<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>B17 · Polaroid Develop</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #E9E1D2; }
.wall { position: absolute; inset: 0; background: radial-gradient(110% 80% at 50% 30%, #F4EEE2 0%, #E6DDCC 60%, #D8CDB8 100%); }
.board { position: absolute; border-radius: 30px; background: #CDB89A;
  background-image: radial-gradient(rgba(90,60,30,.18) 1px, transparent 1.4px), radial-gradient(rgba(255,240,210,.22) 1px, transparent 1.6px);
  background-size: 9px 9px, 13px 13px; background-position: 0 0, 4px 6px;
  box-shadow: inset 0 0 0 14px #B79E7C, inset 0 0 0 16px rgba(0,0,0,.12), 0 50px 100px -50px rgba(60,40,20,.6); }
.sweep { position: absolute; inset: 0; border-radius: 30px; pointer-events: none; mix-blend-mode: soft-light; }
.cam { position: absolute; z-index: 20; }
.cam .body { position: absolute; inset: 0; border-radius: 40px; background: linear-gradient(#2A2724, #1A1816); box-shadow: 0 40px 80px -30px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.08); }
.cam .stripe { position: absolute; left: 0; right: 0; height: 16px; background: linear-gradient(90deg, #DFFF5A 0 25%, #FAF7EE 25% 50%, #E8603C 50% 75%, #7E9A7E 75%); opacity: .9; }
.cam .lens { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #5A6B7A 0, #1D2328 40%, #0B0D0F 70%); box-shadow: 0 0 0 10px #34302C, 0 0 0 14px #0F0E0D, inset 0 0 20px rgba(0,0,0,.8); }
.cam .lens i { position: absolute; left: 28%; top: 22%; width: 22%; height: 18%; border-radius: 50%; background: rgba(255,255,255,.35); filter: blur(2px); }
.cam .flashw { position: absolute; border-radius: 10px; background: linear-gradient(#EDE8DC, #BFB8AA); box-shadow: inset 0 0 0 3px #34302C; }
.cam .btn { position: absolute; border-radius: 50%; background: #DFFF5A; box-shadow: 0 4px 0 #9DB52E; }
.cam .slot { position: absolute; height: 12px; border-radius: 6px; background: #050505; }
.pol { position: absolute; background: #FFFDF8; box-shadow: 0 24px 40px -18px rgba(50,35,20,.55), 0 2px 4px rgba(0,0,0,.08); transform-origin: 50% 50%; }
.pol .ph { position: absolute; overflow: hidden; background: #2E3640; }
.pol .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pol .ph b { position: absolute; inset: 0; background: linear-gradient(160deg, #3C4752, #232A31); }
.pol .lb { position: absolute; left: 0; right: 0; font: 500 18px 'IBM Plex Mono', monospace; letter-spacing: .1em; color: #6B655C; text-align: center; }
.pin { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; z-index: 15;
  box-shadow: 0 8px 10px -4px rgba(0,0,0,.45), inset -4px -5px 0 rgba(0,0,0,.18), inset 3px 3px 0 rgba(255,255,255,.4); }
.gcard { position: absolute; border-radius: 34px; background: #FFFDF8; box-shadow: 0 50px 100px -50px rgba(31,31,31,.7), 0 0 0 1px #E6E0D5; }
.gcard .hd { position: absolute; left: 36px; top: 30px; }
.gcard .hd .k { font: 500 20px 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #45403A; }
.gcard .hd .t { margin-top: 8px; font: 800 36px 'Archivo'; letter-spacing: -0.01em; }
.cap { position: absolute; z-index: 30; color: #1F1F1F; }
.cap .k { font: 500 22px 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #7A5A12; }
.cap .t { margin-top: 10px; font: 800 62px/1.02 'Playfair Display'; letter-spacing: -0.015em; }
.hook { position: absolute; z-index: 30; font: 800 70px/1 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; }
.chip.ink { position: absolute; z-index: 31; font: 700 28px 'Archivo'; padding: 16px 26px; }
.chip.ink i { width: 12px; height: 12px; border-radius: 50%; background: #DFFF5A; display: block; }
.flashall { position: absolute; inset: 0; background: #FFFDF8; z-index: 80; pointer-events: none; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .07; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// B17 — an instant camera ejects the owner's real listing images one per beat; each develops from blue-grey to
// colour and gets pinned to a cork board; then the photos FLIP out of their frames into one listing-image set,
// and the real product screen shows where they live, waiting for the seller's review.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BEAT = 60 / 104, B = (n) => +(n * BEAT).toFixed(3);
const EJ = [1, 3, 5, 7, 9, 11].map(B); // 0.577 … 6.346
const T_FLIP = B(14), T_PHONE = B(18);   // 8.077, 10.385
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const IMGS = [1, 2, 3, 4, 5, 6].map((n) => K.pub('showcase/christmas-preschool-pack/listing-0' + n + '.webp'));

const G = tall ? {
  cam: [300, 1330, 480, 236], slotY: 1338, ej: -1, capX: 70, capY: 296, capW: W - 140, capAlign: 'center',
  board: [40, 470, 1000, 780], pw: 290, pins: [[45, 50], [358, 34], [668, 56], [52, 418], [362, 432], [662, 410]],
  card: [80, 480, 920, 740], cell: 262, cellGap: 22, gridY: 120, phone: [530, 520, 480], cardSmall: [50, 560, 470],
  tagY: 1206,
} : {
  cam: [60, 40, 380, 190], slotY: 230, ej: 1, capX: 480, capY: 56, capW: 540, capAlign: 'left',
  board: [60, 286, 960, 940], pw: 292, pins: [[28, 54], [336, 36], [640, 60], [34, 488], [338, 506], [636, 480]],
  card: [100, 320, 880, 740], cell: 262, cellGap: 22, gridY: 120, phone: [590, 290, 400], cardSmall: [60, 330, 500],
  tagY: 1252,
};
K.box(0, 0, W, H, { cls: 'wall' });
const [bX, bY, bW, bH] = G.board;
const board = K.box(bX, bY, bW, bH, { cls: 'board' });
const sweep = K.el('div', { parent: board, cls: 'sweep' });

// the camera
const [cX, cY, cW, cH] = G.cam;
const cam = K.box(cX, cY, cW, cH, { cls: 'cam' });
K.el('div', { parent: cam, cls: 'body' });
K.el('div', { parent: cam, cls: 'stripe', style: { top: cH * 0.6 + 'px' } });
const lensS = cH * 0.62;
const lens = K.el('div', { parent: cam, cls: 'lens', style: { left: cW / 2 - lensS / 2 + 'px', top: cH * 0.14 + 'px', width: lensS + 'px', height: lensS + 'px' } });
K.el('i', { parent: lens });
const flashw = K.el('div', { parent: cam, cls: 'flashw', style: { left: cW * 0.07 + 'px', top: cH * 0.14 + 'px', width: cW * 0.2 + 'px', height: cH * 0.22 + 'px' } });
const btn = K.el('div', { parent: cam, cls: 'btn', style: { left: cW * 0.8 + 'px', top: cH * 0.14 + 'px', width: cH * 0.18 + 'px', height: cH * 0.18 + 'px' } });
K.el('div', { parent: cam, cls: 'slot', style: { left: cW * 0.16 + 'px', width: cW * 0.68 + 'px', top: (G.ej > 0 ? cH - 20 : 8) + 'px' } });
const camBlink = K.el('div', { parent: flashw, style: { position: 'absolute', inset: 0, borderRadius: '10px', background: '#FFFFFF' } });

// polaroids
const PW = G.pw, PAD = Math.round(PW * 0.06), PB = Math.round(PW * 0.22);
const PINC = ['#E8603C', '#DFFF5A', '#7E9A7E', '#E8603C', '#DFFF5A', '#2E3640'];
const pols = IMGS.map((src, i) => {
  const p = K.box(0, 0, PW, PW - 2 * PAD + PAD + PB, { cls: 'pol', style: { zIndex: 10 + i } });
  const ph = K.el('div', { parent: p, cls: 'ph' });
  const img = K.el('img', { parent: ph, src });
  const fog = K.el('b', { parent: ph });
  const lb = K.el('div', { parent: p, cls: 'lb', html: 'LISTING IMAGE 0' + (i + 1) });
  const pin = K.box(0, 0, 30, 30, { cls: 'pin', style: { background: PINC[i] } });
  return { p, ph, img, fog, lb, pin, rot: (seed(i + 4) - 0.5) * 14 };
});
// the set: a card that receives them
const [gX, gY, gW, gH] = G.card;
const gcard = K.box(gX, gY, gW, gH, { cls: 'gcard', html: '<div class="hd"><div class="k">Listing images · 6</div><div class="t">Christmas Preschool Learning Pack</div></div>', style: { zIndex: 5 } });
const gridX0 = gX + (gW - (3 * G.cell + 2 * G.cellGap)) / 2;
const cellAt = (i) => [gridX0 + (i % 3) * (G.cell + G.cellGap), gY + G.gridY + Math.floor(i / 3) * (G.cell + G.cellGap)];

const [qX, qY, qW] = G.phone;
const phone = K.phone(qX, qY, qW, K.screen('24-phone-product'));
phone.root.style.zIndex = 40;
const qS = (qW - 28) / 780;

const hook = K.box(G.capX, G.capY, G.capW, null, { cls: 'hook', style: { textAlign: G.capAlign, fontSize: tall ? '70px' : '60px' } });
const hookW = K.words(hook, 'Your listing images,\ndeveloping.');
const CAPS = [
  [1.75, 4.55, 'Listing images', 'Made from your pages.'],
  [4.6, 7.95, 'Six of them', 'Pinned, ready to check.'],
  [T_FLIP + 0.1, T_PHONE - 0.1, 'One set', 'Ready for the listing.'],
  [T_PHONE + 0.1, 12.85, 'Before anything goes live', 'You review every one.'],
];
const caps = CAPS.map(([a, b, k, t]) => {
  const c = K.box(G.capX, G.capY, G.capW, null, { cls: 'cap', html: `<div class="k">${k}</div>`, style: { textAlign: G.capAlign } });
  const tt = K.el('div', { parent: c, cls: 't' });
  if (!tall) tt.style.fontSize = '50px';
  return { c, a, b, w: K.words(tt, t) };
});
const chip = K.box(0, 0, null, null, { cls: 'chip ink', html: '<i></i>Draft until you approve it', style: { width: 'auto', height: 'auto' } });
const tagO = K.demoTag('Example made with MakeAndList by its owner', 0, 0);
const tagR = K.demoTag('Real app · demo workspace', 0, 0);
const flashAll = K.box(0, 0, W, H, { cls: 'flashall' });
const grain = K.box(0, 0, W, H, { cls: 'gr' });

const end = K.endCard(13.0, { line: 'Your listing images,<br>developed.' });
const endBg = document.getElementById('stage').lastElementChild;
if (tall) [...endBg.children].forEach((c) => { c.style.top = parseFloat(c.style.top) - 150 + 'px'; });
const endPols = [0, 1, 2].map((i) => K.el('div', { parent: endBg, cls: 'pol', style: { position: 'absolute', width: '150px', height: '180px', padding: 0 },
  html: `<div class="ph" style="left:9px;top:9px;width:132px;height:132px"><img src="${IMGS[i * 2]}"></div>` }));

K.run({
  id: 'B17', title: 'Polaroid Develop', dur: DUR, bpm: 104, mood: 'warm', key: 'F', intro: 0.58, cover: 6.9,
  technique: 'Instant-film metaphor: a CSS camera flashes and ejects the owner’s real listing images on the beat; each develops from a blue-grey fog to colour (filter + fog layer), flies to a cork board and is pinned; then a FLIP moves every photo out of its white frame into one listing-image set, which steps aside for the real product screen',
  caption: 'MakeAndList makes listing images from your product’s real pages: a set you can look through before anything reaches a store. Every listing stays a draft until you approve it. Start free at makeandlist.com',
  short: 'Your listing images, developing.',
  beats: ['0–1.7 s: “Your listing images, developing.” The camera fires', '1.7–7.9 s: six of the owner’s listing images eject, develop and get pinned', '8.1–10.3 s: they FLIP out of their frames into one set', '10.4–12.9 s: the real product screen, “You review every one.”', '13–15 s: end card'],
  cues: [...EJ.flatMap((t) => [[t, 'click'], [t + 1.05, 'pop']]), [T_FLIP - 0.4, 'riser'], [T_FLIP, 'whoosh'], [T_FLIP + 0.85, 'hit'], [T_PHONE, 'whoosh'], [T_PHONE + 1.1, 'pop'], [12.8, 'whoosh'], [13.0, 'hit']],
}, (T) => {
  const fr = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(fr) - 0.5) * 60}px, ${(seed(fr + 3) - 0.5) * 60}px)`;

  // camera: rests, recoils on each shot, flash window blinks; slides away when the set forms
  let rec = 0, blink = 0;
  EJ.forEach((t) => { if (T >= t) { const u = T - t; rec += Math.exp(-u * 9) * Math.sin(u * 30) * 6; blink = Math.max(blink, Math.exp(-u * 10)); } });
  const camIn = K.p(T, 0, 0.6, E.outExpo), camOut = K.p(T, T_FLIP - 0.2, T_FLIP + 0.3, E.inCubic);
  cam.style.transform = `translateY(${G.ej * ((1 - camIn) * -260 - camOut * 700) + rec + Math.sin(T * 1.2) * 3}px) rotate(${Math.sin(T * 0.7) * 0.6}deg)`;
  camBlink.style.opacity = blink;
  btn.style.transform = `translateY(${blink > 0.6 ? 4 : 0}px)`;
  flashAll.style.opacity = blink * 0.16;

  // board: enters, drifts, light sweep; recedes for the set
  const bIn = K.p(T, 0.1, 0.9, E.outExpo), bOut = K.p(T, T_FLIP, T_FLIP + 0.6, E.inOutCubic);
  board.style.transform = `translateY(${(1 - bIn) * 120 + Math.sin(T * 0.6) * 4}px) scale(${1 - 0.06 * bOut})`;
  board.style.opacity = bIn * (1 - bOut);
  const sw = (T * 0.18) % 1.4 - 0.2;
  sweep.style.background = `linear-gradient(115deg, rgba(255,255,255,0) ${sw * 100 - 15}%, rgba(255,255,255,.55) ${sw * 100}%, rgba(255,255,255,0) ${sw * 100 + 15}%)`;

  // the set card
  const gIn = K.p(T, T_FLIP + 0.1, T_FLIP + 0.7, E.outExpo);
  const gSm = K.p(T, T_PHONE, T_PHONE + 0.7, E.inOutCubic);
  const [sX, sY, sW] = G.cardSmall, sScale = sW / gW;
  gcard.style.opacity = gIn;
  const gcX = K.lerp(0, sX - gX, gSm), gcY = K.lerp(0, sY - gY, gSm), gcS = K.lerp(1, sScale, gSm);
  gcard.style.transformOrigin = '0 0';
  gcard.style.transform = `translate(${gcX}px, ${gcY + (1 - gIn) * 60}px) scale(${gcS * (0.97 + 0.03 * gIn)})`;

  // polaroids
  const sx = cX + cW / 2, sy = G.slotY + (tall ? 0 : 0);
  pols.forEach((P, i) => {
    const t0 = EJ[i];
    const out = K.p(T, t0, t0 + 0.45, E.outCubic);       // out of the slot
    const fly = K.p(T, t0 + 0.55, t0 + 1.05, E.inOutCubic); // to the board
    const dev = K.p(T, t0 + 0.3, t0 + 2.9, (x) => 1 - Math.pow(1 - x, 2));
    const flip = K.p(T, T_FLIP + i * 0.07, T_FLIP + 0.75 + i * 0.07, E.inOutExpo);
    const [px, py] = G.pins[i];
    const h0 = PW - 2 * PAD + PAD + PB;
    // ejecting: emerges from under the camera (scaled, centred on the slot)
    let x = sx - PW / 2, y = G.ej > 0 ? sy - h0 + out * (h0 * 0.85) : sy - out * (h0 * 0.85), r = 0, s = 0.72;
    const fl = Math.sin(Math.min(1, (T - t0 - 0.45) / 0.15) * Math.PI) * (T > t0 + 0.45 && T < t0 + 0.6 ? 1 : 0);
    r += fl * 6;
    x = K.lerp(x, bX + px, fly); y = K.lerp(y, bY + py, fly) - Math.sin(fly * Math.PI) * 60;
    r = K.lerp(r, P.rot + Math.sin(T * 0.8 + i) * 0.8, fly); s = K.lerp(s, 1, fly);
    const land = T > t0 + 1.05 ? Math.exp(-(T - t0 - 1.05) * 9) * Math.sin((T - t0 - 1.05) * 28) * 0.03 : 0;
    // FLIP into the set grid: the frame falls away, photo squares up
    const [gx, gy] = cellAt(i);
    const fw = K.lerp(PW, G.cell, flip), pad = K.lerp(PAD, 0, flip), pb = K.lerp(PB, 0, flip);
    let X = K.lerp(x, gx, flip), Y = K.lerp(y, gy, flip) - Math.sin(flip * Math.PI) * 40;
    const R = K.lerp(r, 0, flip), Sc = K.lerp(s * (1 + land), 1, flip);
    // after the set forms it rides the card when it steps aside
    if (gSm > 0) { X = sX + (gx - gX) * K.lerp(1, sScale, gSm) + (gX - sX) * (1 - gSm); Y = sY + (gy - gY) * K.lerp(1, sScale, gSm) + (gY - sY) * (1 - gSm); }
    const cw = gSm > 0 ? G.cell * K.lerp(1, sScale, gSm) : fw;
    const iw = cw - 2 * pad;
    P.p.style.left = X + 'px'; P.p.style.top = Y + 'px';
    P.p.style.width = cw + 'px'; P.p.style.height = iw + pad + pb + (gSm > 0 ? 0 : pad * 0) + 'px';
    P.p.style.transform = `rotate(${R}deg) scale(${Sc})`;
    P.p.style.background = `rgba(255,253,248,${1 - flip})`;
    P.p.style.boxShadow = flip > 0.5 ? '0 16px 30px -18px rgba(31,31,31,.5)' : '';
    P.p.style.borderRadius = K.lerp(3, 18, flip) + 'px';
    P.ph.style.left = pad + 'px'; P.ph.style.top = pad + 'px'; P.ph.style.width = iw + 'px'; P.ph.style.height = iw + 'px';
    P.ph.style.borderRadius = K.lerp(1, 18, flip) + 'px';
    P.lb.style.top = iw + pad + pb * 0.32 + 'px'; P.lb.style.opacity = 1 - flip;
    P.lb.style.fontSize = Math.round(PW * 0.06) + 'px';
    P.p.style.opacity = T >= t0 ? 1 : 0;
    P.p.style.zIndex = fly < 1 && T >= t0 ? 19 : 10 + i; // behind the camera while ejecting? no: above board, under camera
    if (out < 1) P.p.style.zIndex = 18;
    // developing: blue-grey fog clears, colour rises
    P.fog.style.opacity = Math.pow(1 - dev, 1.4);
    P.img.style.filter = `grayscale(${1 - dev}) contrast(${0.6 + 0.4 * dev}) brightness(${1.25 - 0.25 * dev}) sepia(${0.25 * (1 - dev)})`;
    // pin: pops in on landing, pops off for the FLIP
    const pIn = K.p(T, t0 + 1.0, t0 + 1.3, E.outBack), pOff = K.p(T, T_FLIP - 0.15 + i * 0.05, T_FLIP + 0.1 + i * 0.05, E.inCubic);
    P.pin.style.left = X + cw / 2 + 'px'; P.pin.style.top = Y + 18 + 'px';
    P.pin.style.opacity = T > t0 + 1.0 ? 1 - pOff : 0;
    P.pin.style.transform = `scale(${(1.6 - 0.6 * pIn) * (1 - pOff)})`;
    P.pin.style.zIndex = 25;
  });

  // phone with the real product screen, scrolled to its listing images
  const qIn = K.p(T, T_PHONE + 0.15, T_PHONE + 0.85, E.outExpo);
  phone.root.style.opacity = qIn;
  phone.root.style.transform = `translateX(${(1 - qIn) * 420}px) rotate(${(1 - qIn) * 8 + Math.sin(T * 0.8) * 0.6}deg)`;
  const qs = K.lerp(1150, 1260, K.p(T, T_PHONE + 0.6, 12.9, E.inOutCubic));
  phone.img.style.transform = `translateY(${-qs * qS}px)`;

  // words
  K.reveal(hookW, T, 0.1, { kind: 'up', stagger: 0.08, out: 1.4 });
  caps.forEach((c) => {
    c.c.style.opacity = K.win(T, c.a, c.b, 0.22);
    c.c.firstChild.style.transform = `translateY(${(1 - K.p(T, c.a, c.a + 0.5, E.outExpo)) * 16}px)`;
    K.reveal(c.w, T, c.a + 0.06, { kind: 'up', stagger: 0.07, out: c.b - 0.3 });
  });
  const cp = K.p(T, T_PHONE + 1.1, T_PHONE + 1.6, E.outBack);
  chip.style.left = (tall ? sX + 10 : sX + 10) + 'px';
  chip.style.top = (tall ? sY + gH * sScale + 30 : sY + gH * sScale + 24) + 'px';
  chip.style.opacity = K.p(T, T_PHONE + 1.1, T_PHONE + 1.25, E.linear) * (1 - K.p(T, 12.7, 12.95, E.linear));
  chip.style.transform = `scale(${0.8 + 0.2 * cp})`;
  chip.style.transformOrigin = '0 50%';
  // honest labels
  tagO.style.left = bX + 28 + 'px'; tagO.style.top = (tall ? bY - 46 : bY + bH - 52) + 'px';
  tagO.style.opacity = K.win(T, 1.6, T_PHONE + 0.1, 0.25);
  tagR.style.left = qX + qW - tagR.offsetWidth + 'px'; tagR.style.top = qY - 48 + 'px';
  tagR.style.opacity = K.win(T, T_PHONE + 0.6, 12.85, 0.25);

  end(T);
  endPols.forEach((e, i) => {
    const p = K.p(T, 13.5 + i * 0.12, 14.2 + i * 0.12, E.outBack);
    const baseY = (tall ? H * 0.72 : H * 0.84);
    e.style.left = W / 2 - 75 + (i - 1) * 170 + 'px'; e.style.top = baseY + (1 - p) * 80 + 'px';
    e.style.opacity = tall ? K.p(T, 13.5 + i * 0.12, 13.7 + i * 0.12, E.linear) : 0;
    e.style.transform = `rotate(${(i - 1) * 7 + Math.sin(T * 1.2 + i) * 1.5}deg)`;
  });
});
</script></body></html>
