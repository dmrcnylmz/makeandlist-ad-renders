<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G06 · Colour Story</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #E8DCC8; }
.set { position: absolute; inset: 0; }
.pz { position: absolute; left: 0; top: 0; }
.pz img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.tint { position: absolute; inset: 0; mix-blend-mode: multiply; -webkit-mask-size: 100% 100%; -webkit-mask-composite: source-in; }
.shine { position: absolute; inset: 0; mix-blend-mode: soft-light; -webkit-mask-size: 100% 100%; background-repeat: no-repeat; }
.plinth { position: absolute; }
.csh { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(30,20,10,.38), rgba(30,20,10,0)); }
.kick { position: absolute; z-index: 60; font: 500 21px 'IBM Plex Mono', monospace; letter-spacing: .26em; text-transform: uppercase; text-align: center; white-space: nowrap; }
.cap { position: absolute; z-index: 60; text-align: center; font: 700 100px/1.03 'Playfair Display'; letter-spacing: -0.025em; }
.cap em { font-style: italic; font-weight: 500; }
.sub { position: absolute; z-index: 60; text-align: center; font: 500 29px/1.3 'Archivo'; }
.sw { position: absolute; z-index: 60; display: flex; gap: 12px; align-items: center; white-space: nowrap; padding: 10px 16px; border-radius: 999px; background: rgba(255,253,248,.55); backdrop-filter: blur(8px); font: 500 20px 'IBM Plex Mono', monospace; letter-spacing: .06em; color: #1F1F1F; }
.sw span { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; opacity: .55; }
.sw span.on { opacity: 1; background: rgba(31,31,31,.88); color: #FFF6EA; }
.sw i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(31,31,31,.25); }
.chip2 { position: absolute; z-index: 61; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; border-radius: 999px; white-space: nowrap;
  background: rgba(255,253,248,.9); box-shadow: 0 20px 40px -24px rgba(0,0,0,.5); font: 500 23px 'IBM Plex Mono', monospace; letter-spacing: .03em; color: #1F1F1F; }
.chip2 s { text-decoration: none; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #E8A33C; box-shadow: 0 0 0 5px rgba(232,163,60,.22); }
.chip2 u { text-decoration: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #1F1F1F; color: #DFFF5A; font: 800 17px 'Archivo'; }
.chip2 b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #DFFF5A; color: #1F1F1F; font: 800 18px 'Archivo'; }
.ring { position: absolute; z-index: 22; border-radius: 50%; border: 4px solid #DFFF5A; box-shadow: 0 0 0 2px rgba(31,31,31,.6); }
.demo.dk { background: rgba(20,26,40,.6); color: rgba(255,246,236,.85); border-color: rgba(255,246,236,.4); }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .08; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// G06 — Colour Story. One design on a plinth in a seamless studio. On the beat a tide of colour rises up the set and up
// the garment with the same wavy line — sand, sage, clay, sky — the tee's fabric changes (a multiply tint masked to the
// cut-out with the print cut out of the mask, so the artwork stays true) and the mug follows; at ink the tide brings the
// navy hoodie. Then the colourways line up, a buyer picks one (sample), and only that one goes to print — on your yes.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 107.7, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const TEE = K.pub('r07/k03-tee.webp'), HOOD = K.pub('r07/k04-hoodie.webp'), MUG = K.pub('r07/k01-mug.webp');
const PRINT_HOLE = 'radial-gradient(19.9% 22.4% at 50.9% 45%, transparent 0 97%, #000 100%)'; // the tee's artwork stays untinted

// colourways: set colour, fabric tint (multiply), mug tint
const CW = [
  { n: 'sand', set: ['#F1E8D8', '#E3D5BE', '#CDBB9E'], dot: '#EFE6D6' },
  { n: 'sage', set: ['#C3D1BB', '#A3B69B', '#7F9578'], tee: '#B9CBB0', mug: '#BFCFB7', dot: '#A9BCA1' },
  { n: 'clay', set: ['#EBA584', '#D8825E', '#B5603F'], tee: '#F2B094', mug: '#F0B79C', dot: '#DE8C68' },
  { n: 'sky', set: ['#C7D6E7', '#A2B9D3', '#7D97B6'], tee: '#BDD0E7', mug: '#C3D4E8', dot: '#A6BDD7' },
  { n: 'ink', set: ['#34456A', '#1F2B45', '#121A2C'], mug: '#5A6A90', dot: '#1F2B45' },
];
const TF = [0, B(3), B(6), B(9), B(12)]; // the tides rise on the beat
const TIDE = 0.95;
const LINEUP = B(15.5), PICK = 9.3;

const L = tall ? { teeW: 620, teeY: 600, plY: 1250, plRx: 380, mugW: 240, mugX: 800, capY: 316, capFs: 100, swY: 1196, lineY: 1060, chipY: 1196, tagY: 1214 }
  : { teeW: 480, teeY: 318, plY: 905, plRx: 340, mugW: 190, mugX: 790, capY: 64, capFs: 84, swY: 1150, lineY: 830, chipY: 1150, tagY: 1256 };
const teeH = L.teeW * 901 / 977, hoodW = L.teeW * 0.98, hoodH = hoodW * 979 / 976, mugH = L.mugW * 804 / 852;
const teeX = (W - L.teeW) / 2, hoodX = (W - hoodW) / 2, hoodY = L.teeY + teeH - hoodH + 10;

// ---------- set: one layer per colourway, each revealed by its own tide ----------
const sets = CW.map((c) => K.box(0, 0, W, H, { cls: 'set', style: { background: `radial-gradient(70% 46% at 50% ${tall ? 42 : 40}%, ${c.set[0]} 0, ${c.set[1]} 55%, ${c.set[2]} 100%)` } }));
const shade = K.box(0, 0, W, H, { cls: 'set', style: { background: `linear-gradient(180deg, rgba(0,0,0,0) ${tall ? 60 : 62}%, rgba(0,0,0,.12) ${tall ? 70 : 72}%, rgba(0,0,0,.04) 86%, rgba(0,0,0,.18))` } });
const NS = 'http://www.w3.org/2000/svg';
const foam = document.createElementNS(NS, 'svg'); foam.setAttribute('width', W); foam.setAttribute('height', H);
Object.assign(foam.style, { position: 'absolute', left: 0, top: 0, zIndex: 40, pointerEvents: 'none', filter: 'blur(3px)' });
foam.innerHTML = '<path fill="none" stroke="rgba(255,255,255,.55)" stroke-width="8"/>';
document.getElementById('stage').appendChild(foam);
const foamP = foam.querySelector('path');

// plinth: a soft cylinder that takes the set's colour (light and shade over whatever is behind it)
const plTopH = L.plRx * 0.2;
const plBody = K.box(W / 2 - L.plRx, L.plY, L.plRx * 2, H - L.plY, { cls: 'plinth', style: { background: 'linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.18) 38%, rgba(255,255,255,.1) 55%, rgba(0,0,0,.25))', zIndex: 5 } });
const plTop = K.box(W / 2 - L.plRx, L.plY - plTopH / 2, L.plRx * 2, plTopH, { cls: 'plinth', style: { borderRadius: '50%', background: 'radial-gradient(closest-side, rgba(255,255,255,.42), rgba(255,255,255,.22))', boxShadow: 'inset 0 -3px 0 rgba(0,0,0,.08)', zIndex: 6 } });
const teeSh = K.box(W / 2 - L.teeW * 0.42, L.plY - plTopH * 0.3, L.teeW * 0.84, plTopH * 0.6, { cls: 'csh', style: { zIndex: 7 } });
const mugSh = K.box(L.mugX - L.mugW * 0.55, L.plY + plTopH * 0.1 - 10, L.mugW * 1.1, L.mugW * 0.16, { cls: 'csh', style: { zIndex: 7 } });

function tinted(src, w, h, tints, hole, z) {
  const box = K.box(0, 0, w, h, { cls: 'pz', style: { zIndex: z } });
  K.el('img', { parent: box, src });
  const layers = tints.map((c) => c ? K.el('div', { cls: 'tint', parent: box, style: { background: c, webkitMaskImage: `url("${src}")${hole ? ', ' + hole : ''}` } }) : null);
  const shine = K.el('div', { cls: 'shine', parent: box, style: { webkitMaskImage: `url("${src}")` } });
  return { box, layers, shine, w, h };
}
const tee = tinted(TEE, L.teeW, teeH, [null, CW[1].tee, CW[2].tee, CW[3].tee], PRINT_HOLE, 10);
const hood = tinted(HOOD, hoodW, hoodH, [], null, 11);
const mug = tinted(MUG, L.mugW, mugH, [null, CW[1].mug, CW[2].mug, CW[3].mug, CW[4].mug], null, 12);

// the lineup: five colourways, one picked
const LW = tall ? 250 : 220;
const line = [0, 1, 2, 3].map((j) => tinted(TEE, LW, LW * 901 / 977, [CW[j].tee || null], PRINT_HOLE, 20)).concat([tinted(HOOD, LW * 0.98, LW * 0.98, [], null, 20)]);
const lineSh = line.map(() => K.box(0, 0, LW, LW * 0.12, { cls: 'csh', style: { zIndex: 19 } }));
const ring = K.box(0, 0, 10, 10, { cls: 'ring' });

// ---------- type ----------
const kick = K.box(65, tall ? 272 : 30, W - 130, null, { cls: 'kick', html: 'Product film Nº 06 · colour story' });
const em = (s) => s.replace(/<em>(.*?)<\/em>/g, (m, x) => x.split(' ').map((w) => '<em>' + w + '</em>').join(' '));
const CAP = [
  { a: 0.85, b: 1.95, t: 'One <em>design.</em>' },
  { a: 2.25, b: 6.6, t: 'Every\n<em>colour.</em>' },
  { a: 7.3, b: 10.25, t: 'Printed only\n<em>when picked.</em>' },
  { a: 10.5, b: 12.85, t: 'Sent on\nyour <em>yes.</em>' },
];
const caps = CAP.map((c) => { const el = K.box(65, L.capY + 30, W - 130, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' } }); return { el, ws: K.words(el, em(c.t)), c }; });
const sub = K.box(65, L.capY + 30 + L.capFs * 2.14, W - 130, null, { cls: 'sub', html: 'by your own print partner, paid from your partner account' });
const sw = K.box(0, L.swY, null, null, { cls: 'sw', html: CW.map((c) => `<span><i style="background:${c.dot}"></i>${c.n}</span>`).join(''), style: { width: 'auto', height: 'auto' } });
const swS = [...sw.querySelectorAll('span')];
const chipO = K.box(0, L.chipY, null, null, { cls: 'chip2', html: '<u>1</u>Order · clay tee · sample', style: { width: 'auto', height: 'auto' } });
const chipW = K.box(0, L.chipY, null, null, { cls: 'chip2', html: '<s></s>Waiting for your yes', style: { width: 'auto', height: 'auto' } });
const chipA = K.box(0, L.chipY, null, null, { cls: 'chip2', html: '<b>✓</b>Approved · sent to your partner', style: { width: 'auto', height: 'auto' } });
const tag = K.demoTag('Concept products · AI-generated · colours previewed', 0, 0);
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'One design.<br>Every colour.' });

K.run({
  id: 'G06', title: 'Colour Story', dur: DUR, bpm: BPM, music: 'blue-skies', mood: 'warm', key: 'E', intro: 0.0, cover: 3.9,
  technique: 'Colour-flood product film: a seamless studio where a tide of colour rises up the set on the beat with a wavy, foam-lit edge, and the same clipped edge rises up the cut-out tee — a multiply tint masked to the product with the artwork cut out of the mask, so the print stays true — and the mug; at ink the tide brings the hoodie; then the colourways line up and one is picked',
  caption: 'One design, in every colour you choose to offer. Your own print partner prints only the one a buyer picks, paid from your partner account, and nothing is sent without your yes. Products and colourways shown are concept previews. Start free at makeandlist.com',
  short: 'One design. Every colour.',
  question: 'Can I sell physical products too?', gain: 'Every colourway, printed per order',
  vo: [[0.35, 'One design.'], [0.85, 'In every colour you choose to offer.'], [6.95, 'Your partner prints only the one a buyer picks.'], [10.2, 'Nothing is sent without your yes.']],
  beats: ['0–1.7 s: the sunset tee floats above a plinth in a sand studio — “One design.”', '1.7–6.7 s: on the beat a tide of colour rises up the set and the tee: sage, clay, sky — “Every colour.” (the mug follows)', '6.7–8.6 s: the ink tide brings the navy hoodie', '8.6–10.3 s: the five colourways line up; a buyer picks clay (sample order) — printed only when picked, by your own partner', '10.3–13 s: “Sent on your yes.” — waiting for your yes, then approved and sent to your partner', '13–15 s: end card'],
  cues: [[0.0, 'swish'], ...TF.slice(1).map((t) => [+(t - 0.05).toFixed(3), 'swish']), [LINEUP, 'whoosh'], [PICK, 'pop'], [11.95, 'chime'], [13.0, 'chime']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;

  // tides: each one's edge as screen points
  const tideP = (j) => (j === 0 ? 1 : K.p(T, TF[j], TF[j] + TIDE, E.inOutCubic));
  const edge = (j) => { const y0 = K.lerp(H + 140, -180, tideP(j)); const pts = []; for (let x = -60; x <= W + 60; x += 40) pts.push([x, y0 + Math.sin(x * 0.009 + T * 4 + j * 1.7) * 26 + Math.sin(x * 0.023 - T * 2.3) * 9]); return pts; };
  const below = (pts, ox, oy) => `polygon(${pts.map(([x, y]) => `${(x - ox).toFixed(1)}px ${(y - oy).toFixed(1)}px`).join(', ')}, ${W + 200 - ox}px ${H + 400 - oy}px, ${-200 - ox}px ${H + 400 - oy}px)`;
  const above = (pts, ox, oy) => `polygon(${-200 - ox}px ${-400 - oy}px, ${W + 200 - ox}px ${-400 - oy}px, ${pts.slice().reverse().map(([x, y]) => `${(x - ox).toFixed(1)}px ${(y - oy).toFixed(1)}px`).join(', ')})`;
  const clipFor = (el, j, ox, oy, inv) => {
    const p = tideP(j);
    if (p <= 0) { el.style.visibility = inv ? 'visible' : 'hidden'; el.style.clipPath = 'none'; return; }
    el.style.visibility = 'visible';
    if (p >= 1) { el.style.clipPath = 'none'; el.style.visibility = inv ? 'hidden' : 'visible'; return; }
    el.style.clipPath = (inv ? above : below)(edge(j), ox, oy);
  };
  // a tint layer lives between its own tide and the next one (multiply layers must never stack)
  const band = (el, j, ox, oy) => {
    const pj = tideP(j), pn = j + 1 < TF.length ? tideP(j + 1) : 0;
    if (pj <= 0 || pn >= 1) { el.style.visibility = 'hidden'; return; }
    el.style.visibility = 'visible';
    if (pn <= 0) { clipFor(el, j, ox, oy); return; }
    const top = pj >= 1 ? [[-200, -400], [W + 200, -400]] : edge(j);
    const bot = edge(j + 1).slice().reverse();
    el.style.clipPath = `polygon(${top.concat(bot).map(([x, y]) => `${(x - ox).toFixed(1)}px ${(y - oy).toFixed(1)}px`).join(', ')})`;
  };
  sets.forEach((s, j) => { if (j) clipFor(s, j, 0, 0); });
  const active = TF.findIndex((t, j) => j > 0 && T >= t && T < t + TIDE);
  if (active > 0) { foamP.setAttribute('d', 'M' + edge(active).map(([x, y]) => x.toFixed(1) + ' ' + y.toFixed(1)).join(' L')); foam.style.opacity = 1; } else foam.style.opacity = 0;

  // hero: the tee floats, the hoodie arrives with the ink tide, the mug sits on the plinth
  const toLine = K.p(T, LINEUP - 0.1, LINEUP + 0.7, E.inOutCubic);
  const bob = Math.sin(T * 1.4) * 10, sway = Math.sin(T * 0.8) * 1.5;
  const heroO = 1 - toLine;
  const tx = teeX, ty = L.teeY + bob - toLine * 60;
  tee.box.style.transform = `translate(${tx}px, ${ty}px) rotate(${sway}deg) scale(${1 - 0.3 * toLine})`;
  tee.box.style.opacity = heroO;
  tee.layers.forEach((ly, j) => { if (ly) band(ly, j, tx, ty); });
  clipFor(tee.box, 4, tx, ty, true);
  const hy = hoodY + bob - toLine * 60;
  hood.box.style.transform = `translate(${hoodX}px, ${hy}px) rotate(${sway}deg) scale(${1 - 0.3 * toLine})`;
  hood.box.style.opacity = heroO;
  clipFor(hood.box, 4, hoodX, hy);
  const mx = L.mugX - L.mugW / 2, my = L.plY + plTopH * 0.18 - mugH;
  mug.box.style.transform = `translate(${mx}px, ${my}px)`;
  mug.box.style.opacity = heroO;
  mug.layers.forEach((ly, j) => { if (ly) band(ly, j, mx, my); });
  teeSh.style.opacity = (0.75 - bob / 60) * heroO; teeSh.style.transform = `scaleX(${1 - bob / 300})`;
  mugSh.style.opacity = heroO;
  [plBody, plTop].forEach((p) => { p.style.opacity = 1 - 0.5 * toLine; p.style.transform = `translateY(${toLine * 60}px)`; });
  // a light sweep across the garment after each tide
  const lastTide = TF.reduce((a, t, j) => (T >= t + TIDE * 0.6 ? j : a), 0);
  const sp = K.p(T, TF[lastTide] + TIDE * 0.6, TF[lastTide] + TIDE * 0.6 + 1.1, E.inOutCubic);
  [tee, hood, mug].forEach((o) => {
    o.shine.style.background = `linear-gradient(105deg, rgba(255,255,255,0) ${sp * 160 - 40}%, rgba(255,255,255,.95) ${sp * 160 - 20}%, rgba(255,255,255,0) ${sp * 160}%)`;
    o.shine.style.opacity = sp > 0 && sp < 1 ? 1 : 0;
  });

  // the lineup and the pick
  const picked = K.p(T, PICK, PICK + 0.7, E.inOutCubic);
  const slots = tall ? [150, 345, 540, 735, 930] : [160, 350, 540, 730, 920];
  line.forEach((o, j) => {
    const lp = K.p(T, LINEUP + j * 0.06, LINEUP + 0.75 + j * 0.06, E.outCubic);
    const isP = j === 2;
    const x = K.lerp(slots[j], W / 2, isP ? picked : 0), y = L.lineY - o.h + (1 - lp) * 120 + Math.sin(T * 1.3 + j) * 6;
    const s = isP ? 1 + picked * (tall ? 0.75 : 0.7) : 1 - 0.15 * picked;
    o.box.style.transform = `translate(${x - o.w / 2}px, ${y}px) scale(${s})`;
    o.box.style.transformOrigin = '50% 100%';
    o.box.style.opacity = lp * (isP ? 1 : 1 - 0.55 * picked);
    o.box.style.filter = !isP && picked > 0.02 ? `blur(${(picked * 3).toFixed(1)}px)` : 'none';
    o.box.style.zIndex = isP ? 25 : 20;
    lineSh[j].style.transform = `translate(${x - LW / 2}px, ${L.lineY - LW * 0.05}px) scaleX(${s * 0.9})`;
    lineSh[j].style.opacity = lp * 0.8 * (isP ? 1 : 1 - 0.6 * picked);
  });
  const rp = K.p(T, PICK + 0.45, PICK + 0.85, E.outBack);
  const rw = (tall ? 470 : 400) * (0.9 + 0.1 * rp);
  Object.assign(ring.style, { width: rw + 'px', height: rw * 0.22 + 'px', left: W / 2 - rw / 2 + 'px', top: L.lineY - rw * 0.11 + 'px', opacity: K.p(T, PICK + 0.45, PICK + 0.6, E.linear) * (1 - K.p(T, 12.6, 13, E.linear)) });

  // ---------- type: dark on the light sets, light on ink ----------
  const dark = T >= TF[4] + TIDE * 0.5;
  const ink = dark ? '#FFF6EA' : '#1F1F1F', soft = dark ? 'rgba(255,246,234,.85)' : '#3A342D';
  kick.style.color = dark ? 'rgba(255,246,234,.7)' : 'rgba(31,31,31,.62)';
  kick.style.opacity = 0.9 * K.win(T, 0.2, 1.95, 0.3);
  caps.forEach(({ el, ws, c }) => {
    el.style.visibility = T > c.a - 0.05 && T < c.b + 0.4 ? 'visible' : 'hidden';
    el.style.color = ink;
    el.querySelectorAll('em').forEach((e) => { e.style.color = dark ? '#DFFF5A' : '#1F1F1F'; });
    K.reveal(ws, T, c.a, { kind: 'blur', stagger: 0.1, dur: 0.75, ease: E.outCubic, out: c.b });
  });
  const sbP = K.win(T, 8.1, 10.25, 0.35);
  sub.style.color = soft; sub.style.opacity = sbP; sub.style.transform = `translateY(${(1 - K.p(T, 8.1, 8.7, E.outCubic)) * 14}px)`;
  // colourway swatches: the current one lights up as its tide lands
  const cur = TF.reduce((a, t, j) => (T >= t + TIDE * 0.5 ? j : a), 0);
  swS.forEach((s, j) => s.classList.toggle('on', j === cur));
  sw.style.left = (W - sw.offsetWidth) / 2 + 'px';
  sw.style.opacity = K.win(T, 1.6, LINEUP + 0.2, 0.35);
  const oP = K.win(T, PICK + 0.5, 10.4, 0.25), wP = K.win(T, 10.45, 11.95, 0.25), aP = K.win(T, 11.95, 12.9, 0.25);
  [[chipO, oP, PICK + 0.5], [chipW, wP, 10.45], [chipA, aP, 11.95]].forEach(([c, o, a]) => { c.style.left = (W - c.offsetWidth) / 2 + 'px'; c.style.opacity = o; c.style.transform = `scale(${0.88 + 0.12 * K.p(T, a, a + 0.35, E.outBack)})`; });
  tag.classList.toggle('dk', dark);
  tag.style.left = (tall ? 65 : 60) + 'px'; tag.style.top = (tall ? 1150 : 1210) + 'px';
  tag.style.opacity = 0.95 * K.p(T, 0.8, 1.2, E.linear) * (1 - K.p(T, 12.6, 13, E.linear));

  end(T);
});
</script></body></html>
