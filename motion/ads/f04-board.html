<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>F04 · Board</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #F6F2EA; }
.bg { position: absolute; inset: 0; background: #F6F2EA; }
.status { position: absolute; z-index: 30; display: flex; justify-content: space-between; align-items: center; font: 700 34px 'Archivo'; color: #1F1F1F; }
.status .bt { display: flex; gap: 12px; align-items: center; }
.status .bt i { display: block; border-radius: 4px; background: #1F1F1F; }
.board { position: absolute; left: 0; top: 0; width: 100%; z-index: 10; }
.bh { position: absolute; }
.bh .k { font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #6B645A; }
.bh .t { margin-top: 6px; font: 800 66px/1 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; white-space: nowrap; }
.bh .t em { font-style: italic; background: linear-gradient(transparent 60%, #DFFF5A 60%, #DFFF5A 92%, transparent 92%); }
.bh .m { margin-top: 12px; display: flex; gap: 12px; }
.bh .m span { font: 600 24px 'Archivo'; padding: 10px 20px; border-radius: 99px; background: #FFFDF8; box-shadow: 0 0 0 1.5px #E2DBCE; color: #1F1F1F; white-space: nowrap; }
.bh .m span.on { background: #1F1F1F; color: #FAF7EE; box-shadow: none; }
.pin { position: absolute; perspective: 1800px; }
.pin .in { position: absolute; inset: 0; transform-style: preserve-3d; }
.pin .fr, .pin .bk { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 30px; overflow: hidden; }
.pin .fr { background: #EDE7DB; }
.pin .fr .ph { position: absolute; left: 0; right: 0; top: 0; bottom: 58px; overflow: hidden; border-radius: 30px; }
.pin .fr .ph img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.pin .fr .cp { position: absolute; left: 10px; right: 10px; bottom: 10px; font: 600 24px 'Archivo'; color: #45403A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin .fr .sv { position: absolute; right: 16px; top: 16px; font: 700 22px 'Archivo'; padding: 9px 16px; border-radius: 99px; background: #1F1F1F; color: #FAF7EE; }
.pin .bk { transform: rotateY(180deg); background: #FFFDF8; box-shadow: inset 0 0 0 2px #1F1F1F; padding: 26px 28px; }
.pin .bk .k { font: 500 19px 'IBM Plex Mono', monospace; letter-spacing: .06em; color: #6B645A; text-transform: uppercase; }
.pin .bk .n { margin-top: 10px; font: 800 40px/1.04 'Playfair Display'; letter-spacing: -0.015em; color: #1F1F1F; }
.pin .bk .ty { margin-top: 8px; font: 600 24px 'Archivo'; color: #45403A; }
.pin .bk ul { list-style: none; margin: 16px 0 0; padding: 0; }
.pin .bk li { display: flex; align-items: center; gap: 12px; font: 600 25px/1.5 'Archivo'; color: #1F1F1F; white-space: nowrap; }
.pin .bk li b { width: 28px; height: 28px; border-radius: 50%; background: #1F1F1F; color: #DFFF5A; display: grid; place-items: center; font: 800 16px 'Archivo'; flex: none; }
.pin .bk .dr { position: absolute; left: 28px; right: 28px; bottom: 24px; padding: 13px 18px; border-radius: 16px; background: #DFFF5A; font: 800 24px 'Archivo'; color: #1F1F1F; white-space: nowrap; }
.pin .bk .th { position: absolute; right: 22px; top: 22px; width: 74px; height: 74px; border-radius: 16px; overflow: hidden; }
.pin .bk .th img { width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; z-index: 40; background: #1F1F1F; }
.cap { position: absolute; z-index: 60; font: 800 58px/1.04 'Playfair Display'; letter-spacing: -0.02em; color: #FAF7EE; }
.cap em { font-style: italic; color: #DFFF5A; }
.capk { position: absolute; z-index: 60; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #DFFF5A; }
.band { position: absolute; z-index: 45; left: 0; right: 0; background: linear-gradient(180deg, rgba(246,242,234,.97) 0, rgba(246,242,234,.97) 78%, rgba(246,242,234,0) 100%); }
.fin { position: absolute; z-index: 46; font: 800 78px/1.0 'Playfair Display'; letter-spacing: -0.025em; color: #1F1F1F; }
.fin em { font-style: italic; background: linear-gradient(transparent 60%, #DFFF5A 60%, #DFFF5A 92%, transparent 92%); }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// F04 — a board of saved ideas, the pin-board look drawn by hand (no real app's UI). "Saved ideas? Make them real."
// Pins flip on the beat in 3D: each concept image turns over into the product it could become — a sample listing card
// with what MakeAndList makes for it (print-ready files, listing copy, listing images; a print file check for the printed
// one) and a lime "Draft · waits for your yes". The last pin hands over to the real app (the product, then the Send step),
// then the board returns: "Pin it. Make it. You approve."
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 117.5, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// [image, column, y, h, caption, back | null]
const PINS = tall ? [
  ['r04/g01-botanical-print', 0, 470, 520, 'botanical line art ✦', 0],
  ['r05/h08-postcard', 1, 470, 420, 'postcards for spring', 1],
  ['r04/g11-lemon-notebook', 0, 1020, 470, 'lemon pattern!!', 3],
  ['r04/g07-sticker-sheet', 1, 920, 520, 'woodland stickers', 2],
  ['r04/g12-nursery-art', 0, 1520, 480, 'nursery prints', null],
  ['r04/g03-slow-mornings-mug', 1, 1470, 500, 'mug lettering', null],
] : [
  ['r04/g01-botanical-print', 0, 250, 470, 'botanical line art ✦', 0],
  ['r05/h08-postcard', 1, 250, 400, 'postcards for spring', 1],
  ['r04/g11-lemon-notebook', 0, 750, 440, 'lemon pattern!!', 3],
  ['r04/g07-sticker-sheet', 1, 680, 460, 'woodland stickers', 2],
  ['r04/g12-nursery-art', 0, 1220, 400, 'nursery prints', null],
  ['r04/g03-slow-mornings-mug', 1, 1170, 400, 'mug lettering', null],
];
const BACKS = [
  ['Botanical line-art print', 'Printable wall art · 3 sizes', ['Print-ready files', 'Listing copy', 'Listing images']],
  ['Spring postcard set', 'Printable · 6 cards', ['Print-ready PDF', 'Title, description, tags', 'Listing images']],
  ['Woodland sticker sheet', 'Printable PDF · 2 sheets', ['Cut-ready sheet', 'Listing copy', 'Listing images']],
  ['Lemon notebook', 'Printed per order · your partner', ['Print file checked', 'Listing copy', 'Try-on preview']],
];
const FLIP = [B(3), B(6.5), B(11), B(14)];      // pins 0,1,3,2 (by back index)
const T_SCROLL = [B(8.4), B(10.2)], T_APP = B(17), T_SWAP = B(19.6), T_FIN = B(22.2);
const L = tall
  ? { colX: [65, 555], colW: 460, bhY: 286, finY: 300, scroll: 330, phX: 250, phY: 420, phW: 580, phH: 820, capX: 65, capY: 296, finFs: 76 }
  : { colX: [60, 552], colW: 468, bhY: 40, finY: 40, scroll: 0, phX: 560, phY: 110, phW: 460, phH: 1130, capX: 60, capY: 420, finFs: 70 };

K.box(0, 0, W, H, { cls: 'bg' });
const board = K.box(0, 0, W, H, { cls: 'board' });
const bh = K.box(L.colX[0], L.bhY, W - 130, null, { cls: 'bh', parent: board, html: `<div class="k">Board · 24 saved pins</div><div class="t">Saved ideas? <em>Make them real.</em></div><div class="m"><span class="on">Shop ideas</span><span>Prints</span><span>Stationery</span><span>Kids</span></div>` });
if (tall) bh.querySelector('.t').style.fontSize = '58px'; else bh.querySelector('.t').style.fontSize = '54px';
const pins = PINS.map(([src, col, y, h, cp, bi]) => {
  const p = K.box(L.colX[col], y, L.colW, h, { cls: 'pin', parent: board });
  const inn = K.el('div', { parent: p, cls: 'in' });
  const fr = K.el('div', { parent: inn, cls: 'fr', html: `<div class="ph"><img src="${K.pub(src + '.webp')}"></div><div class="cp">${cp}</div><div class="sv">Saved</div>` });
  let bk = null;
  if (bi !== null) {
    const [n, ty, li] = BACKS[bi];
    bk = K.el('div', { parent: inn, cls: 'bk', html: `<div class="k">Concept · sample listing</div><div class="th"><img src="${K.pub(src + '.webp')}"></div><div class="n" style="padding-right:84px">${n}</div><div class="ty">${ty}</div><ul>${li.map((x) => `<li><b>✓</b>${x}</li>`).join('')}</ul><div class="dr">Draft · waits for your yes</div>` });
  }
  return { p, inn, img: fr.querySelector('img'), bi, y, h };
});
const conceptTag = K.demoTag('Sample board · concept images, AI-generated', L.colX[0], tall ? 1196 : 1280); conceptTag.style.zIndex = 70;

// the real app
const shade = K.box(0, 0, W, H, { cls: 'shade' });
const deck = K.phoneDeck(L.phX, L.phY, L.phW, [K.screen('24-phone-product'), K.screen('72-phone-listing-send')], { h: L.phH });
deck.root.style.zIndex = 55;
const capk = K.box(L.capX, L.capY, tall ? W - 130 : 460, null, { cls: 'capk', html: 'In the real app' });
const caps = (tall ? ['Files, images, listing.', 'Then a draft, <em>until you say yes.</em>'] : ['Files, images,<br>listing.', 'Then a draft,<br><em>until you<br>say yes.</em>'])
  .map((t) => K.box(L.capX, L.capY + 40, tall ? W - 130 : 470, null, { cls: 'cap', html: t, style: { fontSize: (tall ? 52 : 62) + 'px' } }));
const realTag = K.demoTag('Real app · demo workspace', tall ? L.phX : L.capX, tall ? L.phY + L.phH + 14 : 1200); realTag.style.zIndex = 70;
realTag.style.color = '#45403A';

// finale band
const band = K.box(0, 0, W, tall ? 560 : 330, { cls: 'band' });
const fin = K.box(L.colX[0], L.finY, W - 130, null, { cls: 'fin', style: { fontSize: L.finFs + 'px' } });
const finW = K.words(fin, tall ? 'Pin it. Make it.\nYou approve.' : 'Pin it. Make it.\nYou approve.');
finW[finW.length - 1].innerHTML = '<em>approve.</em>';
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Your saved ideas,<br>made real.' });

K.run({
  id: 'F04', title: 'Board', dur: DUR, bpm: BPM, music: 'love-love-love', mood: 'bright', key: 'G', intro: 0.0, cover: 6.0,
  technique: 'A hand-drawn, unbranded pin board of saved concept images in two masonry columns; pins flip over in 3D on the beat (perspective, a scale bump at the edge) into sample listing cards showing what would be made and a lime “Draft · waits for your yes”; the board scrolls, the last pin hands over to the real app in a swiping phone, then the board returns under a band: “Pin it. Make it. You approve.”',
  caption: 'That board of saved ideas? Each one can become a product: describe it and MakeAndList makes the files, listing copy and images — as a draft until you say yes. The pins are concept images; the listings are samples. Start free at makeandlist.com',
  short: 'Saved ideas? Make them real.',
  question: 'What do I get?', gain: 'Ideas become finished products, drafts first',
  beats: ['0–1.5 s: a board of saved pins — “Saved ideas? Make them real.”', '1.5–3.4 s: the botanical print flips into a sample listing: files, copy, images · Draft', '3.4–5.6 s: the postcards flip; the board scrolls', '5.6–8.7 s: the sticker sheet and the printed notebook flip', '8.7–11.3 s: the real app: the product, then the Send step — a draft until you say yes', '11.3–13 s: the board returns: “Pin it. Make it. You approve.”; 13–15 s end card'],
  cues: [[0.0, 'pop'], [0.1, 'swish'], ...FLIP.flatMap((t) => [[+(t - 0.05).toFixed(3), 'swish'], [+(t + 0.32).toFixed(3), 'pop']]), [T_SCROLL[0], 'paper'],
    [+(T_APP - 0.1).toFixed(3), 'whoosh'], [+(T_APP + 0.4).toFixed(3), 'pop'], [T_SWAP, 'swish'], [+(T_SWAP + 0.5).toFixed(3), 'pop'], [+(T_FIN - 0.1).toFixed(3), 'whoosh'], [+(T_FIN + 0.3).toFixed(3), 'pop'], [B(24.4), 'chime'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;

  // board: enters from below, drifts, scrolls once
  const bin = K.p(T, 0, 0.6, E.outExpo);
  const sc = K.p(T, T_SCROLL[0], T_SCROLL[1], E.inOutCubic) * L.scroll;
  const appIn = K.p(T, T_APP - 0.1, T_APP + 0.4, E.inOutCubic), appOut = K.p(T, T_FIN - 0.1, T_FIN + 0.5, E.outExpo);
  const away = appIn * (1 - appOut);
  board.style.transform = `translateY(${(1 - bin) * 220 - sc - T * 4}px) scale(${1 - 0.06 * away})`;
  board.style.transformOrigin = '50% 40%';
  bh.style.opacity = K.p(T, 0.1, 0.5, E.linear) * (1 - K.p(T, T_FIN - 0.1, T_FIN + 0.2, E.linear));

  pins.forEach((pn, i) => {
    const pin = K.p(T, 0.05 + i * 0.06, 0.6 + i * 0.06, E.outExpo);
    pn.p.style.opacity = pin;
    pn.img.style.transform = `scale(${1.08 + 0.04 * Math.sin(T * 0.4 + i)}) translateY(${Math.sin(T * 0.5 + i) * 6}px)`;
    let ang = 0, bump = 0;
    if (pn.bi !== null) {
      const t0 = FLIP[pn.bi];
      const fp = K.p(T, t0, t0 + 0.5, E.inOutCubic);
      ang = 180 * fp; bump = Math.sin(fp * Math.PI);
    }
    pn.inn.style.transform = `translateY(${(1 - pin) * 80}px) rotateY(${ang}deg) scale(${1 + 0.07 * bump})`;
    pn.p.style.zIndex = bump > 0 ? 20 : 10;
  });
  conceptTag.style.opacity = (1 - away) * (T < 12.95 ? 1 : 0);

  // the real app
  shade.style.opacity = 0.94 * away; shade.style.visibility = away > 0 ? 'visible' : 'hidden';
  const posAt = (t) => K.p(t, T_SWAP, T_SWAP + 0.5, E.inOutCubic);
  deck.draw(posAt(T), [K.p(T, T_APP, T_SWAP, E.inOutCubic) * 0.14, 0.9 + K.p(T, T_SWAP + 0.5, T_FIN, E.inOutCubic) * 0.1], posAt(T) - posAt(T - 1 / 30));
  const dp = K.p(T, T_APP, T_APP + 0.55, E.outExpo);
  deck.root.style.opacity = Math.min(1, dp * 1.5) * (1 - appOut);
  deck.root.style.visibility = away > 0 ? 'visible' : 'hidden';
  deck.root.style.transform = `translateY(${(1 - dp) * 240 + appOut * 120}px) rotate(${(tall ? 0 : 2) + Math.sin(T * 0.8) * 0.4}deg) scale(${0.92 + 0.08 * dp})`;
  capk.style.opacity = away;
  caps.forEach((c, k) => {
    const a = k ? T_SWAP + 0.1 : T_APP + 0.2, b = k ? T_FIN - 0.1 : T_SWAP;
    const p = K.p(T, a, a + 0.45, E.outExpo), o = K.p(T, b - 0.15, b + 0.05, E.inCubic);
    c.style.opacity = p * (1 - o); c.style.transform = `translateY(${(1 - p) * 30}px)`;
    c.style.visibility = T >= a && T < b + 0.05 ? 'visible' : 'hidden';
  });
  realTag.style.opacity = away;

  // finale
  const fp = K.p(T, T_FIN, T_FIN + 0.5, E.outExpo);
  band.style.opacity = fp; band.style.transform = `translateY(${(1 - fp) * -60}px)`;
  K.reveal(finW, T, T_FIN + 0.1, { kind: 'up', stagger: 0.06, dur: 0.5 });
  fin.style.visibility = T >= T_FIN ? 'visible' : 'hidden';

  end(T);
});
</script></body></html>
