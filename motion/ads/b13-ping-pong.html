<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>B13 · You / The App</title><link rel="stylesheet" href="kit.css">
<style>
.lane { position: absolute; top: 0; overflow: hidden; }
.crop { position: absolute; overflow: hidden; border-radius: 30px; background: #FAF7EE; }
.crop img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
.card { position: absolute; border-radius: 34px; padding: 10px; transform-origin: 50% 0; }
.card.you { background: #FFFDF8; box-shadow: 0 40px 80px -40px rgba(31,31,31,.55), 0 0 0 1px #E6E0D5; }
.card.app { background: #2A2724; box-shadow: 0 40px 90px -40px rgba(0,0,0,.9), 0 0 0 1px #3A3632; }
.flash { position: absolute; inset: -6px; border-radius: 40px; border: 5px solid #DFFF5A; pointer-events: none; }
.lbl { position: absolute; text-align: center; font: 800 40px/1.1 'Archivo'; letter-spacing: -0.01em; white-space: nowrap; }
.lbl small { display: block; margin-bottom: 10px; font: 500 20px 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.hdr { position: absolute; font: 600 24px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; text-align: center; }
.hook { position: absolute; font: 800 84px/0.98 'Playfair Display'; letter-spacing: -0.02em; text-align: center; }
.ball { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; z-index: 40;
  background: radial-gradient(circle at 34% 30%, #F4FFB8 0, #DFFF5A 38%, #B9D93A 100%); box-shadow: 0 0 0 2px rgba(31,31,31,.18), 0 0 40px rgba(223,255,90,.55); }
.ghost { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: #DFFF5A; z-index: 39; }
.net { position: absolute; width: 4px; margin-left: -2px; background: repeating-linear-gradient(#DFFF5A 0 18px, transparent 18px 34px); z-index: 5; transform-origin: 50% 0; }
.yes { position: absolute; display: grid; place-items: center; border-radius: 999px; background: #DFFF5A; color: #1F1F1F; font: 800 44px 'Archivo'; white-space: nowrap; overflow: hidden; z-index: 41; }
.fin { position: absolute; text-align: center; font: 800 92px/1 'Playfair Display'; letter-spacing: -0.02em; }
.sub { position: absolute; text-align: center; font: 500 28px/1.35 'IBM Plex Mono', monospace; color: #45403A; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .07; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// B13 — ping-pong between "You" and "MakeAndList": every hand-off of a lime ball lands a real screen crop in the
// receiving lane. The seller's lane does the deciding, the app's lane does the legwork; at the end the lanes merge
// and the ball becomes the one button only the seller presses.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BEAT = 60 / 110;
const HITS = [3, 5, 7, 9, 11, 13, 15, 17].map((b) => +(b * BEAT).toFixed(3)); // 1.636 … 9.273
const MERGE = +(19 * BEAT).toFixed(3); // 10.364
const TAP = +(21 * BEAT).toFixed(3);   // 11.455
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const L = tall
  ? { hdrY: 300, hookY: 400, cardY: 400, cardH: 660, lblY: 1094, tagY: 1196, finY: 330, yesY: 700, subY: 830, fanY: 960 }
  : { hdrY: 66, hookY: 200, cardY: 180, cardH: 740, lblY: 952, tagY: 1100, finY: 120, yesY: 440, subY: 600, fanY: 800 };
const CW = 440, half = W / 2;
const laneX = (side) => (side === 0 ? (half - CW) / 2 : half + (half - CW) / 2);

// world: everything the camera pans
const world = K.box(0, 0, W, H, { style: { zIndex: 1 } });
const laneL = K.box(0, 0, half, H, { parent: world, cls: 'lane', style: { background: 'linear-gradient(160deg, #FAF7EE, #EFEADF)' } });
const laneR = K.box(half, 0, half, H, { parent: world, cls: 'lane', style: { background: 'linear-gradient(200deg, #262320, #171615)' } });
const glowL = K.box(0, 0, 900, 900, { parent: laneL, style: { borderRadius: '50%', background: 'radial-gradient(circle, rgba(223,255,90,.32), rgba(223,255,90,0) 62%)' } });
const glowR = K.box(0, 0, 900, 900, { parent: laneR, style: { borderRadius: '50%', background: 'radial-gradient(circle, rgba(223,255,90,.16), rgba(223,255,90,0) 62%)' } });
const dimL = K.box(0, 0, half, H, { parent: world, style: { background: '#1F1F1F', zIndex: 20, opacity: 0 } });
const dimR = K.box(half, 0, half, H, { parent: world, style: { background: '#000', zIndex: 20, opacity: 0 } });
const net = K.box(half, 0, 4, H, { parent: world, cls: 'net' });

const hdrL = K.box(65, L.hdrY, half - 130, null, { parent: world, cls: 'hdr', html: 'You', style: { color: '#45403A', zIndex: 30 } });
const hdrR = K.box(half + 65, L.hdrY, half - 130, null, { parent: world, cls: 'hdr', html: 'MakeAndList', style: { color: '#D9D3C9', zIndex: 30 } });
const hookL = K.box(65, L.hookY, half - 110, null, { parent: world, cls: 'hook', style: { color: '#1F1F1F', zIndex: 30 } });
const hookR = K.box(half + 45, L.hookY, half - 110, null, { parent: world, cls: 'hook', style: { color: '#FAF7EE', zIndex: 30 } });
const hookLW = K.words(hookL, 'You\ndecide.');
const hookRW = K.words(hookR, 'It does\nthe\nlegwork.');

// The eight hand-offs: [side, screen, sx, sy, sw, natH, small, label]
const CARDS = [
  [0, '22-phone-create', 30, 400, 720, 3400, 'Step 1', 'Describe it.'],
  [1, '65-phone-configure', 20, 200, 740, 3800, 'The plan', 'Plans every page.'],
  [0, '65-phone-configure', 20, 2690, 740, 3800, 'Your call', 'Approve the quote.'],
  [1, '69-phone-making', 30, 1500, 720, 2692, 'Making', 'Pages and images.'],
  [0, '24-phone-product', 20, 1180, 740, 3800, 'Your call', 'Check the files.'],
  [1, '51-phone-listing', 20, 1100, 740, 3800, 'The listing', 'Writes the copy.'],
  [0, '72-phone-listing-send', 20, 1060, 740, 3800, 'Your call', 'Pick your store.'],
  [1, '72-phone-listing-send', 20, 2690, 740, 3800, 'Draft only', 'Sends a draft.'],
];
const cards = CARDS.map(([side, src, sx, sy, sw, natH, small, label], i) => {
  const c = K.box(laneX(side), L.cardY, CW, L.cardH, { parent: world, cls: 'card ' + (side ? 'app' : 'you'), style: { zIndex: 10 + i } });
  const ih = L.cardH - 20, iw = CW - 20, s = iw / sw, srcH = ih / s;
  const cr = K.box(0, 0, iw, ih, { parent: c, cls: 'crop', style: { position: 'relative' } });
  const img = K.el('img', { src: K.screen(src), parent: cr, style: { width: 780 * s + 'px' } });
  const y0 = Math.min(sy, natH - srcH);
  const flash = K.el('div', { parent: c, cls: 'flash' });
  const lbl = K.box(side === 0 ? 40 : half + 40, L.lblY, half - 80, null, { parent: world, cls: 'lbl', html: `<small>${small}</small>${label}`, style: { color: side ? '#FAF7EE' : '#1F1F1F', zIndex: 30 } });
  return { c, img, s, sx, y0, srcH, flash, lbl, side, t: HITS[i] };
});

const ghosts = [0, 1, 2, 3].map(() => K.box(0, 0, 66, 66, { parent: world, cls: 'ghost' }));
const ball = K.box(0, 0, 66, 66, { parent: world, cls: 'ball' });
const yes = K.box(0, 0, 66, 66, { parent: world, cls: 'yes', html: '<span>Yes, publish</span>' });
const yesTxt = yes.firstChild;
const ripple = K.box(0, 0, 160, 160, { parent: world, style: { borderRadius: '50%', border: '5px solid #1F1F1F', marginLeft: '-80px', marginTop: '-80px', zIndex: 42, opacity: 0 } });
const fin = K.box(65, L.finY, W - 130, null, { parent: world, cls: 'fin', style: { zIndex: 30 } });
const finW = K.words(fin, 'Live only on\nyour yes.');
const sub = K.box(65, L.subY, W - 130, null, { parent: world, cls: 'sub', html: 'Every listing arrives as a draft.<br>You review it before it goes live.', style: { zIndex: 30 } });

const tag = K.demoTag('Real app · demo workspace', 0, 0);
tag.style.left = '50%'; tag.style.top = L.tagY + 'px'; tag.style.zIndex = 60;
const grain = K.box(0, 0, W, H, { cls: 'gr' });

// End card, lifted in 9:16 so the CTA sits above y 1248; a slow lime glow keeps it alive.
const end = K.endCard(13.0, { line: 'You decide.<br>It does the legwork.' });
const endBg = document.getElementById('stage').lastElementChild;
if (tall) [...endBg.children].forEach((c) => { c.style.top = parseFloat(c.style.top) - 150 + 'px'; });
const endGlow = K.el('div', { parent: endBg, style: { position: 'absolute', width: '1100px', height: '1100px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(223,255,90,.38), rgba(223,255,90,0) 60%)' } });
endBg.insertBefore(endGlow, endBg.firstChild);
const endBall = K.el('div', { parent: endBg, cls: 'ball', style: { position: 'absolute' } });

// ball position at time t (world coords): anchor = top centre of each landed card
const anchor = (i) => [laneX(CARDS[i][0]) + CW / 2, L.cardY + 6];
function ballAt(t) {
  if (t < HITS[0]) { // served: drops in from above the left lane
    const p = K.p(t, 0.9, HITS[0], E.inCubic);
    const [x, y] = anchor(0);
    return [x - 120 * (1 - p), K.lerp(-80, y, p), p];
  }
  for (let i = 1; i < HITS.length; i++) {
    if (t < HITS[i]) {
      const [x0, y0] = anchor(i - 1), [x1, y1] = anchor(i);
      const u = (t - HITS[i - 1]) / (HITS[i] - HITS[i - 1]);
      const x = K.lerp(x0, x1, E.inOutCubic(u));
      const peak = tall ? 260 : 120;
      const y = K.lerp(y0, y1, u) - 4 * peak * u * (1 - u);
      return [x, y, u];
    }
  }
  // last arc: from the app's lane to the centre, where it becomes the button
  const [x0, y0] = anchor(HITS.length - 1);
  const u = K.clamp((t - HITS[HITS.length - 1]) / (MERGE - HITS[HITS.length - 1]));
  const x = K.lerp(x0, half, E.inOutCubic(u));
  const y = K.lerp(y0, L.yesY + 55, u) - 4 * (tall ? 300 : 160) * u * (1 - u);
  return [x, y, u];
}
const lastHit = (t) => { let h = -1; HITS.forEach((x, i) => { if (t >= x) h = i; }); return h; };

K.run({
  id: 'B13', title: 'You / The App', dur: DUR, bpm: 110, mood: 'bright', key: 'A', intro: 1.64, cover: 5.2,
  technique: 'Split-screen ping-pong: a lime ball arcs between a "You" lane and a "MakeAndList" lane on the beat, each impact pops a real screen crop with a flash ring, the active lane lights while the camera leans toward it; the lanes merge and the ball stretches into the one "Yes, publish" button',
  caption: 'You describe the idea, approve the quote, check the files and pick the store. MakeAndList plans the pages, makes them, writes the listing and sends it as a draft. It goes live only on your yes. Start free at makeandlist.com',
  short: 'You decide. It does the legwork.',
  beats: ['0–1.6 s: “You decide. It does the legwork.” on two lanes', '1.6–5.5 s: the ball serves: describe → plan → approve → make', '5.5–9.3 s: check the files → listing → pick a store → a draft', '9.3–12.9 s: lanes merge, the ball becomes “Yes, publish”: “Live only on your yes.”', '13–15 s: end card'],
  cues: [[0.05, 'hit'], [0.95, 'whoosh'], ...HITS.map((h) => [h, 'pop']), [9.6, 'riser'], [MERGE, 'hit'], [TAP, 'click'], [TAP + 0.15, 'pop'], [12.8, 'whoosh'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;

  // lanes slide in from opposite ends, then (merge) the app lane wipes off and the seller's lane takes the frame
  const li = K.p(T, 0, 0.7, E.outExpo);
  const mg = K.p(T, MERGE - 0.05, MERGE + 0.55, E.inOutExpo);
  laneL.style.transform = `translateY(${(1 - li) * -H}px)`;
  laneL.style.width = half + half * mg + 'px';
  laneR.style.transform = `translateY(${(1 - li) * H}px) translateX(${mg * half}px)`;
  dimL.style.width = half + 'px';
  glowL.style.transform = `translate(${-450 + half / 2 + Math.sin(T * 0.7) * 80 + mg * half / 2}px, ${L.cardY + L.cardH / 2 - 450 + Math.cos(T * 0.5) * 60}px)`;
  glowR.style.transform = `translate(${-450 + half / 2 + Math.cos(T * 0.6) * 80}px, ${L.cardY + L.cardH / 2 - 450 + Math.sin(T * 0.55) * 60}px)`;
  net.style.transform = `scaleY(${K.p(T, 0.4, 1.0, E.outExpo) * (1 - K.p(T, MERGE - 0.3, MERGE + 0.1, E.inCubic))})`;

  // which lane has the ball: it lights up, the other dims, and the camera leans that way
  const h = lastHit(T);
  let lean = 0;
  if (h >= 0 && T < MERGE) {
    const nextSide = h + 1 < HITS.length ? CARDS[h + 1][0] : -1;
    const side = CARDS[h][0];
    const u = h + 1 < HITS.length ? K.clamp((T - HITS[h]) / (HITS[h + 1] - HITS[h])) : K.clamp((T - HITS[h]) / (MERGE - HITS[h]));
    const s0 = side === 0 ? -1 : 1, s1 = nextSide === 0 ? -1 : nextSide === 1 ? 1 : 0;
    lean = K.lerp(s0, s1, E.inOutCubic(u));
  }
  const camOn = K.p(T, HITS[0] - 0.4, HITS[0] + 0.3) * (1 - mg);
  world.style.transform = `translateX(${-lean * 16 * camOn}px) rotate(${lean * 0.35 * camOn}deg) scale(${1.015 + 0.01 * Math.sin(T * 0.9)})`;
  dimL.style.opacity = Math.max(0, lean) * 0.1 * camOn;
  dimR.style.opacity = Math.max(0, -lean) * 0.35 * camOn;

  // hook, then the lane headers
  K.reveal(hookLW, T, 0.15, { kind: 'up', stagger: 0.09, out: 1.3 });
  K.reveal(hookRW, T, 0.45, { kind: 'up', stagger: 0.09, out: 1.36 });
  const hp = K.p(T, 1.45, 1.95, E.outExpo) * (1 - K.p(T, MERGE - 0.4, MERGE, E.inCubic));
  [hdrL, hdrR].forEach((e, i) => { e.style.opacity = hp; e.style.transform = `translateY(${(1 - hp) * 24}px)`; e.style.letterSpacing = (0.14 + 0.1 * (1 - hp)) + 'em'; });

  // cards: pop on impact, recede as the lane fills, then fan out into the whole flow at the merge
  cards.forEach((C, i) => {
    let d = 0; for (let j = i + 2; j < cards.length; j += 2) d += K.p(T, cards[j].t - 0.05, cards[j].t + 0.4, E.outCubic);
    const pop = K.p(T, C.t, C.t + 0.5, E.outBack);
    const vis = T >= C.t ? 1 : 0;
    const float = Math.sin(T * 1.4 + i * 1.7) * 5;
    const fan = K.p(T, MERGE + i * 0.04, MERGE + 0.7 + i * 0.04, E.outExpo);
    const fs = 0.3, fanW = CW * fs, gap = (W - 130 - fanW) / 7;
    const fx = 65 + i * gap, fy = L.fanY + Math.abs(i - 3.5) * 10;
    const bx = laneX(C.side), by = L.cardY - d * (tall ? 70 : 50) + float;
    const sc = (0.82 + 0.18 * pop) * (1 - 0.1 * Math.min(d, 2));
    const x = K.lerp(bx, fx - CW * (1 - fs) / 2, fan), y = K.lerp(by, fy, fan);
    const s = K.lerp(sc, fs, fan), rot = K.lerp(0, (i - 3.5) * 3, fan);
    C.c.style.left = x + 'px'; C.c.style.top = y + 'px';
    C.c.style.transform = `translateY(${(1 - pop) * 50}px) scale(${s}) rotate(${rot}deg)`;
    C.c.style.opacity = vis * K.lerp(Math.max(0, 1 - Math.max(0, d - 0.6) * 1.2), 1, fan);
    C.c.style.filter = `brightness(${K.lerp(1 - 0.18 * Math.min(d, 1), 1, fan)})`;
    C.c.style.zIndex = fan > 0.01 ? 10 + i : 10 + i;
    // the screen inside drifts slowly downward (a live screen, not a still)
    const drift = K.p(T, C.t, C.t + 3.2, E.outCubic) * 90;
    C.img.style.transform = `translate(${-C.sx * C.s}px, ${-(C.y0 + Math.min(drift, Math.max(0, 3800 - C.y0 - C.srcH))) * C.s}px)`;
    const fp = K.p(T, C.t, C.t + 0.45, E.outCubic);
    C.flash.style.opacity = vis * (1 - fp); C.flash.style.transform = `scale(${1 + fp * 0.06})`;
    const lp = K.p(T, C.t + 0.05, C.t + 0.5, E.outExpo);
    const lo = 1 - K.p(T, (cards[i + 2] ? cards[i + 2].t : MERGE) - 0.3, (cards[i + 2] ? cards[i + 2].t : MERGE) - 0.05, E.inCubic);
    C.lbl.style.opacity = vis * lp * lo;
    C.lbl.style.transform = `translateY(${(1 - lp) * 30 - (1 - lo) * 24}px)`;
  });

  // ball with squash on impact and a short motion trail
  const [bx, by, bu] = ballAt(T);
  let since = 99; HITS.forEach((x) => { if (T >= x) since = T - x; });
  const squash = Math.exp(-since * 9) * Math.cos(since * 30);
  const sq = since < 0.4 ? squash * 0.32 : 0;
  const toYes = K.p(T, MERGE, MERGE + 0.55, E.outExpo);
  ball.style.left = bx + 'px'; ball.style.top = by + 'px';
  ball.style.transform = `scale(${1 + sq}, ${1 - sq})`;
  ball.style.opacity = T > 0.9 && T < MERGE + 0.02 ? 1 : 0;
  ghosts.forEach((g, k) => {
    const [gx, gy] = ballAt(T - (k + 1) * 0.035);
    g.style.left = gx + 'px'; g.style.top = gy + 'px';
    g.style.opacity = T > 1.0 && T < MERGE ? 0.22 - k * 0.05 : 0;
    g.style.transform = `scale(${1 - (k + 1) * 0.12})`;
  });

  // merge: the ball stretches into the button, a tap, then the promise
  const yw = K.lerp(66, tall ? 520 : 480, toYes), yh = K.lerp(66, 112, toYes);
  const press = T > TAP - 0.06 && T < TAP + 0.12 ? 0.95 : 1;
  const settle = 1 + 0.06 * Math.exp(-Math.max(0, T - TAP - 0.12) * 7) * Math.sin(Math.max(0, T - TAP - 0.12) * 22) * (T > TAP ? 1 : 0);
  yes.style.width = yw + 'px'; yes.style.height = yh + 'px';
  yes.style.left = half - yw / 2 + 'px'; yes.style.top = L.yesY + 55 - yh / 2 + 'px';
  yes.style.opacity = T >= MERGE ? 1 : 0;
  yes.style.transform = `scale(${press * settle})`;
  yes.style.background = T > TAP ? '#1F1F1F' : '#DFFF5A'; yes.style.color = T > TAP ? '#DFFF5A' : '#1F1F1F';
  yesTxt.textContent = T > TAP ? 'Live in your store' : 'Yes, publish';
  yesTxt.style.opacity = K.p(T, MERGE + 0.3, MERGE + 0.6, E.linear);
  const rp = K.p(T, TAP, TAP + 0.6, E.outCubic);
  ripple.style.left = half + 'px'; ripple.style.top = L.yesY + 55 + 'px';
  ripple.style.opacity = T >= TAP && T < TAP + 0.6 ? 1 - rp : 0; ripple.style.transform = `scale(${0.5 + rp * 1.6})`;
  K.reveal(finW, T, MERGE + 0.25, { kind: 'up', stagger: 0.07 });
  const sp = K.p(T, MERGE + 0.7, MERGE + 1.2, E.outExpo);
  sub.style.opacity = sp; sub.style.transform = `translateY(${(1 - sp) * 20}px)`;

  tag.style.opacity = K.win(T, HITS[0], 12.8, 0.3);
  tag.style.transform = `translateX(-50%) translateY(${T > MERGE ? 0 : 0}px)`;

  end(T);
  endGlow.style.left = W / 2 - 550 + Math.sin(T * 1.1) * 120 + 'px';
  endGlow.style.top = H * (tall ? 0.38 : 0.42) - 550 + Math.cos(T * 0.9) * 80 + 'px';
  // the ball rolls in under the CTA and settles
  const eb = K.p(T, 13.6, 14.4, E.outCubic);
  const ctaEl = endBg.querySelector('.chip');
  const ctaTop = parseFloat(ctaEl.style.top);
  const ebx = K.lerp(-80, W / 2 + ctaEl.offsetWidth / 2 + 60, eb);
  endBall.style.left = ebx - 33 + 'px'; endBall.style.top = ctaTop + 10 - Math.abs(Math.sin(eb * Math.PI * 3)) * 70 * (1 - eb) + 'px';
  endBall.style.margin = '0'; endBall.style.transform = `rotate(${eb * 720}deg)`;
  endBall.style.opacity = T > 13.6 ? 1 : 0;
});
</script></body></html>
