<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>D03 · Myth vs Fact</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #1B1A18; }
.board { position: absolute; inset: 0; opacity: .5;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 64px), repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 3px, transparent 3px 48px); }
.glow { position: absolute; border-radius: 50%; pointer-events: none; }
.rig { position: absolute; perspective: 2600px; z-index: 10; }
.half { position: absolute; left: 0; width: 100%; overflow: hidden; backface-visibility: hidden; }
.half.t { top: 0; border-radius: 30px 30px 0 0; transform-origin: 50% 100%; }
.half.b { border-radius: 0 0 30px 30px; transform-origin: 50% 0; }
.face { position: absolute; left: 0; top: 0; }
.shadeL { position: absolute; inset: 0; background: #000; pointer-events: none; }
.hinge { position: absolute; left: -6px; right: -6px; height: 6px; margin-top: -3px; background: #0F0E0D; z-index: 20; border-radius: 3px; }
.pin { position: absolute; width: 22px; height: 34px; margin-top: -17px; border-radius: 6px; background: #2C2A27; box-shadow: inset 0 0 0 2px #3A3733; z-index: 21; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.lab { position: absolute; font: 600 26px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
.chipF { position: absolute; font: 700 28px 'IBM Plex Mono', monospace; letter-spacing: .12em; padding: 10px 20px; border-radius: 999px; background: #DFFF5A; color: #1F1F1F; }
.big { position: absolute; font-family: 'Playfair Display'; font-weight: 800; font-variant-numeric: lining-nums; letter-spacing: -0.03em; line-height: .95; }
.stmt { position: absolute; font-family: 'Playfair Display'; font-weight: 800; letter-spacing: -0.02em; line-height: 1.02; }
.sub2 { position: absolute; font: 500 32px/1.3 'Archivo'; }
.ph { position: absolute; left: 0; top: 0; overflow: hidden; }
.ph img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.scr { position: absolute; overflow: hidden; background: #FAF7EE; }
.scr img { position: absolute; left: 0; top: 0; display: block; }
.demo { background: rgba(31,31,31,.8); color: #EFEADF; border-color: #8A8378; }
.strip { position: absolute; display: flex; gap: 18px; z-index: 10; }
.tile { position: relative; width: 150px; height: 84px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; font: 700 22px 'IBM Plex Mono', monospace; letter-spacing: .1em; }
.tile span { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; border-radius: 14px; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// D03 — a giant split-flap card, the station-board kind. Every flip is a real two-leaf split-flap: the top leaf falls,
// the bottom leaf lands. Each myth (clay) flips to its fact (a product photo over the plain answer) on the beat; the
// third fact is the real Send screen: drafts first, public only when the seller says.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BEAT = 60 / 103.4, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const L = tall
  ? { x: 70, y: 276, cw: 940, ch: 866, stripY: 1162, mythFs: 250, stmtFs: 92, factFs: 84, subFs: 34 }
  : { x: 150, y: 60, cw: 780, ch: 1000, stripY: 1110, mythFs: 210, stmtFs: 78, factFs: 72, subFs: 30 };
const CW = L.cw, CH = L.ch, HH = CH / 2, P = tall ? 60 : 52;

const MYTHS = [
  { m: '“You need<br>design skills.”', f: 'Describe it<br>in a sentence.', s: 'You review the real files before anything is sold.', img: 'g24-colouring-book', fy: 40 },
  { m: '“Selling prints<br>means stock.”', f: 'Your partner<br>prints each order.', s: 'Paid from your own partner account. No shelves.', img: 'g23-mug-set', fy: 50 },
  { m: '“AI posts things<br>for you.”', f: 'Drafts first.<br>Your yes, then live.', s: 'Nothing is published or printed without you.', scr: '72-phone-listing-send', y0: 1056 },
];

// faces: each built as a full card; a half shows its top or bottom
function face(kind, i) {
  const fc = K.el('div', { cls: 'face', style: { width: CW + 'px', height: CH + 'px' } });
  const add = (cls, html, st) => K.el('div', { cls, html, parent: fc, style: st });
  if (kind === 'hook') {
    fc.style.background = '#1F1F1F';
    const ph = add('ph', '', { width: CW + 'px', height: HH + 'px' });
    K.el('img', { src: K.pub('r04/g08-gallery-wall.webp'), parent: ph, style: { objectPosition: '50% 32%' } });
    add('', '', { position: 'absolute', left: 0, top: 0, width: CW + 'px', height: HH + 'px', background: 'linear-gradient(180deg, rgba(20,19,17,0) 30%, rgba(20,19,17,.78) 100%)' });
    add('big', 'Three myths', { left: P + 'px', top: HH - L.mythFs * 0.62 - 26 + 'px', fontSize: L.mythFs * 0.62 + 'px', color: '#FAF7EE' });
    const t = K.demoTag('Concept image · AI-generated', P - 10, 24); fc.appendChild(t);
    add('stmt', 'about selling<br>prints.', { left: P + 'px', top: HH + 40 + 'px', fontSize: L.mythFs * 0.5 + 'px', color: '#DFFF5A', fontStyle: 'italic' });
    add('lab', 'Watch them flip ↓', { left: P + 'px', bottom: '44px', color: '#8A8378' });
  } else if (kind === 'myth') {
    fc.style.background = '#C4532F';
    add('lab', `Myth 0${i + 1} / 03`, { left: P + 'px', top: P - 6 + 'px', color: '#FBD9C9' });
    add('big', 'Myth.', { left: P - 8 + 'px', top: HH - L.mythFs * 0.92 - 18 + 'px', fontSize: L.mythFs + 'px', color: '#FAF7EE', fontStyle: 'italic' });
    add('stmt', MYTHS[i].m, { left: P + 'px', top: HH + 48 + 'px', fontSize: L.stmtFs + 'px', color: '#FAF7EE' });
    add('lab', 'Heard it before?', { left: P + 'px', bottom: '44px', color: '#FBD9C9' });
  } else if (kind === 'fact') {
    fc.style.background = '#FAF7EE';
    const M = MYTHS[i];
    if (M.img) {
      const ph = add('ph', '', { width: CW + 'px', height: HH + 'px' });
      K.el('img', { src: K.pub('r04/' + M.img + '.webp'), parent: ph, style: { objectPosition: `50% ${M.fy}%` } });
      const t = K.demoTag('Concept image · AI-generated', CW - (tall ? 380 : 360), HH - 58); fc.appendChild(t);
    } else {
      const sc = add('scr', '', { left: 0, top: 0, width: CW + 'px', height: HH + 'px', background: '#F4F1EA' });
      const w = tall ? 700 : 600, s = w / 780;
      const inner = K.el('div', { parent: sc, style: { position: 'absolute', left: (CW - w) / 2 + 'px', top: '100px', width: w + 'px', height: HH + 'px', overflow: 'hidden', borderRadius: '26px 26px 0 0', boxShadow: '0 30px 60px -30px rgba(31,31,31,.5), 0 0 0 1.5px #E2DBCE' } });
      K.el('img', { src: K.screen(M.scr), parent: inner, style: { position: 'absolute', left: 0, top: -M.y0 * s + 'px', width: w + 'px' } });
      const t = K.demoTag('Real app · demo workspace', CW - (tall ? 360 : 340), 34); fc.appendChild(t);
    }
    add('chipF', `Fact 0${i + 1}`, { left: P + 'px', top: P - 10 + 'px' });
    add('stmt', M.f, { left: P + 'px', top: HH + 52 + 'px', fontSize: L.factFs + 'px', color: '#1F1F1F' });
    add('sub2', M.s, { left: P + 'px', right: P + 'px', bottom: (tall ? 64 : 52) + 'px', fontSize: L.subFs + 'px', color: '#45403A' });
  } else {
    fc.style.background = '#1F1F1F';
    add('', '', { position: 'absolute', left: 0, top: 0, width: CW + 'px', height: HH + 'px', background: '#DFFF5A' });
    add('lab', 'The score', { left: P + 'px', top: P - 6 + 'px', color: '#45403A' });
    add('big', 'Myths: 0', { left: P - 6 + 'px', top: HH - L.mythFs * 0.7 - 30 + 'px', fontSize: L.mythFs * 0.7 + 'px', color: '#1F1F1F' });
    add('big', 'Facts: 3', { left: P - 6 + 'px', top: HH + 40 + 'px', fontSize: L.mythFs * 0.7 + 'px', color: '#DFFF5A' });
    add('lab', 'Try them yourself', { left: P + 'px', bottom: '44px', color: '#8A8378' });
  }
  return fc;
}
const FACES = [['hook'], ['myth', 0], ['fact', 0], ['myth', 1], ['fact', 1], ['myth', 2], ['fact', 2], ['final']];
// flip k (FACES[k] → FACES[k+1]) starts at FLIP[k]; each takes one beat
const FLIP = [3, 6, 9, 12, 15, 18, 21].map(B);
const FD = B(1);

const glowA = K.box(0, 0, 1400, 1400, { cls: 'glow', style: { background: 'radial-gradient(circle, rgba(223,255,90,.13), rgba(223,255,90,0) 62%)' } });
const glowB = K.box(0, 0, 1200, 1200, { cls: 'glow', style: { background: 'radial-gradient(circle, rgba(232,96,60,.16), rgba(232,96,60,0) 62%)' } });
K.box(0, 0, W, H, { cls: 'board' });
const rig = K.box(L.x, L.y, CW, CH, { cls: 'rig' });
const shadow = K.box(L.x + 30, L.y + CH - 40, CW - 60, 80, { style: { borderRadius: '50%', background: 'rgba(0,0,0,.55)', filter: 'blur(30px)', zIndex: 5 } });
const halves = FACES.map(([kind, i]) => {
  const t = K.el('div', { cls: 'half t', parent: rig, style: { height: HH + 'px' } });
  t.appendChild(face(kind, i));
  const ts = K.el('div', { cls: 'shadeL', parent: t });
  const b = K.el('div', { cls: 'half b', parent: rig, style: { top: HH + 'px', height: HH + 'px' } });
  const fb = face(kind, i); fb.style.top = -HH + 'px'; b.appendChild(fb);
  const bs = K.el('div', { cls: 'shadeL', parent: b });
  return { t, b, ts, bs };
});
K.el('div', { cls: 'hinge', parent: rig, style: { top: HH + 'px' } });
K.el('div', { cls: 'pin', parent: rig, style: { left: '-30px', top: HH + 'px' } });
K.el('div', { cls: 'pin', parent: rig, style: { right: '-30px', top: HH + 'px' } });

// the score strip under the card: three small flaps, red until their fact lands
const strip = K.box(0, L.stripY, null, null, { cls: 'strip', style: { width: 'auto', height: 'auto' } });
const tiles = MYTHS.map((_, i) => {
  const t = K.el('div', { cls: 'tile', parent: strip, style: { perspective: '600px' } });
  const a = K.el('span', { parent: t, html: `0${i + 1} · Myth`, style: { background: '#3A2620', color: '#F0A58A' } });
  const b = K.el('span', { parent: t, html: `0${i + 1} · Fact`, style: { background: '#DFFF5A', color: '#1F1F1F' } });
  return { a, b };
});
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'No skills, no stock,<br>no surprises.' });

K.run({
  id: 'D03', title: 'Myth vs Fact', dur: DUR, music: 'earth', bpm: 103.4, mood: 'bright', key: 'G', intro: 0.0, cover: 4.0,
  technique: 'One giant split-flap card with real two-leaf flips (the top leaf falls, the bottom leaf lands, with shading and a settle), clay myths flipping to product-photo facts on every third beat; a score strip of small flaps tallies myths into facts',
  caption: 'Three myths about selling prints: you do not need design skills (describe it, review the real files), you do not need stock (your print partner prints each order), and nothing goes live without your yes. Start free at makeandlist.com',
  short: 'Three myths, flipped to facts.',
  question: 'Can I do this without skills or stock?', gain: 'No design skills, no stock, control',
  beats: ['0–1.7 s: the board: “Three myths about selling prints.” over a gallery wall', '1.7–5.2 s: Myth: you need design skills → Fact: describe it, review real files', '5.2–8.7 s: Myth: selling prints means stock → Fact: your partner prints each order', '8.7–12.2 s: Myth: AI posts things for you → Fact: drafts first, the real Send screen', '12.2–13 s: Myths: 0 · Facts: 3', '13–15 s: end card'],
  cues: [[0.0, 'hit'], [0.1, 'paper'],
    ...FLIP.flatMap((t, k) => [[t, 'click'], [t + FD * 0.5, 'paper'], [t + FD, k % 2 ? (k === 5 ? 'chime' : 'hit') : 'pop']]),
    [FLIP[1] + FD + 0.2, 'swish'], [FLIP[3] + FD + 0.2, 'swish'], [FLIP[5] + FD + 0.2, 'swish'], [12.95, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  glowA.style.transform = `translate(${W / 2 - 700 + Math.sin(T * 0.6) * 160}px, ${L.y + CH / 2 - 700 + Math.cos(T * 0.45) * 140}px)`;
  glowB.style.transform = `translate(${-300 + Math.cos(T * 0.5) * 140}px, ${H * 0.75 - 600 + Math.sin(T * 0.7) * 120}px)`;

  // card entrance and a slow, living tilt
  const inP = K.p(T, 0, 0.6, E.outExpo);
  rig.style.transform = `translateY(${(1 - inP) * 120}px) rotateX(${Math.sin(T * 0.8) * 1.2}deg) rotateY(${Math.sin(T * 0.55) * 1.5}deg) scale(${0.94 + 0.06 * inP})`;
  rig.style.opacity = inP;
  shadow.style.opacity = inP;

  // which flip is current
  let k = -1; FLIP.forEach((t, j) => { if (T >= t) k = j; });
  const cur = k + 1; // the face that is (or is becoming) current
  const p = k >= 0 ? K.clamp((T - FLIP[k]) / FD) : 1;
  halves.forEach((h, j) => {
    let tv = false, bv = false, tz = 1, bz = 1, tr = 0, br = 0, ts = 0, bs = 0;
    if (k >= 0 && p < 1) {
      const prev = k;
      if (j === cur) { tv = true; tz = 1; ts = 0.35 * (1 - p); }                         // next top waits behind
      if (j === prev) { bv = true; bz = 1; bs = 0.4 * K.clamp((p - 0.5) * 2); }            // old bottom gets covered
      if (j === prev && p < 0.5) { tv = true; tz = 3; const q = E.inCubic(p * 2); tr = -90 * q; ts = 0.55 * q; }
      if (j === cur && p >= 0.5) { bv = true; bz = 3; const q = E.outBack(K.clamp((p - 0.5) * 2)); br = 90 * (1 - q); bs = 0.45 * (1 - K.clamp((p - 0.5) * 2)); }
    } else if (j === cur) { tv = bv = true; }
    h.t.style.visibility = tv ? 'visible' : 'hidden'; h.b.style.visibility = bv ? 'visible' : 'hidden';
    h.t.style.zIndex = tz; h.b.style.zIndex = bz;
    h.t.style.transform = `rotateX(${tr}deg)`; h.b.style.transform = `rotateX(${br}deg)`;
    h.ts.style.opacity = ts; h.bs.style.opacity = bs;
  });

  // score strip
  const sp = K.p(T, B(2), B(3), E.outExpo);
  strip.style.opacity = sp;
  const sw = 3 * 150 + 2 * 18;
  strip.style.left = (W - sw) / 2 + 'px';
  strip.style.transform = `translateY(${(1 - sp) * 30}px)`;
  tiles.forEach((tl, i) => {
    const t0 = FLIP[1 + i * 2] + FD;
    const q = K.p(T, t0, t0 + 0.45, E.outBack);
    tl.a.style.transform = `rotateX(${-180 * q}deg)`; tl.b.style.transform = `rotateX(${180 - 180 * q}deg)`;
    const act = T >= FLIP[i * 2] && T < FLIP[i * 2 + 2];
    tl.a.parentNode.style.boxShadow = act ? '0 0 0 3px #FAF7EE' : 'none';
  });

  end(T);
});
</script></body></html>
