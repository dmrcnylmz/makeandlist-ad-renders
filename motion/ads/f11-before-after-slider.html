<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>F11 · Before and After</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #EFE9DD; }
.bg { position: absolute; inset: 0; background: radial-gradient(110% 70% at 50% 55%, #F8F4EC 0, #EDE6D8 60%, #E2D9C8 100%); }
.card { position: absolute; z-index: 10; border-radius: 30px; overflow: hidden; background: #FFFDF8; box-shadow: 0 60px 110px -50px rgba(31,31,31,.6), 0 0 0 1.5px rgba(31,31,31,.08); transform-origin: 50% 60%; }
.lay { position: absolute; inset: 0; overflow: hidden; }
.lay img { position: absolute; left: 0; top: 0; display: block; }
.blank { position: absolute; background: #FFFDF8; }
.blank .gh { position: absolute; border: 3px dashed #DDD5C7; border-radius: 14px; }
.blank .ln { position: absolute; height: 12px; border-radius: 6px; background: #EEE8DC; }
.note { position: absolute; z-index: 3; font: 500 30px/1.38 'IBM Plex Mono', monospace; color: #1F1F1F; }
.note u { text-decoration: none; display: block; margin-bottom: 10px; font: 600 17px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #8A8378; text-transform: uppercase; }
.caret { display: inline-block; width: 3px; height: 30px; vertical-align: -5px; background: #1F1F1F; margin-left: 2px; }
.wall { position: absolute; background: linear-gradient(180deg, #EAE3D6, #E4DCCD); box-shadow: inset 0 0 30px rgba(120,100,70,.12); }
.lbl { position: absolute; z-index: 12; top: 22px; font: 700 18px 'IBM Plex Mono', monospace; letter-spacing: .14em; padding: 8px 14px; border-radius: 10px; }
.lbl.b { left: 22px; background: rgba(31,31,31,.78); color: #FAF7EE; }
.lbl.a { right: 22px; background: #DFFF5A; color: #1F1F1F; }
.ctr { position: absolute; z-index: 12; left: 50%; top: 24px; transform: translateX(-50%); font: 600 17px 'IBM Plex Mono', monospace; letter-spacing: .1em; color: #FAF7EE; background: rgba(31,31,31,.62); padding: 6px 14px; border-radius: 99px; }
.div { position: absolute; z-index: 11; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: #FFFDF8; box-shadow: 0 0 0 1px rgba(31,31,31,.15), 0 0 24px rgba(31,31,31,.25); }
.knob { position: absolute; z-index: 13; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; background: #FFFDF8; box-shadow: 0 16px 34px -12px rgba(31,31,31,.6), 0 0 0 1px rgba(31,31,31,.12); display: flex; align-items: center; justify-content: center; gap: 14px; }
.knob i { width: 0; height: 0; border-top: 13px solid transparent; border-bottom: 13px solid transparent; }
.knob i.l { border-right: 16px solid #1F1F1F; } .knob i.r { border-left: 16px solid #1F1F1F; }
.touch { position: absolute; z-index: 14; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(31,31,31,.14); border: 3px solid rgba(31,31,31,.4); }
.cap { position: absolute; z-index: 30; font: 800 68px/1.02 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; text-align: center; }
.cap .k { display: block; margin-bottom: 12px; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #6B645A; }
.cap em { font-style: italic; background: linear-gradient(transparent 58%, #DFFF5A 58%, #DFFF5A 92%, transparent 92%); }
.mini { position: absolute; z-index: 20; border-radius: 22px; overflow: hidden; background: #FFFDF8; box-shadow: 0 40px 70px -34px rgba(31,31,31,.6), 0 0 0 6px #FFFDF8; transform-origin: 50% 100%; }
.mini img { position: absolute; display: block; }
.mini b { position: absolute; right: 12px; bottom: 12px; font: 700 16px 'IBM Plex Mono', monospace; letter-spacing: .08em; background: #DFFF5A; color: #1F1F1F; padding: 4px 10px; border-radius: 6px; }
.yes { position: absolute; z-index: 25; display: flex; align-items: center; gap: 14px; background: #1F1F1F; color: #DFFF5A; font: 800 32px 'Archivo'; padding: 22px 34px; border-radius: 99px; white-space: nowrap; box-shadow: 0 30px 60px -24px rgba(31,31,31,.7); }
.yes i { width: 16px; height: 16px; border-radius: 50%; background: #DFFF5A; display: block; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .06; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// F11 — the before/after slider people drag in the feed. Left of the handle: a blank page with one typed sentence (the
// brief, illustrative). Right of it: the finished product. A thumb drags the handle back and forth, three products,
// each round faster: a Halloween activity book and a tracing page (real products their owner made with MakeAndList),
// then a botanical wall print (a concept image) whose frame is blank before — printed per order by your own partner.
// It ends on the three, side by side, each still a draft until you say yes.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 80.7, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const L = tall ? { cw: 740, ch: 958, cy: 446, capY: 270, capFs: 60 } : { cw: 720, ch: 932, cy: 300, capY: 60, capFs: 58 };
const CX = (W - L.cw) / 2;
// rounds: image, natural size, focus/zoom, brief, tag, handle keys [t, fraction of width that is "before"]
const R = [
  { src: K.pub('showcase/activity-halloween/cover.webp'), iw: 900, ih: 1164, z: 1, fx: 0.5, fy: 0.5, kind: 'page', a: 0.0, b: B(6),
    brief: 'A Halloween activity book for ages 5–9: word searches, mazes, I spy and colouring.', type: [0.25, 1.7],
    tag: 'Example made with MakeAndList by its owner',
    keys: [[0, 1], [B(1.6), 1], [B(3.5), 0.1], [B(4.3), 0.62], [B(5.3), 0]] },
  { src: K.pub('showcase/christmas-preschool-pack/interior-02.webp'), iw: 900, ih: 1164, z: 1, fx: 0.5, fy: 0.5, kind: 'page', a: B(6), b: B(10.5),
    brief: 'A tracing page: the word “tree”, for ages 3–5.', type: [B(6) + 0.2, B(6) + 0.85],
    tag: 'Example made with MakeAndList by its owner',
    keys: [[B(6), 1], [B(7), 1], [B(8), 0.08], [B(8.6), 0.7], [B(9.3), 0]] },
  { src: K.pub('r04/g01-botanical-print.webp'), iw: 1024, ih: 1536, z: 1.42, fx: 432 / 1024, fy: 600 / 1536, kind: 'frame', a: B(10.5), b: B(14.4),
    brief: 'A botanical line-art print with a terracotta sun.', type: [B(10.5) + 0.2, B(10.5) + 0.8],
    tag: 'Concept image · AI-generated · printed per order by your partner',
    keys: [[B(10.5), 1], [B(11.3), 1], [B(11.9), 0.05], [B(12.3), 0.58], [B(12.8), 0]] },
];
const T_FIN = B(14.5), T_OUT = 12.7;

K.box(0, 0, W, H, { cls: 'bg' });
const card = K.box(CX, L.cy, L.cw, L.ch, { cls: 'card' });
function cover(r) {
  const s = Math.max(L.cw / r.iw, L.ch / r.ih) * r.z;
  const w = r.iw * s, h = r.ih * s;
  const ox = K.clamp(L.cw / 2 - r.fx * w, L.cw - w, 0), oy = K.clamp(L.ch / 2 - r.fy * h, L.ch - h, 0);
  return { s, w, h, ox, oy };
}
R.forEach((r, i) => {
  const c = cover(r);
  const after = K.el('div', { parent: card, cls: 'lay', html: `<img src="${r.src}" style="width:${c.w}px;height:${c.h}px;left:${c.ox}px;top:${c.oy}px">` });
  const before = K.el('div', { parent: card, cls: 'lay' });
  let noteBox;
  if (r.kind === 'page') {
    const bl = K.el('div', { parent: before, cls: 'blank', style: { inset: '0' } });
    // ghost layout: where things will go
    [[0.08, 0.07, 0.84, 0.13], [0.12, 0.47, 0.76, 0.36]].forEach(([x, y, w, h]) => K.el('div', { parent: bl, cls: 'gh', style: { left: x * L.cw + 'px', top: y * L.ch + 'px', width: w * L.cw + 'px', height: h * L.ch + 'px' } }));
    [0.86, 0.89].forEach((y, j) => K.el('div', { parent: bl, cls: 'ln', style: { left: 0.2 * L.cw + 'px', width: (0.6 - j * 0.16) * L.cw + 'px', top: y * L.ch + 'px' } }));
    noteBox = { x: 0.1 * L.cw, y: 0.22 * L.ch, w: 0.8 * L.cw };
  } else {
    K.el('div', { parent: before, cls: 'lay', html: `<img src="${r.src}" style="width:${c.w}px;height:${c.h}px;left:${c.ox}px;top:${c.oy}px">` });
    const fx = c.ox + 198 * c.s, fy = c.oy + 256 * c.s, fw = (666 - 198) * c.s, fh = (906 - 256) * c.s;
    K.el('div', { parent: before, cls: 'wall', style: { left: fx + 'px', top: fy + 'px', width: fw + 'px', height: fh + 'px' } });
    K.el('div', { parent: before, cls: 'blank', style: { left: fx + fw * 0.08 + 'px', top: fy + fh * 0.06 + 'px', width: fw * 0.84 + 'px', height: fh * 0.88 + 'px', background: 'transparent', border: '3px dashed #CFC5B4', borderRadius: '6px' } });
    noteBox = { x: fx + fw * 0.14, y: fy + fh * 0.3, w: fw * 0.72 };
  }
  const note = K.el('div', { parent: before, cls: 'note', html: '', style: { left: noteBox.x + 'px', top: noteBox.y + 'px', width: noteBox.w + 'px', fontSize: (r.kind === 'frame' ? 24 : 30) + 'px' } });
  r.el = { after, before, note };
});
K.el('div', { parent: card, cls: 'lbl b', html: 'BEFORE' });
K.el('div', { parent: card, cls: 'lbl a', html: 'AFTER' });
const ctr = K.el('div', { parent: card, cls: 'ctr' });
const div = K.el('div', { parent: card, cls: 'div' });
const knob = K.el('div', { parent: card, cls: 'knob', html: '<i class="l"></i><i class="r"></i>' });
const touch = K.el('div', { parent: card, cls: 'touch' });
const tag = K.demoTag('', 0, 0);

// captions
const CAPS = [
  [0.0, B(3.4), 'Before', 'One sentence. <em>A blank page.</em>'],
  [B(3.4), R[0].b - 0.05, 'After', 'A finished <em>activity book.</em>'],
  [R[1].a, R[1].b - 0.05, 'Faster', 'A tracing page, <em>ready to print.</em>'],
  [R[2].a, R[2].b - 0.05, 'Faster still', 'A wall print, <em>printed per order.</em>'],
  [T_FIN - 0.05, T_OUT + 0.3, 'All three', 'Each a draft, <em>until you say yes.</em>'],
].map(([a, b, k, t]) => ({ a, b, el: K.box(60, L.capY, W - 120, null, { cls: 'cap', html: `<span class="k">${k}</span>${t}`, style: { fontSize: L.capFs + 'px' } }) }));

// finale: the three, side by side
const mW = tall ? 310 : 300, mH = mW * 1.29, gap = tall ? 20 : 30;
const minis = R.map((r, i) => {
  const m = K.box(0, 0, mW, mH, { cls: 'mini' });
  const s = Math.max(mW / r.iw, mH / r.ih) * r.z;
  const w = r.iw * s, h = r.ih * s;
  const ox = K.clamp(mW / 2 - r.fx * w, mW - w, 0), oy = K.clamp(mH / 2 - r.fy * h, mH - h, 0);
  m.innerHTML = `<img src="${r.src}" style="width:${w}px;height:${h}px;left:${ox}px;top:${oy}px"><b>DRAFT</b>`;
  return m;
});
const yes = K.box(0, 0, null, null, { cls: 'yes', html: '<i></i>You review. You approve.', style: { width: 'auto', height: 'auto' } });
const tagF = K.demoTag('Two real examples by their owner · one concept image', 0, 0);

const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: tall ? 160 : 0, line: 'From a blank page<br>to a finished product.' });

K.run({
  id: 'F11', title: 'Before and After', dur: DUR, bpm: BPM, music: 'happy-dance', mood: 'bright', key: 'F', intro: 0.0, cover: 3.2,
  technique: 'The draggable before/after slider from the feed: a thumb pulls the handle across a card — left, a blank page with one typed sentence; right, the finished product — back and forth on the beat for three products, each round faster, the third a framed print whose frame is blank before; then the three stand side by side, each tagged Draft',
  caption: 'Before: one sentence on a blank page. After: a finished product — an activity book, a tracing page, a print for the wall that your own partner prints per order. Each stays a draft until you say yes. Two are real products their owner made with MakeAndList; the print is a concept image; the briefs are illustrative. Start free at makeandlist.com',
  short: 'From a blank page to a finished product.',
  question: 'What do I get?', gain: 'No design skills needed: one sentence in, a finished product to review',
  beats: ['0–2.6 s: before — a blank page, one sentence typed; the thumb grabs the slider', '2.6–4.5 s: drag — the finished Halloween activity book (real, by its owner)', '4.5–7.8 s: faster — a tracing page, ready to print (real)', '7.8–10.7 s: faster still — a blank frame becomes a botanical print, printed per order (concept image)', '10.7–13 s: all three side by side, each a draft until you say yes', '13–15 s: end card'],
  cues: [[0.0, 'paper'], [0.3, 'type'], [B(1.6), 'click'], [B(2.2), 'swish'], [B(3.5), 'pop'], [B(4.3), 'swish'], [B(5.3), 'pop'],
    [R[1].a - 0.12, 'whoosh'], [R[1].a + 0.1, 'paper'], [R[1].a + 0.2, 'type'], [B(7), 'click'], [B(8), 'pop'], [B(9.3), 'pop'],
    [R[2].a - 0.12, 'whoosh'], [R[2].a + 0.2, 'type'], [B(11.3), 'click'], [B(11.9), 'pop'], [B(12.8), 'hit'],
    [T_FIN - 0.1, 'whoosh'], [T_FIN + 0.3, 'pop'], [T_FIN + 0.6, 'pop'], [T_FIN + 0.9, 'pop'], [11.95, 'chime'], [T_OUT, 'swish'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  // which round
  let ri = 0; R.forEach((r, i) => { if (T >= r.a) ri = i; });
  const r = R[ri];
  const h = K.k(T, r.keys, E.inOutCubic);
  // card: each round swaps in with a quick slide; ambient breathe
  const sw = ri === 0 ? K.p(T, 0, 0.6, E.outExpo) : K.p(T, r.a, r.a + 0.45, E.outExpo);
  const so = K.p(T, r.b - 0.3, r.b, E.inCubic) * (ri < 2 ? 1 : 1);
  const fin = K.p(T, T_FIN - 0.35, T_FIN, E.inCubic);
  card.style.opacity = Math.min(1, sw * 1.5) * (ri < 2 ? 1 - so : 1 - fin);
  card.style.transform = `translateX(${(1 - sw) * (ri === 0 ? 0 : W * 0.6) - (ri < 2 ? so : fin) * W * 0.6}px) translateY(${ri === 0 ? (1 - sw) * 60 : 0}px) rotate(${(1 - sw) * 4 - (ri < 2 ? so : fin) * 4 + Math.sin(T * 0.8) * 0.4}deg) scale(${1 + 0.008 * Math.sin(T * 1.1)})`;
  card.style.visibility = T < T_FIN ? 'visible' : 'hidden';
  R.forEach((q, i) => {
    q.el.after.style.visibility = i === ri ? 'visible' : 'hidden';
    q.el.before.style.visibility = i === ri ? 'visible' : 'hidden';
  });
  // the reveal: before is left of the handle
  r.el.before.style.clipPath = `inset(0 ${(1 - h) * 100}% 0 0)`;
  const ty = K.p(T, r.type[0], r.type[1], E.linear);
  r.el.note.innerHTML = '<u>Brief · illustrative</u>' + r.brief.slice(0, Math.round(r.brief.length * ty)) + (ty < 1 || Math.floor(T * 4) % 2 === 0 ? '<span class="caret"></span>' : '');
  const hx = h * L.cw;
  div.style.left = hx + 'px';
  const ky = L.ch * 0.6;
  knob.style.left = K.clamp(hx, 58, L.cw - 58) + 'px'; knob.style.top = ky + 'px';
  const grab = r.keys[1][0];
  const grabbing = T >= grab - 0.05 && T < r.keys[r.keys.length - 1][0] + 0.15;
  knob.style.transform = `scale(${grabbing ? 0.92 : 1})`;
  div.style.opacity = knob.style.opacity = h > 0.995 || h < 0.005 ? 0.85 : 1;
  // the thumb comes in, grabs, drags, lets go
  const tin = K.p(T, grab - 0.5, grab - 0.05, E.inOutCubic), tout = K.p(T, r.keys[r.keys.length - 1][0] + 0.1, r.keys[r.keys.length - 1][0] + 0.4, E.linear);
  touch.style.left = K.clamp(hx, 58, L.cw - 58) + (1 - tin) * 160 + 'px'; touch.style.top = ky + 30 + (1 - tin) * 220 + 'px';
  touch.style.opacity = Math.min(1, tin * 2) * (1 - tout);
  touch.style.transform = `scale(${grabbing && tout < 1 ? 0.82 : 1})`;
  ctr.innerHTML = `${ri + 1} / 3`;
  // tag under the card
  tag.innerHTML = r.tag;
  tag.style.left = CX + 'px'; tag.style.top = (tall ? L.cy - 46 : L.cy + L.ch + 22) + 'px';
  tag.style.opacity = card.style.opacity;

  // finale
  const tot = 3 * mW + 2 * gap, x0 = (W - tot) / 2, my = tall ? 560 : 430;
  minis.forEach((m, i) => {
    const p = K.p(T, T_FIN + i * 0.3, T_FIN + i * 0.3 + 0.55, E.outBack), o = K.p(T, T_OUT, 13.0, E.inCubic);
    m.style.left = x0 + i * (mW + gap) + 'px'; m.style.top = my + (i === 1 ? -30 : 0) + 'px';
    m.style.visibility = T >= T_FIN ? 'visible' : 'hidden';
    m.style.opacity = Math.min(1, p * 2) * (1 - o);
    m.style.transform = `translateY(${(1 - p) * 120}px) rotate(${(i - 1) * 3 * p}deg) scale(${0.8 + 0.2 * p})`;
  });
  const yp = K.p(T, 11.85, 12.3, E.outBack), yo = K.p(T, T_OUT, 13, E.inCubic);
  yes.style.left = (W - yes.offsetWidth) / 2 + 'px'; yes.style.top = my + mH + (tall ? 70 : 50) + 'px';
  yes.style.opacity = Math.min(1, yp * 2) * (1 - yo); yes.style.transform = `scale(${0.8 + 0.2 * yp})`;
  tagF.style.left = (W - tagF.offsetWidth) / 2 + 'px'; tagF.style.top = my + mH + (tall ? 190 : 150) + 'px';
  tagF.style.opacity = K.p(T, T_FIN + 0.4, T_FIN + 0.7, E.linear) * (1 - yo);

  CAPS.forEach((c, i) => {
    const pi = K.p(T, c.a, c.a + 0.4, E.outExpo), po = i === CAPS.length - 1 ? K.p(T, T_OUT, 13, E.inCubic) : K.p(T, c.b - 0.18, c.b, E.inCubic);
    c.el.style.visibility = T >= c.a && T < c.b ? 'visible' : 'hidden';
    c.el.style.opacity = pi * (1 - po);
    c.el.style.transform = `translateY(${(1 - pi) * 36 - po * 24}px)`;
  });
  end(T);
});
</script></body></html>
