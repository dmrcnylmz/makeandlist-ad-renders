<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>H10 · Describe It in Chat</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #FAF7EE; }
.fchip { position: absolute; z-index: 80; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 10px; border-radius: 99px;
  background: #1F1F1F; color: #FAF7EE; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 16px 30px -18px rgba(31,31,31,.7); }
.fchip b { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 99px; background: #DFFF5A; color: #1F1F1F; font-weight: 600; }
.fchip i { font-style: normal; color: #8A8378; }
.fchip span { font: 700 25px 'Archivo'; letter-spacing: 0; }
.cap { position: absolute; z-index: 40; font: 800 84px/1.0 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; }
.cap em { font-style: italic; background: linear-gradient(transparent 62%, #DFFF5A 62%, #DFFF5A 92%, transparent 92%); padding: 0 .06em; }
.w { display: inline-block; white-space: pre; }
.crop { position: absolute; overflow: hidden; border-radius: 26px; background: #FFFDF8; box-shadow: 0 50px 90px -46px rgba(31,31,31,.6), 0 0 0 1px #E2DBCE; }
.crop.flat { box-shadow: none; background: transparent; border-radius: 0; overflow: hidden; }
.crop .ly { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.crop .ly img { position: absolute; left: 0; top: 0; display: block; max-width: none; }
.hlb { position: absolute; background: #DFFF5A; mix-blend-mode: multiply; border-radius: 6px; transform-origin: 0 50%; }
.cov { position: absolute; background: #FFFDF8; transform-origin: 100% 50%; }
.typ { position: absolute; color: #1F1F1F; background: #FFFFFF; font-family: 'Archivo'; }
.typ i { display: inline-block; width: 3px; height: 1em; background: #1F1F1F; vertical-align: -0.12em; margin-left: 2px; }
.tick { position: absolute; width: 44px; height: 44px; border-radius: 50%; background: #DFFF5A; display: grid; place-items: center; box-shadow: 0 0 0 3px #1F1F1F; }
.say { position: absolute; z-index: 34; font: italic 700 46px/1.15 'Playfair Display'; color: #1F1F1F; }
.say::before { content: '“'; position: absolute; left: -.5em; top: -.08em; color: #B9B1A3; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.blob { position: absolute; border-radius: 50%; pointer-events: none; }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// H10 — Describe it in chat. A sentence and its answer: on the real phone the seller types one sentence into the
// Copilot ("Nothing is generated or charged until you confirm" sits right under it); she sends it, and the sentence
// travels across into the design board, where the plan builds beside it line by line as Marian names its parts
// (pages, files, images); then the quote card rises with the assistant's own words highlighted: nothing is spent until
// you press Make. Voice and effects only — a calm, close, explanatory ad.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 90, BEAT = 60 / BPM;
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Voice (Marian), measured from the takes (vo.mjs):
//   L1 1.00–4.90 ("Say what you want to make," 1.00–3.05 · "in one sentence." 3.60–4.90)
//   L2 5.15–9.60 ("The plan answers beside it:" 5.15–6.55 · "pages," 7.40 · "files," 8.25 · "images." 8.95)
//   L3 9.85–12.70 ("And the quote," 9.85–10.50 · "before anything is spent." 11.00–12.70)
const S_B = 4.95, S_C = 9.72;
const T_TYPE = [1.05, 3.25], T_SEND = 4.88;
const T_ROW = [7.35, 7.8, 8.2, 8.9];          // plan rows: pages · answer keys · PDFs (files) · images + video
const T_HL = 11.05;

const L = tall
  ? { chipX: 65, chipY: 290, capX: 65, capY: 360, capFs: 88 }
  : { chipX: 60, chipY: 56, capX: 60, capY: 118, capFs: 74 };

const blobA = K.box(0, 0, 1000, 1000, { cls: 'blob', style: { background: 'radial-gradient(circle, rgba(223,255,90,.22), rgba(223,255,90,0) 62%)' } });
const chip = K.box(L.chipX, L.chipY, null, null, { cls: 'fchip', html: '<b>Feature 10</b><i>/ 16 ·</i><span>Describe it in chat</span>', style: { width: 'auto', height: '56px' } });

function capEm(parts, w) {
  const el = K.box(L.capX, L.capY, w || W - 2 * L.capX, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' } });
  el.innerHTML = parts.map(([t, em]) => (t === '<br>' ? '<br>' : t.split(' ').map((x) => (em ? `<span class="w"><em>${x}</em> </span>` : `<span class="w">${x} </span>`)).join(''))).join('');
  return { el, ws: [...el.querySelectorAll('.w')] };
}
const C = [
  { c: capEm([['Say it in', 0], ['<br>'], ['one', 0], ['sentence.', 1]], tall ? null : 520), a: 0.7, b: S_B },
  { c: capEm([['The plan answers', 0], ['<br>'], ['beside', 0], ['it.', 1]]), a: 5.05, b: S_C },
  { c: capEm([['The quote, before', 0], ['<br>'], ['anything is', 0], ['spent.', 1]]), a: 9.85, b: 12.95 },
];

function crop(src, natW, sx, sy, sw, sh, w, cls) {
  const k = w / sw;
  const box = K.box(0, 0, w, sh * k, { cls: 'crop ' + (cls || '') });
  const ly = K.el('div', { cls: 'ly', parent: box, style: { width: natW + 'px' } });
  K.el('img', { src, parent: ly, style: { width: natW + 'px' } });
  ly.style.transform = `translate(${-sx * k}px, ${-sy * k}px) scale(${k})`;
  return { box, ly, k, w, h: sh * k };
}

// ---------- scene A: the real phone, typing one sentence ----------
const phW = tall ? 470 : 420;
const deck = K.phoneDeck(0, 0, phW, [K.screen('68-phone-copilot')], { noBar: true });
deck.root.style.zIndex = 30;
const kP = deck.sw / 780;
const layer0 = deck.root.querySelector('.screen > div');
const typ = K.el('div', { parent: layer0, cls: 'typ', style: { left: 60 * kP + 'px', top: 1212 * kP + 'px', width: 560 * kP + 'px', height: 120 * kP + 'px', fontSize: Math.round(30 * kP) + 'px', lineHeight: 1.3, padding: 6 * kP + 'px' } });
const TYPED = 'A Halloween learning pack for ages 4–6, with tracing and counting';
const hlP = K.el('div', { parent: layer0, cls: 'hlb', style: { left: 124 * kP + 'px', top: 1381 * kP + 'px', width: 532 * kP + 'px', height: 30 * kP + 'px' } });
const realTag = K.demoTag('Real app · demo workspace', 0, 0);
const cursor = K.cursor();
const say = K.box(0, 0, tall ? 470 : 470, null, { cls: 'say', html: 'A Halloween learning pack for ages 4–6, with tracing and counting' });

// ---------- scene B: the board — the sentence, the plan beside it ----------
// AppCopilot board (2880 wide): user bubble 864,314–1758,452 · plan card 1853,269–2782,708 · options 639,691–1758,1070
const bubW = tall ? 760 : 700;
const bub = crop(K.canvas('AppCopilot'), 2880, 860, 310, 902, 146, bubW, 'flat');
bub.box.style.zIndex = 31;
const planW = tall ? 950 : 960;
const plan = crop(K.canvas('AppCopilot'), 2880, 1853, 269, 929, 439, planW);
plan.box.style.zIndex = 31;
// covers over the plan's title and four rows, wiped away as she names them
const PROWS = [452, 506, 560, 614];
const covTitle = K.el('div', { parent: plan.ly, cls: 'cov', style: { left: '1890px', top: '360px', width: '880px', height: '80px' } });
const covs = PROWS.map((y) => K.el('div', { parent: plan.ly, cls: 'cov', style: { left: '1890px', top: y + 'px', width: '880px', height: '52px' } }));
const ticks = PROWS.map((y) => K.el('div', { parent: plan.ly, cls: 'tick', style: { left: '1880px', top: y + 4 + 'px' }, html: '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#1F1F1F" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' }));
const opts = crop(K.canvas('AppCopilot'), 2880, 636, 688, 1125, 385, 860);
opts.box.style.zIndex = 30;
const boardTagB = K.demoTag('Product design · sample data', 0, 0);

// ---------- scene C: the quote, and nothing spent yet ----------
const botW = tall ? 950 : 960;
const bot = crop(K.canvas('AppCopilot'), 2880, 636, 476, 980, 192, botW);
bot.box.style.zIndex = 31;
const hl1 = K.el('div', { parent: bot.ly, cls: 'hlb', style: { left: '1288px', top: '552px', width: '276px', height: '40px' } });
const hl2 = K.el('div', { parent: bot.ly, cls: 'hlb', style: { left: '760px', top: '598px', width: '222px', height: '40px' } });
const quoteW = tall ? 900 : 960;
const quote = crop(K.canvas('AppCopilot'), 2880, 1853, 739, 929, 432, quoteW);
quote.box.style.zIndex = 32; quote.box.style.background = '#1F1F1F';
const boardTagC = K.demoTag('Product design · sample data', 0, 0);

const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Say it.<br>See the plan and the price.' });
const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };

K.run({
  id: 'H10', title: 'Describe It in Chat', dur: DUR, bpm: BPM, music: 'ov-strolling-stripes', musicMode: 'none', mood: 'calm', key: 'F', intro: 0.0, cover: 8.6,
  feature: 'Feature 10 / 16 · Describe it in chat',
  technique: 'A sentence and its answer: one sentence is typed into the real phone Copilot (with its own “nothing is generated or charged until you confirm” highlighted) and sent; it travels into the design board where the plan builds beside it line by line as each part is named (pages, files, images); the quote card rises under the assistant’s own words, highlighted: nothing is spent until you press Make. Voice and effects only.',
  caption: 'Describe it in chat: say what you want to make in one sentence, and the plan answers beside it — pages, files, images — with the quote in Credits before anything is spent. Start free at makeandlist.com',
  short: 'Say it. See the plan and the price.',
  question: 'How do I start?', gain: 'Time and cost: one sentence gets a plan and a quote before anything is spent',
  vo: [[0.3, 'Say what you want to make, in one sentence.'], [4.5, 'The plan answers beside it: pages, files, images.'], [9.4, 'And the quote, before anything is spent.']],
  beats: ['0–5 s: the real phone Copilot: one sentence typed, “nothing is generated or charged until you confirm”, sent', '5–9.7 s: the sentence lands on the design board; the plan builds beside it as she names pages, files, images', '9.7–13 s: the assistant’s line “nothing is spent until you press Make” highlighted; the quote card rises', '13–15 s: end card'],
  cues: [[0.25, 'pop'], [T_TYPE[0], 'type'], [1.85, 'type'], [3.0, 'marker'], [T_SEND, 'click'], [S_B + 0.05, 'swish'], [6.75, 'pop'], [T_ROW[0], 'pop'], [T_ROW[2], 'pop'], [T_ROW[3], 'pop'],
    [S_C - 0.02, 'whoosh'], [10.7, 'marker'], [10.9, 'coin'], [12.85, 'ding']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  blobA.style.transform = `translate(${W * 0.55 - 500 + Math.sin(T * 0.5) * 180}px, ${H * 0.45 - 500 + Math.cos(T * 0.4) * 140}px)`;
  const cp = K.p(T, 0.1, 0.6, E.outExpo);
  chip.style.opacity = cp * (1 - K.p(T, 12.8, 13.0, E.linear));
  chip.style.transform = `translateY(${(1 - cp) * -18}px)`;

  C.forEach(({ c, a, b }) => {
    const o = K.p(T, b - 0.2, b, E.inCubic);
    c.ws.forEach((w, j) => {
      const p = K.p(T, a + j * 0.06, a + 0.5 + j * 0.06, E.outExpo);
      w.style.opacity = Math.min(1, p * 1.6) * (1 - o);
      w.style.transform = `translateY(${(1 - p) * 50 - o * 30}px)`;
      w.style.filter = p < 1 ? `blur(${(1 - p) * 8}px)` : 'none';
    });
    c.el.style.visibility = T >= a - 0.05 && T < b + 0.02 ? 'visible' : 'hidden';
  });

  // ---------- A ----------
  const aIn = K.p(T, 0.0, 0.6, E.outExpo), aOut = K.p(T, S_B - 0.1, S_B + 0.3, E.inCubic);
  const onA = T < S_B + 0.32;
  const phX = tall ? (W - phW) / 2 : W - phW - 70, phY = tall ? 590 : 300;
  deck.root.style.left = phX + 'px'; deck.root.style.top = phY + 'px';
  deck.draw(0, [0.0], 0);
  deck.root.style.opacity = aIn * (1 - aOut);
  deck.root.style.transform = `translateY(${(1 - aIn) * 240 + aOut * 120}px) rotate(${-1.5 + Math.sin(T * 0.7) * 0.5}deg) scale(${1 + T * 0.006})`;
  vis(deck.root, onA);
  const n = Math.round(TYPED.length * K.p(T, T_TYPE[0], T_TYPE[1], E.linear));
  typ.innerHTML = TYPED.slice(0, n) + (Math.floor(T * 4) % 2 === 0 || n < TYPED.length ? '<i></i>' : '');
  hlP.style.transform = `scaleX(${K.p(T, 3.0, 3.4, E.outCubic)})`;
  const bx = phX + 14 + 678 * kP, by = phY + 14 + 1286 * kP;
  const mv = K.p(T, 3.9, T_SEND, E.inOutCubic);
  const press = T >= T_SEND && T < T_SEND + 0.13;
  cursor.at(bx + 150 * (1 - mv), by + 200 * (1 - mv), press);
  cursor.hide(onA ? K.p(T, 3.85, 4.0, E.linear) * (1 - K.p(T, T_SEND + 0.1, T_SEND + 0.25, E.linear)) : 0);
  cursor.ripple(bx, by, T, T_SEND);
  realTag.style.left = (tall ? L.capX : 60) + 'px'; realTag.style.top = (tall ? 548 : 1272) + 'px';
  if (!tall) { realTag.style.left = phX + 'px'; realTag.style.top = phY + deck.h + 22 + 'px'; }
  realTag.style.opacity = aIn * (1 - aOut); vis(realTag, onA);
  // 4:5 has room for the sentence itself, large, beside the phone
  say.style.left = 100 + 'px'; say.style.top = 420 + 'px'; say.style.fontSize = '50px';
  say.innerHTML = TYPED.slice(0, n);
  say.style.opacity = tall ? 0 : (1 - aOut);
  vis(say, !tall && onA && n > 0);

  // ---------- B ----------
  const bIn = K.p(T, S_B, S_B + 0.55, E.outExpo), bOut = K.p(T, S_C - 0.28, S_C, E.inCubic);
  const onB = T >= S_B - 0.02 && T < S_C + 0.02;
  const bubX = W - (tall ? 65 : 60) - bubW, bubY = tall ? 590 : 316;
  // the sentence flies from the phone input into the board's bubble
  const fly = K.p(T, S_B - 0.05, S_B + 0.5, E.inOutCubic);
  bub.box.style.left = K.lerp(phX + 20, bubX, fly) + 'px';
  bub.box.style.top = K.lerp(phY + 1212 * kP, bubY, fly) + 'px';
  bub.box.style.opacity = Math.min(1, fly * 3) * (1 - bOut);
  bub.box.style.transform = `scale(${K.lerp(0.55, 1, fly)}) rotate(${(1 - fly) * 3}deg)`;
  bub.box.style.transformOrigin = '0 0';
  vis(bub.box, onB);
  const planX = (W - planW) / 2, planY = bubY + bub.h + (tall ? 50 : 40);
  const pIn = K.p(T, 5.15, 5.75, E.outExpo);
  plan.box.style.left = planX + 'px'; plan.box.style.top = planY + 'px';
  plan.box.style.opacity = pIn * (1 - bOut);
  plan.box.style.transform = `translateY(${(1 - pIn) * 120 - bOut * 50}px) scale(${0.96 + 0.04 * pIn})`;
  vis(plan.box, onB && T >= 5.1);
  covTitle.style.transform = `scaleX(${1 - K.p(T, 6.0, 6.55, E.inOutCubic)})`;
  covs.forEach((c, i) => { c.style.transform = `scaleX(${1 - K.p(T, T_ROW[i], T_ROW[i] + 0.4, E.inOutCubic)})`; });
  ticks.forEach((t, i) => {
    const p = K.p(T, T_ROW[i] - 0.05, T_ROW[i] + 0.3, E.outBack);
    const g = K.p(T, T_ROW[i] + 0.5, T_ROW[i] + 0.8, E.inCubic);
    t.style.opacity = Math.min(1, p * 2) * (1 - g);
    t.style.transform = `scale(${(0.4 + 0.6 * p) * (1 - 0.4 * g)})`;
  });
  const oIn = K.p(T, 6.6, 7.1, E.outExpo);
  const oY = planY + plan.h + 40;
  opts.box.style.left = (W - 860) / 2 + 'px'; opts.box.style.top = oY + 'px';
  opts.box.style.opacity = oIn * (1 - bOut);
  opts.box.style.transform = `translateY(${(1 - oIn) * 80}px)`;
  vis(opts.box, onB && !tall && T >= 6.6);
  boardTagB.style.left = (tall ? 65 : 60) + 'px'; boardTagB.style.top = (tall ? planY + plan.h + 22 : 1272) + 'px';
  boardTagB.style.opacity = bIn * (1 - bOut); vis(boardTagB, onB);

  // ---------- C ----------
  const cIn = K.p(T, S_C - 0.05, S_C + 0.5, E.outExpo);
  const onC = T >= S_C - 0.08;
  const botX = (W - botW) / 2, botY = tall ? 590 : 330;
  bot.box.style.left = botX + 'px'; bot.box.style.top = botY + 'px';
  bot.box.style.opacity = cIn;
  bot.box.style.transform = `translateY(${(1 - cIn) * 120}px)`;
  vis(bot.box, onC);
  hl1.style.transform = `scaleX(${K.p(T, T_HL, T_HL + 0.45, E.outCubic)})`;
  hl2.style.transform = `scaleX(${K.p(T, T_HL + 0.45, T_HL + 0.75, E.outCubic)})`;
  const qIn = K.p(T, 10.35, 11.0, E.outBack);
  const qY = botY + bot.h + (tall ? 30 : 60);
  quote.box.style.left = (W - quoteW) / 2 + 'px'; quote.box.style.top = qY + 'px';
  quote.box.style.opacity = Math.min(1, qIn * 2);
  quote.box.style.transform = `translateY(${(1 - qIn) * 260}px) rotate(${(1 - qIn) * 4 + Math.sin(T * 0.8) * 0.3}deg)`;
  vis(quote.box, onC && T >= 10.35);
  boardTagC.style.left = (tall ? 65 : 60) + 'px'; boardTagC.style.top = (tall ? 1200 : 1272) + 'px';
  if (tall) boardTagC.style.top = Math.min(1204, qY + quote.h + 10) + 'px';
  boardTagC.style.opacity = cIn; vis(boardTagC, onC);

  end(T);
});
</script></body></html>
