<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C11 · The Flow in Six Words</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #171615; color: #FAF7EE; }
.glow { position: absolute; border-radius: 50%; pointer-events: none; }
.num { position: absolute; font: 800 900px/0.8 'Playfair Display'; color: #FAF7EE; opacity: .035; letter-spacing: -0.04em; white-space: nowrap; pointer-events: none; }
.bigw { position: absolute; white-space: nowrap; font-family: 'Playfair Display'; font-weight: 800; letter-spacing: -0.03em; line-height: 1; z-index: 20; }
.bigw.tex { -webkit-background-clip: text; background-clip: text; color: transparent; background-repeat: no-repeat; z-index: 21; }
.bigw i { font-style: normal; color: #DFFF5A; }
.card { position: absolute; overflow: hidden; background: #FAF7EE; z-index: 15; border-radius: 36px; }
.card img { position: absolute; left: 0; top: 0; display: block; }
.edge { position: absolute; border-radius: 36px; z-index: 16; pointer-events: none; box-shadow: 0 0 0 3px #DFFF5A, 0 60px 120px -40px rgba(0,0,0,.9); }
.kick { position: absolute; z-index: 30; font: 600 24px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #DFFF5A; white-space: nowrap; }
.kick b { color: #FAF7EE; font-weight: 500; }
.cap { position: absolute; z-index: 30; font: 700 38px/1.12 'Archivo'; letter-spacing: -0.01em; color: #FAF7EE; }
.list { position: absolute; z-index: 25; font: 800 98px/1.02 'Playfair Display'; letter-spacing: -0.025em; }
.list span { display: table; }
.tick { position: absolute; height: 6px; border-radius: 3px; background: #DFFF5A; z-index: 30; }
.fin { position: absolute; z-index: 30; text-align: center; font: 800 76px/1.04 'Playfair Display'; letter-spacing: -0.02em; }
.fin em { font-style: normal; color: #DFFF5A; }
.chipF { position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); font: 600 26px 'IBM Plex Mono', monospace; color: #1F1F1F; background: #DFFF5A; padding: 14px 26px; border-radius: 99px; white-space: nowrap; }
.demo { background: rgba(31,31,31,.85); color: #EFEADF; border-color: #8A8378; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// C11 — the whole flow as one kinetic chain. Each word fills with its own real screen (the letters become a window),
// the screen opens out of the word's box, holds, then closes back down into the box of the next word. Six words,
// four beats each, one continuous rhythm; the last one is the printed edition, paid from the seller's partner account.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BEAT = 60 / 126, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// [word, screen, source y, kicker, caption]
const STEPS = [
  ['Describe.', '22-phone-create', 300, 'Step 01', 'One sentence. Nothing made until you say so.'],
  ['Plan.', '65-phone-configure', 2000, 'Step 02', 'Every page planned. The quote first.'],
  ['Make.', '69-phone-making', 1330, 'Step 03', 'Pages, artwork, listing photos.'],
  ['Review.', '24-phone-product', 300, 'Step 04', 'You check every file.'],
  ['List.', '72-phone-listing-send', 1320, 'Step 05', 'To your store, as a draft.'],
  ['Print.', '33-phone-sell-physical', 0, 'Step 06', 'Your partner prints. Paid from your partner account.'],
];
const L = tall
  ? { cx: 155, cy: 395, cw: 770, ch: 740, kickY: 322, capY: 1160, capW: 900, wordFs: 210, wordY: 765, listX: 120, listY: 300, listFs: 98, finY: 420, chipY: 900, numY: 900 }
  : { cx: 250, cy: 160, cw: 580, ch: 830, kickY: 92, capY: 1040, capW: 960, wordFs: 190, wordY: 575, listX: 90, listY: 150, listFs: 88, finY: 300, chipY: 760, numY: 520 };
const S = L.cw / 780; // screen scale inside the card
const t0 = (i) => B(2 + i * 4); // each word lands on a bar
// the last word opens faster, so its card (the printed edition) holds long enough to read
const PH = (i) => (i < 5 ? { fill: B(1), open: B(1.5), opened: B(2.3), close: B(3.4) } : { fill: B(0.45), open: B(0.8), opened: B(1.5), close: B(3.4) });
const PRINT_END = t0(5) + B(3.4); // the last card closes into the closing list

const glowA = K.box(0, 0, 1300, 1300, { cls: 'glow', style: { background: 'radial-gradient(circle, rgba(223,255,90,.16), rgba(223,255,90,0) 62%)' } });
const glowB = K.box(0, 0, 1000, 1000, { cls: 'glow', style: { background: 'radial-gradient(circle, rgba(232,96,60,.10), rgba(232,96,60,0) 62%)' } });
const num = K.box(0, L.numY - 450, null, null, { cls: 'num', style: { width: 'auto', height: 'auto' } });

const cards = STEPS.map(([w, src, y0]) => {
  const c = K.box(L.cx, L.cy, L.cw, L.ch, { cls: 'card' });
  const img = K.el('img', { src: K.screen(src), parent: c, style: { width: 780 * S + 'px' } });
  const edge = K.box(L.cx, L.cy, L.cw, L.ch, { cls: 'edge' });
  return { c, img, edge, y0 };
});
const words = STEPS.map(([w, src]) => {
  const ink = K.box(0, 0, null, null, { cls: 'bigw', html: w.replace('.', '<i>.</i>'), style: { width: 'auto', height: 'auto', fontSize: L.wordFs + 'px' } });
  const tex = K.box(0, 0, null, null, { cls: 'bigw tex', html: w, style: { width: 'auto', height: 'auto', fontSize: L.wordFs + 'px', backgroundImage: `url("${K.screen(src)}")` } });
  return { ink, tex };
});
const kick = K.box(L.cx, L.kickY, L.cw, null, { cls: 'kick' });
const cap = K.box((W - L.capW) / 2, L.capY, L.capW, null, { cls: 'cap', style: { textAlign: 'center' } });
const capW = STEPS.map(([, , , , c]) => { const d = K.el('div', { parent: cap, style: { position: 'absolute', left: 0, right: 0, top: 0 } }); return { d, w: K.words(d, c) }; });

// hook: the six words as a stacked list
const list = K.box(L.listX, L.listY, W - L.listX * 2, null, { cls: 'list', style: { fontSize: L.listFs + 'px' } });
const listW = STEPS.map(([w]) => K.el('span', { parent: list, html: w }));
const ticks = STEPS.map(() => K.box(0, 0, 0, 6, { cls: 'tick' }));
// finale
const fin = K.box(65, L.finY, W - 130, null, { cls: 'fin' });
const finW = K.words(fin, 'Six steps.\nNothing goes live\nwithout you.');
const tag = K.demoTag('Real app · demo workspace', 0, 0);
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Describe it. List it.<br>Print it.', dark: true });

// word geometry is measured once, after the fonts are in (draw only runs after K.run's ready)
let G = null;
function geom() {
  if (G) return G;
  G = words.map((wd, i) => {
    let fs = L.wordFs;
    wd.ink.style.fontSize = fs + 'px';
    let r = wd.ink.getBoundingClientRect();
    const maxW = W - 150;
    if (r.width > maxW) { fs = Math.floor(fs * maxW / r.width); wd.ink.style.fontSize = fs + 'px'; r = wd.ink.getBoundingClientRect(); }
    wd.tex.style.fontSize = fs + 'px';
    const x = (W - r.width) / 2, y = L.wordY - r.height / 2;
    return { x, y, w: r.width, h: r.height, fs };
  });
  return G;
}
// the clip of a card, as an inset matching the box (bx, by, bw, bh) in stage px
function inset(bx, by, bw, bh, r) {
  const t = by - L.cy, l = bx - L.cx, b = L.cy + L.ch - (by + bh), rr = L.cx + L.cw - (bx + bw);
  return `inset(${t}px ${rr}px ${b}px ${l}px round ${r}px)`;
}
const lerpBox = (a, b, p) => a.map((v, k) => K.lerp(v, b[k], p));

K.run({
  id: 'C11', title: 'The Flow in Six Words', dur: DUR, bpm: 126, mood: 'drive', key: 'E', intro: 0.0, cover: 4.4,
  technique: 'Kinetic word chain: each word fills with its own real screen through background-clipped letters, the screen opens out of the word’s box with a clip-path inset, holds with a slow scroll, then closes back down into the next word, four beats per word',
  caption: 'Describe it, see the plan and the quote, let it make the files, review them, send the listing to your store as a draft, and make a printed edition your print partner ships, paid from your partner account. Start free at makeandlist.com',
  short: 'Describe. Plan. Make. Review. List. Print.',
  beats: ['0–1 s: the six words stack up', '1–4.8 s: Describe → the real create screen; Plan → the quote', '4.8–8.6 s: Make → live progress; Review → the product', '8.6–12 s: List → a draft to your store; Print → the printed edition, paid from your partner account', '12–13 s: “Nothing goes live without you.”', '13–15 s: end card'],
  cues: [[0.0, 'hit'], [0.05, 'type'], [0.72, 'swish'], [B(2), 'pop'],
    ...STEPS.flatMap((_, i) => [[t0(i) + PH(i).fill, 'swish'], [t0(i) + PH(i).open - 0.05, 'whoosh'], [t0(i) + PH(i).opened - B(0.3), 'pop'], ...(i < 5 ? [[t0(i) + B(4), 'hit']] : [])]),
    [t0(5) + B(2.7), 'chime'], [PRINT_END - 0.15, 'pop'], [12.95, 'hit']],
}, (T) => {
  const g = geom();
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  glowA.style.transform = `translate(${W / 2 - 650 + Math.sin(T * 0.6) * 180}px, ${L.wordY - 650 + Math.cos(T * 0.45) * 160}px)`;
  glowB.style.transform = `translate(${W * 0.1 - 500 + Math.cos(T * 0.5) * 140}px, ${H * 0.75 - 500 + Math.sin(T * 0.7) * 120}px)`;

  // which step is live
  let cur = -1; STEPS.forEach((_, i) => { if (T >= t0(i)) cur = i; });
  num.innerHTML = cur >= 0 ? '0' + (cur + 1) : '';
  num.style.left = (W * 0.55 - (T - (cur >= 0 ? t0(cur) : 0)) * 40) + 'px';

  // hook list: words pop on half-beats, the current word marked; at B(2.5) the others fly off and "Describe." grows
  const out = K.p(T, 0.72, 0.98, E.inCubic);
  listW.forEach((s, i) => {
    const p = K.p(T, 0.04 + i * 0.07, 0.44 + i * 0.07, E.outExpo);
    s.style.opacity = p * (1 - out);
    s.style.transform = `translateY(${(1 - p) * 40 - out * 80}px)`;
    s.style.color = i === 5 ? '#DFFF5A' : '#FAF7EE';
    s.style.filter = out > 0.05 ? `blur(${out * 10}px)` : 'none';
  });
  ticks.forEach((tk, i) => {
    const r = listW[i].getBoundingClientRect();
    const p = K.p(T, 0.16 + i * 0.07, 0.56 + i * 0.07, E.outExpo);
    tk.style.left = r.right + 18 + 'px'; tk.style.top = r.top + r.height * 0.56 + 'px';
    tk.style.width = 80 * p * (1 - out) + 'px'; tk.style.opacity = 1 - out;
  });

  // the chain
  cards.forEach((cd, i) => {
    const a = t0(i), wb = g[i], PHASE = PH(i);
    const next = i < 5 ? g[i + 1] : null;
    const closeEnd = i < 5 ? a + B(4) : PRINT_END;
    const closeStart = i < 5 ? a + PHASE.close : PRINT_END - B(0.6);
    const openP = K.p(T, a + PHASE.open, a + PHASE.opened, E.outExpo);
    const closeP = K.p(T, closeStart, closeEnd, E.inOutCubic);
    const live = T >= a + PHASE.open && T < closeEnd;
    // card clip: from this word's box, out to the full card, then down to the next word's box (or a line for the last)
    const full = [L.cx, L.cy, L.cw, L.ch], wbox = [wb.x - 20, wb.y + wb.h * 0.12, wb.w + 40, wb.h * 0.82];
    const nbox = next ? [next.x - 20, next.y + next.h * 0.12, next.w + 40, next.h * 0.82] : [W / 2 - 30, L.wordY - 4, 60, 8];
    let bx = lerpBox(wbox, full, openP);
    if (closeP > 0) bx = lerpBox(full, nbox, closeP);
    const rad = K.lerp(24, 36, openP) * (1 - closeP) + 18 * closeP;
    const clip = inset(bx[0], bx[1], bx[2], bx[3], rad);
    cd.c.style.clipPath = clip; cd.c.style.webkitClipPath = clip;
    cd.c.style.visibility = live ? 'visible' : 'hidden';
    cd.edge.style.left = bx[0] + 'px'; cd.edge.style.top = bx[1] + 'px'; cd.edge.style.width = bx[2] + 'px'; cd.edge.style.height = bx[3] + 'px';
    cd.edge.style.borderRadius = rad + 'px';
    cd.edge.style.visibility = live ? 'visible' : 'hidden';
    cd.edge.style.opacity = 0.35 + 0.65 * Math.max(1 - openP, closeP);
    // the screen inside scrolls slowly while open; it dims as it closes so the next word reads out of it
    const drift = K.p(T, a + PHASE.open, closeEnd, E.inOutCubic) * 160;
    cd.img.style.transform = `translateY(${-(cd.y0 + drift) * S}px) scale(${1 + 0.04 * closeP})`;
    cd.c.style.filter = closeP > 0 ? `brightness(${1 - 0.75 * closeP}) blur(${closeP * closeP * 6}px)` : 'none';
  });

  words.forEach((wd, i) => {
    const a = t0(i), wb = g[i], PHASE = PH(i);
    // in: from the hook for the first word, else revealed as the previous card closes onto it
    const inP = i === 0 ? K.p(T, 0.8, a + 0.3, E.outExpo) : K.p(T, a - B(0.35), a + B(0.25), E.outExpo);
    const fillP = K.p(T, a + PHASE.fill, a + PHASE.open, E.inOutCubic);
    const gone = T >= a + PHASE.open + 0.06;
    const vis = T >= (i === 0 ? 0.8 : a - B(0.35)) && !gone;
    const sc = (i === 0 ? 0.6 + 0.4 * inP : 0.9 + 0.1 * inP) * (1 + 0.03 * fillP);
    [wd.ink, wd.tex].forEach((el) => {
      el.style.left = wb.x + 'px'; el.style.top = wb.y + 'px';
      el.style.transformOrigin = '50% 55%';
      el.style.transform = `scale(${sc})`;
    });
    wd.ink.style.opacity = vis ? inP * (1 - fillP) : 0;
    wd.ink.style.filter = i > 0 && inP < 1 ? `blur(${(1 - inP) * 12}px)` : 'none';
    wd.tex.style.opacity = vis ? fillP : 0;
    // the letters are a window onto the card's screen, aligned to where the card will open
    wd.tex.style.backgroundSize = `${780 * S}px auto`;
    wd.tex.style.backgroundPosition = `${L.cx - wb.x}px ${L.cy - wb.y - cards[i].y0 * S}px`;
  });

  // kicker and caption ride with the open card
  if (cur >= 0) {
    const a = t0(cur), PHASE = PH(cur), closeEnd = cur < 5 ? a + B(4) : PRINT_END;
    const kp = K.p(T, a + PHASE.opened - B(0.3), a + PHASE.opened + B(0.2), E.outExpo) * (1 - K.p(T, (cur < 5 ? a + PHASE.close : PRINT_END - B(0.6)) - 0.1, (cur < 5 ? a + PHASE.close : PRINT_END - B(0.6)) + 0.15, E.inCubic));
    kick.innerHTML = `${STEPS[cur][3]} <b>· ${STEPS[cur][0].replace('.', '')}</b>`;
    kick.style.opacity = kp; kick.style.transform = `translateY(${(1 - kp) * 20}px)`;
    kick.style.letterSpacing = (0.14 + 0.12 * (1 - kp)) + 'em';
    capW.forEach((c, i) => {
      c.d.style.visibility = i === cur ? 'visible' : 'hidden';
      if (i === cur) K.reveal(c.w, T, a + PHASE.opened - B(0.2), { kind: 'up', stagger: 0.04, dur: 0.45, out: (cur < 5 ? a + PHASE.close : PRINT_END - B(0.6)) - 0.1 });
    });
    tag.style.opacity = kp;
    tag.style.left = L.cx + 24 + 'px'; tag.style.top = L.cy + L.ch - 56 + 'px';
  } else { kick.style.opacity = 0; tag.style.opacity = 0; capW.forEach((c) => (c.d.style.visibility = 'hidden')); }

  // finale
  K.reveal(finW, T, PRINT_END - 0.15, { kind: 'up', stagger: 0.06, dur: 0.5 });

  end(T);
});
</script></body></html>
