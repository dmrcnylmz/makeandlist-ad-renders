<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>E06 · The Recipe</title><link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=block">
<style>
#stage { background: #2B2219; }
.bg { position: absolute; left: 0; top: 0; overflow: hidden; }
.bg img { position: absolute; display: block; filter: blur(7px) brightness(.62) saturate(.9); transform-origin: 50% 50%; }
.warm { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 45%, rgba(255,220,170,.18), rgba(30,20,10,.45) 100%); }
.pill { position: absolute; z-index: 40; display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 99px; background: rgba(250,247,238,.94); color: #1F1F1F; white-space: nowrap;
  font: 600 21px 'IBM Plex Mono', monospace; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 16px 30px -16px rgba(0,0,0,.6); }
.pill img { height: 30px; }
.timer { position: absolute; z-index: 40; width: 130px; height: 130px; }
.card { position: absolute; z-index: 20; background: #FFFDF8; border-radius: 18px; overflow: hidden; transform-origin: 50% 60%;
  box-shadow: 0 50px 80px -40px rgba(0,0,0,.8), 0 0 0 1px rgba(0,0,0,.06);
  background-image: repeating-linear-gradient(180deg, transparent 0 63px, rgba(126,154,126,.22) 63px 65px); background-position: 0 150px; }
.card .band { position: absolute; left: 0; right: 0; top: 0; height: 128px; background: #FFFDF8; border-bottom: 4px solid #E8603C; }
.card .k { position: absolute; left: 48px; top: 30px; font: 600 21px 'IBM Plex Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: #8A8378; }
.card .h { position: absolute; left: 48px; top: 58px; font: 800 58px/1 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; white-space: nowrap; }
.card .h em { font-style: italic; }
.card .no { position: absolute; right: 44px; top: 34px; font: 700 54px 'Caveat', cursive; color: #E8603C; transform: rotate(-6deg); }
.rv { position: absolute; }
.big { font: 800 112px/0.96 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; }
.big em { font-style: italic; background: linear-gradient(transparent 62%, #DFFF5A 62%, #DFFF5A 92%, transparent 92%); }
.meta { display: flex; gap: 14px; flex-wrap: wrap; }
.meta span { font: 600 23px 'Archivo'; color: #45403A; background: #F1ECE1; border-radius: 99px; padding: 10px 18px; white-space: nowrap; }
.meta span b { color: #1F1F1F; }
.ing { display: flex; align-items: center; gap: 24px; font: 700 54px/1.1 'Archivo'; color: #1F1F1F; letter-spacing: -0.015em; }
.ing small { display: block; font: 500 26px 'Archivo'; color: #6B645A; letter-spacing: 0; margin-top: 4px; }
.ing .q { flex: none; width: 92px; height: 92px; border-radius: 26px; background: #F1ECE1; display: grid; place-items: center; }
.box { position: absolute; width: 46px; height: 46px; border-radius: 12px; border: 4px solid #1F1F1F; background: #FFFDF8; }
.box svg { position: absolute; left: -4px; top: -10px; overflow: visible; }
.step { display: flex; align-items: center; gap: 22px; font: 800 60px/1 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; white-space: nowrap; }
.step u { text-decoration: none; flex: none; width: 66px; height: 66px; border-radius: 50%; background: #1F1F1F; color: #DFFF5A; display: grid; place-items: center; font: 700 30px 'IBM Plex Mono', monospace; }
.step em { font-style: italic; }
.inset { position: absolute; border-radius: 18px; overflow: hidden; background: #FFFDF8; box-shadow: 0 24px 44px -24px rgba(31,31,31,.55), 0 0 0 1.5px #E2DBCE; }
.inset img { position: absolute; display: block; }
.ring { position: absolute; z-index: 3; border-radius: 12px; border: 5px solid #DFFF5A; box-shadow: 0 0 0 2px #1F1F1F; pointer-events: none; }
.yes { position: absolute; z-index: 5; padding: 10px 26px 14px; border: 6px solid #1F1F1F; border-radius: 18px; background: #DFFF5A; font: 800 64px/1 'Archivo'; letter-spacing: .04em; color: #1F1F1F; transform-origin: 50% 50%; }
.photo { position: absolute; background: #FFFDF8; padding: 12px 12px 48px; box-shadow: 0 24px 40px -20px rgba(0,0,0,.55); }
.photo .im { width: 100%; height: 100%; overflow: hidden; position: relative; }
.photo img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
.photo .c { position: absolute; left: 14px; bottom: 10px; font: 700 30px 'Caveat', cursive; color: #45403A; white-space: nowrap; }
.note { font: 600 30px/1.3 'Archivo'; color: #45403A; }
.note b { color: #1F1F1F; background: linear-gradient(transparent 60%, #DFFF5A 60%); }
.logos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.logo { height: 104px; border-radius: 22px; background: #FFFDF8; box-shadow: 0 0 0 2px #E2DBCE, 0 16px 26px -18px rgba(31,31,31,.5); display: grid; place-items: center; padding: 18px; }
.logo img { max-width: 100%; max-height: 52px; }
.sprig { position: absolute; z-index: 6; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// E06 — The Recipe. A cooking-show recipe box on a kitchen counter: five index cards land one after another in the
// narrator's breaths — the title card with a "serving suggestion" photo, the ingredients (one idea), the method
// (Describe it · Check the draft · Say yes, each with a real screen inset), the garnish (printed editions from your own
// print partner, paid from your partner account), and "Serves: every store you sell in" with the store logos.
// A kitchen timer runs down in the corner and dings at the end.
document.fonts && document.fonts.load('700 40px Caveat');
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 107.7, BEAT = 60 / BPM;
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const VO = [[0.3, "Today's recipe: a new product."], [3.0, "You'll need one idea."], [4.76, 'Describe it, check the draft, then say yes.'],
  [7.82, 'Garnish with prints from your own partner.'], [10.17, 'Serves every store you sell in.']];
const CARD_T = [0.05, 3.16, 4.66, 7.75, 10.25]; // each card lands in a breath

// ---------- counter ----------
const bg = K.box(0, 0, W, H, { cls: 'bg' });
const cb = Math.max(W / 1024, H / 1536);
const bgImg = K.el('img', { parent: bg, src: K.pub('r04/g13-recipe-cards.webp'), style: { width: 1024 * cb + 'px', height: 1536 * cb + 'px', left: (W - 1024 * cb) / 2 + 'px', top: (H - 1536 * cb) / 2 + 'px' } });
K.el('div', { parent: bg, cls: 'warm' });

const L = tall
  ? { pill: [65, 290], timer: [W - 65 - 130, 270], card: { x: 65, y: 420, w: 950, h: 800 } }
  : { pill: [60, 52], timer: [W - 60 - 120, 34], card: { x: 90, y: 190, w: 900, h: 980 } };
const pill = K.box(L.pill[0], L.pill[1], null, null, { cls: 'pill', style: { width: 'auto', height: 'auto' }, html: `<img src="${K.brand('makeandlist-monogram.svg')}">MakeAndList Kitchen` });
const timer = K.box(L.timer[0], L.timer[1], 130, 130, { cls: 'timer', html: `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="70" r="54" fill="#FFFDF8" stroke="#1F1F1F" stroke-width="5"/>
  <rect x="55" y="6" width="20" height="12" rx="4" fill="#1F1F1F"/><circle id="tr" cx="65" cy="70" r="40" fill="none" stroke="#E8603C" stroke-width="16" pathLength="1" transform="rotate(-90 65 70)"/>
  <text id="tt" x="65" y="80" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="21" fill="#1F1F1F">0:13</text></svg>` });
const tr = timer.querySelector('#tr'), tt = timer.querySelector('#tt');

// ---------- the five cards ----------
const C = L.card, CW = C.w, CH = C.h;
const mkCard = (k, h, no) => {
  const el = K.box(C.x, C.y, CW, CH, { cls: 'card' });
  K.el('div', { parent: el, cls: 'band', html: `<div class="k">${k}</div><div class="h">${h}</div>` });
  if (no) K.el('div', { parent: el, cls: 'no', html: no });
  return el;
};
const rv = (card, x, y, html, cls, t, style = {}) => { const e = K.el('div', { parent: card, cls: 'rv ' + (cls || ''), html, style: { left: x + 'px', top: y + 'px', ...style } }); e.dataset.t = t; return e; };
const tickSvg = '<svg width="60" height="60" viewBox="0 0 60 60"><path d="M10 32 L24 46 L54 8" fill="none" stroke="#1F1F1F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="0 1"/></svg>';
const icon = (p) => `<svg width="54" height="54" viewBox="0 0 48 48" fill="none" stroke="#1F1F1F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

// 1 · title
const c1 = mkCard('Recipe · serves many', "Today’s recipe", 'Nº 01');
const big = rv(c1, 48, 180, 'A new<br><em>product.</em>', 'big', 1.94, { fontSize: (tall ? 112 : 120) + 'px' });
const PW = tall ? 330 : 360, PH = tall ? 280 : 400;
const meta = rv(c1, 48, tall ? 430 : 470, '<span>Prep: <b>one sentence</b></span><span>Rest: <b>you review</b></span><span>Serves: <b>every store</b></span>', 'meta', 2.3, { width: CW - PW - 150 + 'px' });
const photo = rv(c1, CW - PW - 54, CH - PH - (tall ? 46 : 80), `<div class="im"><img src="${K.pub('r04/g06-wedding-planner.webp')}" style="object-position:50% 40%"></div><div class="c">serving suggestion</div>`, 'photo', 2.5, { width: PW + 'px', height: PH + 48 + 'px' });
const tagC1 = rv(c1, 48, CH - 70, '', '', 2.6); tagC1.appendChild(K.demoTag('Photo: concept image · AI-generated', 0, 0)).style.position = 'relative';

// 2 · ingredients
const c2 = mkCard('Ingredients', 'You’ll need', null);
const ING = [
  ['1 idea', 'the one you keep coming back to', icon('<path d="M24 6a12 12 0 0 0-7 21.7V32h14v-4.3A12 12 0 0 0 24 6z"/><path d="M19 37h10M20 42h8"/>'), 3.83],
  ['1 sentence', 'to describe it', icon('<path d="M8 10h32a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H22l-9 7v-7H8a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3z"/><path d="M13 19h22M13 25h14"/>'), 4.15],
  ['Your stores', 'ikas, WooCommerce, Wix…', icon('<path d="M6 18l4-10h28l4 10"/><path d="M6 18h36v4a6 6 0 0 1-12 0 6 6 0 0 1-12 0 6 6 0 0 1-12 0z"/><path d="M9 26v15h30V26"/><path d="M20 41v-9h8v9"/>'), 4.4],
];
const ingEls = ING.map(([a, b, ic, t], i) => rv(c2, 48, 180 + i * (tall ? 196 : 250), `<div class="q">${ic}</div><div>${a}<small>${b}</small></div>`, 'ing', t));
const boxes = ING.map((_, i) => { const b = K.el('div', { parent: c2, cls: 'box', html: tickSvg, style: { left: CW - 110 + 'px', top: 180 + i * (tall ? 196 : 250) + 22 + 'px' } }); return b.querySelector('path'); });

// 3 · method
const c3 = mkCard('Method', 'Three steps', null);
const STEPS = [['1', 'Describe it.', 4.9], ['2', 'Check the <em>draft.</em>', 5.66], ['3', 'Say <em>yes.</em>', 6.81]];
const sg = tall ? 104 : 116;
const stepEls = STEPS.map(([n, h, t], i) => rv(c3, 48, 168 + i * sg, `<u>${n}</u>${h}`, 'step', t, { fontSize: (tall ? 58 : 62) + 'px' }));
// one real screen inset under the steps, changing with the step
const IW = CW - 96, IY = 168 + 3 * sg + 18, IH = CH - IY - 40;
const insets = [['22-phone-create', 33, 420, 714], ['24-phone-product', 0, 120, 780], ['72-phone-listing-send', 0, 1060, 780]].map(([scr, sx, sy, sw]) => {
  const s = IW / sw;
  const el = K.el('div', { parent: c3, cls: 'inset', style: { left: '48px', top: IY + 'px', width: IW + 'px', height: IH + 'px' } });
  K.el('img', { parent: el, src: K.screen(scr), style: { width: 780 * s + 'px', left: -sx * s + 'px', top: -sy * s + 'px' } });
  return { el, s };
});
const ringM = K.el('div', { parent: insets[2].el, cls: 'ring' });
const ringR = K.el('div', { parent: insets[1].el, cls: 'ring' });
const yes = K.el('div', { parent: c3, cls: 'yes', html: 'YES ✓' });
const realTag = K.demoTag('Real app · demo workspace', 0, 0); realTag.style.zIndex = 30;

// 4 · garnish
const c4 = mkCard('Garnish · optional', 'Prints, on the side', null);
const g1 = rv(c4, 48, 176, 'Printed editions from<br><b>your own print partner.</b>', 'note', 8.56, { fontSize: (tall ? 40 : 42) + 'px', width: CW - 96 + 'px' });
const g2 = rv(c4, 48, tall ? 300 : 320, 'Printing is paid from your partner account, <b>never Credits.</b>', 'note', 9.4, { fontSize: (tall ? 28 : 30) + 'px', width: CW - 96 + 'px' });
const GPW = tall ? 360 : 380, GPH = tall ? 270 : 440;
const gp = [['g02-sunset-tee', 'a tee'], ['g23-mug-set', 'three mugs']].map(([id, c], i) => rv(c4, i ? CW - GPW - 60 : 60, (tall ? 392 : 450) + (i ? 14 : 0), `<div class="im"><img src="${K.pub('r04/' + id + '.webp')}"></div><div class="c">${c}</div>`, 'photo', 8.4 + i * 0.3, { width: GPW + 'px', height: GPH + 48 + 'px' }));
const tagC4 = rv(c4, 48, CH - 64, '', '', 8.8); tagC4.appendChild(K.demoTag('Photos: concept images · AI-generated', 0, 0)).style.position = 'relative';
const sprig = K.el('div', { parent: c4, cls: 'sprig', html: '<svg width="150" height="150" viewBox="0 0 150 150" fill="#7E9A7E"><path d="M20 130 C60 100 90 60 130 20" stroke="#5E7A5E" stroke-width="5" fill="none"/>' + [[45, 104, -30], [62, 86, 40], [78, 70, -35], [94, 54, 35], [108, 40, -30]].map(([x, y, r]) => `<ellipse cx="${x}" cy="${y}" rx="16" ry="7" transform="rotate(${r} ${x} ${y}) translate(${r > 0 ? 10 : -10} 0)"/>`).join('') + '</svg>', style: { right: '30px', top: '-6px' } });

// 5 · serves
const c5 = mkCard('Serves', 'Every store you sell in', null);
c5.querySelector('.h').style.fontSize = (tall ? 54 : 56) + 'px';
const STORES = ['ikas', 'woocommerce', 'wix', 'gumroad', 'shopware', 'salla', 'shopline', 'whop'];
const logos = rv(c5, 48, tall ? 200 : 230, STORES.map((s) => `<div class="logo"${s === 'wix' ? ' style="background:#1F1F1F"' : ''}><img src="${K.pub('platforms/' + s + '.svg')}"></div>`).join(''), 'logos', 10.9, { width: CW - 96 + 'px' });
const logoEls = [...logos.querySelectorAll('.logo')];
if (!tall) logoEls.forEach((l) => { l.style.height = '136px'; });
const s5 = rv(c5, 48, tall ? 480 : 600, 'Listings go to <b>your own stores</b>,<br>as drafts first.', 'note', 11.5, { fontSize: (tall ? 38 : 42) + 'px', width: CW - 96 + 'px' });
const s6 = rv(c5, 48, tall ? 610 : 760, 'One place for all of them.', 'note', 11.9, { fontSize: (tall ? 30 : 34) + 'px', width: CW - 96 + 'px', color: '#6B645A' });

const cards = [c1, c2, c3, c4, c5];
const allRv = cards.map((c) => [...c.querySelectorAll('.rv')]);
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Serves every store<br>you sell in.' });

K.run({
  id: 'E06', title: 'The Recipe', dur: DUR, bpm: BPM, music: 'blue-skies', mood: 'warm', key: 'G', intro: 0.0, cover: 6.0,
  technique: 'Cooking-show recipe box: five ruled index cards drop onto a blurred kitchen counter in the narrator’s breaths, each with a red-ruled header; lines on a card reveal on her words, ingredient boxes are ticked with drawn strokes, the method card swaps a real screen inset per step and lands a YES stamp, the garnish card shows concept tee and mug photos, the serves card pops the store logos; a kitchen timer runs down and dings',
  caption: 'Today’s recipe: a new product. You’ll need one idea. Describe it, check the draft, then say yes — garnish with prints from your own print partner (paid from your partner account, never Credits). Serves every store you sell in. Start free at makeandlist.com',
  short: 'Serves every store you sell in.',
  vo: VO,
  beats: ['0–3.1 s: “Today’s recipe: a new product.” — title card, a serving-suggestion photo (concept image)', '3.1–4.6 s: “You’ll need one idea.” — ingredients ticked: an idea, a sentence, your stores', '4.6–7.7 s: “Describe it, check the draft, then say yes.” — the method with real screens, a YES stamp', '7.7–10.2 s: “Garnish with prints from your own partner.” — printed editions, paid from your partner account', '10.2–13 s: “Serves every store you sell in.” — store logos; the timer dings', '13–15 s: end card'],
  cues: [[0.0, 'paper'], [2.95, 'paper'], [3.12, 'whoosh'], [4.18, 'marker'], [4.6, 'paper'], [5.0, 'type'], [5.62, 'swish'], [6.78, 'swish'], [7.55, 'stamp'], [7.7, 'paper'], [8.45, 'pop'], [10.05, 'paper'], [10.9, 'pop'], [11.4, 'pop'], [12.5, 'chime'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  bgImg.style.transform = `scale(${1.08 + 0.04 * K.p(T, 0, 13, E.linear)}) rotate(${-1 + 2 * K.p(T, 0, 13, E.linear)}deg)`;

  const pp = K.p(T, 0.1, 0.6, E.outExpo);
  pill.style.opacity = pp; pill.style.transform = `translateY(${(1 - pp) * -20}px)`;
  const tp = K.p(T, 0.2, 0.7, E.outBack);
  timer.style.transform = `scale(${tp}) rotate(${(1 - tp) * -40 + (T > 12.45 && T < 12.9 ? Math.sin(T * 80) * 6 : 0)}deg)`;
  const left = Math.max(0, 12.5 - T);
  tr.setAttribute('stroke-dasharray', `${left / 12.5} 1`);
  tt.textContent = `0:${String(Math.ceil(left)).padStart(2, '0')}`;

  // ---------- cards ----------
  cards.forEach((c, i) => {
    const a = CARD_T[i], nx = CARD_T[i + 1] ?? 99;
    const p = K.p(T, a, a + 0.5, E.outExpo);
    const under = K.p(T, nx, nx + 0.5, E.outCubic);       // pushed aside by the next card
    const gone = K.p(T, (CARD_T[i + 2] ?? 99), (CARD_T[i + 2] ?? 99) + 0.4, E.inCubic);
    const rot = [-1.5, 1.2, -0.8, 1.4, -1][i];
    c.style.visibility = T >= a && gone < 1 ? 'visible' : 'hidden';
    c.style.zIndex = 20 + i;
    c.style.transform = `translate(${(1 - p) * (i % 2 ? 260 : -260) + under * (i % 2 ? -40 : 40)}px, ${(1 - p) * 520 - under * 24}px) rotate(${rot + (1 - p) * (i % 2 ? 9 : -9) + under * (i % 2 ? -3 : 3)}deg) scale(${1 - 0.05 * under})`;
    c.style.filter = under > 0 ? `brightness(${1 - 0.25 * under})` : 'none';
    c.style.opacity = 1 - gone;
    allRv[i].forEach((e) => {
      const t = +e.dataset.t, q = K.p(T, t - 0.05, t + 0.4, E.outExpo);
      e.style.opacity = q; e.style.transform = `translateY(${(1 - q) * 24}px)`;
    });
  });
  // title card: the photo tilts in
  const php = K.p(T, 2.45, 2.95, E.outBack);
  photo.style.transform = `rotate(${4 - (1 - php) * 10}deg) translateY(${(1 - php) * 40}px)`;
  // ingredient ticks
  boxes.forEach((b, i) => b.setAttribute('stroke-dasharray', `${K.p(T, ING[i][3] + 0.15, ING[i][3] + 0.4, E.outCubic)} 1`));
  // method: step focus, inset swap, rings, YES
  const cur = T >= 6.78 ? 2 : T >= 5.62 ? 1 : 0;
  stepEls.forEach((s, i) => { if (T > STEPS[i][2]) s.style.opacity = i === cur ? 1 : 0.4; });
  insets.forEach((ins, i) => {
    const a = STEPS[i][2] - 0.08, b = i < 2 ? STEPS[i + 1][2] - 0.08 : 99;
    const q = K.p(T, a, a + 0.35, E.outExpo);
    ins.el.style.visibility = T >= a && T < b + 0.2 ? 'visible' : 'hidden';
    ins.el.style.opacity = q; ins.el.style.zIndex = 2 + i;
    ins.el.style.transform = `translateY(${(1 - q) * 40}px) rotate(${(1 - q) * 2}deg)`;
  });
  const r1 = K.p(T, 6.1, 6.4, E.outBack);
  Object.assign(ringR.style, { left: 266 * insets[1].s + 'px', top: (176 - 120) * insets[1].s + 'px', width: 150 * insets[1].s + 'px', height: 116 * insets[1].s + 'px', opacity: r1 > 0 ? 1 : 0, transform: `scale(${1.1 - 0.1 * r1})` });
  const r2 = K.p(T, 7.0, 7.3, E.outBack);
  Object.assign(ringM.style, { left: 10 * insets[2].s + 'px', top: 14 * insets[2].s + 'px', width: 760 * insets[2].s + 'px', height: 60 * insets[2].s + 'px', opacity: r2 > 0 ? 1 : 0, transform: `scale(${1.08 - 0.08 * r2})` });
  const ys = K.p(T, 7.42, 7.56, E.inCubic);
  Object.assign(yes.style, { left: CW - 330 + 'px', top: 168 + 2 * sg - 6 + 'px', opacity: ys > 0 ? 1 : 0, transform: `rotate(-8deg) scale(${K.lerp(1.8, 1, ys)})` });
  realTag.style.left = C.x + 48 + 'px'; realTag.style.top = C.y + CH + 14 + 'px';
  realTag.style.opacity = K.win(T, 4.9, 7.9, 0.2);
  if (tall) { realTag.style.top = C.y + IY - 44 + 'px'; realTag.style.left = 'auto'; realTag.style.right = W - C.x - CW + 60 + 'px'; }
  // garnish
  gp.forEach((g, i) => { const q = K.p(T, 8.4 + i * 0.3, 8.9 + i * 0.3, E.outBack); g.style.transform = `rotate(${(i ? 5 : -4) * q}deg) translateY(${(1 - q) * 50}px)`; });
  const sp = K.p(T, 8.0, 8.5, E.outBack);
  sprig.style.transform = `rotate(${(1 - sp) * -40 + Math.sin(T * 2) * 2}deg) scale(${sp})`;
  // logos pop on the words "every store"
  logoEls.forEach((lg, i) => { const q = K.p(T, 10.86 + i * 0.07, 11.2 + i * 0.07, E.outBack); lg.style.transform = `scale(${q})`; lg.style.opacity = Math.min(1, q * 2); });

  end(T);
});
