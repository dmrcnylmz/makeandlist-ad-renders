<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C03 · Who Pays What</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #F4F0E7; }
.dots { position: absolute; inset: -80px; background-image: radial-gradient(circle, rgba(31,31,31,.09) 2px, transparent 2.5px); background-size: 40px 40px; }
svg.flow { position: absolute; left: 0; top: 0; overflow: visible; z-index: 8; }
.cap { position: absolute; left: 60px; right: 60px; text-align: center; font-family: 'Playfair Display'; font-weight: 800; letter-spacing: -0.02em; line-height: 1.0; z-index: 40; }
.node { position: absolute; z-index: 12; width: 0; height: 0; }
.tile { position: absolute; border-radius: 34px; background: #FFFDF8; box-shadow: 0 30px 50px -30px rgba(31,31,31,.55), 0 0 0 3px #1F1F1F; display: grid; place-items: center; }
.tile svg { width: 56%; height: 56%; }
.nl { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; font: 800 29px/1.1 'Archivo'; letter-spacing: -0.01em; color: #1F1F1F; }
.nl small { display: block; margin-top: 6px; font: 500 19px 'IBM Plex Mono', monospace; letter-spacing: .06em; color: #6B655C; text-transform: uppercase; }
.amt { position: absolute; left: 50%; white-space: nowrap; font: 700 22px 'IBM Plex Mono', monospace; padding: 6px 12px; border-radius: 10px; z-index: 14; }
.coin { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; z-index: 16; display: grid; place-items: center; font: 800 28px 'Archivo'; }
.coin.eu { background: radial-gradient(circle at 35% 30%, #FFF6D8, #E9C76B 55%, #C79B3B); color: #6B4E12; box-shadow: 0 0 0 3px #1F1F1F, 0 14px 20px -10px rgba(0,0,0,.5); }
.coin.pa { background: radial-gradient(circle at 35% 30%, #5A5550, #2A2724 60%, #111); color: #FAF7EE; box-shadow: 0 0 0 3px #1F1F1F, 0 14px 20px -10px rgba(0,0,0,.5); }
.coin.cr { background: #DFFF5A; color: #1F1F1F; box-shadow: 0 0 0 3px #1F1F1F, 0 0 24px rgba(223,255,90,.8); }
.coin.cr::after { content: ''; position: absolute; inset: 13px; border-radius: 50%; border: 5px solid #1F1F1F; border-right-color: transparent; transform: rotate(-30deg); }
.lanecap { position: absolute; z-index: 13; white-space: nowrap; font: 600 21px 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; color: #8A8378; transform: translateX(-50%); }
.wall { position: absolute; z-index: 17; width: 22px; height: 170px; margin: -85px 0 0 -11px; border-radius: 11px; background: repeating-linear-gradient(-45deg, #E5484D 0 12px, #B42A30 12px 24px); box-shadow: 0 10px 24px -8px rgba(120,20,24,.6); }
.xmark { position: absolute; z-index: 18; width: 120px; height: 120px; margin: -60px 0 0 -60px; }
.col { position: absolute; z-index: 25; border-radius: 26px; overflow: hidden; background: #FAF7EE; box-shadow: 0 50px 90px -40px rgba(31,31,31,.6), 0 0 0 2px #1F1F1F; }
.col img { position: absolute; max-width: none; display: block; }
</style></head>
<body><div id="stage" class="grain"><div class="dots"></div></div>
<script src="kit.js"></script>
<script>
// C03 — three lanes of money that never mix. Each lane draws on and its coins travel along it on the beat: the buyer
// pays your store; your partner account pays for printing and shipping; Credits pay for making designs. Then a
// Credit token tries the printing lane and hits a wall. The lanes fold into the three real columns of the Costs
// board: three kinds of money, kept apart. Figures are the board's demo values.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const B = 60 / 100, b = (n) => n * B;
const NS = 'http://www.w3.org/2000/svg';
const L = K.v({
  '9x16': { capY: 292, capFs: 84, lanes: [612, 854, 1096], xl: 205, xr: 875, tile: 136, colW: 720 },
  '4x5': { capY: 60, capFs: 74, lanes: [440, 740, 1040], xl: 215, xr: 865, tile: 132, colW: 760 },
});
const ICON = {
  buyer: '<svg viewBox="0 0 64 64" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M14 24h36l-3 30H17z"/><path d="M24 24v-5a8 8 0 0 1 16 0v5"/></svg>',
  store: '<svg viewBox="0 0 64 64" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 26l5-14h38l5 14"/><path d="M8 26c0 5 4 8 8 8s8-3 8-8c0 5 4 8 8 8s8-3 8-8c0 5 4 8 8 8s8-3 8-8"/><path d="M13 34v20h38V34"/><path d="M26 54V42h12v12"/></svg>',
  wallet: '<svg viewBox="0 0 64 64" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="16" width="48" height="36" rx="6"/><path d="M8 26h48"/><circle cx="45" cy="39" r="3" fill="#1F1F1F"/><path d="M14 16l26-8 4 8"/></svg>',
  printer: '<svg viewBox="0 0 64 64" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M18 22V8h28v14"/><rect x="8" y="22" width="48" height="22" rx="5"/><path d="M18 36h28v20H18z"/><path d="M24 44h16M24 50h10"/></svg>',
  credits: '<svg viewBox="0 0 64 64" fill="none" stroke-width="7" stroke-linecap="round"><circle cx="32" cy="32" r="22" stroke="#E6E0D5"/><path d="M32 10a22 22 0 1 1-21 28" stroke="#1F1F1F"/></svg>',
  design: '<svg viewBox="0 0 64 64" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="10" width="48" height="44" rx="5"/><circle cx="38" cy="26" r="7" fill="#E8603C" stroke="none"/><path d="M14 46c6-9 10-12 15-6s8 2 13-6l8 12"/></svg>',
};
const LANES = [
  { a: ['buyer', 'Buyer', 'pays'], z: ['store', 'Your store', 'checks out'], coin: 'eu', glyph: '$', col: '#7E9A7E', amt: '+$48.00 · sample', cap: 'The buyer pays\nyour store.', name: 'Sale' },
  { a: ['wallet', 'Your partner account', 'your own'], z: ['printer', 'Printing & shipping', 'by the partner'], coin: 'pa', glyph: '$', col: '#1F1F1F', amt: '$26.89 · sample', cap: 'Your partner bills\nyour own account.', name: 'Production' },
  { a: ['credits', 'Credits', 'your plan'], z: ['design', 'Designs & print files', 'made here'], coin: 'cr', glyph: '', col: '#B9D93A', amt: '100 Credits · sample', cap: 'Credits pay for\nmaking designs.', name: 'Design' },
];
// timing: lanes on beats 4, 8, 12; the wall on 16, impact on 17; the board on 19
const LT = [b(4), b(8), b(12)];
const TRY = b(15.5), HIT = b(17), BOARD = b(19);

// ---------- captions ----------
const capEls = [];
function cap(text) { const c = K.box(60, L.capY, W - 120, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' } }); capEls.push(c); return K.words(c, text); }
const capHook = cap('Credits make.\nYour partner prints.');
const capLane = LANES.map((l) => cap(l.cap));
const capNever = cap('Never Credits\nfor printing.');
const capBoard = cap('Three kinds of money,\nkept apart.');
capNever.forEach((w) => { w.style.color = '#B42A30'; });

// ---------- flow paths ----------
const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'flow'); svg.setAttribute('width', W); svg.setAttribute('height', H);
document.getElementById('stage').appendChild(svg);
const mk = (tag, attrs) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); svg.appendChild(n); return n; };
const half = L.tile / 2 + 18;
const paths = L.lanes.map((y, i) => {
  const d = `M ${L.xl + half} ${y} C ${L.xl + 230} ${y - 110}, ${L.xr - 230} ${y - 110}, ${L.xr - half} ${y}`;
  const base = mk('path', { d, fill: 'none', stroke: '#E2DBCE', 'stroke-width': 18, 'stroke-linecap': 'round' });
  const line = mk('path', { d, fill: 'none', stroke: LANES[i].col, 'stroke-width': 8, 'stroke-linecap': 'round' });
  const flow = mk('path', { d, fill: 'none', stroke: '#FFFDF8', 'stroke-width': 3, 'stroke-dasharray': '6 26', 'stroke-linecap': 'round' });
  return { base, line, flow, len: line.getTotalLength() };
});
// the forbidden route: Credits → Printing
const fy0 = L.lanes[2], fy1 = L.lanes[1];
const fd = `M ${L.xl + half} ${fy0 - 20} C ${L.xl + 260} ${fy0 - 60}, ${L.xr - 300} ${fy1 + 120}, ${L.xr - half} ${fy1 + 30}`;
const fpath = mk('path', { d: fd, fill: 'none', stroke: '#D3343A', 'stroke-width': 6, 'stroke-dasharray': '16 16', 'stroke-linecap': 'round' });
const flen = fpath.getTotalLength();
const WALL_AT = 0.5;

// ---------- nodes ----------
function node(x, y, [icon, label, sub]) {
  const n = K.box(x, y, 0, 0, { cls: 'node' });
  const t = K.el('div', { cls: 'tile', parent: n, html: ICON[icon], style: { left: -L.tile / 2 + 'px', top: -L.tile / 2 + 'px', width: L.tile + 'px', height: L.tile + 'px' } });
  const l = K.el('div', { cls: 'nl', parent: n, html: `${label}<small>${sub}</small>`, style: { top: L.tile / 2 + 16 + 'px' } });
  return { n, t, l };
}
const nodes = LANES.map((ln, i) => [node(L.xl, L.lanes[i], ln.a), node(L.xr, L.lanes[i], ln.z)]);
const amts = LANES.map((ln, i) => K.box(L.xr - L.tile / 2 - 24, L.lanes[i] + 24, null, null, { cls: 'amt', html: ln.amt, style: { width: 'auto', height: 'auto', background: i === 2 ? '#DFFF5A' : '#1F1F1F', color: i === 2 ? '#1F1F1F' : '#FAF7EE' } }));
const laneCaps = LANES.map((ln, i) => K.box(W / 2, L.lanes[i] - 128, null, null, { cls: 'lanecap', html: ln.name, style: { width: 'auto', height: 'auto' } }));
const coins = LANES.map((ln) => [0, 1, 2].map(() => K.box(0, 0, 58, 58, { cls: 'coin ' + ln.coin, html: ln.glyph })));
const rogue = K.box(0, 0, 58, 58, { cls: 'coin cr' });
const wallEl = K.box(0, 0, 22, 170, { cls: 'wall' });
const xEl = K.box(0, 0, 120, 120, { cls: 'xmark', html: '<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#D3343A"/><path d="M38 38L82 82M82 38L38 82" stroke="#FFFDF8" stroke-width="12" stroke-linecap="round"/></svg>' });
const tagD = K.demoTag('Demo values · nothing is charged', 0, 0);

// ---------- the real Costs board, three columns ----------
const COLS = [[2064, 236, 746, 222], [1298, 236, 746, 222], [528, 236, 746, 222]]; // in lane order: store, partner, credits
const cs = L.colW / 746, ch = Math.round(222 * cs);
const cols = COLS.map((r, i) => {
  const c = K.box(0, 0, L.colW, ch, { cls: 'col' });
  K.el('img', { src: K.canvas('Costs'), parent: c, style: { width: 2880 * cs + 'px', left: -r[0] * cs + 'px', top: -r[1] * cs + 'px' } });
  return c;
});
const tagB = K.demoTag('Product design · sample data', 0, 0);
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Credits make.<br>Your partner prints.' });

const at = (P, f) => { const q = P.getPointAtLength(K.clamp(f) * (P.getTotalLength())); return [q.x, q.y]; };

K.run({
  id: 'C03', title: 'Who Pays What', dur: DUR, bpm: 100, mood: 'calm', key: 'F', intro: 2.4, cover: 9.0,
  technique: 'Three-lane money infographic: each lane draws on and its coins ride the curve on the beat (buyer → your store, your partner account → printing, Credits → designs); a Credit token tries the printing route and hits a striped wall; the lanes fold into the three real columns of the Costs board',
  caption: 'Three kinds of money, kept apart: the buyer pays your store, your print partner bills your own partner account for printing and shipping, and Credits pay only for making designs. Never Credits for printing. Start free at makeandlist.com',
  short: 'Credits make. Your partner prints.',
  beats: ['0–2.4 s: “Credits make. Your partner prints.” — six nodes', '2.4–4.8 s: the buyer pays your store', '4.8–7.2 s: your partner bills your own account for printing and shipping', '7.2–9.3 s: Credits pay for making designs', '9.3–11.4 s: a Credit tries the printing route — a wall: never Credits for printing', '11.4–13 s: the real Costs board — three kinds of money, kept apart; 13–15 s end card'],
  cues: [[0.1, 'swish'], [0.45, 'pop'], [0.65, 'pop'], [0.85, 'pop'], [1.05, 'pop'], [1.25, 'pop'], [1.45, 'pop'],
    ...LT.flatMap((t, i) => [[t, 'swish'], [t + b(1), 'coin'], [t + b(2), 'coin'], [t + b(3), 'coin']]),
    [b(14.7), 'riser'], [TRY, 'swish'], [b(16.2), 'click'], [HIT, 'hit'], [HIT + 0.1, 'pop'], [BOARD - 0.25, 'whoosh'], [BOARD, 'pop'], [BOARD + b(0.5), 'pop'], [BOARD + b(1), 'pop'], [13.0, 'hit']],
}, (T) => {
  document.querySelector('.dots').style.transform = `translate(${(T * 9) % 40}px, ${(T * 5) % 40}px)`;
  // captions, one at a time
  K.reveal(capHook, T, 0.1, { kind: 'up', stagger: 0.07, out: LT[0] - 0.35 });
  capLane.forEach((w, i) => K.reveal(w, T, LT[i] + 0.05, { kind: 'up', stagger: 0.06, out: (i < 2 ? LT[i + 1] : TRY) - 0.35 }));
  K.reveal(capNever, T, HIT + 0.05, { kind: 'up', stagger: 0.06, out: BOARD - 0.35 });
  K.reveal(capBoard, T, BOARD + 0.05, { kind: 'up', stagger: 0.06 });
  const capWin = [[0, LT[0]], [LT[0], LT[1]], [LT[1], LT[2]], [LT[2], TRY], [HIT, BOARD], [BOARD, 99]];
  capEls.forEach((c, i) => { c.style.visibility = T >= capWin[i][0] - 0.05 && T < capWin[i][1] + 0.05 ? 'visible' : 'hidden'; });

  // the board folds the lanes away
  const fold = K.p(T, BOARD - 0.3, BOARD + 0.25, E.inCubic);
  // nodes pop in, the active lane is full strength, the others rest
  const active = T < LT[0] ? -1 : T < LT[1] ? 0 : T < LT[2] ? 1 : T < TRY ? 2 : 3;
  nodes.forEach((pair, i) => pair.forEach((N, j) => {
    const k = i * 2 + j;
    const p = K.p(T, 0.4 + k * 0.2, 0.4 + k * 0.2 + 0.5, E.outBack);
    const rest = active >= 0 && active < 3 && active !== i ? 0.45 : 1;
    const hot = active === 3 && ((i === 2 && j === 0) || (i === 1 && j === 1)) ? 1 : active === 3 ? 0.5 : rest;
    const bob = Math.sin(T * 1.6 + k) * 4;
    // the receiving tile thumps when a coin lands
    let thump = 0;
    if (j === 1) [1, 2, 3].forEach((n) => { const t0 = LT[i] + b(n) + b(1.2); if (T > t0) thump += Math.exp(-(T - t0) * 9) * Math.sin((T - t0) * 26) * 0.08; });
    N.n.style.transform = `translateY(${bob - fold * 40}px) scale(${p * (1 + thump)})`;
    N.n.style.opacity = Math.min(1, p * 1.4) * hot * (1 - fold);
  }));
  paths.forEach((P, i) => {
    const d = K.p(T, LT[i], LT[i] + 0.55, E.inOutCubic);
    P.line.setAttribute('stroke-dasharray', `${d * P.len} 9999`);
    P.flow.setAttribute('stroke-dasharray', d >= 1 ? '6 26' : `0 9999`);
    P.flow.setAttribute('stroke-dashoffset', -T * 60);
    const rest = active >= 0 && active < 3 && active !== i && T > LT[i] ? 0.45 : 1;
    [P.base, P.line, P.flow].forEach((e) => e.setAttribute('opacity', (d > 0.01 ? 1 : 0) * (active === 3 ? 0.4 : rest) * (1 - fold)));
    P.base.setAttribute('opacity', K.p(T, 1.6, 2.2, E.linear) * (active === 3 ? 0.4 : 1) * (1 - fold));
  });
  // coins ride the lanes, one per beat
  coins.forEach((cs3, i) => cs3.forEach((c, n) => {
    const t0 = LT[i] + b(n + 1) - b(0.2), t1 = t0 + b(1.4);
    const f = K.p(T, t0, t1, E.inOutCubic);
    const [x, y] = at(paths[i].line, f);
    const on = T > t0 && T < t1 + 0.12;
    c.style.left = x + 'px'; c.style.top = y + 'px';
    c.style.opacity = on ? Math.min(1, (T - t0) * 8) * (1 - K.p(T, t1, t1 + 0.12, E.linear)) : 0;
    c.style.transform = `scale(${0.7 + 0.3 * Math.sin(Math.PI * f) + 0.3}) rotate(${f * 360}deg)`;
  }));
  amts.forEach((a, i) => {
    const t0 = LT[i] + b(2.2);
    const p = K.p(T, t0, t0 + 0.4, E.outBack);
    a.style.opacity = p * (1 - fold) * (active === 3 ? 0.4 : 1); a.style.transform = `translateX(-100%) scale(${0.7 + 0.3 * p})`; a.style.transformOrigin = '100% 50%';
  });
  laneCaps.forEach((c, i) => {
    const p = K.p(T, LT[i] + 0.2, LT[i] + 0.6, E.outExpo);
    c.style.opacity = p * (1 - fold) * (active === i || active === -1 ? 1 : 0.45);
  });
  tagD.style.left = W / 2 + 'px'; tagD.style.top = (L.lanes[2] + 100) + 'px'; tagD.style.transform = 'translateX(-50%)';
  tagD.style.opacity = K.win(T, LT[0] + 0.6, TRY, 0.3);

  // the rogue Credit: draws its route, runs it, hits the wall
  const fr = K.p(T, TRY, TRY + 0.5, E.inOutCubic);
  fpath.setAttribute('stroke-dasharray', fr >= 1 ? '16 16' : `${fr * flen} 9999`);
  fpath.setAttribute('opacity', fr > 0.01 ? 1 - fold : 0);
  const [wx, wy] = at(fpath, WALL_AT);
  const wp = K.p(T, b(16), b(16) + 0.35, E.outBack);
  wallEl.style.left = wx + 'px'; wallEl.style.top = wy + 'px';
  const q = fpath.getPointAtLength(flen * (WALL_AT + 0.01)), ang = Math.atan2(q.y - wy, q.x - wx) * 180 / Math.PI;
  wallEl.style.transform = `rotate(${ang}deg) scaleY(${wp})`; wallEl.style.opacity = wp > 0 ? 1 - fold : 0;
  let rf;
  if (T < HIT) rf = K.lerp(0, WALL_AT - 0.035, K.p(T, b(16.1), HIT, E.inCubic));
  else rf = (WALL_AT - 0.035) - 0.16 * K.p(T, HIT, HIT + 0.5, E.outCubic);
  const [rx, ry] = at(fpath, rf);
  const drop = T > HIT ? 120 * K.p(T, HIT + 0.1, HIT + 0.9, E.inCubic) : 0;
  rogue.style.left = rx + 'px'; rogue.style.top = ry + drop + 'px';
  rogue.style.opacity = T > b(16.1) ? 1 - K.p(T, HIT + 0.5, HIT + 0.9, E.linear) : 0;
  rogue.style.transform = `rotate(${T > HIT ? (T - HIT) * -400 : 0}deg)`;
  const xp = K.p(T, HIT, HIT + 0.35, E.outBack);
  xEl.style.left = wx + 'px'; xEl.style.top = wy - 120 + 'px'; xEl.style.opacity = xp * (1 - fold);
  xEl.style.transform = `scale(${xp}) rotate(${(1 - xp) * -40}deg)`;

  // the real board's three columns land where the lanes were
  cols.forEach((c, i) => {
    const t0 = BOARD + b(i * 0.5);
    const p = K.p(T, t0, t0 + 0.6, E.outExpo);
    const y = L.lanes[i] - ch / 2 + 10;
    c.style.left = (W - L.colW) / 2 + (i - 1) * -24 + 'px'; c.style.top = y + 'px';
    c.style.opacity = Math.min(1, p * 1.6); c.style.visibility = p > 0 ? 'visible' : 'hidden';
    c.style.transform = `translateX(${(1 - p) * (i % 2 ? -1 : 1) * 380}px) rotate(${(1 - p) * (i % 2 ? -5 : 5) + (i - 1) * 0.8}deg) translateY(${Math.sin(T * 1.3 + i) * 4}px)`;
  });
  tagB.style.left = (W - L.colW) / 2 + 'px'; tagB.style.top = L.lanes[2] + ch / 2 + 26 + 'px';
  tagB.style.opacity = K.p(T, BOARD + 0.8, BOARD + 1.1, E.linear);
  end(T);
});
</script></body></html>
