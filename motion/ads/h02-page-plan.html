<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>H02 · The Page Plan</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #F6F3EA; }
/* R08 series chip — identical in H01–H06 */
.fchip { position: absolute; z-index: 80; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 10px; border-radius: 99px;
  background: #1F1F1F; color: #FAF7EE; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 16px 30px -18px rgba(31,31,31,.7); }
.fchip b { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 99px; background: #DFFF5A; color: #1F1F1F; font-weight: 600; }
.fchip i { font-style: normal; color: #8A8378; }
.fchip span { font: 700 25px 'Archivo'; letter-spacing: 0; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
/* drafting grid */
.grid { position: absolute; inset: -80px; z-index: 0; background-image:
  linear-gradient(rgba(31,31,31,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(31,31,31,.055) 1px, transparent 1px),
  linear-gradient(rgba(31,31,31,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(31,31,31,.03) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
.crop { position: absolute; overflow: hidden; }
.crop > img { position: absolute; max-width: none; display: block; }
.big { position: absolute; z-index: 40; font: 800 112px/0.98 'Playfair Display'; letter-spacing: -0.035em; color: #1F1F1F; }
.big em { font-style: italic; }
.mid { position: absolute; z-index: 40; font: 800 74px/1.02 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; }
.mid em { font-style: italic; }
.w { display: inline-block; white-space: pre; }
.hl { background: linear-gradient(transparent 58%, #DFFF5A 58%, #DFFF5A 92%, transparent 92%) no-repeat 0 0 / 0% 100%; }
.tile { position: absolute; z-index: 20; border-radius: 8px; background: #FFFDF8; box-shadow: 0 10px 18px -12px rgba(31,31,31,.45), 0 0 0 1.5px #D9D3C9; overflow: hidden; }
.tile .n { position: absolute; left: 8px; top: 6px; font: 600 16px 'IBM Plex Mono', monospace; color: #8A8378; }
.tile .ln { position: absolute; left: 10px; right: 10px; height: 4px; border-radius: 2px; background: #E7E1D5; }
.tile .pic { position: absolute; left: 12px; right: 12px; bottom: 12px; top: 40%; border-radius: 6px; }
.legend { position: absolute; z-index: 40; display: flex; gap: 12px; flex-wrap: wrap; }
.lg { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 99px; background: #FFFDF8; box-shadow: 0 0 0 2px #D9D3C9; font: 700 26px 'Archivo'; color: #1F1F1F; white-space: nowrap; }
.lg i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; }
.win { z-index: 30; border-radius: 30px; background: #FFFDF8; box-shadow: 0 50px 90px -40px rgba(31,31,31,.6), 0 0 0 1px #E2DBCE; }
.band { position: absolute; left: 0; right: 0; z-index: 2; border-radius: 12px; }
.sub { position: absolute; z-index: 40; font: 700 50px/1.1 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; }
.sub em { font-style: italic; }
.pdf { position: absolute; z-index: 30; border-radius: 26px; background: #FFFDF8; box-shadow: 0 30px 60px -30px rgba(31,31,31,.55), 0 0 0 1px #E2DBCE; padding: 26px 28px; }
.pdf .ic { width: 64px; height: 80px; border-radius: 8px; background: #1F1F1F; color: #DFFF5A; font: 700 18px 'IBM Plex Mono', monospace; display: grid; place-items: end center; padding-bottom: 10px; position: relative; }
.pdf .ic::after { content: ''; position: absolute; right: 0; top: 0; border-left: 18px solid #FFFDF8; border-bottom: 18px solid #FFFDF8; border-top: 0; border-right: 0; border-color: transparent transparent transparent transparent; }
.pdf .t { margin-top: 16px; font: 700 28px 'Archivo'; color: #1F1F1F; }
.pdf .s { font: 500 20px 'IBM Plex Mono', monospace; color: #6B645A; }
.pdf .c { margin-top: 14px; font: 800 120px/1 'Playfair Display'; color: #1F1F1F; letter-spacing: -0.03em; }
.pdf .cl { margin-top: 6px; font: 600 20px 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #6B645A; }

.tape { position: absolute; z-index: 26; width: 54px; border-radius: 8px; background: #E8C547; box-shadow: inset -6px 0 0 rgba(0,0,0,.08), 0 10px 20px -12px rgba(31,31,31,.5); overflow: hidden; }
.tape i { position: absolute; left: 0; height: 2px; background: #1F1F1F; }
.tape b { position: absolute; left: 22px; font: 700 15px 'IBM Plex Mono', monospace; color: #1F1F1F; }
.case { position: absolute; z-index: 27; width: 96px; height: 96px; border-radius: 22px; background: #1F1F1F; box-shadow: 0 16px 26px -14px rgba(31,31,31,.7); }
.case::after { content: ''; position: absolute; left: 30px; top: 30px; width: 36px; height: 36px; border-radius: 50%; border: 5px solid #DFFF5A; }
.rcrop { z-index: 30; border-radius: 26px; box-shadow: 0 40px 70px -36px rgba(31,31,31,.7); }
.mark { position: absolute; z-index: 3; border: 4px solid #DFFF5A; border-radius: 12px; }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// H02 — The page plan, told on a drafting table. 37 blank pages are laid out like a floor plan; the camera then reads
// the Plan board's real page list (what each page needs, and why) as Marian says it; the pages come back coloured by
// what they need — new pictures only on 7 of them; finally the finished PDF counts its own pages out onto a stack
// beside a tape measure, and the real phone's page plan says it plainly: every page of the finished PDF is counted.
// Voice + effects only (musicMode 'none'): an explanatory, close-up film.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Voice (Marian), speech windows from the takes:
//   L1 0.60–1.59 · L2 2.29–4.97 ("What each page needs," 2.29 · "and why it's there." 3.89)
//   L3 5.67–7.40 ("New pictures" 5.67 · "only where they're needed." 6.45)
//   L4 8.60–11.68 ("And the page count" 8.60 · "is measured" 9.33 · "from the files that ship." 10.15)
const SB = 2.0, SC = 5.25, SD = 7.75;

function crop(src, srcW, sx, sy, sw, sh, w, opts = {}) {
  const k = w / sw;
  const b = K.box(0, 0, w, sh * k, { cls: 'crop ' + (opts.cls || '') });
  const img = K.el('img', { src, parent: b, style: { left: -sx * k + 'px', top: -sy * k + 'px', width: srcW * k + 'px' } });
  return { el: b, img, k, h: sh * k };
}
function chip(n, name) {
  const c = K.box(tall ? 65 : 60, tall ? 290 : 56, null, null, { cls: 'fchip', style: { width: 'auto', height: '56px' },
    html: `<b>Feature ${String(n).padStart(2, '0')}</b><i>/ 16 ·</i><span>${name}</span>` });
  return (T) => {
    const p = K.p(T, 0.1, 0.6, E.outExpo);
    c.style.opacity = p * (1 - K.p(T, 12.85, 13.0, E.linear));
    c.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0 round 99px)`;
    c.style.transform = `translateX(${(1 - p) * -30}px)`;
  };
}
const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
function words(ws, T, a, out, st = 0.07) {
  ws.forEach((w, i) => {
    const p = K.p(T, a + i * st, a + 0.5 + i * st, E.outExpo);
    const o = out ? K.p(T, out - 0.25, out, E.inCubic) : 0;
    w.style.opacity = Math.min(1, p * 1.6) * (1 - o);
    w.style.transform = `translateY(${(1 - p) * 60 - o * 30}px)`;
    w.style.filter = p < 1 ? `blur(${(1 - p) * 8}px)` : 'none';
  });
}
// 'Every page, *planned.*' → word spans; *…* words are italic and highlighted; \n breaks the line
function wrapWords(text) {
  let on = false;
  return text.split('\n').map((line) => line.split(' ').map((w) => {
    const st = w.startsWith('*'), en = w.endsWith('*');
    if (st) on = true;
    const clean = w.replace(/\*/g, '');
    const out = on ? `<span class="w"><em class="hl">${clean} </em></span>` : `<span class="w">${clean} </span>`;
    if (en) on = false;
    return out;
  }).join('')).join('<br>');
}
const hlSweep = (hls, T, a, b) => hls.forEach((h, i) => { const n = hls.length; h.style.backgroundSize = `${K.p(T, a + (b - a) * i / n, a + (b - a) * (i + 1) / n, E.linear) * 100}% 100%`; });

const L = tall
  ? { hookY: 370, hookFs: 112, tW: 84, tH: 112, gap: 14, gY: 640, legY: 548,
      winX: 65, winY: 440, winW: 950, winH: 660, boardTag: [65, 392], subY: 1140,
      capY: 370, capFs: 74, pdfX: 65, pdfY: 570, pdfW: 330, stX: 470, stW: 300, stBase: 850, tapeX: 800, rY: 922, rW: 900, rX: 90, rTag: [90, 878] }
  : { hookY: 140, hookFs: 104, tW: 84, tH: 112, gap: 14, gY: 400, legY: 1050,
      winX: 60, winY: 150, winW: 960, winH: 820, boardTag: [60, 1250], subY: 1010,
      capY: 130, capFs: 70, pdfX: 60, pdfY: 340, pdfW: 330, stX: 470, stW: 300, stBase: 630, tapeX: 800, rY: 700, rW: 960, rX: 60, rTag: [60, 1250] };
const COLS = 8, ROWS = 5, gridW = COLS * L.tW + (COLS - 1) * L.gap, gX = (W - gridW) / 2;

K.box(0, 0, W, H, { cls: 'grid' });
const chipDraw = chip(2, 'The page plan');

// ---------- A: 37 pages laid out like a plan ----------
const hook = K.box(65, L.hookY, W - 130, null, { cls: 'big', style: { fontSize: L.hookFs + 'px' }, html: wrapWords('Every page, *planned.*') });
const hookW = [...hook.querySelectorAll('.w')], hookHl = [...hook.querySelectorAll('.hl')];
// what each page needs (the Plan board's sample plan): new picture · drawn in code · reuses pictures
const KIND = (n) => (n === 1 || (n >= 21 && n <= 26) ? 'new' : (n >= 3 && n <= 8) || (n >= 15 && n <= 20) ? 'reuse' : 'code');
const COL = { new: '#DFFF5A', code: '#1F1F1F', reuse: '#9DB59D' };
const tiles = Array.from({ length: 37 }, (_, i) => {
  const n = i + 1, c = i % COLS, r = Math.floor(i / COLS);
  const t = K.box(gX + c * (L.tW + L.gap), L.gY + r * (L.tH + L.gap), L.tW, L.tH, { cls: 'tile',
    html: `<span class="n">${n}</span><span class="ln" style="top:34px;right:22px"></span><span class="ln" style="top:44px;right:34px"></span><span class="pic"></span>` });
  return { el: t, n, kind: KIND(n), pic: t.querySelector('.pic'), c, r };
});
const legend = K.box(tall ? 65 : 60, L.legY, W - 130, null, { cls: 'legend',
  html: [['new', 'New picture · 7'], ['reuse', 'Reuses pictures'], ['code', 'Drawn in code']].map(([k, t]) => `<div class="lg"><i style="background:${COL[k]};${k === 'new' ? 'box-shadow:0 0 0 2px #1F1F1F' : ''}"></i>${t}</div>`).join('') });
const lgEls = [...legend.querySelectorAll('.lg')];
const tileTag = K.demoTag('Sample plan · from the Plan board', 0, 0);

// ---------- B: the Plan board's page list, read as she speaks ----------
// AppPlan (2880 wide): the page-plan card x 599–1662, y 611–2129.
const PC = { x: 599, w: 1063 };
const win = K.box(L.winX, L.winY, L.winW, L.winH, { cls: 'crop win' });
const kB = L.winW / PC.w;
const boardImg = K.el('img', { src: K.canvas('AppPlan'), parent: win, style: { left: -PC.x * kB + 'px', top: '0px', width: 2880 * kB + 'px' } });
const band = K.el('div', { parent: win, cls: 'band', style: { background: 'rgba(223,255,90,.32)', boxShadow: 'inset 0 0 0 3px #1F1F1F' } });
const boardTag = K.demoTag('Product design · sample data', L.boardTag[0], L.boardTag[1]);
const sub = K.box(tall ? 65 : 60, L.subY, W - 130, null, { cls: 'sub', html: wrapWords('What each page needs — *and why.*') });
const subW = [...sub.querySelectorAll('.w')], subHl = [...sub.querySelectorAll('.hl')];
// rows of the list (board px, 140 tall): Cover 857, How to use 997, Count 1137, Trace 1277, Match 1417, Colour 1557, Certificate 1697, Answer keys 1837
const ROWY = [857, 997, 1137, 1277, 1417, 1557, 1697, 1837];

// ---------- C: caption over the coloured plan ----------
const cap3 = K.box(65, tall ? 370 : 140, W - 130, null, { cls: 'mid', style: { fontSize: (tall ? 74 : 70) + 'px' }, html: wrapWords('New pictures only\nwhere *they’re needed.*') });
const cap3W = [...cap3.querySelectorAll('.w')], cap3Hl = [...cap3.querySelectorAll('.hl')];

// ---------- D: the finished PDF counts its pages ----------
const cap4 = K.box(65, L.capY, W - 130, null, { cls: 'mid', style: { fontSize: L.capFs + 'px' }, html: wrapWords('Counted from\nthe *files that ship.*') });
const cap4W = [...cap4.querySelectorAll('.w')], cap4Hl = [...cap4.querySelectorAll('.hl')];
const pdf = K.box(L.pdfX, L.pdfY, L.pdfW, 290, { cls: 'pdf', style: { height: 'auto' }, html: '<div class="ic">PDF</div><div class="c">0</div><div class="cl">pages counted</div>' });
const pdfC = pdf.querySelector('.c');
const SHEET = 7;
const sheets = Array.from({ length: 37 }, (_, i) => K.box(L.stX, L.stBase - (i + 1) * SHEET, L.stW, 6, { cls: 'sheet' }));
const tapeLen = 37 * SHEET + 30;
const tape = K.box(L.tapeX, L.stBase - tapeLen, 54, tapeLen, { cls: 'tape',
  html: Array.from({ length: 38 }, (_, i) => `<i style="bottom:${i * SHEET + 1}px;width:${i % 10 === 0 ? 20 : i % 5 === 0 ? 14 : 8}px"></i>`).join('')
    + [10, 20, 30].map((n) => `<b style="bottom:${n * SHEET - 8}px">${n}</b>`).join('') });
const shTag = K.demoTag('Illustration', 0, 0);
// the real phone's page plan: "Page plan · 37 pages … every page of the finished PDF is counted and checked"
const rc = crop(K.screen('65-phone-configure'), 780, 22, 2940, 736, 262, L.rW, { cls: 'rcrop' });
rc.el.style.left = L.rX + 'px'; rc.el.style.top = L.rY + 'px';
const rMark = K.el('div', { parent: rc.el, cls: 'mark', style: { left: (58 - 22) * rc.k + 'px', top: (3124 - 2940) * rc.k + 'px', width: 680 * rc.k + 'px', height: 50 * rc.k + 'px' } });
const realTag = K.demoTag('Real app · demo workspace', 0, 0);

const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: tall ? 160 : 0, line: 'Every page, planned.<br>Every page, counted.' });

const PAGE_T0 = 8.75, PAGE_DT = 0.068; // sheet i lands at PAGE_T0 + i * PAGE_DT (last ≈ 11.2)

K.run({
  id: 'H02', title: 'The Page Plan', dur: DUR, bpm: 90, musicMode: 'none', mood: 'calm', key: 'C', intro: 0, cover: 6.4,
  series: 'R08', feature: 'Feature 02 / 16 · The page plan',
  technique: 'A drafting table: 37 numbered page tiles laid out like a floor plan; a lime band reads the Plan board’s real page list row by row as the narrator speaks; the tiles return coloured by what each page needs (new pictures only on seven); the finished PDF counts its pages out onto a stack beside a tape measure, proved by the real phone’s page plan',
  caption: 'Every page is planned before anything is made: what each page needs and why — new pictures only where they’re needed. And the page count is measured from the files that actually ship. Start free at makeandlist.com',
  short: 'Every page planned. Every page counted.',
  question: 'How does it work?', gain: 'Quality: pages planned and counted',
  vo: [[0.19, 'Every page gets a plan.'], [2.03, "What each page needs, and why it's there."], [4.71, "New pictures only where they're needed."], [8.02, 'And the page count is measured from the files that ship.']],
  beats: ['0–2 s: “Every page, planned.” — 37 blank pages land on a drafting grid', '2–5.3 s: the Plan board’s page list, read row by row: what each page needs, and why', '5.3–7.8 s: the pages return coloured by what they need: new pictures only on 7, the rest reuse pictures or are drawn in code', '7.8–13 s: the finished PDF counts its pages onto a stack by a tape measure; the real phone: every page of the finished PDF is counted', '13–15 s: end card'],
  cues: [[0.12, 'pop'], [0.35, 'paper'], [1.1, 'paper'], [1.85, 'whoosh'], [3.72, 'swish'], [5.12, 'whoosh'], [5.45, 'sparkle'], [6.38, 'pop'],
    [7.62, 'whoosh'], [8.15, 'tape'], [8.75, 'pageturn'], [9.95, 'paper'], [11.75, 'ding'], [13.0, 'chime']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  chipDraw(T);

  // ---------- A + C: the tiles ----------
  const aOut = K.p(T, SB - 0.3, SB + 0.05, E.inCubic);
  words(hookW, T, 0.15, SB + 0.05, 0.1);
  hlSweep(hookHl, T, 1.05, 1.45);
  vis(hook, T < SB + 0.1);
  const cIn = K.p(T, SC - 0.05, SC + 0.5, E.outExpo), cOut = K.p(T, SD - 0.3, SD, E.inCubic);
  tiles.forEach((t, i) => {
    const d = (t.c + t.r) * 0.045;
    // A: drop in as a wave; out toward the board window
    const pa = K.p(T, 0.3 + d, 0.85 + d, E.outBack);
    // C: back in, coloured
    const pc = K.p(T, SC + d * 0.6, SC + 0.5 + d * 0.6, E.outExpo);
    const inA = T < SB + 0.1, inC = T >= SC - 0.05 && T < SD + 0.05;
    let o = 0, tr = '';
    if (inA) { o = Math.min(1, pa * 2) * (1 - aOut); tr = `translateY(${(1 - pa) * -50 + aOut * -40}px) rotate(${(1 - pa) * (seed(i) - 0.5) * 30}deg) scale(${1 - aOut * 0.2})`; }
    if (inC) {
      const lift = t.kind === 'new' ? K.p(T, 5.75 + d * 0.3, 6.15 + d * 0.3, E.outBack) : 0;
      o = Math.min(1, pc * 2) * (1 - cOut);
      tr = `translateY(${(1 - pc) * 40 - lift * 10 + cOut * -30}px) scale(${(0.9 + 0.1 * pc) * (1 + lift * 0.08)})`;
      t.el.style.zIndex = t.kind === 'new' ? 22 : 20;
    }
    t.el.style.opacity = o; t.el.style.transform = tr;
    // colour: what the page needs, filled from 5.4 s; the 'new' ones flash with "New pictures"
    const fillP = inC ? K.p(T, SC + 0.2 + d * 0.5, SC + 0.6 + d * 0.5, E.outCubic) : 0;
    t.pic.style.background = t.kind === 'new' ? '#DFFF5A' : t.kind === 'reuse' ? '#9DB59D' : 'transparent';
    t.pic.style.border = t.kind === 'code' ? '3px solid #1F1F1F' : t.kind === 'new' ? '3px solid #1F1F1F' : 'none';
    t.pic.style.opacity = fillP * (t.kind === 'new' ? 1 : 0.9 - 0.35 * K.p(T, 5.7, 6.1, E.linear));
    t.pic.style.transform = `scale(${0.6 + 0.4 * fillP})`;
    vis(t.el, inA || inC);
  });
  lgEls.forEach((l, i) => {
    const p = K.p(T, SC + 0.3 + i * 0.1, SC + 0.75 + i * 0.1, E.outBack);
    l.style.opacity = Math.min(1, p * 2) * (1 - cOut) * (i === 0 ? 1 : 1 - 0.45 * K.p(T, 5.7, 6.1, E.linear));
    l.style.transform = `translateY(${(1 - p) * 30}px) scale(${(0.85 + 0.15 * p) * (i === 0 ? 1 + 0.06 * K.p(T, 5.7, 6.0, E.outBack) : 1)})`;
  });
  vis(legend, T >= SC && T < SD + 0.05);
  tileTag.style.left = (tall ? 65 : 60) + 'px'; tileTag.style.top = (tall ? L.gY + ROWS * (L.tH + L.gap) + 8 : 1250) + 'px';
  tileTag.style.opacity = cIn * (1 - cOut); vis(tileTag, T >= SC && T < SD + 0.05);
  words(cap3W, T, SC + 0.1, SD, 0.06);
  hlSweep(cap3Hl, T, 6.45, 7.3);
  vis(cap3, T >= SC && T < SD + 0.05);

  // ---------- B: read the list ----------
  const bIn = K.p(T, SB - 0.1, SB + 0.45, E.outExpo), bOut = K.p(T, SC - 0.3, SC, E.inCubic);
  win.style.opacity = Math.min(1, bIn * 2) * (1 - bOut);
  win.style.transform = `translateY(${(1 - bIn) * 160 - bOut * 60}px) scale(${0.95 + 0.05 * bIn})`;
  vis(win, T >= SB - 0.1 && T < SC + 0.05);
  // camera: header first, then down the rows (board y of the window's top edge)
  const topY = K.k(T, [[SB, 640], [2.6, 660], [3.6, 820], [4.4, 1080], [SC, 1300]], E.inOutCubic);
  boardImg.style.top = -topY * kB + 'px';
  // the band follows the row being read
  const rowF = K.k(T, [[2.25, 0], [2.75, 0], [2.95, 1], [3.35, 1], [3.55, 2], [3.9, 2], [4.1, 3], [4.4, 3], [4.6, 4]], E.inOutCubic);
  const ry = ROWY[0] + 140 * rowF;
  band.style.top = (ry - topY) * kB + 'px'; band.style.height = 140 * kB + 'px';
  band.style.left = 14 * kB + 'px'; band.style.right = 14 * kB + 'px';
  band.style.opacity = K.p(T, 2.2, 2.45, E.linear);
  boardTag.style.opacity = bIn * (1 - bOut); vis(boardTag, T >= SB && T < SC + 0.05);
  words(subW, T, 2.3, SC, 0.07);
  hlSweep(subHl, T, 3.9, 4.6);
  vis(sub, T >= SB && T < SC + 0.05);

  // ---------- D: the count ----------
  const dIn = K.p(T, SD - 0.05, SD + 0.45, E.outExpo);
  words(cap4W, T, SD + 0.1, null, 0.08);
  hlSweep(cap4Hl, T, 10.15, 11.5);
  vis(cap4, T >= SD);
  pdf.style.opacity = dIn; pdf.style.transform = `translateY(${(1 - dIn) * 60}px) rotate(${-2 + Math.sin(T * 0.8) * 0.4}deg)`;
  vis(pdf, T >= SD - 0.05);
  const landed = Math.max(0, Math.min(37, Math.floor((T - PAGE_T0) / PAGE_DT) + 1));
  pdfC.textContent = T < PAGE_T0 ? '0' : String(landed);
  pdfC.style.transform = `scale(${landed === 37 ? 1 + 0.12 * (1 - K.p(T, 11.25, 11.7, E.outBack)) : 1})`;
  pdfC.style.color = landed === 37 && T > 11.25 ? '#1F1F1F' : '#45403A';
  sheets.forEach((s, i) => {
    const t0 = PAGE_T0 + i * PAGE_DT;
    const p = K.p(T, t0 - 0.28, t0, E.outCubic);
    const fromX = L.pdfX + L.pdfW / 2 - L.stX - L.stW / 2, fromY = L.pdfY + 60 - (L.stBase - (i + 1) * SHEET);
    const arc = Math.sin(Math.PI * p) * -80;
    s.style.opacity = T >= t0 - 0.28 ? 1 : 0;
    s.style.transform = `translate(${(1 - p) * fromX}px, ${(1 - p) * fromY + arc}px) rotate(${(1 - p) * -25 + (seed(i) - 0.5) * 2}deg) scaleY(${1 + (1 - p) * 6})`;
    vis(s, T >= t0 - 0.28);
  });
  // tape pulls up beside the stack
  const tp = K.p(T, 8.1, 8.7, E.outExpo);
  tape.style.clipPath = `inset(${(1 - tp) * 100}% 0 0 0 round 8px)`;
  tape.style.opacity = dIn; vis(tape, T >= SD);
  shTag.style.left = L.stX + 'px'; shTag.style.top = L.stBase - 37 * SHEET - 50 + 'px';
  shTag.style.opacity = dIn; vis(shTag, T >= SD);
  const rp = K.p(T, 9.3, 9.85, E.outExpo);
  rc.el.style.opacity = rp; rc.el.style.transform = `translateY(${(1 - rp) * 80}px)`;
  vis(rc.el, T >= 9.3);
  rMark.style.opacity = K.p(T, 10.2, 10.4, E.linear);
  rMark.style.transform = `scale(${1.05 - 0.05 * K.p(T, 10.2, 10.6, E.outBack)})`;
  realTag.style.left = L.rX + 'px'; realTag.style.top = (tall ? L.rY - 42 : L.rY + rc.h + 14) + 'px';
  realTag.style.opacity = rp; vis(realTag, T >= 9.3);

  end(T);
});
