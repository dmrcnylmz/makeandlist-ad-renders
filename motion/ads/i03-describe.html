<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>I03 · Describe It</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #FAF7EE; }
/* R09 highlight chip — the R08 .fchip, identical in I01–I16 */
.fchip { position: absolute; z-index: 80; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 10px; border-radius: 99px;
  background: #1F1F1F; color: #FAF7EE; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 16px 30px -18px rgba(31,31,31,.7); }
.fchip b { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 99px; background: #DFFF5A; color: #1F1F1F; font-weight: 600; }
.fchip i { font-style: normal; color: #8A8378; }
.fchip span { font: 700 25px 'Archivo'; letter-spacing: 0; }
.blob { position: absolute; border-radius: 50%; pointer-events: none; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.cap { position: absolute; z-index: 40; font: 800 88px/1.0 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; white-space: nowrap; }
.cap em { font-style: italic; background: linear-gradient(transparent 60%, #DFFF5A 60%, #DFFF5A 92%, transparent 92%) no-repeat 0 0 / 0% 100%; padding: 0 .04em; }
.w { display: inline-block; white-space: pre; }
.card { position: absolute; z-index: 30; border-radius: 28px; background: #FFFDF8; box-shadow: 0 60px 110px -50px rgba(31,31,31,.6), 0 0 0 1px #E2DBCE; transform-origin: 50% 60%; padding: 32px 34px 34px; }
.lbl { font: 600 26px 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: #6B645A; }
.field { margin-top: 18px; padding: 22px 28px; height: 222px; border-radius: 20px; border: 2.5px solid #1F1F1F; font: 500 46px/1.22 'Archivo'; color: #1F1F1F; }
.caret { display: inline-block; width: 4px; height: 50px; margin-left: 3px; vertical-align: -8px; background: #1F1F1F; }
.q2 { margin-top: 26px; font: 700 32px 'Archivo'; color: #1F1F1F; }
.opts { display: flex; gap: 16px; margin-top: 16px; }
.opt { flex: 1; padding: 18px 20px; border-radius: 18px; background: #F4F1EA; box-shadow: inset 0 0 0 2px #E2DBCE; }
.opt b { display: block; font: 800 36px 'Archivo'; color: #1F1F1F; }
.opt small { display: block; margin-top: 6px; font: 500 26px/1.2 'Archivo'; color: #6B645A; }
.opt.on { background: #FFFDF8; box-shadow: inset 0 0 0 4px #1F1F1F; }
.foot { display: flex; align-items: center; gap: 22px; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; height: 84px; padding: 0 40px; border-radius: 20px; background: #DFFF5A; font: 800 40px 'Archivo'; color: #1F1F1F; white-space: nowrap; }
.nb { font: 500 27px/1.25 'Archivo'; color: #45403A; }
.qc { position: absolute; z-index: 30; border-radius: 30px; background: #1F1F1F; color: #FAF7EE; box-shadow: 0 70px 120px -50px rgba(31,31,31,.85); padding: 34px 40px 38px; transform-origin: 50% 60%; }
.qc .hd { display: flex; align-items: flex-end; justify-content: space-between; }
.qc .big { font: 800 120px/0.9 'Playfair Display'; letter-spacing: -0.03em; color: #FAF7EE; white-space: nowrap; }
.qc .big span { font: 600 44px 'Archivo'; letter-spacing: 0; color: #CFC8BA; margin-left: 14px; }
.qc .k { font: 500 26px/1.3 'IBM Plex Mono', monospace; color: #B9B1A3; text-align: right; letter-spacing: .04em; }
.qc .rows { margin-top: 20px; }
.qc .row { position: relative; display: flex; align-items: center; gap: 20px; height: 78px; border-top: 1.5px solid #3A3835; }
.qc .row .c { flex: none; width: 168px; height: 46px; border-radius: 99px; box-shadow: inset 0 0 0 2px #DFFF5A; color: #DFFF5A; font: 600 26px/46px 'IBM Plex Mono', monospace; letter-spacing: .06em; text-align: center; }
.qc .row .l { flex: 1; min-width: 0; font: 500 33px/1.1 'Archivo'; color: #FAF7EE; }
.qc .row .v { flex: none; font: 600 38px 'IBM Plex Mono', monospace; color: #FAF7EE; }
.qc .row.tot { border-top: 2.5px solid #8A8378; }
.qc .row.tot .l { font-weight: 800; font-size: 38px; }
.qc .row.tot .v { color: #DFFF5A; font-size: 44px; }
.qc .row.tot .c { background: #DFFF5A; color: #1F1F1F; }
.qc .hl { position: absolute; left: -16px; right: -16px; top: 6px; bottom: 6px; border-radius: 16px; background: rgba(223,255,90,.13); box-shadow: inset 0 0 0 2.5px rgba(223,255,90,.85); }
.qc .nt { margin-top: 18px; font: 500 28px/1.3 'Archivo'; color: #CFC8BA; }
.qc .mk { margin-top: 20px; height: 90px; border-radius: 22px; background: #DFFF5A; color: #1F1F1F; font: 800 42px/90px 'Archivo'; text-align: center; white-space: nowrap; }
.band { position: absolute; left: 0; right: 0; z-index: 1; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 34%); mask-image: linear-gradient(180deg, transparent 0%, #000 34%); }
.band img { position: absolute; left: 0; width: 100%; display: block; }
.ring { position: absolute; z-index: 60; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; border: 6px solid #DFFF5A; box-shadow: 0 0 0 4px rgba(31,31,31,.25); pointer-events: none; }
.dot { position: absolute; z-index: 61; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: rgba(250,247,238,.42); box-shadow: 0 0 0 4px rgba(31,31,31,.85); pointer-events: none; }
/* 9:16 (Stories): the cards fill the taller room */
.tall .field { font-size: 52px; height: 250px; }
.tall .caret { height: 56px; }
.tall .q2 { font-size: 36px; margin-top: 30px; }
.tall .opt { padding: 24px 22px; }
.tall .opt b { font-size: 40px; }
.tall .opt small { font-size: 28px; }
.tall .btn { height: 96px; font-size: 44px; }
.tall .nb { font-size: 29px; }
.tall .qc { padding: 40px 42px 44px; }
.tall .qc .big { font-size: 150px; }
.tall .qc .row { height: 100px; }
.tall .qc .row .l { font-size: 37px; }
.tall .qc .row .v { font-size: 42px; }
.tall .qc .row.tot .l { font-size: 42px; }
.tall .qc .row.tot .v { font-size: 48px; }
.tall .qc .nt { font-size: 31px; margin-top: 22px; }
.tall .qc .mk { height: 106px; line-height: 106px; font-size: 46px; margin-top: 26px; }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// I03 — How it works (1/3): Step 1, describe it. The Describe field from the Studio, redrawn large: a real sentence
// (the owner's Christmas preschool pack) types itself in, Digital is chosen, Plan it is tapped. The Plan's quote card
// then swings in, dark and large: 110 Credits counts up, and a spotlight walks the rows as she names them — pages,
// pictures, extras, total. Nothing is made until a tap on "Make it" — her "yes".
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 18, E = K.ease;
if (tall) document.body.classList.add('tall');
const BPM = 92.3, BEAT = 60 / BPM;
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Marian, speech windows measured from the takes (vo.mjs + an RMS pass):
//   L1 0.49–2.19 · L2 2.66–6.23 · L3 6.56–12.65 ("…quote in Credits" → 8.34, "pages" 9.07, "pictures" 10.19,
//   "extras" 11.26, "total" 12.41–12.65) · L4 13.19–15.48
const VO = [[0.1, 'Step one: describe it.'], [1.95, 'A Christmas learning pack for preschoolers, with answer keys.'],
  [6.4, 'Then you see the quote in Credits: pages, pictures, extras, total.'], [12.55, 'Nothing is made until you say yes.']];
const S_B = 6.45, S_C = 12.95, END = DUR - 2;
const T_ROW = [9.0, 10.12, 11.2, 12.35];
const T_TAP = 15.55;
const SENT = 'A Christmas learning pack for preschoolers — counting, tracing and matching, with answer keys';
const T_TYPE = [0.8, 5.9];

const L = tall
  ? { chip: [65, 290], capX: 65, capY: 384, cardY: 520, cardW: 950, qY: 520, bandY: 1330, ex: [65, 1540] }
  : { chip: [60, 56], capX: 60, capY: 140, cardY: 262, cardW: 960, qY: 262, bandY: 950, ex: [60, 1290] };

const blobA = K.box(0, 0, 1100, 1100, { cls: 'blob', style: { background: 'radial-gradient(circle, rgba(223,255,90,.26), rgba(223,255,90,0) 62%)' } });
const blobB = K.box(0, 0, 900, 900, { cls: 'blob', style: { background: 'radial-gradient(circle, rgba(126,154,126,.18), rgba(126,154,126,0) 62%)' } });
// the real product under the sentence (the owner's own pack)
const band = K.box(0, L.bandY, W, H - L.bandY, { cls: 'band', html: `<img src="${K.pub('showcase/christmas-preschool-pack/photo.webp')}">` });
const bandImg = band.querySelector('img');
const exTag = K.demoTag('Example made with MakeAndList by its owner', L.ex[0], L.ex[1]);

function mkCap(text, fs) {
  const c = K.box(L.capX, L.capY, W - 2 * L.capX, null, { cls: 'cap', style: { fontSize: (fs || (tall ? 88 : 80)) + 'px' } });
  c.innerHTML = text.split('\n').map((line) => line.split(' ').map((t) => t.startsWith('*')
    ? `<span class="w"><em>${t.replace(/\*/g, '')}</em> </span>` : `<span class="w">${t} </span>`).join('')).join('<br>');
  return { c, w: [...c.querySelectorAll('.w')], em: [...c.querySelectorAll('em')] };
}
function drawCap(cp, T, a, out, hl) {
  cp.w.forEach((w, i) => {
    const p = K.p(T, a + i * 0.06, a + 0.5 + i * 0.06, E.outExpo);
    const o = out ? K.p(T, out - 0.25, out, E.inCubic) : 0;
    w.style.opacity = Math.min(1, p * 1.6) * (1 - o);
    w.style.transform = `translateY(${(1 - p) * 60 - o * 30}px)`;
    w.style.filter = p < 1 ? `blur(${(1 - p) * 8}px)` : 'none';
  });
  cp.em.forEach((e, i) => { e.style.backgroundSize = `${K.p(T, hl + i * 0.12, hl + 0.4 + i * 0.12, E.outCubic) * 100}% 100%`; });
  cp.c.style.visibility = T >= a && (!out || T < out + 0.05) ? 'visible' : 'hidden';
}
const capA = mkCap('Step 1: *describe* it.');
const capB = mkCap('See the *quote* first.');
const capC = mkCap('Made only on your *yes.*', tall ? 84 : 78);

// ---------- A: the Describe field (Studio, redrawn larger) ----------
const card = K.box(L.capX, L.cardY, L.cardW, null, { cls: 'card',
  html: `<div class="lbl">Describe it in your own words</div><div class="field"><span class="tx"></span><span class="caret"></span></div>
    <div class="q2">What should it become?</div>
    <div class="opts"><div class="opt"><b>Digital</b><small>Files your buyers download</small></div><div class="opt"><b>Printed</b><small>Made by your print partner</small></div><div class="opt"><b>Both</b><small>One design, two editions</small></div></div>
    <div class="foot"><div class="btn">Plan it →</div><div class="nb">Nothing is made or charged<br>until you approve the quote.</div></div>` });
const tx = card.querySelector('.tx'), caret = card.querySelector('.caret'), planBtn = card.querySelector('.btn');
const optD = card.querySelector('.opt');
const redrawTag = K.demoTag('App screen · redrawn, sample data', 0, 0);

// ---------- B: the quote (Plan, redrawn larger) ----------
const ROWS = [['PAGES', 'Product plan and layout', '0'], ['PICTURES', '7 new illustrations · Smart engine', '70'],
  ['EXTRAS', 'Listing images, video, copy', '40'], ['TOTAL', 'Total', '110']];
const qc = K.box(L.capX, L.qY, L.cardW, null, { cls: 'qc',
  html: `<div class="hd"><div class="big"><b class="n">110</b><span>Credits</span></div><div class="k">Quote<br>valid 30 minutes</div></div>
    <div class="rows">${ROWS.map(([c, l, v], i) => `<div class="row${i === 3 ? ' tot' : ''}"><div class="hl"></div><div class="c">${c}</div><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
    <div class="nt">If it stops, every unused Credit comes back.</div>
    <div class="mk">Make it · 110 Credits</div>` });
const qn = qc.querySelector('.n'), rows = [...qc.querySelectorAll('.row')], hls = [...qc.querySelectorAll('.hl')], mk = qc.querySelector('.mk');
const ring = K.box(0, 0, 170, 170, { cls: 'ring' }), dot = K.box(0, 0, 66, 66, { cls: 'dot' });

const chip = K.box(L.chip[0], L.chip[1], null, null, { cls: 'fchip', style: { width: 'auto', height: '56px' }, html: '<b>HOW IT WORKS</b><i>·</i><span>1/3</span>' });
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(END, { lift: tall ? 160 : 0, line: 'Next: it makes and checks →' });

const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
function float(el, T, a, b, o = {}) {
  const pi = K.p(T, a, a + (o.din || 0.65), E.outExpo), po = b ? K.p(T, b - 0.35, b, E.inCubic) : 0;
  const ph = o.ph || 0;
  el.style.opacity = Math.min(1, pi * 1.8) * (1 - po);
  el.style.transform = `perspective(1600px) translateY(${(1 - pi) * (o.dy ?? 180) - po * 90 + Math.sin(T * 0.8 + ph) * 5}px) `
    + `rotateX(${(1 - pi) * 9 + Math.sin(T * 0.6 + ph) * 0.8}deg) rotateY(${(1 - pi) * (o.ry ?? -7) + Math.cos(T * 0.5 + ph) * 1.1}deg) `
    + `scale(${0.93 + 0.07 * pi + 0.003 * Math.max(0, T - a)})`;
  vis(el, T >= a && (!b || T < b + 0.02));
}

K.run({
  id: 'I03', title: 'Describe It', dur: DUR, bpm: BPM, music: 'ov-vanilla-lofi-beat', mood: 'bright', key: 'F', intro: 0, cover: 10.4,
  series: 'R09', highlight: 'HOW IT WORKS · 1/3',
  technique: 'The Studio’s Describe field, redrawn large: a real sentence types itself in, Digital is chosen and Plan it is tapped; the Plan’s dark quote card swings in from a 3D tilt, 110 Credits counts up, and a lime spotlight walks the rows as she names pages, pictures, extras and the total; the card waits until a finger taps “Make it” on her “yes”',
  caption: 'How MakeAndList works, step 1: describe what you want to make in a sentence. Before anything is made you see the quote in Credits — pages, pictures, extras and the total — and nothing is made until you say yes. Start free at makeandlist.com',
  short: 'Describe it. See the quote first.',
  vo: VO,
  beats: ['0–2.6 s: “Step 1: describe it.” — the Describe field (redrawn) starts typing', '2.6–6.4 s: the sentence completes — a Christmas learning pack with answer keys; Digital; Plan it is tapped',
    '6.4–9 s: the quote card swings in — 110 Credits counts up', '9–13 s: a spotlight walks the rows: pages, pictures, extras, total',
    '13–16 s: “Made only on your yes.” — the finger taps Make it', '16–18 s: end card · Next: it makes and checks'],
  cues: [[0.1, 'pop'], [0.8, 'type'], [2.7, 'type'], [5.0, 'click'], [6.12, 'click'], [6.38, 'whoosh'], [7.4, 'coin'],
    [T_ROW[0], 'pop'], [T_ROW[1], 'pop'], [T_ROW[2], 'pop'], [T_ROW[3], 'ding'], [T_TAP, 'click'], [T_TAP + 0.1, 'sparkle'], [END, 'swish']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  blobA.style.transform = `translate(${W * 0.66 - 550 + Math.sin(T * 0.5) * 160}px, ${H * 0.36 - 550 + Math.cos(T * 0.4) * 120}px)`;
  blobB.style.transform = `translate(${W * 0.14 - 450 + Math.cos(T * 0.45) * 120}px, ${H * 0.78 - 450 + Math.sin(T * 0.6) * 100}px)`;
  const cp = K.p(T, 0.05, 0.55, E.outExpo);
  chip.style.opacity = cp * (1 - K.p(T, END - 0.15, END, E.linear)); chip.style.clipPath = `inset(0 ${(1 - cp) * 100}% 0 0 round 99px)`; chip.style.transform = `translateX(${(1 - cp) * -30}px)`;

  drawCap(capA, T, 0.2, S_B, 1.3);
  drawCap(capB, T, S_B + 0.15, S_C, 8.0);
  drawCap(capC, T, S_C + 0.15, END, 15.1);

  // the owner's pack under the sentence
  const bo = K.p(T, END - 0.2, END, E.linear);
  band.style.opacity = K.p(T, 0.3, 1.3, E.linear) * (1 - bo) * 0.95;
  bandImg.style.top = (tall ? -180 : -300) - 160 * K.p(T, 0, END, E.linear) + 'px';
  bandImg.style.transform = `scale(${1.04 + 0.05 * K.p(T, 0, END, E.linear)})`;
  vis(band, T < END + 0.05);
  exTag.style.opacity = band.style.opacity; exTag.style.zIndex = 61; vis(exTag, T > 0.3 && T < END + 0.05);

  // ---------- A ----------
  float(card, T, 0.3, S_B, { ph: 0.4 });
  const n = Math.round(SENT.length * K.p(T, T_TYPE[0], T_TYPE[1], E.linear));
  tx.textContent = SENT.slice(0, n);
  caret.style.opacity = (T > T_TYPE[0] && T < T_TYPE[1]) || Math.floor(T * 2.4) % 2 === 0 ? 1 : 0;
  const on = K.p(T, 5.0, 5.25, E.outBack);
  optD.className = 'opt' + (T >= 5.0 ? ' on' : '');
  optD.style.transform = `scale(${1 + 0.04 * Math.sin(Math.PI * K.p(T, 5.0, 5.35, E.linear))})`;
  const tap = K.p(T, 6.0, 6.12, E.outCubic) * (1 - K.p(T, 6.12, 6.3, E.outCubic));
  planBtn.style.transform = `scale(${1 - 0.06 * tap})`;
  redrawTag.style.zIndex = 61;
  if (T < S_B) {
    redrawTag.style.left = L.capX + L.cardW - redrawTag.offsetWidth + 'px'; redrawTag.style.top = L.ex[1] + 'px';
    redrawTag.style.opacity = K.p(T, 0.8, 1.1, E.linear) * (1 - K.p(T, S_B - 0.3, S_B, E.linear));
  } else {
    redrawTag.style.left = L.capX + L.cardW - redrawTag.offsetWidth + 'px';
    redrawTag.style.top = L.ex[1] + 'px';
    redrawTag.style.opacity = K.p(T, S_B + 0.4, S_B + 0.7, E.linear) * (1 - K.p(T, END - 0.1, END + 0.2, E.linear));
  }

  // ---------- B / C: the quote ----------
  float(qc, T, S_B, END + 0.4, { ph: 1.1, ry: 9, dy: 240 });
  qn.textContent = K.count(T, 7.35, 8.4, 0, 110);
  const spot = T >= T_ROW[0] && T < S_C;
  rows.forEach((r, i) => {
    const a = T_ROW[i], b = i < 3 ? T_ROW[i + 1] : S_C;
    const act = K.p(T, a - 0.05, a + 0.2, E.outCubic) * (1 - K.p(T, b - 0.05, b + 0.15, E.outCubic));
    hls[i].style.opacity = act;
    hls[i].style.transform = `scaleX(${0.96 + 0.04 * K.p(T, a - 0.05, a + 0.35, E.outBack)})`;
    // the spotlight: rows not yet named sit back
    const lit = !spot ? 1 : (T >= a - 0.05 ? 1 : 0.3);
    r.style.opacity = lit;
    r.style.transform = `translateX(${act * 10}px)`;
  });
  // the yes: a finger comes to Make it and taps it
  const mr = mk.getBoundingClientRect();
  const bx = mr.left + mr.width * 0.62, by = mr.top + mr.height / 2;
  const fin = K.p(T, 14.7, 15.4, E.inOutCubic), fout = K.p(T, 15.8, 15.98, E.inCubic);
  const pt = K.p(T, T_TAP - 0.1, T_TAP, E.outCubic) * (1 - K.p(T, T_TAP, T_TAP + 0.2, E.outCubic));
  dot.style.left = K.lerp(bx + 160, bx, fin) + 'px'; dot.style.top = K.lerp(by + 300, by, fin) + fout * 120 + 'px';
  dot.style.opacity = K.p(T, 14.7, 14.9, E.linear) * (1 - fout);
  dot.style.transform = `scale(${1 - 0.18 * pt})`;
  vis(dot, T >= 14.7 && T < 16);
  mk.style.transform = `scale(${1 - 0.04 * pt + 0.015 * Math.sin(Math.PI * 2 * K.p(T, S_C, T_TAP, E.linear) * 3) * (T < T_TAP ? 1 : 0)})`;
  const rp = K.p(T, T_TAP, T_TAP + 0.5, E.outCubic);
  ring.style.left = bx + 'px'; ring.style.top = by + 'px';
  ring.style.opacity = T >= T_TAP && T < 16 ? 1 - rp : 0; ring.style.transform = `scale(${0.35 + 0.9 * rp})`;

  end(T);
});
</script></body></html>
