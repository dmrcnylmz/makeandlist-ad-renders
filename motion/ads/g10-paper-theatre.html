<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G10 · Paper Theatre</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #3A1714; }
.pro { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 40%, #7A2E27 0%, #5A1F1A 60%, #3A1714 100%); }
.box { position: absolute; overflow: hidden; border-radius: 6px; box-shadow: inset 0 0 0 6px #C9A45E, inset 0 0 0 9px #5A1F1A, inset 0 30px 60px rgba(0,0,0,.35); }
.inner { position: absolute; left: 0; top: 0; width: 960px; height: 900px; transform-origin: 0 0; }
.ly { position: absolute; left: 0; top: 0; width: 960px; height: 900px; }
.pc { position: absolute; filter: drop-shadow(0 10px 7px rgba(40,20,10,.32)); }
.pc svg, .pc img { display: block; }
.str { position: absolute; width: 2px; background: rgba(60,40,25,.55); }
.stk { position: absolute; width: 8px; border-radius: 2px; background: linear-gradient(90deg, #8C6A43, #B48A5A); }
.boards { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: repeating-linear-gradient(90deg, #9C7148 0 118px, #8A6240 118px 120px), linear-gradient(#A77A4E, #7E5737); box-shadow: inset 0 6px 10px rgba(0,0,0,.25); }
.slot { position: absolute; left: 30px; right: 30px; bottom: 74px; height: 8px; background: #2A1A10; border-radius: 4px; }
.foot { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,226,160,.85), rgba(255,226,160,0)); mix-blend-mode: screen; }
.curtain { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(90deg, #8E2F28 0 26px, #A33A31 26px 50px, #7A2620 50px 74px); box-shadow: inset 0 -40px 60px rgba(0,0,0,.35); }
.curtain::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: linear-gradient(transparent, rgba(0,0,0,.3)); }
.val { position: absolute; left: 0; right: 0; top: 0; }
.cap { position: absolute; z-index: 40; text-align: center; font: 800 76px/1.04 'Playfair Display'; letter-spacing: -0.015em; color: #FBF1DC; text-shadow: 0 3px 0 rgba(40,10,8,.45); }
.cap em { font-style: italic; color: #DFFF5A; }
.sub { position: absolute; z-index: 40; text-align: center; font: 500 22px/1.45 'IBM Plex Mono', monospace; letter-spacing: .06em; color: rgba(251,241,220,.9); }
.kick { position: absolute; z-index: 40; text-align: center; font: 600 21px 'IBM Plex Mono', monospace; letter-spacing: .3em; text-transform: uppercase; color: #E7C987; white-space: nowrap; }
.aud { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; }
.paperN { position: absolute; inset: 0; z-index: 60; pointer-events: none; mix-blend-mode: multiply; opacity: .16; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .32  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.demo.dk { background: rgba(40,14,12,.7); color: rgba(255,253,248,.88); border-color: rgba(255,253,248,.4); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// G10 — Paper Theatre. A toy paper-cut theatre: a red proscenium, a valance that carries the captions, footlights, a row
// of paper heads in the audience. Velvet curtains open on "Tonight": the flow plays as five scenes, each built from
// paper flats on four depth planes (2.5D parallax under a slowly drifting camera, drop shadows between the layers):
// flats drop from the fly on strings, slide in from the wings or rise through the floor slot on sticks, with paper
// springiness. Idea (a lightbulb and a thought card) → files (pages on strings, each ticked) → your store (a shopfront,
// a "Draft" tag swinging from the awning) → your print partner (a press, rollers turning, cards coming out) → the parcel
// (a van crosses the hills to a house). The curtains close on the beat. Narrated.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 89.1, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Voice — speech windows: L1 0.55–2.61 · L2 3.22–4.49 · L3 5.75–7.47 · L4 8.54–10.34 · L5 11.22–12.68. Scene changes
// (paper and swish cues) land in the breaths.
const VO = [[0.35, 'Tonight, your idea takes the stage.'], [2.69, 'You check every file.'], [5.45, 'It waits in your store as a draft.'], [8.0, 'Your print partner prints each order.'], [10.28, 'And off it goes.']];
const C = [0, B(4), B(8), B(12), B(15.5), 99]; // scene starts: 0 · 2.694 · 5.387 · 8.081 · 10.438
const CLOSE = B(18.5); // 12.458 curtains close

const L = tall
  ? { box: [60, 590, 960, 930], valH: 570, capY: 318, capFs: 78, subY: 488, kickY: 282, audY: 1580, tagY: 1206 }
  : { box: [60, 272, 960, 880], valH: 262, capY: 52, capFs: 62, subY: 196, kickY: 0, audY: 1176, tagY: 1282 };
const [BX, BY, BW, BH] = L.box;
const s = Math.min(BW / 960, BH / 900);

// ---------- the theatre ----------
K.box(0, 0, W, H, { cls: 'pro' });
const val = K.box(0, 0, W, L.valH, { cls: 'val', html: `<svg width="${W}" height="${L.valH + 40}" viewBox="0 0 ${W} ${L.valH + 40}">
  <path d="M0 0 H${W} V${L.valH - 10} ${Array.from({ length: 12 }, (_, i) => `Q${W - (i + 0.5) * W / 12} ${L.valH + 34} ${W - (i + 1) * W / 12} ${L.valH - 10}`).join(' ')} Z" fill="#6B2620"/>
  <path d="M0 ${L.valH - 34} H${W}" stroke="#C9A45E" stroke-width="3" opacity=".8"/>
  ${Array.from({ length: 12 }, (_, i) => `<circle cx="${(i + 0.5) * W / 12}" cy="${L.valH + 14}" r="7" fill="#C9A45E"/>`).join('')}</svg>`, style: { zIndex: 35, filter: 'drop-shadow(0 12px 10px rgba(0,0,0,.4))' } });
const box = K.box(BX, BY, BW, BH, { cls: 'box' });
const inner = K.el('div', { parent: box, cls: 'inner', style: { left: (BW - 960 * s) / 2 + 'px', top: (BH - 900 * s) + 'px' } });
const LY = [0, 1, 2, 3].map(() => K.el('div', { parent: inner, cls: 'ly' }));
K.el('div', { parent: inner, cls: 'slot' });
K.el('div', { parent: inner, cls: 'boards' });
const foots = Array.from({ length: 7 }, (_, i) => K.el('div', { parent: box, cls: 'foot', style: { left: BW * (i + 0.5) / 7 - 110 + 'px', top: BH - 120 + 'px', width: '220px', height: '160px' } }));
const curtains = [0, 1].map((i) => K.el('div', { parent: box, cls: 'curtain', style: { width: BW / 2 + 40 + 'px', left: i ? BW / 2 - 40 + 'px' : 0, zIndex: 20 } }));
// audience: paper heads, bobbing on the beat
const aud = K.box(0, L.audY, W, H - L.audY, { cls: 'aud', html: `<svg width="${W}" height="${H - L.audY}" viewBox="0 0 ${W} ${H - L.audY}">${Array.from({ length: 11 }, (_, i) => { const x = 40 + i * (W - 80) / 10, y = 60 + (i % 2) * 26; return `<g class="hd" data-i="${i}"><circle cx="${x}" cy="${y}" r="${44 + seed(i) * 8}" fill="#1E0C0A"/><rect x="${x - 70}" y="${y + 34}" width="140" height="400" rx="60" fill="#1E0C0A"/></g>`; }).join('')}</svg>` });
const heads = [...aud.querySelectorAll('.hd')];

// ---------- paper pieces ----------
// each piece: layer, scene, x/y/w/h in the 960×900 stage, an entrance ('drop' on strings, 'wing' from a side, 'rise' on a stick)
const P = [];
function piece(o) {
  const el = K.el('div', { parent: LY[o.d], cls: 'pc', html: o.html, style: { left: o.x + 'px', top: o.y + 'px', width: o.w + 'px', height: o.h + 'px' } });
  if (o.how === 'drop') [0.2, 0.8].slice(0, o.one ? 1 : 2).forEach((u) => K.el('div', { parent: el, cls: 'str', style: { left: (o.one ? o.w / 2 : o.w * u) + 'px', top: -1200 + 'px', height: 1200 + 'px' } }));
  if (o.how === 'rise') K.el('div', { parent: el, cls: 'stk', style: { left: o.w / 2 - 4 + 'px', top: o.h - 6 + 'px', height: 900 + 'px' } });
  const p = { ...o, el, a: C[o.sc] + (o.dl || 0), b: C[o.sc + 1] };
  P.push(p);
  return p;
}
const img = (id, w, h) => `<img src="${K.pub('r07/' + id + '.webp')}" style="width:${w}px;height:${h}px">`;
const svg = (w, h, body, vb) => `<svg width="${w}" height="${h}" viewBox="${vb || `0 0 ${w} ${h}`}">${body}</svg>`;
const BACK = ['#24344C', '#EADFC6', '#D6E2CF', '#EBD3BD', '#CFE2E8'];
BACK.forEach((c, i) => piece({ sc: i, d: 0, how: 'drop', x: -40, y: -40, w: 1040, h: 980, dl: -0.3, html: svg(1040, 980, `<rect width="1040" height="980" fill="${c}"/>` + (i === 0 ? Array.from({ length: 30 }, (_, j) => `<circle cx="${seed(j) * 1040}" cy="${seed(j + 50) * 560}" r="${2 + seed(j + 9) * 3}" fill="#FBF1DC" opacity="${0.5 + seed(j + 3) * 0.5}"/>`).join('') : '') + (i === 4 ? '<circle cx="820" cy="190" r="70" fill="#F2C66B"/>' : '')) }));
// scene 1 — the idea, at night
piece({ sc: 0, d: 1, how: 'drop', one: true, x: 700, y: 90, w: 130, h: 130, html: svg(130, 130, '<circle cx="65" cy="65" r="60" fill="#FBF1DC"/><circle cx="45" cy="50" r="10" fill="#E6D9BC"/><circle cx="80" cy="85" r="7" fill="#E6D9BC"/>') });
piece({ sc: 0, d: 1, how: 'rise', x: -40, y: 560, w: 1040, h: 300, html: svg(1040, 300, '<path d="M0 140 Q180 40 360 120 T720 100 T1040 120 V300 H0Z" fill="#1A2638"/>') });
const bulb = piece({ sc: 0, d: 2, how: 'rise', x: 390, y: 360, w: 180, h: 260, dl: 0.25, html: `<div class="glow" style="position:absolute;left:-150px;top:-140px;width:480px;height:480px;border-radius:50%;background:radial-gradient(closest-side, rgba(223,255,90,.55), rgba(223,255,90,0));"></div>` + svg(180, 260, '<path d="M90 10 C35 10 12 55 12 92 C12 130 45 150 55 185 H125 C135 150 168 130 168 92 C168 55 145 10 90 10Z" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="5"/><path d="M70 120 L90 150 L110 120" fill="none" stroke="#1F1F1F" stroke-width="4"/><rect x="55" y="190" width="70" height="20" rx="5" fill="#8A8378"/><rect x="60" y="214" width="60" height="16" rx="5" fill="#6B645A"/>') });
piece({ sc: 0, d: 3, how: 'drop', x: 150, y: 70, w: 400, h: 230, dl: 0.55, html: `<div style="width:400px;height:230px;border-radius:30px;background:#FBF6EA;box-shadow:inset 0 0 0 3px #D9CDB4;display:flex;align-items:center;gap:18px;padding:0 24px;box-sizing:border-box">${img('k06-notebook', 112, 163)}<div style="font:italic 600 36px/1.1 'Playfair Display';color:#1F1F1F">a lemon notebook, for summer</div></div>` });
// scene 2 — files on strings, each one ticked
const FILES = [['pages.pdf', 80, 190], ['cover.png', 290, 120], ['listing.txt', 560, 150], ['images', 760, 210]];
const ticks = FILES.map(([n, x, y], i) => {
  const p = piece({ sc: 1, d: 1 + (i % 2), how: 'drop', x, y, w: 160, h: 214, dl: 0.08 * i, html: `<div style="position:relative;width:160px;height:214px;background:#FFFDF8;border-radius:6px;box-shadow:inset 0 0 0 2px #E2DBCE;padding:18px 16px;box-sizing:border-box">${Array.from({ length: 6 }, (_, j) => `<div style="height:8px;margin:10px 0;border-radius:4px;background:${j === 0 ? '#C9B48E' : '#E6DCC8'};width:${j === 0 ? 70 : 60 + seed(i * 7 + j) * 40}%"></div>`).join('')}<div style="position:absolute;left:12px;bottom:12px;font:600 15px 'IBM Plex Mono';color:#6B645A">${n}</div><div class="tk" style="position:absolute;right:-18px;top:-18px;width:56px;height:56px;border-radius:50%;background:#DFFF5A;box-shadow:0 0 0 4px #1F1F1F;display:grid;place-items:center;font:800 30px Archivo;color:#1F1F1F">✓</div></div>` });
  return p.el.querySelector('.tk');
});
piece({ sc: 1, d: 3, how: 'rise', x: 380, y: 420, w: 200, h: 291, dl: 0.3, html: img('k06-notebook', 200, 291) });
// scene 3 — the store, a Draft tag swinging from the awning
piece({ sc: 2, d: 1, how: 'rise', x: -40, y: 620, w: 1040, h: 240, html: svg(1040, 240, '<path d="M0 90 Q260 20 520 80 T1040 60 V240 H0Z" fill="#AFC3A5"/>') });
piece({ sc: 2, d: 2, how: 'wing', from: 1, x: 150, y: 150, w: 660, h: 670, html: svg(660, 670, `
  <rect x="20" y="60" width="620" height="610" fill="#FBF6EA"/><rect x="0" y="0" width="660" height="78" rx="8" fill="#1F1F1F"/>
  <text x="330" y="54" text-anchor="middle" font-family="Playfair Display" font-weight="800" font-size="44" fill="#FBF1DC">Your store</text>
  ${Array.from({ length: 11 }, (_, i) => `<path d="M${i * 60} 78 h60 v56 q-30 26 -60 0z" fill="${i % 2 ? '#FBF1DC' : '#E8603C'}"/>`).join('')}
  <rect x="60" y="180" width="380" height="330" rx="10" fill="#E7EFE2" stroke="#1F1F1F" stroke-width="5"/><rect x="60" y="400" width="380" height="10" fill="#B48A5A"/>
  <rect x="480" y="230" width="120" height="440" rx="8" fill="#7E9A7E" stroke="#1F1F1F" stroke-width="5"/><circle cx="500" cy="460" r="7" fill="#1F1F1F"/>`) });
piece({ sc: 2, d: 3, how: 'wing', from: 1, x: 225, y: 414, w: 210, h: 140, dl: 0.15, html: `<div style="display:flex;align-items:flex-end;gap:10px">${img('k06-notebook', 92, 134)}${img('k08-greeting-card', 76, 131)}</div>` });
piece({ sc: 2, d: 3, how: 'wing', from: 1, x: 455, y: 437, w: 120, h: 113, dl: 0.2, html: img('k01-mug', 120, 113) });
const dtag = piece({ sc: 2, d: 3, how: 'drop', one: true, x: 640, y: 250, w: 150, h: 96, dl: 1.15, html: `<div style="width:150px;height:96px;border-radius:12px 12px 12px 12px;background:#DFFF5A;box-shadow:inset 0 0 0 4px #1F1F1F;display:grid;place-items:center;font:800 36px Archivo;color:#1F1F1F">Draft</div>` });
// scene 4 — the partner's press: rollers turn, cards come out
piece({ sc: 3, d: 2, how: 'wing', from: -1, x: 120, y: 300, w: 520, h: 520, html: svg(520, 520, `
  <rect x="30" y="120" width="460" height="400" rx="20" fill="#3F5A6B"/><rect x="60" y="150" width="400" height="120" rx="12" fill="#2C4250"/>
  <rect x="0" y="470" width="520" height="50" rx="10" fill="#2C4250"/><rect x="200" y="20" width="120" height="110" rx="12" fill="#2C4250"/>
  <circle cx="400" cy="380" r="34" fill="#E8603C"/><rect x="80" y="330" width="200" height="22" rx="11" fill="#FBF1DC" opacity=".6"/>`) });
const rollers = [0, 1].map((i) => piece({ sc: 3, d: 3, how: 'wing', from: -1, x: 170 + i * 150, y: 335, w: 120, h: 120, html: svg(120, 120, `<g class="rot"><circle cx="60" cy="60" r="56" fill="#C9A45E" stroke="#1F1F1F" stroke-width="5"/>${[0, 60, 120].map((a) => `<line x1="60" y1="60" x2="${60 + 50 * Math.cos(a * Math.PI / 180)}" y2="${60 + 50 * Math.sin(a * Math.PI / 180)}" stroke="#1F1F1F" stroke-width="5" transform="rotate(0)"/><line x1="60" y1="60" x2="${60 - 50 * Math.cos(a * Math.PI / 180)}" y2="${60 - 50 * Math.sin(a * Math.PI / 180)}" stroke="#1F1F1F" stroke-width="5"/>`).join('')}<circle cx="60" cy="60" r="10" fill="#1F1F1F"/></g>`) }));
const outs = [0, 1, 2].map((i) => piece({ sc: 3, d: 3, how: 'none', x: 560, y: 520 - i * 8, w: 118, h: 203, html: img('k08-greeting-card', 118, 203) }));
piece({ sc: 3, d: 3, how: 'drop', one: true, x: 600, y: 90, w: 300, h: 120, dl: 0.35, html: `<div style="width:300px;height:120px;border-radius:14px;background:#FBF6EA;box-shadow:inset 0 0 0 4px #1F1F1F;display:grid;place-items:center;text-align:center;font:800 34px/1.0 'Playfair Display';color:#1F1F1F">Your print<br>partner</div>` });
// scene 5 — the parcel crosses the hills
piece({ sc: 4, d: 1, how: 'rise', x: -40, y: 470, w: 1040, h: 400, html: svg(1040, 400, '<path d="M0 150 Q220 40 460 130 T1040 100 V400 H0Z" fill="#9DB894"/><path d="M0 260 Q300 170 620 240 T1040 220 V400 H0Z" fill="#7E9A7E"/>') });
piece({ sc: 4, d: 2, how: 'wing', from: 1, x: 690, y: 430, w: 250, h: 330, html: svg(250, 330, '<path d="M10 120 L125 20 L240 120Z" fill="#E8603C"/><rect x="30" y="118" width="190" height="212" fill="#FBF6EA"/><rect x="100" y="210" width="60" height="120" rx="6" fill="#7E9A7E" stroke="#1F1F1F" stroke-width="4"/><rect x="50" y="150" width="44" height="44" rx="4" fill="#CFE2E8" stroke="#1F1F1F" stroke-width="4"/>') });
const road = piece({ sc: 4, d: 2, how: 'rise', x: -40, y: 740, w: 1040, h: 90, html: svg(1040, 90, `<rect width="1040" height="90" fill="#5C5650"/>${Array.from({ length: 12 }, (_, i) => `<rect x="${i * 90 + 20}" y="40" width="50" height="8" rx="4" fill="#FBF1DC"/>`).join('')}`) });
const van = piece({ sc: 4, d: 3, how: 'none', x: -380, y: 560, w: 330, h: 230, html: `<div style="position:relative;width:330px;height:230px">${svg(330, 230, '<rect x="10" y="80" width="230" height="110" rx="12" fill="#FBF6EA" stroke="#1F1F1F" stroke-width="5"/><path d="M240 110 H290 L320 150 V190 H240Z" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="5"/><rect x="255" y="122" width="34" height="26" rx="4" fill="#CFE2E8" stroke="#1F1F1F" stroke-width="4"/><text x="125" y="146" text-anchor="middle" font-family="IBM Plex Mono" font-size="20" font-weight="600" fill="#1F1F1F">PRINTED PER ORDER</text>')}${[60, 260].map((x) => `<div class="wh" style="position:absolute;left:${x - 30}px;top:166px;width:60px;height:60px;border-radius:50%;background:#1F1F1F;box-shadow:inset 0 0 0 12px #3A3631"><i style="position:absolute;left:27px;top:6px;width:6px;height:48px;background:#8A8378"></i></div>`).join('')}<div style="position:absolute;left:52px;top:-34px">${img('k11-parcel', 140, 140)}</div></div>` });
const wheels = [...van.el.querySelectorAll('.wh')];

// ---------- type ----------
const kick = K.box(65, L.kickY, W - 130, null, { cls: 'kick', html: 'Tonight · a paper theatre' });
const CAPS = [
  { a: 0.5, b: 2.6, t: 'Tonight:\n<em>your idea.</em>' },
  { a: 3.15, b: 5.3, t: 'You check\n<em>every file.</em>' },
  { a: 5.7, b: 7.95, t: 'It waits as\na <em>draft.</em>', sub: 'in your own store · live only on your yes' },
  { a: 8.45, b: 10.35, t: 'Printed\n<em>per order.</em>', sub: 'by your own print partner · paid from your partner account' },
  { a: 11.15, b: 12.85, t: 'And off\n<em>it goes.</em>' },
];
const caps = CAPS.map((c) => {
  const el = K.box(65, L.capY, W - 130, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' } });
  const ws = K.words(el, c.t.replace(/<em>(.*?)<\/em>/g, (m, x) => x.split(' ').map((w) => '<em>' + w + '</em>').join(' ')));
  const sub = c.sub ? K.box(65, L.subY, W - 130, null, { cls: 'sub', html: c.sub }) : null;
  return { el, ws, sub, c };
});
const tag = K.demoTag('Concept products · AI-generated', 0, L.tagY); tag.classList.add('dk');
K.box(0, 0, W, H, { cls: 'paperN' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Your idea,<br>on every stage.' });

K.run({
  id: 'G10', title: 'Paper Theatre', dur: DUR, bpm: BPM, music: 'a-small-town-on-pluto', mood: 'bright', key: 'C', intro: 0.0, cover: 6.6,
  technique: 'A toy paper-cut theatre in CSS/SVG: red proscenium, a valance that carries the captions, footlights and an audience of paper heads; each scene is built from paper flats on four depth planes with drop shadows and 2.5D parallax under a drifting camera, entering from the fly on strings, from the wings, or up through the floor slot on sticks with paper springiness; velvet curtains open and close on the beat',
  caption: 'Your idea takes the stage: you check every file, it waits in your own store as a draft until your yes, and your own print partner prints each order — paid from your partner account — before it is shipped to the buyer. Products shown are concept images. Start free at makeandlist.com',
  short: 'Your idea, on every stage.',
  question: 'How does it work?', gain: 'The whole flow: idea, files, store, print, parcel',
  vo: VO,
  beats: ['0–2.7 s: the curtains open on a night set — a lightbulb rises, a thought card drops: “a lemon notebook, for summer”', '2.7–5.4 s: pages drop on strings and get ticked; the notebook rises — you check every file', '5.4–8.1 s: a paper shopfront slides in, a Draft tag swings from the awning — it waits as a draft', '8.1–10.4 s: the print partner’s press, rollers turning, cards coming out — printed per order, paid from your partner account', '10.4–12.5 s: a van carries the parcel across the hills to a house — and off it goes; the curtains close', '13–15 s: end card'],
  cues: [[0.0, 'swish'], [0.75, 'pop'], [1.25, 'paper'], ...C.slice(1, 5).flatMap((c) => [[+(c - 0.3).toFixed(3), 'swish'], [c, 'paper']]), [4.6, 'pop'], [7.55, 'pop'], [8.3, 'printer'], [9.4, 'paper'], [10.65, 'whoosh'], [11.1, 'box'], [CLOSE, 'swish'], [12.85, 'chime'], [13.0, 'hit']],
}, (T) => {
  // camera: a slow parallax drift, a gentle push into each scene
  const sc = C.findIndex((c, i) => T >= c && T < C[i + 1]);
  const camX = Math.sin(T * 0.45) * 22 + K.k(T, [[0, -20], [13, 20]], E.linear);
  const push = 1 + 0.035 * K.clamp((T - C[sc]) / (C[sc + 1] - C[sc] || 1));
  inner.style.transform = `scale(${s * push})`;
  inner.style.transformOrigin = `50% 70%`;
  LY.forEach((l, d) => { l.style.transform = `translateX(${camX * (d - 1.2) * 0.9}px)`; });

  P.forEach((p) => {
    const inP = K.clamp((T - p.a) / 0.75), outP = K.p(T, p.b - 0.38, p.b - 0.02, E.inCubic);
    const vis = T >= p.a - 0.01 && T < p.b;
    p.el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) return;
    let tx = 0, ty = 0, rot = 0;
    if (p.how === 'drop') { ty = -(1 - E.spring(inP)) * 1000 - outP * 1000; rot = Math.sin(T * 2.2 + p.x) * 1.2 * (p.one ? 2 : 0.6); }
    if (p.how === 'wing') { tx = p.from * (1 - E.outBack(K.clamp(inP * 1.3))) * 1100 + p.from * outP * 1100; }
    if (p.how === 'rise') { ty = (1 - E.outBack(K.clamp(inP * 1.2))) * 700 + outP * 700; rot = (1 - K.clamp(inP * 1.2)) * 4; }
    p.el.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
    p.el.style.transformOrigin = p.how === 'drop' ? '50% -200px' : '50% 100%';
  });
  // details
  const glow = bulb.el.querySelector('.glow'); glow.style.opacity = 0.55 + 0.45 * Math.abs(Math.sin(T * 3)) * K.p(T, 0.8, 1.2, E.linear);
  ticks.forEach((t, i) => { const q = K.p(T, 3.55 + i * 0.28, 3.85 + i * 0.28, E.outBack); t.style.transform = `scale(${q}) rotate(${(1 - q) * -40}deg)`; });
  dtag.el.style.transform += ` rotate(${Math.sin((T - dtag.a) * 5) * 10 * Math.exp(-(T - dtag.a) * 0.9)}deg)`;
  rollers.forEach((r) => { const g = r.el.querySelector('.rot'); g.setAttribute('transform', `rotate(${(T - C[3]) * 260} 60 60)`); });
  outs.forEach((o, i) => {
    const a = C[3] + 0.6 + i * 0.5, p = K.p(T, a, a + 0.5, E.outCubic);
    o.el.style.visibility = T >= a && T < C[4] ? 'visible' : 'hidden';
    o.el.style.transform = `translate(${-200 + p * (140 + i * 26)}px, ${(1 - p) * -150}px) rotate(${(1 - p) * -30 + i * 4}deg) scale(${0.4 + 0.6 * p})`;
    o.el.style.opacity = K.p(T, a, a + 0.1, E.linear) * (1 - K.p(T, C[4] - 0.35, C[4], E.linear));
  });
  const vp = K.p(T, C[4] + 0.15, C[4] + 1.5, E.outCubic);
  van.el.style.visibility = T >= C[4] && T < CLOSE + 0.6 ? 'visible' : 'hidden';
  van.el.style.transform = `translate(${vp * 760}px, ${Math.abs(Math.sin(T * 14)) * -5 * (1 - K.p(T, C[4] + 1.3, C[4] + 1.5)) }px)`;
  wheels.forEach((w) => { w.style.transform = `rotate(${vp * 760 / 30 * 57.3}deg)`; });
  road.el.style.zIndex = 0;

  // curtains open on the downbeat and close on the beat before the end card
  const open = K.p(T, 0.1, 1.25, E.inOutCubic) * (1 - K.p(T, CLOSE, CLOSE + 0.5, E.inOutCubic));
  curtains.forEach((c, i) => { c.style.transform = `translateX(${(i ? 1 : -1) * open * (BW / 2 - 30)}px) scaleX(${1 - 0.72 * open})`; c.style.transformOrigin = i ? '100% 50%' : '0 50%'; });
  foots.forEach((f, i) => { f.style.opacity = K.p(T, 0, 0.6, E.linear) * (0.75 + 0.25 * Math.sin(T * 5 + i)); });
  heads.forEach((h, i) => { const bob = Math.max(0, Math.sin((T / BEAT + i * 0.37) * Math.PI)) * 6; h.setAttribute('transform', `translate(0 ${-bob})`); });

  // ---------- type ----------
  kick.style.opacity = tall ? K.p(T, 0.1, 0.4, E.linear) * (1 - K.p(T, 12.6, 12.9, E.linear)) : 0;
  caps.forEach(({ el, ws, sub, c }) => {
    const vis = T >= c.a - 0.02 && T < c.b + 0.02;
    el.style.visibility = vis ? 'visible' : 'hidden';
    if (sub) sub.style.opacity = vis ? K.p(T, c.a + 0.5, c.a + 0.9, E.linear) * (1 - K.p(T, c.b - 0.25, c.b, E.linear)) : 0;
    if (!vis) return;
    K.reveal(ws, T, c.a, { kind: 'drop', stagger: 0.08, dur: 0.5, ease: E.outBack });
    el.style.opacity = 1 - K.p(T, c.b - 0.22, c.b, E.inCubic);
  });
  tag.style.left = BX + 40 + 'px';
  tag.style.opacity = K.p(T, 1.2, 1.6, E.linear) * (1 - K.p(T, 12.5, 12.9, E.linear));
  end(T);
});
</script></body></html>
