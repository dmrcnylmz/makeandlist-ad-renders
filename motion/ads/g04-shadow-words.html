<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G04 · Shadow Words</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #E8DFD1; }
.wall { position: absolute; inset: 0; }
.world { position: absolute; left: 0; top: 0; }
.win { position: absolute; pointer-events: none; mix-blend-mode: soft-light; }
.ledge { position: absolute; }
.pr { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; }
.pr img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.pr .lt { filter: brightness(1.25) saturate(1.05); }
.csh { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(60,40,22,.55), rgba(60,40,22,0)); }
.sil { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; z-index: 1; }
.pr, .csh { z-index: 5; }
.sil img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; filter: brightness(0); }
.word { position: absolute; left: 0; top: 0; z-index: 2; transform-origin: 50% 100%; white-space: nowrap; font: 800 170px/0.9 'Playfair Display'; letter-spacing: -0.03em; color: rgba(62,46,30,.62); }
.word i { font-weight: 600; }
.kick { position: absolute; z-index: 60; font: 500 21px 'IBM Plex Mono', monospace; letter-spacing: .26em; text-transform: uppercase; color: rgba(69,64,58,.75); text-align: center; white-space: nowrap; }
.sub { position: absolute; z-index: 60; text-align: center; font: 500 30px/1.32 'Archivo'; color: #3A342D; }
.sub b { font-weight: 700; color: #1F1F1F; background: linear-gradient(transparent 62%, rgba(223,255,90,.9) 62%); }
.chip2 { position: absolute; z-index: 61; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 14px; border-radius: 999px; white-space: nowrap;
  background: rgba(255,253,248,.85); border: 1px solid rgba(31,31,31,.12); box-shadow: 0 20px 40px -24px rgba(60,40,20,.45); font: 500 23px 'IBM Plex Mono', monospace; letter-spacing: .03em; color: #1F1F1F; }
.chip2 s { text-decoration: none; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #E8A33C; box-shadow: 0 0 0 5px rgba(232,163,60,.22); }
.mote { position: absolute; left: 0; top: 0; border-radius: 50%; background: rgba(255,250,236,.95); }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .08; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// G04 — Shadow Words. A plaster wall, an oak ledge, low afternoon light raking in from the left. Two products stand on
// the ledge; as the sun sinks their shadows stretch up the wall and resolve into the two words of the message — Made /
// once. — then the camera trucks along the ledge: No / stock. — Your / yes. Music-led; the small line under each pair
// tells the honest fact (drafts first, printed per order by your own partner and paid from your partner account).
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 76, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const SZ = { 'k01-mug': [852, 804], 'k02-framed-print': [608, 897], 'k05-tote': [595, 961], 'k09-kids-book': [656, 926], 'k06-notebook': [634, 923], 'k08-greeting-card': [540, 928] };

const L = tall ? { ledge: 1170, wordB: 640, fs: 178, subY: 336, kickY: 286, chipY: 1214, tagY: 1214, k: 1.3 }
  : { ledge: 1010, wordB: 470, fs: 150, subY: 92, kickY: 40, chipY: 1090, tagY: 1256, k: 1.12 };
const SEP = W * 1.15; // the ledge is long; each pair stands one frame apart
// pairs: [file, height, x as a fraction of the frame], words, sub line, morph start
const G = [
  { items: [['k02-framed-print', 400, 0.3], ['k01-mug', 250, 0.72]], words: ['Made', '<i>once.</i>'], m: 0.45, sub: 'One design, made into files, images and a listing —<br><b>a draft for you to review.</b>' },
  { items: [['k05-tote', 420, 0.3], ['k09-kids-book', 340, 0.72]], words: ['No', '<i>stock.</i>'], m: 5.0, sub: 'Printed per order by <b>your own print partner,</b><br>paid from your partner account.' },
  { items: [['k06-notebook', 360, 0.3], ['k08-greeting-card', 330, 0.7]], words: ['Your', '<i>yes.</i>'], m: 9.55, sub: 'Nothing goes live, and nothing is sent to print,<br><b>until you approve it.</b>' },
];
const TRUCK = [[4.05, 4.8], [8.6, 9.35]];

// ---------- wall, light, ledge ----------
K.box(0, 0, W, H, { cls: 'wall', style: { background: 'linear-gradient(100deg, #F3EADC 0%, #EADFCD 45%, #DCCFBB 100%)' } });
const plaster = K.box(0, 0, W, H, { cls: 'wall', style: { opacity: 0.5, mixBlendMode: 'multiply', backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4'/><feColorMatrix values='0 0 0 0 .86  0 0 0 0 .82  0 0 0 0 .76  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>\")" } });
const winA = K.box(-W * 0.4, 0, W * 0.9, H, { cls: 'win', style: { background: 'linear-gradient(90deg, rgba(255,236,200,0), rgba(255,236,200,.95) 45%, rgba(255,236,200,0))', filter: 'blur(40px)' } });
const winB = K.box(0, 0, W * 0.5, H, { cls: 'win', style: { background: 'linear-gradient(90deg, rgba(255,236,200,0), rgba(255,236,200,.8) 50%, rgba(255,236,200,0))', filter: 'blur(50px)' } });
// a window's light on the plaster: a warm skewed pane with two soft mullion shadows
const pane = K.box(0, 0, W * 0.95, L.ledge * 0.95, { style: { pointerEvents: 'none', background: 'linear-gradient(180deg, rgba(255,240,210,.0), rgba(255,240,210,.55) 30%, rgba(255,240,210,.5) 80%, rgba(255,240,210,0))', filter: 'blur(18px)', mixBlendMode: 'screen' } });
const mull = [0, 1].map((i) => K.box(0, 0, 36, L.ledge * 1.1, { style: { pointerEvents: 'none', background: 'rgba(110,84,56,.16)', filter: 'blur(14px)' } }));
const mullH = K.box(0, 0, W * 0.95, 30, { style: { pointerEvents: 'none', background: 'rgba(110,84,56,.12)', filter: 'blur(14px)' } });
K.box(0, L.ledge + 86, W, H - L.ledge - 86, { style: { background: 'linear-gradient(180deg, rgba(150,120,88,.18), rgba(110,84,56,.34))' } });
const world = K.box(0, 0, SEP * 3, H, { cls: 'world' });
K.box(-200, L.ledge - 4, SEP * 3 + 400, 34, { cls: 'ledge', parent: world, style: { background: 'linear-gradient(180deg, #D7B98F, #C9A574 60%, #B48D5E)', boxShadow: '0 30px 50px -20px rgba(60,40,22,.45)' } });
K.box(-200, L.ledge + 30, SEP * 3 + 400, 56, { cls: 'ledge', parent: world, style: { background: 'linear-gradient(180deg, #A87F51, #8E6942 70%, #7A5938)' } });
K.box(-200, L.ledge + 86, SEP * 3 + 400, 120, { cls: 'ledge', parent: world, style: { background: 'linear-gradient(180deg, rgba(60,40,22,.35), rgba(60,40,22,0))' } });

const groups = G.map((g, gi) => {
  const its = g.items.map(([file, h, fx], k) => {
    h *= L.k; const [nw, nh] = SZ[file], w = h * nw / nh, x = gi * SEP + fx * W;
    const sil = K.box(0, 0, w, h, { cls: 'sil', parent: world, html: `<img src="${K.pub('r07/' + file + '.webp')}">` });
    const csh = K.box(x - w * 0.55, L.ledge - w * 0.06, w * 1.1, w * 0.14, { cls: 'csh', parent: world });
    const pr = K.box(x - w / 2, L.ledge - h, w, h, { cls: 'pr', parent: world, html: `<img src="${K.pub('r07/' + file + '.webp')}"><img class="lt" src="${K.pub('r07/' + file + '.webp')}">` });
    const lt = pr.querySelector('.lt');
    const word = K.box(0, 0, null, null, { cls: 'word', parent: world, html: g.words[k], style: { width: 'auto', height: 'auto', fontSize: L.fs + 'px' } });
    return { sil, csh, pr, lt, word, x, w, h, k };
  });
  g.base = gi * SEP;
  const sub = K.box(65, L.subY, W - 130, null, { cls: 'sub', html: g.sub });
  return { its, sub, g, gi };
});
const motes = Array.from({ length: 22 }, (_, i) => K.box(0, 0, 3 + seed(i) * 5, 3 + seed(i) * 5, { cls: 'mote' }));

// ---------- type ----------
const kick = K.box(65, L.kickY, W - 130, null, { cls: 'kick', html: 'Product film Nº 04 · shadow words' });
const chip = K.box(0, L.chipY, null, null, { cls: 'chip2', html: '<s></s>Draft · waiting for your yes', style: { width: 'auto', height: 'auto' } });
const tag = K.demoTag('Concept products · AI-generated', 0, 0);
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Made once. No stock.<br>Your yes.' });

K.run({
  id: 'G04', title: 'Shadow Words', dur: DUR, bpm: BPM, music: 'letting-go-of-the-past', mood: 'calm', key: 'D', intro: 0.0, cover: 2.4,
  technique: 'Raking-light still life: cut-out products on an oak ledge against a plaster wall; each product casts a silhouette shadow (a blackened, blurred, skewed copy) that stretches up the wall as the window light drifts and dissolves into a word set as a soft shadow; the camera trucks along the ledge between three pairs',
  caption: 'Made once. No stock. Your yes. Each product is a draft for you to review; printed ones are printed per order by your own print partner and paid from your partner account, and nothing goes live or to print until you approve it. Products shown are concept images. Start free at makeandlist.com',
  short: 'Made once. No stock. Your yes.',
  question: 'Can I trust it?', gain: 'Control and no stock',
  beats: ['0–4 s: a framed print and a mug on an oak ledge; their shadows stretch up the wall into “Made once.” — a draft for you to review', '4–4.8 s: the camera trucks along the ledge', '4.8–8.6 s: a tote and a colouring book: “No stock.” — printed per order by your own partner, paid from your partner account', '8.6–9.4 s: truck', '9.4–13 s: a notebook and a card: “Your yes.” — nothing live or sent to print until you approve (Draft · waiting for your yes)', '13–15 s: end card'],
  cues: [[0.0, 'swish'], [B(2), 'paper'], [B(3), 'paper'], [B(5), 'pop'], [4.0, 'whoosh'], [B(7), 'paper'], [B(8), 'paper'], [B(9.5), 'pop'], [8.55, 'whoosh'], [B(13), 'paper'], [B(14), 'paper'], [11.6, 'pop'], [13.0, 'chime']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  // camera truck along the ledge (with a breath of drift on the holds)
  let X = T * 6;
  TRUCK.forEach(([a, b]) => { X += SEP * K.p(T, a, b, E.inOutCubic); });
  const vel = Math.abs(TRUCK.reduce((s, [a, b]) => s + SEP * (K.p(T + 1 / 30, a, b, E.inOutCubic) - K.p(T, a, b, E.inOutCubic)), 0));
  world.style.transform = `translateX(${-X}px)`;
  world.style.filter = vel > 6 ? `blur(${Math.min(10, vel / 14).toFixed(1)}px)` : 'none';

  // window light drifts as the sun sinks within each pair; the light angle drives the shadows
  const gi = T < 4.4 ? 0 : T < 8.95 ? 1 : 2;
  const local = T - (gi === 0 ? 0 : TRUCK[gi - 1][1]);
  winA.style.transform = `translateX(${local * 40 + Math.sin(T * 0.3) * 20}px)`; winA.style.opacity = 0.75 + 0.2 * Math.sin(T * 0.5);
  winB.style.transform = `translateX(${W * 0.55 + local * 30}px)`; winB.style.opacity = 0.45;
  const px = W * 0.06 + local * 22 + Math.sin(T * 0.25) * 14;
  pane.style.transform = `translate(${px}px, ${L.ledge * 0.04}px) skewX(-16deg)`; pane.style.opacity = 0.8;
  mull.forEach((mm, i) => { mm.style.transform = `translate(${px + W * (0.32 + 0.3 * i)}px, ${-L.ledge * 0.02}px) skewX(-16deg)`; });
  mullH.style.transform = `translate(${px}px, ${L.ledge * 0.42}px) skewX(-16deg)`;
  plaster.style.transform = `translateX(${-X * 0.15 % 400}px)`;

  groups.forEach(({ its, sub, g, gi: n }) => {
    its.forEach((it) => {
      const m = K.p(T, g.m + it.k * 0.22, g.m + 1.25 + it.k * 0.22, E.inOutCubic); // shadow → word
      const pre = K.p(T, g.m - 1.2, g.m + 0.2, E.inOutCubic); // the shadow lengthens before it turns
      // silhouette shadow: offset right and up the wall, skewed by the low light
      const sx = 40 + 70 * pre, sy = -14 - 120 * m, sk = -10 - 16 * pre, scy = 1.02 + 0.28 * pre + 0.25 * m;
      it.sil.style.transform = `translate(${it.x - it.w / 2 + sx}px, ${L.ledge - it.h + sy}px) skewX(${sk}deg) scaleY(${scy})`;
      it.sil.style.opacity = 0.3 * (1 - m);
      it.sil.style.filter = `blur(${(3 + 4 * pre + 14 * m).toFixed(1)}px)`;
      // the word: a soft shadow on the wall above the product
      // the pair of words is set as one line, centred in its frame (scaled down if it would not fit)
      const w0 = its[0].word.offsetWidth, w1 = its[1].word.offsetWidth, gap = L.fs * 0.28, tot = w0 + gap + w1;
      const fit = Math.min(1, (W - 150) / tot);
      const ww = it.word.offsetWidth;
      const left0 = g.base + W / 2 - tot * fit / 2;
      const wx = (it.k ? left0 + (w0 + gap) * fit : left0) - ww * (1 - fit) / 2, wy = L.wordB - it.word.offsetHeight;
      it.word.style.transform = `translate(${wx + (1 - m) * 40}px, ${wy + (1 - m) * 60}px) skewX(${-12 * (1 - m) - 6}deg) scale(${fit * (0.92 + 0.08 * m)})`;
      it.word.style.opacity = 0.95 * m;
      it.word.style.filter = `blur(${(1.4 + 16 * (1 - m)).toFixed(1)}px)`;
      // the product: warm light from the left (a lit copy behind a gradient mask)
      const c = 30 + 20 * Math.sin(T * 0.4 + it.k);
      it.lt.style.webkitMaskImage = `linear-gradient(100deg, #000 0, rgba(0,0,0,.6) ${c}%, rgba(0,0,0,0) ${c + 40}%)`;
      it.lt.style.opacity = 0.55 + 0.25 * pre;
      it.pr.style.transform = `translateY(${Math.sin(T * 0.6 + it.k) * 0.8}px)`;
    });
    const sa = g.m + 1.35, sb = n === 2 ? 12.9 : TRUCK[n][0] + 0.05;
    const p = K.p(T, sa, sa + 0.6, E.outCubic), o = K.p(T, sb - 0.3, sb, E.inCubic);
    sub.style.opacity = p * (1 - o); sub.style.transform = `translateY(${(1 - p) * 16}px)`;
  });

  motes.forEach((m, i) => {
    const x = (seed(i + 11) * W * 0.8 + Math.sin(T * 0.3 + i) * 40), y = ((seed(i + 17) * H - T * (5 + seed(i + 5) * 10)) % H + H) % H;
    m.style.transform = `translate(${x}px, ${y}px)`; m.style.zIndex = 50;
    m.style.opacity = (0.2 + 0.5 * seed(i + 23)) * (0.5 + 0.5 * Math.sin(T * 1.1 + i * 2));
  });

  kick.style.opacity = 0.9 * K.win(T, 0.2, 1.7, 0.35);
  const cp = K.win(T, 11.6, 12.9, 0.3);
  chip.style.left = (W - chip.offsetWidth) / 2 + 'px'; chip.style.opacity = cp; chip.style.transform = `scale(${0.9 + 0.1 * K.p(T, 11.6, 12.0, E.outBack)})`;
  tag.style.left = (tall ? 65 : 60) + 'px'; tag.style.top = L.tagY + 'px';
  tag.style.opacity = 0.95 * K.p(T, 0.6, 1.0, E.linear) * (1 - (tall ? cp : 0)) * (1 - K.p(T, 12.6, 13, E.linear));

  end(T);
});
</script></body></html>
