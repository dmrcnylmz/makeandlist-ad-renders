<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>G11 · Three Rooms</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #201C19; }
.bgx { position: absolute; inset: 0; background: radial-gradient(80% 55% at 50% 60%, #3A332D 0%, #221E1B 60%, #171412 100%); }
.world { position: absolute; width: 0; height: 0; transform-style: preserve-3d; }
.room { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.room > div { position: absolute; }
.wallB, .wallS, .flr { backface-visibility: visible; }
.slab { background: linear-gradient(180deg, #5B4636, #3E2F24); }
.bb { position: absolute; transform-style: preserve-3d; }
.bb > * { position: absolute; }
.cs { border-radius: 50%; background: radial-gradient(closest-side, rgba(40,25,12,.55), rgba(40,25,12,0)); }
.glow { border-radius: 50%; pointer-events: none; }
.mon { border-radius: 14px; background: #1F1F1F; padding: 10px; box-shadow: 0 20px 30px -16px rgba(0,0,0,.6); }
.mon .scr { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 6px; background: #FAF7EE; }
.mon .scr img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.kick { position: absolute; z-index: 40; text-align: center; font: 600 21px 'IBM Plex Mono', monospace; letter-spacing: .26em; text-transform: uppercase; color: #E9DCC4; white-space: nowrap; }
.kick b { color: #DFFF5A; font-weight: 600; }
.cap { position: absolute; z-index: 40; text-align: center; font: 800 80px/1.02 'Playfair Display'; letter-spacing: -0.02em; color: #FBF5EA; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
.cap em { font-style: italic; color: #DFFF5A; }
.sub { position: absolute; z-index: 40; text-align: center; font: 500 22px/1.45 'IBM Plex Mono', monospace; letter-spacing: .05em; color: rgba(251,245,234,.88); }
.mote { position: absolute; border-radius: 50%; background: rgba(255,244,222,.9); z-index: 20; pointer-events: none; }
.demo.dk { background: rgba(30,26,22,.72); color: rgba(255,253,248,.88); border-color: rgba(255,253,248,.4); }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .08; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// G11 — Three Rooms. Three cut-away dioramas side by side in real CSS 3D (back wall, floor and side walls in
// perspective, a wooden cross-section slab at the front, props as standing cut-outs at depth with contact shadows),
// lit three ways: the seller's desk at golden hour, the print partner's cool print room, a buyer's sunny living room.
// One camera move: it opens wide on all three like a dollhouse, pushes into the desk (the real create screen on the
// monitor, the protea design leaning on it), pulls back and trucks into the print room (a light bar prints the same
// protea, garments on a rail, parcels stacked), then trucks into the home, where the print hangs on the wall and the
// opened parcel sits on the floor. One product, three rooms. Narrated.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 107.7, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Voice — speech windows: L1 0.60–1.16 / 1.78–2.22 · L2 2.85–5.12 · L3 6.49–8.94 · L4 10.20–11.97. The camera's
// moves between rooms happen in the breaths.
const VO = [[0.3, 'One product. Three rooms.'], [2.55, 'At your desk, you describe it and approve it.'], [5.55, "At your partner's, it's printed when someone orders."], [9.4, "Then it arrives in a buyer's home."]];

const RW = 1000, RH = tall ? 1150 : 880, RD = 820, RS = RW * 1.1;
const L = tall
  ? { FY: 1690, kickY: 284, capY: 324, capFs: 80, subY: 500, tagY: 1206 }
  : { FY: 1300, kickY: 56, capY: 92, capFs: 66, subY: 238, tagY: 1282 };
const OY = L.FY - RH * 0.46, PERSP = 1300;

K.box(0, 0, W, H, { cls: 'bgx' });
const persp = K.box(0, 0, W, H, { style: { perspective: PERSP + 'px', perspectiveOrigin: `${W / 2}px ${OY}px` } });
const world = K.el('div', { parent: persp, cls: 'world', style: { left: W / 2 + 'px', top: L.FY + 'px' } });

const ROOMS = [
  { wall: 'linear-gradient(180deg, #E7CFAE 0%, #DDBE97 100%)', floor: 'linear-gradient(0deg, #9C7650, #7A5A3C)', side: '#D2B188', light: 'rgba(255,196,120,.55)' },
  { wall: 'linear-gradient(180deg, #DCE4E7 0%, #C9D3D8 100%)', floor: 'linear-gradient(0deg, #9AA3A6, #7D878B)', side: '#C3CDD1', light: 'rgba(220,240,255,.45)' },
  { wall: 'linear-gradient(180deg, #CBD8C4 0%, #B8C9B0 100%)', floor: 'linear-gradient(0deg, #C9A57C, #A9845D)', side: '#BCCDB4', light: 'rgba(255,236,190,.6)' },
];
const rooms = ROOMS.map((r, i) => {
  const g = K.el('div', { parent: world, cls: 'room', style: { transform: `translate3d(${i * RS}px, 0, 0)` } });
  const d = (st, html) => K.el('div', { parent: g, style: st, html });
  d({ left: -RW / 2 + 'px', top: -RH + 'px', width: RW + 'px', height: RH + 'px', background: r.wall, transform: `translateZ(${-RD}px)` });
  d({ left: -RW / 2 + 'px', top: 0, width: RW + 'px', height: RD + 'px', background: r.floor, transformOrigin: '50% 0', transform: 'rotateX(-90deg)' },
    `<div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 98px, rgba(0,0,0,.12) 98px 100px)"></div>`);
  [-1, 1].forEach((sd) => d({ left: sd * RW / 2 + 'px', top: -RH + 'px', width: RD + 'px', height: RH + 'px', background: `linear-gradient(90deg, ${r.side}, rgba(0,0,0,.25)), ${r.side}`, backgroundBlendMode: 'multiply', transformOrigin: '0 50%', transform: 'rotateY(90deg)' }));
  // the cut-away cross-section: a floor slab and two wall edges at the front
  [[-RW / 2 - 30, 0, RW + 60, 70], [-RW / 2 - 30, -RH, 30, RH], [RW / 2, -RH, 30, RH]].forEach(([l, t, w, h]) => { d({ left: l + 'px', top: t + 'px', width: w + 'px', height: h + 'px' }).className = 'slab'; });
  // light on the back wall and a pool on the floor
  const wl = d({ left: -RW / 2 + 'px', top: -RH + 'px', width: RW + 'px', height: RH + 'px', transform: `translateZ(${-RD + 2}px)`, background: `radial-gradient(60% 50% at 50% 40%, ${r.light}, rgba(0,0,0,0) 70%)` });
  return { g, wl };
});
// a standing cut-out at (x, z) in room i: bottom-centre anchored at height y above the floor
function bb(i, x, z, w, h, html, o = {}) {
  const el = K.el('div', { parent: rooms[i].g, cls: 'bb', style: { left: x - w / 2 + 'px', top: -(o.y || 0) - h + 'px', width: w + 'px', height: h + 'px', transform: `translateZ(${z}px)${o.rot ? ` rotate(${o.rot}deg)` : ''}` }, html });
  if (!o.noShadow && !o.y) K.el('div', { parent: rooms[i].g, cls: 'cs', style: { left: x - w * 0.6 + 'px', top: -w * 0.12 + 'px', width: w * 1.2 + 'px', height: w * 0.24 + 'px', transform: `translateZ(${z}px) rotateX(-90deg)` } });
  return el;
}
const im = (id, w, h, st = '') => `<img src="${K.pub('r07/' + id + '.webp')}" style="position:absolute;left:0;top:0;width:${w}px;height:${h}px;${st}">`;
const plane = (i, x, y, z, w, d, bg) => K.el('div', { parent: rooms[i].g, style: { left: x - w / 2 + 'px', top: -y + 'px', width: w + 'px', height: d + 'px', background: bg, transformOrigin: '50% 0', transform: `translateZ(${z}px) rotateX(-90deg)` } });
const kH = RH / 1150; // props scale with the room height

// ---------- room 1: the seller's desk, golden hour ----------
bb(0, -250, -RD + 4, 300 * kH + 40, 380 * kH, `<div style="position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#F6B979,#E8875A 70%,#B86A57);box-shadow:inset 0 0 0 14px #F4E6CF"></div><div style="position:absolute;left:50%;top:14px;bottom:14px;width:8px;margin-left:-4px;background:#F4E6CF"></div>`, { y: 560 * kH, noShadow: true });
const DESK = { y: 310 * kH, z: -430, w: 640 };
plane(0, 0, DESK.y, DESK.z + 150, DESK.w, 300, 'linear-gradient(0deg, #B98C5C, #A27648)');
bb(0, 0, DESK.z + 150, DESK.w, DESK.y, `<div style="position:absolute;left:0;right:0;top:0;height:46px;background:linear-gradient(180deg,#C49766,#9C7146);border-radius:4px"></div>${[18, DESK.w - 42].map((x) => `<div style="position:absolute;left:${x}px;top:46px;width:24px;bottom:0;background:#7A5638;border-radius:3px"></div>`).join('')}`);
const MON = { w: 470, h: 300 };
const mon = bb(0, 30, DESK.z + 20, MON.w, MON.h + 80, `<div class="mon" style="width:${MON.w}px;height:${MON.h}px"><div class="scr"><img src="${K.screen('32-create-composer')}"></div></div><div style="position:absolute;left:${MON.w / 2 - 14}px;top:${MON.h}px;width:28px;height:60px;background:#2A2A2A"></div><div style="position:absolute;left:${MON.w / 2 - 80}px;top:${MON.h + 56}px;width:160px;height:24px;border-radius:6px;background:#2A2A2A"></div>`, { y: DESK.y, noShadow: true });
const monImg = mon.querySelector('img');
{ const k = (MON.w - 20) / 1200; monImg.style.width = 1440 + 'px'; monImg.style.transform = `translate(${-240 * k}px, 0) scale(${k})`; }
bb(0, -260, DESK.z + 70, 140, 140 * 897 / 608, im('k02-framed-print', 140, 140 * 897 / 608), { y: DESK.y, rot: -6, noShadow: true });
bb(0, 260, DESK.z + 90, 120, 113, im('k01-mug', 120, 113), { y: DESK.y, noShadow: true });
bb(0, 360, DESK.z + 60, 96, 140, im('k06-notebook', 96, 140), { y: DESK.y, rot: 5, noShadow: true });
const lamp = bb(0, -330, DESK.z - 20, 160, 300, `<svg width="160" height="300" viewBox="0 0 160 300"><path d="M30 70 L130 70 L110 10 L50 10Z" fill="#1F1F1F"/><path d="M80 70 L80 280" stroke="#1F1F1F" stroke-width="8"/><ellipse cx="80" cy="288" rx="50" ry="10" fill="#1F1F1F"/></svg>`, { y: DESK.y, noShadow: true });
const lampGlow = K.el('div', { parent: rooms[0].g, cls: 'glow', style: { left: -330 - 260 + 'px', top: -DESK.y - 420 + 'px', width: '520px', height: '520px', background: 'radial-gradient(closest-side, rgba(255,205,130,.7), rgba(255,205,130,0))', transform: `translateZ(${DESK.z}px)` } });
bb(0, 400, -RD + 120, 170, 260, `<svg width="170" height="260" viewBox="0 0 170 260"><rect x="45" y="170" width="80" height="90" rx="10" fill="#C96B4B"/>${[[85, 70, 60], [50, 110, 45], [120, 105, 48], [85, 140, 40]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#6F8E68"/>`).join('')}</svg>`);

// ---------- room 2: the partner's print room ----------
bb(1, 0, -RD + 4, 760, 440 * kH, `<div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,#F4FAFC 0 120px,#9AA7AD 120px 128px),#F4FAFC;box-shadow:inset 0 0 0 10px #9AA7AD;opacity:.92"></div>`, { y: 480 * kH, noShadow: true });
bb(1, -250, -RD + 6, 380, 70, `<div style="position:absolute;inset:0;border-radius:10px;background:#1F1F1F;color:#FAF7EE;display:grid;place-items:center;font:800 34px 'Playfair Display'">Your print partner</div>`, { y: 950 * kH, noShadow: true });
const PRN = { w: 560, h: 260 * kH + 60, z: -380 };
bb(1, -60, PRN.z, PRN.w, PRN.h, `<div style="position:absolute;left:0;right:0;bottom:0;height:${PRN.h - 40}px;border-radius:18px;background:linear-gradient(180deg,#4A5F6C,#33444F)"></div><div style="position:absolute;left:40px;right:40px;top:0;height:60px;border-radius:10px;background:#2A3842"></div><div style="position:absolute;right:30px;top:80px;width:60px;height:24px;border-radius:12px;background:#DFFF5A"></div>`);
const bedP = plane(1, -60, PRN.h, PRN.z + 160, PRN.w - 80, 150, 'linear-gradient(0deg,#2A3842,#22303A)');
const printOut = bb(1, -60, PRN.z + 110, 200, 200 * 897 / 608, im('k02-framed-print', 200, 200 * 897 / 608), { y: PRN.h, noShadow: true });
const lightBar = bb(1, -60, PRN.z + 130, PRN.w - 60, 16, `<div style="position:absolute;inset:0;border-radius:8px;background:#DFFF5A;box-shadow:0 0 40px 14px rgba(223,255,90,.55)"></div>`, { y: PRN.h + 10, noShadow: true });
// garment rail and parcels
bb(1, 330, -RD + 200, 300, 520 * kH, `<div style="position:absolute;left:0;right:0;top:0;height:10px;border-radius:5px;background:#55616A"></div><div style="position:absolute;left:0;top:0;width:8px;bottom:0;background:#55616A"></div><div style="position:absolute;right:0;top:0;width:8px;bottom:0;background:#55616A"></div>${im('k03-tee', 150, 138, 'left:8px;top:12px')}${im('k04-hoodie', 150, 150, 'left:140px;top:12px')}`);
bb(1, 360, -180, 190, 190, im('k11-parcel', 190, 190));
bb(1, 250, -120, 150, 150, im('k11-parcel', 150, 150));
bb(1, -360, -160, 260, 164, im('k12-poster-tube', 260, 164));

// ---------- room 3: a buyer's home, morning sun ----------
const wallPrint = bb(2, -40, -RD + 6, 260, 260 * 897 / 608, im('k02-framed-print', 260, 260 * 897 / 608), { y: 520 * kH, noShadow: true });
bb(2, -40, -RD + 140, 640, 300, `<svg width="640" height="300" viewBox="0 0 640 300"><rect x="20" y="20" width="600" height="170" rx="40" fill="#E3D6C1"/><rect x="0" y="140" width="110" height="150" rx="40" fill="#D9C9AF"/><rect x="530" y="140" width="110" height="150" rx="40" fill="#D9C9AF"/><rect x="70" y="150" width="500" height="110" rx="26" fill="#EEE3D0"/><rect x="200" y="90" width="120" height="80" rx="20" fill="#E8603C" opacity=".85"/><rect x="40" y="270" width="16" height="30" fill="#6B4A30"/><rect x="584" y="270" width="16" height="30" fill="#6B4A30"/></svg>`);
bb(2, 380, -RD + 260, 140, 230, `<svg width="140" height="230" viewBox="0 0 140 230"><ellipse cx="70" cy="20" rx="66" ry="14" fill="#B9875B"/><rect x="62" y="20" width="16" height="200" fill="#8C643F"/><ellipse cx="70" cy="222" rx="40" ry="8" fill="#8C643F"/></svg>`);
bb(2, 380, -RD + 260, 110, 104, im('k01-mug', 110, 104), { y: 218, noShadow: true });
const parcelHome = bb(2, 150, -200, 230, 230, im('k11-parcel', 230, 230));
bb(2, 300, -150, 150, 242, im('k05-tote', 150, 242), { rot: 8 });
bb(2, -400, -RD + 150, 190, 330, `<svg width="190" height="330" viewBox="0 0 190 330"><rect x="55" y="230" width="80" height="100" rx="12" fill="#F4E6CF"/>${[[95, 70, 70], [50, 140, 55], [140, 135, 55], [95, 185, 50]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#5E8158"/>`).join('')}</svg>`);
const sun = K.el('div', { parent: rooms[2].g, style: { left: 120 + 'px', top: -RH + 'px', width: '360px', height: RH + 'px', transform: `translateZ(${-RD + 3}px) skewX(-18deg)`, background: 'linear-gradient(180deg, rgba(255,250,228,.42), rgba(255,250,228,.06))', filter: 'blur(14px)' } });

// ---------- atmosphere and type ----------
const scrim = K.box(0, 0, W, tall ? 640 : 330, { style: { zIndex: 30, pointerEvents: 'none', background: 'linear-gradient(180deg, rgba(23,20,18,.96) 0%, rgba(23,20,18,.82) 60%, rgba(23,20,18,0) 100%)' } });
const motes = Array.from({ length: 26 }, (_, i) => K.box(0, 0, 2 + seed(i) * 5, 2 + seed(i) * 5, { cls: 'mote', style: { filter: `blur(${1 + seed(i + 40) * 2}px)` } }));
const KICKS = ['', 'Room 1 · <b>your desk</b>', 'Room 2 · <b>your partner’s print room</b>', 'Room 3 · <b>a buyer’s home</b>'];
const kicks = KICKS.map((k) => K.box(65, L.kickY, W - 130, null, { cls: 'kick', html: k }));
const CAPS = [
  { a: 0.45, b: 2.5, t: 'One product.\n<em>Three rooms.</em>' },
  { a: 2.82, b: 5.05, t: 'You describe it.\n<em>You approve it.</em>', sub: 'nothing is made or sent until you approve' },
  { a: 6.45, b: 9.1, t: 'Printed when\n<em>someone orders.</em>', sub: 'by your own print partner · paid from your partner account' },
  { a: 10.15, b: 12.85, t: 'Then it\n<em>arrives.</em>' },
];
const caps = CAPS.map((c) => {
  const el = K.box(65, L.capY, W - 130, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' } });
  const ws = K.words(el, c.t.replace(/<em>(.*?)<\/em>/g, (m, x) => x.split(' ').map((w) => '<em>' + w + '</em>').join(' ')));
  const sub = c.sub ? K.box(65, L.subY, W - 130, null, { cls: 'sub', html: c.sub }) : null;
  return { el, ws, sub, c };
});
const ctag = K.demoTag('Concept products · AI-generated', 0, L.tagY); ctag.classList.add('dk');
const rtag = K.demoTag('Real app · demo workspace', 65, L.tagY); rtag.classList.add('dk');
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'One product.<br>Three rooms. Your yes.' });

// ---------- camera ----------
const MV = [[B(9), B(11.5)], [9.15, 10.35]]; // the moves between rooms: 5.01–6.40 · 9.15–10.35
const camX = (t) => K.k(t, [[0, RS], [1.55, RS], [2.75, 0], [MV[0][0], 0], [MV[0][1], RS], [MV[1][0], RS], [MV[1][1], 2 * RS], [13, 2 * RS]], E.inOutCubic);
const camZ = (t) => K.k(t, [[0, -2750], [1.55, -2550], [2.75, 0], [MV[0][0], 110], [(MV[0][0] + MV[0][1]) / 2, -1050], [MV[0][1], 0], [MV[1][0], 110], [(MV[1][0] + MV[1][1]) / 2, -1000], [MV[1][1], 0], [13, 130]], E.inOutCubic);
const camY = (t) => -(tall ? 720 : 330) * K.clamp((-camZ(t) - 300) / 2300);
const camRy = (t) => Math.sin(t * 0.5) * 1.6;

K.run({
  id: 'G11', title: 'Three Rooms', dur: DUR, bpm: BPM, music: 'blue-skies', mood: 'warm', key: 'F', intro: 0.0, cover: 7.6,
  technique: 'Three cut-away dioramas built in real CSS 3D (back wall, floor and side walls in perspective, a wooden cross-section slab, standing cut-out props at depth with contact shadows), each lit its own way; one continuous camera move — wide on all three like a dollhouse, a push into the desk, then two pull-back-and-truck moves between rooms timed to the narrator’s breaths, with a light bar printing the same protea print in the partner’s room and the print hanging in the buyer’s home',
  caption: 'One product, three rooms: at your desk you describe it and approve it; at your own print partner it is printed when someone orders, paid from your partner account; then it arrives in a buyer’s home. Nothing is made or sent until you approve. Products shown are concept images. Start free at makeandlist.com',
  short: 'One product. Three rooms.',
  question: 'Can I sell physical products too?', gain: 'Printed per order, by your partner, after your yes',
  vo: VO,
  beats: ['0–2.7 s: wide on three dioramas like a dollhouse — “One product. Three rooms.”', '2.7–5 s: push into the seller’s desk at golden hour: the real create screen, the protea design — you describe it, you approve it', '5–6.4 s: pull back and truck to the print room', '6.4–9.1 s: the partner’s print room: a light bar prints the protea; garments, parcels — printed when someone orders', '9.1–10.4 s: pull back and truck to the home', '10.4–13 s: a buyer’s living room, the print on the wall, the opened parcel — then it arrives', '13–15 s: end card'],
  cues: [[0.0, 'swish'], [2.35, 'whoosh'], [3.3, 'type'], [4.55, 'click'], [MV[0][1] - 0.4, 'whoosh'], [MV[0][1], 'paper'], [6.8, 'printer'], [MV[1][1] - 0.4, 'whoosh'], [MV[1][1], 'box'], [12.1, 'chime'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  const x = camX(T), z = camZ(T);
  world.style.transform = `translate3d(${-x}px, ${camY(T)}px, ${z}px) rotateY(${camRy(T)}deg)`;
  // how close the camera is (motes only show inside a room)
  const near = K.clamp((z + 400) / 440);

  // room light: the lamp flickers warm, the print room's bar sweeps, the sun drifts
  lampGlow.style.opacity = 0.75 + 0.1 * Math.sin(T * 5.3) + 0.05 * Math.sin(T * 13);
  const pp = K.p(T, 6.55, 8.6, E.inOutCubic);
  lightBar.style.transform = `translateZ(${PRN.z + 130 + K.lerp(-140, 140, pp)}px)`;
  lightBar.style.opacity = T > 6.4 && T < 8.75 ? 1 : 0.25;
  printOut.style.clipPath = `inset(${((1 - pp) * 100).toFixed(1)}% 0 0 0)`;
  printOut.style.transform = `translateZ(${PRN.z + 110}px) translateY(${(1 - K.p(T, 8.6, 9.0, E.outBack)) * 20}px)`;
  sun.style.opacity = 0.7 + 0.15 * Math.sin(T * 0.8);
  const pIn = K.p(T, MV[1][1] - 0.2, MV[1][1] + 0.5, E.outBack);
  parcelHome.style.transform = `translateZ(-200px) translateY(${(1 - pIn) * -260}px) rotate(${(1 - pIn) * -10}deg)`;

  motes.forEach((m, i) => {
    const mx = (seed(i + 11) * W + Math.sin(T * 0.3 + i) * 40) % W;
    const my = ((seed(i + 17) * H - T * (5 + seed(i + 3) * 12)) % H + H) % H;
    m.style.transform = `translate(${mx}px, ${my}px)`;
    m.style.opacity = (0.15 + 0.45 * seed(i + 23)) * near * (1 - K.p(T, 12.7, 13, E.linear));
  });

  // ---------- type ----------
  const KW = [null, [2.75, MV[0][0] + 0.25], [MV[0][1] - 0.1, MV[1][0] + 0.25], [MV[1][1] - 0.1, 12.9]];
  kicks.forEach((k, i) => { k.style.opacity = i ? K.win(T, KW[i][0], KW[i][1], 0.3) : 0; });
  caps.forEach(({ el, ws, sub, c }) => {
    const vis = T >= c.a - 0.02 && T < c.b + 0.02;
    el.style.visibility = vis ? 'visible' : 'hidden';
    if (sub) sub.style.opacity = vis ? K.p(T, c.a + 0.5, c.a + 0.9, E.linear) * (1 - K.p(T, c.b - 0.25, c.b, E.linear)) : 0;
    if (!vis) return;
    K.reveal(ws, T, c.a, { kind: 'up', stagger: 0.07, dur: 0.55, out: c.b - 0.3 });
  });
  ctag.style.left = W - 65 - ctag.offsetWidth + 'px';
  ctag.style.opacity = K.p(T, 0.6, 1.0, E.linear) * (1 - K.p(T, 12.7, 13, E.linear));
  rtag.style.opacity = K.win(T, 2.9, MV[0][0] + 0.2, 0.3);
  end(T);
});
