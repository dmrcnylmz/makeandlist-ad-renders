<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>I13 · Pricing</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #F5F0E6; }
.bg { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 40%, #FCF9F2 0%, #F2ECE0 64%, #E6DDCD 100%); }
.wash { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(60px); }
/* R09 series chip — the R08 .fchip, identical in I01–I16 */
.fchip { position: absolute; z-index: 80; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 10px; border-radius: 99px;
  background: #1F1F1F; color: #FAF7EE; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 16px 30px -18px rgba(31,31,31,.7); }
.fchip b { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 99px; background: #DFFF5A; color: #1F1F1F; font-weight: 600; }
.fchip i { font-style: normal; color: #8A8378; }
.fchip span { font: 700 25px 'Archivo'; letter-spacing: 0; }
.cap { position: absolute; z-index: 40; font: 800 84px/1.0 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; }
.cap em { font-style: italic; font-weight: 700; background: linear-gradient(transparent 60%, #DFFF5A 60%, #DFFF5A 92%, transparent 92%); padding: 0 .04em; }
.hero { position: absolute; z-index: 40; font: 800 200px/0.92 'Playfair Display'; letter-spacing: -0.045em; color: #1F1F1F; }
.hero em { font-style: italic; font-weight: 700; }
.hl { background: linear-gradient(transparent 58%, #DFFF5A 58%, #DFFF5A 90%, transparent 90%) no-repeat 0 0 / 0% 100%; }
.sub { position: absolute; z-index: 40; font: 600 44px/1.2 'Archivo'; color: #45403A; }
.persp { position: absolute; perspective: 1600px; z-index: 30; }
.qcard { position: relative; border-radius: 28px; background: #1F1F1F; color: #FAF7EE; padding: 46px 52px; transform-origin: 50% 60%;
  box-shadow: 0 70px 120px -50px rgba(31,31,31,.75), 0 20px 40px -24px rgba(31,31,31,.5); }
.qcard .k { font: 500 30px 'IBM Plex Mono', monospace; color: #CFC8BA; letter-spacing: .02em; }
.qcard .tot { display: flex; align-items: baseline; gap: 20px; margin-top: 18px; }
.qcard .tot b { font: 800 124px/1 'Playfair Display'; letter-spacing: -0.03em; }
.qcard .tot span { font: 600 54px 'Archivo'; color: #D8D1C3; }
.qcard .row { display: flex; justify-content: space-between; font: 500 40px/1.2 'Archivo'; color: #E9E3D6; padding: 10px 0; }
.qcard .row.t { font-weight: 800; color: #FAF7EE; border-top: 2px solid #4A4640; margin-top: 8px; padding-top: 22px; }
.qcard .row b { font-weight: 600; }
.qcard .foot { margin-top: 18px; font: 500 34px/1.3 'Archivo'; color: #CFC8BA; }
.qcard .foot u { text-decoration: none; color: #1F1F1F; background: #DFFF5A; border-radius: 8px; padding: 0 8px; }
.qcard .btn { margin-top: 26px; height: 104px; border-radius: 26px; background: #DFFF5A; color: #1F1F1F; display: flex; align-items: center; justify-content: center; font: 800 42px 'Archivo'; }
.stamp { position: absolute; z-index: 45; padding: 16px 30px; border-radius: 99px; background: #DFFF5A; color: #1F1F1F; font: 800 44px 'Archivo'; white-space: nowrap; box-shadow: 0 0 0 4px #1F1F1F, 0 24px 40px -20px rgba(31,31,31,.7); }
.bal { position: absolute; z-index: 44; display: flex; align-items: center; gap: 18px; padding: 18px 30px 18px 18px; border-radius: 99px; background: #FFFDF8; box-shadow: 0 0 0 2px #1F1F1F, 0 30px 50px -26px rgba(31,31,31,.6); white-space: nowrap; }
.bal i { width: 64px; height: 64px; border-radius: 50%; background: #1F1F1F; display: flex; align-items: center; justify-content: center; }
.bal b { font: 800 40px 'Archivo'; color: #1F1F1F; }
.bal span { font: 600 40px 'Archivo'; color: #45403A; }
.tok { position: absolute; z-index: 46; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: #DFFF5A; box-shadow: 0 0 0 4px #1F1F1F, 0 10px 18px -8px rgba(31,31,31,.6); }
.tile { position: absolute; z-index: 30; border-radius: 28px; background: #FFFDF8; padding: 28px 40px; overflow: hidden; box-shadow: 0 50px 90px -46px rgba(31,31,31,.6), 0 0 0 1px #E2DBCE; }
.tile.dark { background: #1F1F1F; color: #FAF7EE; box-shadow: 0 50px 90px -46px rgba(31,31,31,.8); }
.tile .h { display: flex; justify-content: space-between; align-items: baseline; font: 800 44px 'Archivo'; letter-spacing: -0.01em; }
.tile .h small { font: 500 28px 'IBM Plex Mono', monospace; color: #6B645A; letter-spacing: .02em; }
.tile.dark .h small { color: #B9B1A3; }
.tile .vals { display: flex; gap: 16px; margin-top: 16px; }
.tile .v { flex: 1; border-radius: 20px; background: #F2ECE0; padding: 10px 20px 12px; }
.tile .v b { display: block; font: 800 52px/1 'Playfair Display'; letter-spacing: -0.02em; color: #1F1F1F; }
.tile .v span { display: block; margin-top: 4px; font: 600 26px/1 'Archivo'; color: #6B645A; }
.tile .v.on { background: #DFFF5A; }
.tile .kl { margin-top: 12px; font: 600 40px/1.2 'Archivo'; color: #FAF7EE; }
.tile .kl em { font-style: normal; color: #DFFF5A; }
.ko { position: absolute; z-index: 32; }
.prod { position: absolute; z-index: 20; }
.prod img { width: 100%; display: block; filter: drop-shadow(0 40px 34px rgba(31,31,31,.32)); }
/* 9:16 (Stories): the panels fill y 300–1560 */
.T9 .qcard { padding: 54px 60px; }
.T9 .qcard .k { font-size: 34px; }
.T9 .qcard .tot b { font-size: 140px; }
.T9 .qcard .tot span { font-size: 62px; }
.T9 .qcard .row { font-size: 46px; padding: 12px 0; }
.T9 .qcard .foot { font-size: 40px; }
.T9 .qcard .btn { height: 110px; font-size: 48px; }
.T9 .tile { padding: 36px 44px; }
.T9 .tile .h { font-size: 52px; }
.T9 .tile .h small { font-size: 32px; }
.T9 .tile .vals { margin-top: 22px; gap: 18px; }
.T9 .tile .v { padding: 16px 24px 18px; border-radius: 22px; }
.T9 .tile .v b { font-size: 76px; }
.T9 .tile .v span { font-size: 34px; margin-top: 6px; }
.T9 .tile .kl { font-size: 50px; margin-top: 18px; }
.T9 .sub { font-size: 48px; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// I13 — Pricing (PRICING · 1/1). "Start free" stands huge; then the app's real quote card (AppPlan board: 110 Credits —
// plan and layout 0 · 7 new illustrations 70 · listing images, video, copy 40) is redrawn large and floats in, tilting flat:
// the quote comes first. Its own footer line "If it stops, every unused Credit comes back" lifts out under a highlighter
// while lime tokens fly back into the balance chip. Last, the three ways to hold Credits stack in as tiles with the real
// values from the billing screen: monthly plans 800 · 2,400 · 6,000, one-time packs 500 · 2,000 · 5,000 (valid 12 months),
// or your own AI key. Credits only — no currency anywhere.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 18, E = K.ease;
const BPM = 83.4;
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Marian — measured with vo.mjs (line ends noted); scene cuts sit in the breaths.
// speech ≈ 0.79–1.50 · 2.00–3.40 | 3.88–5.02 · 6.21–7.34 | 7.78–9.20 · 10.02–12.01 | 12.37–14.09
const VO = [[0.0, 'Start free.'], [1.4, 'You pay in Credits for what you make, and the quote comes first.'],
  [5.6, 'If making stops, unused Credits come back.'], [9.5, 'Plans and packs come in Credits, or use your own AI key.']];
const SB = 1.75, TQ = 3.3, SC = 5.6, SD = 9.45, END = DUR - 2;
const TILE_T = [10.0, 10.85, 12.3];

const L = tall
  ? { chip: [65, 290], capX: 65, capY: 380, capFs: 84, heroY: 560, heroFs: 230, subY: 1050, prod: [470, 990, 580],
      q: [65, 640, 950, 650], stamp: [590, 598], bal: [1015, 598], tagY: 1210,
      tiles: [[65, 640, 950], [65, 962, 950], [65, 1284, 950]], tileH: [302, 302, 220] }
  : { chip: [60, 56], capX: 60, capY: 124, capFs: 72, heroY: 230, heroFs: 190, subY: 640, prod: [600, 560, 400],
      q: [130, 352, 820, 650], stamp: [560, 312], bal: [950, 312], tagY: 1290,
      tiles: [[60, 352, 960], [60, 588, 960], [60, 824, 960]], tileH: [222, 222, 162] };

if (tall) document.getElementById('stage').classList.add('T9');
K.box(0, 0, W, H, { cls: 'bg' });
const washes = [0, 1].map((i) => K.box(0, 0, 900, 900, { cls: 'wash', style: { background: ['rgba(255,236,206,.7)', 'rgba(223,255,90,.22)'][i] } }));
const vis = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };

// ---------- A: start free ----------
const hero = K.box(L.capX, L.heroY, W - 2 * L.capX, null, { cls: 'hero', style: { fontSize: L.heroFs + 'px' },
  html: '<span class="w" style="display:inline-block">Start</span><br><span class="w" style="display:inline-block"><em class="hl">free.</em></span>' });
const heroW = [...hero.querySelectorAll('.w')];
const heroHl = hero.querySelector('.hl');
const sub = K.box(L.capX, L.subY, tall ? 420 : 560, null, { cls: 'sub', html: 'Pay in Credits<br>for what you make.' });
const prod = K.box(L.prod[0], L.prod[1], L.prod[2], null, { cls: 'prod', html: `<img src="${K.pub('r09/k18-planner-stack.webp')}">` });
const conceptTag = K.demoTag('Concept product · AI-generated', L.prod[0], L.prod[1] + L.prod[2] * 1.0);

// ---------- B + C: the real quote, redrawn large ----------
const persp = K.box(L.q[0], L.q[1], L.q[2], null, { cls: 'persp' });
const qc = K.el('div', { parent: persp, cls: 'qcard', html: `<div class="k">Quote · valid 30 minutes</div>
  <div class="tot"><b class="n">0</b><span>Credits</span></div>
  <div class="row r"><span>Product plan and layout</span><b>0</b></div>
  <div class="row r"><span>7 new illustrations</span><b>70</b></div>
  <div class="row r"><span>Listing images, video, copy</span><b>40</b></div>
  <div class="row t r"><span>Total</span><span>110</span></div>
  <div class="foot">If it stops, <u>every unused Credit comes back.</u></div>
  <div class="btn">Make it · 110 Credits</div>` });
const qBtn = qc.querySelector('.btn');
const qn = qc.querySelector('.n');
const rows = [...qc.querySelectorAll('.r')];
const foot = qc.querySelector('.foot');
const footU = foot.querySelector('u');
const stamp = K.box(L.stamp[0], L.stamp[1], null, null, { cls: 'stamp', style: { width: 'auto', height: 'auto' }, html: 'Before it’s made' });
const qTag = K.demoTag('App screen · redrawn, sample data', L.q[0], L.q[1] - 46);
const bal = K.box(0, L.bal[1], null, null, { cls: 'bal', style: { width: 'auto', height: 'auto' },
  html: '<i><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2l2.2 6.6L21 9.5l-5.4 4.1 1.9 6.8L12 16.6 6.5 20.4l1.9-6.8L3 9.5l6.8-.9z" fill="#DFFF5A"/></svg></i><b>Back to your balance</b>' });
const toks = Array.from({ length: 7 }, () => K.box(0, 0, 54, 54, { cls: 'tok' }));

// ---------- D: plans, packs, your own key ----------
const tiles = [
  K.box(...L.tiles[0].slice(0, 2), L.tiles[0][2], L.tileH[0], { cls: 'tile', html: `<div class="h">Monthly plan<small>Credits / month</small></div>
    <div class="vals"><div class="v"><b>800</b><span>Starter</span></div><div class="v on"><b>2,400</b><span>Pro</span></div><div class="v"><b>6,000</b><span>Agency</span></div></div>` }),
  K.box(...L.tiles[1].slice(0, 2), L.tiles[1][2], L.tileH[1], { cls: 'tile', html: `<div class="h">One-time packs<small>valid 12 months</small></div>
    <div class="vals"><div class="v"><b>500</b><span>Credits</span></div><div class="v"><b>2,000</b><span>Credits</span></div><div class="v"><b>5,000</b><span>Credits</span></div></div>` }),
  K.box(...L.tiles[2].slice(0, 2), L.tiles[2][2], L.tileH[2], { cls: 'tile dark', html: `<div class="h">Or your own AI key</div>
    <div class="kl">That provider bills you <em>directly.</em></div>` }),
];
const keySvg = K.box(0, 0, 150, 60, { cls: 'ko', html: `<svg width="150" height="60" viewBox="0 0 300 120"><defs><linearGradient id="kg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D27A"/><stop offset=".55" stop-color="#C99A2E"/><stop offset="1" stop-color="#9A7215"/></linearGradient></defs>
  <circle cx="58" cy="60" r="50" fill="url(#kg)" stroke="#FAF7EE" stroke-width="6"/><circle cx="58" cy="60" r="20" fill="#1F1F1F" stroke="#FAF7EE" stroke-width="6"/>
  <path d="M104 50 H288 a6 6 0 0 1 6 6 v8 a6 6 0 0 1-6 6 H262 v22 h-18 v-22 h-14 v14 h-18 v-14 H104 z" fill="url(#kg)" stroke="#FAF7EE" stroke-width="6" stroke-linejoin="round"/></svg>` });
const dTag = K.demoTag('App screen · redrawn, sample data', L.tiles[0][0], L.tiles[0][1] - 46);

// captions
const mkCap = (html) => { const c = K.box(L.capX, L.capY, W - 2 * L.capX, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' }, html }); return { c, w: [...c.querySelectorAll('.w')] }; };
const wrapW = (s) => s.split(' ').map((x) => `<span class="w" style="display:inline-block;white-space:pre">${x} </span>`).join('');
const caps = [
  mkCap(wrapW('The quote') + '<br>' + wrapW('comes') + `<span class="w" style="display:inline-block"><em>first.</em></span>`),
  mkCap(wrapW('Stopped? Unused') + '<br>' + wrapW('Credits') + `<span class="w" style="display:inline-block"><em>come back.</em></span>`),
  mkCap(wrapW('Plans, packs') + '<br>' + wrapW('or') + `<span class="w" style="display:inline-block"><em>your own key.</em></span>`),
];
const capT = [[TQ + 0.45, SC], [SC + 0.2, SD], [SD + 0.2, END]];

const chip = K.box(L.chip[0], L.chip[1], null, null, { cls: 'fchip', style: { width: 'auto', height: '56px' }, html: '<b>PRICING</b><i>·</i><span>1/1</span>' });
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(END, { lift: tall ? 160 : 0, line: 'Next: your control →' });

function words(ws, T, a, out, st = 0.07) {
  ws.forEach((w, i) => {
    const p = K.p(T, a + i * st, a + 0.5 + i * st, E.outExpo);
    const o = out ? K.p(T, out - 0.3, out, E.inCubic) : 0;
    w.style.opacity = Math.min(1, p * 1.6) * (1 - o);
    w.style.transform = `translateY(${(1 - p) * 60 - o * 30}px)`;
    w.style.filter = p < 1 ? `blur(${(1 - p) * 8}px)` : 'none';
  });
}

K.run({
  id: 'I13', title: 'Pricing', dur: DUR, bpm: BPM, music: 'ov-strolling-stripes', mood: 'calm', key: 'F', intro: 0, cover: 4.6,
  series: 'R09', highlight: 'PRICING · 1/1',
  technique: 'A huge “Start free.” under a highlighter swipe; the app’s real quote card (110 Credits: plan and layout 0, 7 new illustrations 70, listing images, video and copy 40) redrawn large as a floating dark card that tilts flat while its rows count in; its own footer line “every unused Credit comes back” lifts under a highlighter as lime tokens fly back to the balance; then three tiles stack in with the billing screen’s real Credit values — monthly plans 800 · 2,400 · 6,000, one-time packs 500 · 2,000 · 5,000, or your own AI key',
  caption: 'Pricing, plainly: start free, then pay in Credits for what you make — and you see the quote before anything is made. If making stops, unused Credits come back. Choose a monthly plan or one-time packs, or use your own AI key. Start free at makeandlist.com',
  short: 'Start free. The quote comes first.',
  vo: VO,
  beats: ['0–3.3 s: “Start free.” — huge serif under a highlighter swipe, a concept planner stack floats in; “Pay in Credits for what you make”', '3.3–5.6 s: “The quote comes first” — the real quote card (redrawn) floats in and settles flat, rows count to 110 Credits; “Before it’s made”', '5.6–9.4 s: “If making stops, unused Credits come back” — the card’s own footer line lifts under a highlighter; lime tokens fly back to the balance', '9.4–16 s: monthly plans 800 · 2,400 · 6,000 Credits, packs 500 · 2,000 · 5,000 (valid 12 months), or your own AI key (that provider bills you directly)', '16–18 s: end card — “Next: your control →”'],
  cues: [[0.1, 'pop'], [0.62, 'swish'], [1.7, 'pop'], [TQ - 0.05, 'whoosh'], [3.6, 'click'], [3.95, 'click'], [4.3, 'click'], [4.7, 'ding'], [5.15, 'pop'],
    [SC - 0.05, 'swish'], [6.0, 'pop'], [7.7, 'sparkle'], [9.0, 'ding'], [SD - 0.05, 'whoosh'], [TILE_T[0], 'pop'], [TILE_T[1], 'pop'], [TILE_T[2], 'pop'], [TILE_T[2] + 1.0, 'click'], [END, 'swish']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  washes[0].style.transform = `translate(${W * 0.7 - 450 + Math.sin(T * 0.4) * 140}px, ${H * 0.28 - 450 + Math.cos(T * 0.35) * 90}px)`;
  washes[1].style.transform = `translate(${W * 0.15 - 450 + Math.cos(T * 0.5) * 110}px, ${H * 0.72 - 450 + Math.sin(T * 0.45) * 90}px)`;
  const cp = K.p(T, 0.05, 0.55, E.outExpo);
  chip.style.opacity = cp * (1 - K.p(T, END - 0.15, END, E.linear)); chip.style.clipPath = `inset(0 ${(1 - cp) * 100}% 0 0 round 99px)`; chip.style.transform = `translateX(${(1 - cp) * -30}px)`;

  // ---------- A ----------
  const aOut = K.p(T, TQ - 0.3, TQ + 0.15, E.inCubic);
  heroW.forEach((w, i) => {
    const p = K.p(T, 0.1 + i * 0.16, 0.7 + i * 0.16, E.outExpo);
    w.style.opacity = Math.min(1, p * 1.6) * (1 - aOut);
    w.style.transform = `translateY(${(1 - p) * 90 - aOut * 70}px)`;
    w.style.filter = p < 1 ? `blur(${(1 - p) * 12}px)` : 'none';
  });
  heroHl.style.backgroundSize = `${K.p(T, 0.75, 1.2, E.outCubic) * 100}% 100%`;
  hero.style.transform = `scale(${1 + 0.01 * T})`;
  vis(hero, T < TQ + 0.2);
  const sp = K.p(T, SB + 0.05, SB + 0.55, E.outExpo);
  sub.style.opacity = sp * (1 - aOut); sub.style.transform = `translateY(${(1 - sp) * 30 - aOut * 40}px)`;
  vis(sub, T >= SB && T < TQ + 0.2);
  const pp = K.p(T, 0.35, 1.1, E.outExpo);
  prod.style.opacity = pp * (1 - aOut);
  prod.style.transform = `translate(${(1 - pp) * 120 + aOut * 160}px, ${Math.sin(T * 1.1) * 8}px) rotate(${6 - 2 * pp + Math.sin(T * 0.8)}deg)`;
  vis(prod, T < TQ + 0.2);
  conceptTag.style.opacity = K.p(T, 0.8, 1.1, E.linear) * (1 - aOut); vis(conceptTag, T < TQ + 0.2);

  // ---------- B + C: the quote card ----------
  const qIn = K.p(T, TQ - 0.05, TQ + 0.65, E.outExpo), qOut = K.p(T, SD - 0.3, SD + 0.1, E.inCubic);
  const settle = K.p(T, TQ - 0.05, TQ + 1.3, E.outCubic);
  persp.style.opacity = Math.min(1, qIn * 2) * (1 - qOut);
  const zoomC = K.p(T, SC, SC + 0.6, E.inOutCubic);
  qc.style.transform = `translateY(${(1 - qIn) * 260 - qOut * 90}px) rotateX(${(1 - settle) * 10 + Math.sin(T * 0.7) * 0.8}deg) rotateY(${(1 - settle) * -8 + Math.sin(T * 0.5) * 1.2}deg) scale(${0.94 + 0.06 * qIn + 0.012 * Math.sin(T * 0.6)})`;
  vis(persp, T >= TQ - 0.1 && T < SD + 0.12);
  qn.textContent = K.count(T, TQ + 0.2, TQ + 1.6, 0, 110);
  const RT = [TQ + 0.3, TQ + 0.65, TQ + 1.0, TQ + 1.4];
  rows.forEach((r, i) => {
    const p = K.p(T, RT[i], RT[i] + 0.45, E.outExpo);
    r.style.opacity = Math.min(1, p * 1.5) * (1 - 0.65 * zoomC);
    r.style.transform = `translateX(${(1 - p) * 40}px)`;
  });
  const fp = K.p(T, TQ + 1.85, TQ + 2.3, E.outExpo);
  foot.style.opacity = fp;
  qBtn.style.opacity = K.p(T, TQ + 1.5, TQ + 1.9, E.linear) * (1 - 0.65 * zoomC);
  foot.style.transform = `translateY(${(1 - fp) * 20 - zoomC * 30}px) scale(${1 + 0.1 * zoomC})`;
  foot.style.transformOrigin = '0 50%';
  footU.style.backgroundSize = '100% 100%';
  footU.style.background = `linear-gradient(90deg, #DFFF5A ${K.p(T, 7.55, 7.95, E.outCubic) * 100}%, transparent 0)`;
  footU.style.color = T >= 7.95 ? '#1F1F1F' : '#FAF7EE';
  const st = K.p(T, 4.55, 4.95, E.outBack);
  stamp.style.opacity = Math.min(1, st * 2) * (1 - K.p(T, SC - 0.2, SC + 0.1, E.linear));
  stamp.style.transform = `rotate(${6 - 4 * st}deg) scale(${1.5 - 0.5 * st})`;
  vis(stamp, T > 4.5 && T < SC + 0.15);
  qTag.style.opacity = qIn * (1 - qOut); vis(qTag, T >= TQ && T < SD + 0.12);
  // C: balance chip + tokens returning
  bal.style.left = (L.bal[0] - bal.offsetWidth) + 'px';
  const bp = K.p(T, SC + 0.4, SC + 0.85, E.outBack);
  bal.style.opacity = Math.min(1, bp * 2) * (1 - qOut);
  bal.style.transform = `translateY(${(1 - bp) * 40}px) scale(${0.85 + 0.15 * bp + 0.06 * Math.sin(Math.PI * K.p(T, 8.75, 9.1, E.linear))})`;
  vis(bal, T >= SC + 0.35 && T < SD + 0.12);
  const fx = L.q[0] + L.q[2] * 0.62, fy = L.q[1] + foot.offsetTop + 40;
  const bx = L.bal[0] - bal.offsetWidth + 50, by = L.bal[1] + 50;
  toks.forEach((tk, i) => {
    const t0 = 7.95 + i * 0.12, p = K.p(T, t0, t0 + 0.7, E.inOutCubic);
    const x = K.lerp(fx + (i - 3) * 50, bx, p), y = K.lerp(fy, by, p) - Math.sin(Math.PI * p) * 140;
    tk.style.left = x + 'px'; tk.style.top = y + 'px';
    tk.style.opacity = (p > 0 && p < 1) ? 1 : 0;
    tk.style.transform = `scale(${1 - 0.4 * p})`;
  });

  // ---------- D ----------
  tiles.forEach((t, i) => {
    const t0 = TILE_T[i], p = K.p(T, t0, t0 + 0.65, E.outExpo);
    const s = K.p(T, t0, t0 + 1.3, E.outCubic);
    t.style.opacity = Math.min(1, p * 2);
    t.style.transform = `perspective(1600px) translateY(${(1 - p) * 140}px) rotateX(${(1 - s) * 9}deg) translateY(${Math.sin(T * 0.9 + i) * 4}px)`;
    vis(t, T >= t0 - 0.05);
  });
  // the key slides into the dark tile and turns
  const kt = L.tiles[2], kx = kt[0] + kt[2] - 200, ky = kt[1] + 36;
  const ks = K.p(T, TILE_T[2] + 0.35, TILE_T[2] + 0.8, E.outCubic), kr = K.p(T, TILE_T[2] + 0.75, TILE_T[2] + 1.1, E.outBack);
  keySvg.style.left = kx + 'px'; keySvg.style.top = ky + 'px';
  keySvg.style.opacity = ks;
  keySvg.style.transform = `translateX(${(1 - ks) * 200}px) rotate(${-30 + kr * 30 + Math.sin(T * 1.2) * 2}deg)`;
  vis(keySvg, T >= TILE_T[2] + 0.3);
  dTag.style.opacity = K.p(T, TILE_T[0], TILE_T[0] + 0.4, E.linear); vis(dTag, T >= TILE_T[0]);

  caps.forEach((c, i) => {
    const [a, b] = capT[i];
    words(c.w, T, a, b < END ? b : null, 0.07);
    vis(c.c, T >= a - 0.05 && T < b + 0.05);
  });

  end(T);
});
