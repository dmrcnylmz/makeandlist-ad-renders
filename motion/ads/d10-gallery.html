<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>D10 · The Gallery Opening</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #2A2724; }
.room { position: absolute; left: 0; top: 0; overflow: hidden; }
.room img { position: absolute; display: block; transform-origin: 50% 50%; }
.vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% 45%, rgba(0,0,0,0) 55%, rgba(20,16,12,.35) 100%); }
.top { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; z-index: 2; }
.door { position: absolute; left: 0; top: 0; z-index: 30; overflow: visible; pointer-events: none; }
.hook { position: absolute; z-index: 40; font: 800 112px/1.0 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; }
.hook i { font-style: italic; font-weight: 600; }
.kick { position: absolute; z-index: 40; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .22em; text-transform: uppercase; color: #45403A; white-space: nowrap; }
.plaque { position: absolute; z-index: 45; background: #FFFDF8; border-radius: 4px; padding: 26px 30px 24px; box-shadow: 0 30px 50px -26px rgba(20,16,12,.75), 0 2px 0 rgba(0,0,0,.05); }
.plaque .n { font: 600 17px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #8A8378; }
.plaque .t { margin-top: 10px; font: 700 40px/1.05 'Playfair Display'; color: #1F1F1F; }
.plaque .t i { font-weight: 500; }
.plaque .b { margin-top: 12px; font: 500 24px/1.32 'Archivo'; color: #45403A; }
.plaque .rule { margin-top: 16px; height: 3px; width: 64px; background: #DFFF5A; box-shadow: 0 0 0 1px rgba(31,31,31,.15); }
.map { position: absolute; z-index: 44; }
.wall { position: absolute; inset: 0; background: radial-gradient(60% 45% at 50% 40%, #4A443E 0, #2A2724 60%, #1E1B19 100%); }
.cone { position: absolute; pointer-events: none; background: radial-gradient(50% 50% at 50% 50%, rgba(255,240,210,.22), rgba(255,240,210,0) 70%); }
.ring { position: absolute; z-index: 5; border-radius: 16px; border: 5px solid #DFFF5A; box-shadow: 0 0 0 2px #1F1F1F; pointer-events: none; }
.cap { position: absolute; z-index: 40; font: 800 76px/1.06 'Playfair Display'; letter-spacing: -0.02em; color: #FAF7EE; text-shadow: 0 4px 30px rgba(20,16,12,.45); }
.cap em { font-style: normal; color: #DFFF5A; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// D10 — "Can I sell physical prints?" A gallery opening: the camera walks room to room through arched doorways (each
// room a concept image of prints on real walls), and every room has a museum wall label telling one print-on-demand
// fact: printed by your partner per order, no stock, the partner's own catalogue, listed only after your yes. The
// proof room is the real "Make it physical" screen under a spotlight, its sharpness check ringed. Last room: the parcel.
const em = (s) => s.replace(/<em>(.*?)<\/em>/gs, (m, x) => x.split(/( |\n)/).map((w) => (w === ' ' || w === '\n' || !w ? w : '<em>' + w + '</em>')).join(''));
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 76, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const CUT = [0, B(4), B(7), B(10), B(13)]; // room starts: g08, g01, g12, proof, parcel
const WALK = 0.75; // doorway walk, ends on the cut

// ---------- rooms ----------
function room(src, z, fy = 0) {
  const r = K.box(0, 0, W, H, { cls: 'room', style: { zIndex: z } });
  const img = src ? K.el('img', { parent: r, src }) : null;
  if (img) { const b = Math.max(W / 1024, H / 1536); Object.assign(img.style, { width: 1024 * b + 'px', height: 1536 * b + 'px', left: (W - 1024 * b) / 2 + 'px', top: (H - 1536 * b) / 2 + fy * (1536 * b - H) / 2 + 'px' }); }
  K.el('div', { parent: r, cls: 'vig' });
  return { r, img };
}
const rooms = [
  room(K.pub('r04/g08-gallery-wall.webp'), 10, tall ? 0 : -0.5),
  room(K.pub('r04/g01-botanical-print.webp'), 11, tall ? 0 : -0.4),
  room(K.pub('r04/g12-nursery-art.webp'), 12, tall ? 0 : -0.5),
  room(null, 13),
  room(K.pub('r04/g20-parcel.webp'), 14, tall ? 0 : 0.2),
];
// the proof room: a dark wall, a spotlight, the real screen
K.el('div', { parent: rooms[3].r, cls: 'wall' });
const PH = tall ? { x: (W - 340) / 2, y: 340, w: 340 } : { x: 110, y: 150, w: 400 };
const cone = K.box(PH.x - 300, PH.y - 260, PH.w + 600, PH.w * 2.05 + 520, { parent: rooms[3].r, cls: 'cone' });
const ph = K.phone(PH.x, PH.y, PH.w, K.screen('33-phone-sell-physical'), { parent: rooms[3].r });
const sc = (PH.w - 28) / 780;
const ring = K.el('div', { parent: ph.root.firstChild, cls: 'ring' });
// a soft wash at the top of the light rooms so the hook reads
rooms.slice(0, 3).forEach((r) => K.el('div', { parent: r.r, cls: 'top', style: { height: (tall ? 760 : 520) + 'px', background: 'linear-gradient(rgba(250,247,238,.78), rgba(250,247,238,0))' } }));
K.el('div', { parent: rooms[4].r, cls: 'top', style: { height: (tall ? 820 : 560) + 'px', background: 'linear-gradient(rgba(20,16,12,.7), rgba(20,16,12,0))' } });

// doorway outline (drawn on the arch of the incoming room)
const NS = 'http://www.w3.org/2000/svg';
const door = document.createElementNS(NS, 'svg'); door.setAttribute('class', 'door'); door.setAttribute('width', W); door.setAttribute('height', H);
door.innerHTML = '<path fill="none" stroke="#FFFDF8" stroke-width="18"/><path fill="none" stroke="rgba(31,31,31,.25)" stroke-width="2"/>';
document.getElementById('stage').appendChild(door);
const doorP = door.querySelectorAll('path');
function arch(p) {
  const w = K.lerp(W * 0.34, W * 2.2, p), h = w * 1.5;
  const bottom = K.lerp(H * (tall ? 0.66 : 0.74), H + h * 0.32, p), top = bottom - h, cx = W / 2, x0 = cx - w / 2, x1 = cx + w / 2, r = w / 2;
  return `M${x0} ${bottom} L${x0} ${top + r} A${r} ${r} 0 0 1 ${x1} ${top + r} L${x1} ${bottom} Z`;
}

// ---------- plaques ----------
const PL = tall ? { x: 65, y: 940, w: 560 } : { x: 60, y: 960, w: 600 };
const PLATES = [
  ['Nº 01 · Living room', 'Three prints, <i>one wall</i>', 'Printed by your partner each time a buyer orders.'],
  ['Nº 02 · Hallway', 'Protea, <i>terracotta sun</i>', 'No stock to buy first. Nothing printed in advance.'],
  ['Nº 03 · Nursery', 'Fox, bear <i>&amp; rabbit</i>', 'Listed in your own stores only after your yes.'],
  ['Nº 04 · The check', 'Sharp at <i>40 × 50 cm</i>', 'Measured before it is listed: about 300 ppi at this size.'],
  ['Nº 05 · The doorstep', 'Shipped to <i>the buyer</i>', 'Paid from your partner account, never Credits.'],
];
const PLX = (i) => (i === 3 ? (tall ? { x: 65, y: 1060, w: W - 130 } : { x: 570, y: 560, w: 450 }) : PL);
const plaques = PLATES.map(([n, t, b], i) => { const g = PLX(i); return K.box(g.x, g.y, g.w, null, { cls: 'plaque', html: `<div class="n">${n}</div><div class="t">${t}</div><div class="b">${b}</div><div class="rule"></div>` }); });
// floor plan: five rooms, the visitor's dot moves on each cut
const MAPG = tall ? { x: 830, y: 1150, w: 185 } : { x: 860, y: 1250, w: 170 };
const map = K.box(MAPG.x, MAPG.y, MAPG.w, 60, { cls: 'map', html: `<svg width="${MAPG.w}" height="60" viewBox="0 0 185 60">${[0, 1, 2, 3, 4].map((i) => `<rect x="${2 + i * 36.5}" y="8" width="32" height="32" rx="3" fill="rgba(255,253,248,.9)" stroke="#1F1F1F" stroke-width="2"/>`).join('')}<circle class="me" cx="18" cy="24" r="7" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="2"/><text x="2" y="57" font-family="IBM Plex Mono" font-size="11" letter-spacing="1.5" fill="#FFFDF8">FLOOR PLAN</text></svg>` });
const me = map.querySelector('.me');

// ---------- type ----------
const kick = K.box(65, tall ? 292 : 60, W - 130, null, { cls: 'kick', html: 'The opening · five rooms' });
const hook = K.box(65, tall ? 340 : 104, W - 130, null, { cls: 'hook', style: { fontSize: (tall ? 118 : 104) + 'px' } });
const hookW = K.words(hook, 'Your art,\non <i>real</i> walls.');
const cap = K.box(65, tall ? 300 : 70, W - 130, null, { cls: 'cap', style: { fontSize: (tall ? 80 : 76) + 'px' } });
const capW = K.words(cap, em('No stock.\n<em>Printed per order.</em>'));
const ctag = K.demoTag('Concept image · AI-generated', 0, 0);
const rtag = K.demoTag('Real app · demo workspace', 0, 0);
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Your art, printed<br>for every order.' });
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

K.run({
  id: 'D10', title: 'The Gallery Opening', dur: DUR, bpm: BPM, music: 'letting-go-of-the-past', mood: 'calm', key: 'D', intro: 0.0, cover: 1.9,
  technique: 'A museum walk-through: each room is a full-frame concept image with a slow push, the next room opens in an arched doorway (clip-path arch drawn per frame) that the camera walks through on the beat, a museum wall label per room and a live floor plan; the proof room is the real Make-it-physical screen under a spotlight',
  caption: 'Turn your art into printed products without buying stock: your own print partner prints each order and ships it, paid from your partner account, never Credits. The sharpness is checked for the size before it is listed, and it goes live only after your yes. The rooms shown are concept images. Start free at makeandlist.com',
  short: 'Your art, on real walls.',
  beats: ['0–3.2 s: “Your art, on real walls.” — room one, three prints over a sofa (concept image)', '3.2–5.5 s: through the doorway: a protea print; no stock, nothing printed in advance', '5.5–7.9 s: the nursery trio; listed only after your yes', '7.9–10.3 s: the real Make-it-physical screen under a spotlight: sharp at 40 × 50 cm', '10.3–13 s: the parcel on the doorstep: printed per order, paid from your partner account', '13–15 s: end card'],
  cues: [[0.0, 'hit'], [B(1), 'paper'], ...CUT.slice(1).flatMap((c) => [[+(c - 0.05).toFixed(3), 'whoosh'], [+(c + 0.15).toFixed(3), 'paper']]), [B(11.5), 'click'], [B(14), 'box'], [B(15), 'chime'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  let cur = 0; CUT.forEach((c, i) => { if (T >= c - WALK) cur = i; });
  rooms.forEach((r, i) => {
    const a = CUT[i], next = CUT[i + 1] ?? 99;
    const inP = i === 0 ? 1 : K.p(T, a - WALK, a, E.inOutCubic);
    const outP = K.p(T, next - WALK, next, E.inCubic);
    const vis = T >= (i === 0 ? -1 : a - WALK) && T < next + 0.05;
    r.r.style.visibility = vis ? 'visible' : 'hidden';
    // walking in: the room grows with its arch; once in, a slow push; walking out: it rushes past the camera
    const push = 1 + 0.07 * K.p(T, a, next, E.linear);
    const sIn = K.lerp(0.62, 1, inP);
    const sOut = 1 + 0.9 * outP;
    r.r.style.transform = `scale(${sIn * push * sOut})`;
    r.r.style.transformOrigin = `50% ${tall ? 60 : 62}%`;
    r.r.style.filter = outP > 0.02 ? `blur(${outP * 10}px)` : 'none';
    r.r.style.opacity = 1 - K.p(T, next - 0.12, next, E.linear);
    r.r.style.clipPath = i > 0 && inP < 1 ? `path('${arch(inP)}')` : 'none';
    if (r.img) r.img.style.transform = `translateX(${Math.sin(T * 0.35 + i) * 14}px)`;
  });
  // doorway outline follows the incoming arch
  const nxt = CUT.findIndex((c) => T >= c - WALK && T < c);
  if (nxt > 0) { const p = K.p(T, CUT[nxt] - WALK, CUT[nxt], E.inOutCubic); const d = arch(p); doorP.forEach((q) => q.setAttribute('d', d)); door.style.opacity = 1 - p; door.style.transform = `scale(${K.lerp(0.62, 1, p)})`; door.style.transformOrigin = `50% ${tall ? 60 : 62}%`; }
  else door.style.opacity = 0;

  // plaques: one per room, slides in after the cut, out before the walk
  plaques.forEach((pl, i) => {
    const a = CUT[i] + (i === 0 ? B(1) : 0.1), b = (CUT[i + 1] ?? 13.2) - 0.15;
    const pin = K.p(T, a, a + 0.6, E.outExpo), pout = K.p(T, b - 0.3, b, E.inCubic);
    pl.style.opacity = K.clamp(pin * 2) * (1 - pout);
    pl.style.transform = `translateX(${(1 - pin) * -60 + pout * -30}px) rotate(${(1 - pin) * -1.5}deg)`;
  });
  // floor plan
  const mp = K.k(T, CUT.flatMap((c, i) => (i === 0 ? [[0, 0]] : [[c - WALK, i - 1], [c, i]])), E.inOutCubic);
  me.setAttribute('cx', 18 + mp * 36.5);
  map.style.opacity = K.p(T, 0.6, 1.0, E.linear);

  // hook
  kick.style.opacity = K.win(T, 0.05, CUT[1] - WALK, 0.25);
  K.reveal(hookW, T, 0.08, { kind: 'up', stagger: 0.09, dur: 0.6, out: CUT[1] - WALK - 0.35 });
  // last room caption
  K.reveal(capW, T, CUT[4] + 0.15, { kind: 'up', stagger: 0.08, dur: 0.55 });

  // proof room: the screen, the ring on the technical pass
  const pr = K.p(T, CUT[3], CUT[3] + 0.6, E.outExpo);
  ph.root.style.transform = `translateY(${(1 - pr) * 60}px)`;
  cone.style.opacity = 0.6 + 0.4 * pr + 0.05 * Math.sin(T * 3);
  const SRC = K.k(T, [[CUT[3], 0], [B(11.5) - 0.2, 230], [CUT[4], 280]], E.inOutCubic);
  ph.scroll(SRC * sc);
  const rp = K.p(T, B(11.5), B(11.5) + 0.4, E.outBack);
  Object.assign(ring.style, { left: 26 * sc + 'px', top: (728 - SRC) * sc + 'px', width: 728 * sc + 'px', height: 150 * sc + 'px', opacity: rp > 1e-6 ? 1 : 0, transform: `scale(${1.1 - 0.1 * rp})` });

  // tags
  const concept = cur !== 3;
  ctag.style.opacity = concept ? 1 : 0;
  ctag.style.left = PL.x + 'px'; ctag.style.top = (PL.y - 50) + 'px';
  rtag.style.opacity = cur === 3 ? K.p(T, CUT[3] - 0.2, CUT[3] + 0.2, E.linear) : 0;
  rtag.style.left = (tall ? (W - rtag.offsetWidth) / 2 : PH.x) + 'px'; rtag.style.top = (tall ? 284 : PH.y + PH.w * 2.05 + 16) + 'px';

  end(T);
});
</script></body></html>
