<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>F01 · Shop To-Do</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #FBF7EC; }
.paper { position: absolute; inset: 0; background: linear-gradient(180deg, #FDFAF2 0, #FBF7EC 40%, #F6F1E4 100%); }
.status { position: absolute; z-index: 30; display: flex; justify-content: space-between; align-items: center; font: 700 34px 'Archivo'; color: #1F1F1F; }
.status .bt { display: flex; gap: 12px; align-items: center; }
.status .bt i { display: block; border-radius: 4px; background: #1F1F1F; }
.nav { position: absolute; z-index: 30; display: flex; justify-content: space-between; align-items: center; color: #B07A12; font: 500 38px 'Archivo'; }
.nav .ic { display: flex; gap: 34px; align-items: center; }
.nav .ic span { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 3px solid #B07A12; font: 800 26px 'Archivo'; }
.when { position: absolute; z-index: 20; font: 500 24px 'IBM Plex Mono', monospace; letter-spacing: .04em; color: #9A9286; }
.ttl { position: absolute; z-index: 20; font: 800 64px/1.05 'Archivo'; letter-spacing: -0.02em; color: #1F1F1F; white-space: nowrap; }
.caret { display: inline-block; width: 4px; height: .9em; margin-left: 4px; vertical-align: -0.08em; background: #B07A12; }
.row { position: absolute; z-index: 20; display: flex; align-items: center; gap: 26px; }
.row .cb { position: relative; flex: none; border-radius: 50%; border: 4px solid #C3BAAA; background: #FFFDF8; }
.row .cb b { position: absolute; inset: -4px; border-radius: 50%; background: #1F1F1F; display: grid; place-items: center; }
.row .tx { position: relative; font: 500 46px/1.1 'Archivo'; letter-spacing: -0.01em; color: #1F1F1F; white-space: nowrap; }
.row .tx .hl { position: absolute; left: -12px; right: -12px; top: 8%; bottom: 0; border-radius: 10px; background: #DFFF5A; z-index: -1; transform-origin: 0 50%; }
.row .tx .st { position: absolute; left: -4px; right: -4px; top: 54%; height: 5px; border-radius: 3px; background: #8A8378; transform-origin: 0 50%; }
.done { position: absolute; z-index: 21; white-space: nowrap; font: 600 21px 'IBM Plex Mono', monospace; letter-spacing: .04em; color: #1F1F1F; background: #EFEADF; padding: 7px 12px; border-radius: 99px; }
.done i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #9BC23A; margin-right: 8px; vertical-align: 0; font-style: normal; }
.yours { position: absolute; z-index: 22; white-space: nowrap; font: italic 800 52px 'Playfair Display'; color: #1F1F1F; }
.yours svg { position: absolute; left: -96px; top: 6px; }
.card { position: absolute; z-index: 40; border-radius: 30px; overflow: hidden; background: #FFFDF8; box-shadow: 0 50px 90px -40px rgba(31,31,31,.6), 0 0 0 1px rgba(31,31,31,.08); }
.card .hd { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 26px; background: #1F1F1F; color: #FAF7EE; font: 700 28px 'Archivo'; white-space: nowrap; }
.card .hd b { width: 16px; height: 16px; border-radius: 50%; background: #DFFF5A; display: block; flex: none; }
.card .hd em { margin-left: auto; font: 500 20px 'IBM Plex Mono', monospace; font-style: normal; color: #DFFF5A; letter-spacing: .06em; text-transform: uppercase; }
.card .im { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; background: #FAF7EE; }
.card .im img { position: absolute; display: block; }
.ring { position: absolute; z-index: 3; border-radius: 16px; border: 6px solid #DFFF5A; box-shadow: 0 0 0 2px #1F1F1F; }
.kb { position: absolute; z-index: 35; left: 0; right: 0; background: #E4DFD4; border-top: 1px solid #D3CCBF; }
.kb .r { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
.kb .k { height: 108px; border-radius: 14px; background: #FFFDF8; box-shadow: 0 3px 0 #BDB5A7; display: grid; place-items: center; font: 400 44px 'Archivo'; color: #1F1F1F; }
.kb .k.on { background: #1F1F1F; color: #FAF7EE; }
.kb .k.dk { background: #CFC8BB; font: 600 28px 'Archivo'; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// F01 — a notes-app checklist, typed live with the keyboard up: "Shop to-do · this weekend". The keyboard drops and
// each line is done in MakeAndList: a card rises with the real screen that did it (making the pages, the written
// description, the listing images, the listing prepared for ikas as a draft), the box ticks on the beat and the line
// strikes through. The last line, "Approve it", is never ticked: the real Send step waits, "← that one's yours".
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 89.1, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const ITEMS = ['Make the 36-page planner', 'Write the listing copy', 'Make 10 listing images', 'Prep it for ikas + Woo', 'Approve it'];
// proofs: [screen, top y in the 780-wide shot, card label, card tag]
const PROOF = [
  ['69-phone-making', 1790, 'Making the pages', 'Done'],
  ['51-phone-listing', 2492, 'Listing description', 'Written'],
  ['24-phone-product', 1796, 'Listing images', 'Made'],
  ['72-phone-listing-send', 1992, 'Prepared for ikas', 'Draft only'],
  ['72-phone-listing-send', 3196, 'Send · waits for you', 'Your call'],
];
const T_TITLE = 0.05, T_ROW = (i) => 0.62 + i * 0.33, TYPE_D = 0.3;
const T_KB = 2.25;
const P = [B(4), B(7), B(10), B(13)];  // each card rises
const TICK = P.map((p) => +(p + B(2)).toFixed(3));
const DROP = P.map((p) => +(p + B(2.75)).toFixed(3));
const T_LAST = B(16), T_YOURS = B(17.2);

const L = tall
  ? { stY: 52, navY: 150, whenY: 284, ttlY: 318, ttlFs: 64, rowY: 430, rowH: 80, txFs: 46, cb: 52, x: 70,
      cardX: 65, cardY: 836, cardW: 950, cardH: 408, kbY: 1250 }
  : { stY: 22, navY: 84, whenY: 156, ttlY: 186, ttlFs: 58, rowY: 290, rowH: 74, txFs: 42, cb: 48, x: 64,
      cardX: 60, cardY: 690, cardW: 960, cardH: 600, kbY: 830 };
const CROP_W = 740; // src px shown across the card

K.box(0, 0, W, H, { cls: 'paper' });
const status = K.box(64, L.stY, W - 128, 50, { cls: 'status', html: '<span>9:41</span><span class="bt"><i style="width:8px;height:16px"></i><i style="width:8px;height:22px"></i><i style="width:8px;height:28px"></i><i style="width:52px;height:26px;border-radius:8px;margin-left:10px"></i></span>' });
const nav = K.box(50, L.navY, W - 100, 60, { cls: 'nav', html: '<span>‹ Notes</span><span class="ic"><span>↑</span><span>···</span></span>' });
const note = K.box(0, 0, W, H, { style: { zIndex: 20 } });
const when = K.box(L.x, L.whenY, 800, null, { cls: 'when', parent: note, html: 'Saturday 9:12 · sample note' });
const ttl = K.box(L.x, L.ttlY, W - 140, null, { cls: 'ttl', parent: note, style: { fontSize: L.ttlFs + 'px' } });
const TITLE = 'Shop to-do · this weekend';
const rows = ITEMS.map((t, i) => {
  const r = K.box(L.x, L.rowY + i * L.rowH, W - 140, L.rowH, { cls: 'row', parent: note });
  const cb = K.el('div', { parent: r, cls: 'cb', style: { width: L.cb + 'px', height: L.cb + 'px' }, html: `<b><svg width="${L.cb * 0.6}" height="${L.cb * 0.6}" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#DFFF5A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></b>` });
  const tx = K.el('div', { parent: r, cls: 'tx', style: { fontSize: L.txFs + 'px' }, html: '<span class="hl"></span><span class="t"></span><span class="st"></span>' });
  const done = i < 4 ? K.box(0, 0, null, null, { cls: 'done', parent: note, html: '<i></i>MakeAndList', style: { width: 'auto', height: 'auto' } }) : null;
  return { r, cb, fill: cb.firstChild, tx, t: tx.querySelector('.t'), hl: tx.querySelector('.hl'), st: tx.querySelector('.st'), done };
});
const yours = K.box(0, 0, null, null, { cls: 'yours', parent: note, style: { width: 'auto', height: 'auto' },
  html: `<svg width="80" height="40" viewBox="0 0 80 40"><path class="arr" d="M76 22 C 52 30, 30 26, 6 18 M 18 8 L 5 18 L 19 28" fill="none" stroke="#1F1F1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>that one’s yours.` });

// the cards that rise with the real screen
const cards = PROOF.map(([scr, sy, lb, tag], i) => {
  const c = K.box(L.cardX, L.cardY, L.cardW, L.cardH, { cls: 'card', html: `<div class="hd"><b></b>${lb}<em>${tag}</em></div><div class="im"></div>` });
  const im = c.querySelector('.im'); im.style.top = '64px';
  const s = L.cardW / CROP_W;
  K.el('img', { parent: im, src: K.screen(scr), style: { width: 780 * s + 'px', left: -20 * s + 'px', top: -sy * s + 'px' } });
  return { c, s };
});
// on the last card: the ring around "Review what will be sent"
const ring = K.el('div', { parent: cards[4].c.querySelector('.im'), cls: 'ring' });
const s4 = cards[4].s;
Object.assign(ring.style, { left: (66 - 20 - 8) * s4 + 'px', top: (3360 - 3196 - 8) * s4 + 'px', width: (374 + 16) * s4 + 'px', height: (80 + 16) * s4 + 'px' });
const realTag = K.demoTag('Real app · demo workspace', 0, 0); realTag.style.zIndex = 60;

// keyboard
const kb = K.box(0, L.kbY, W, H - L.kbY + 40, { cls: 'kb' });
const KEYS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
const kw = (W - 24 - 9 * 12) / 10;
const keyEls = {};
KEYS.forEach((r, ri) => {
  const row = K.el('div', { parent: kb, cls: 'r', style: { top: 22 + ri * 128 + 'px' } });
  if (ri === 2) K.el('div', { parent: row, cls: 'k dk', html: '⇧', style: { width: kw * 1.4 + 'px' } });
  r.split('').forEach((ch) => { keyEls[ch] = K.el('div', { parent: row, cls: 'k', html: ch, style: { width: kw + 'px' } }); });
  if (ri === 2) K.el('div', { parent: row, cls: 'k dk', html: '⌫', style: { width: kw * 1.4 + 'px' } });
});
const r4 = K.el('div', { parent: kb, cls: 'r', style: { top: 22 + 3 * 128 + 'px' } });
K.el('div', { parent: r4, cls: 'k dk', html: '123', style: { width: kw * 2 + 'px' } });
keyEls[' '] = K.el('div', { parent: r4, cls: 'k', html: '', style: { width: kw * 5.6 + 'px' } });
K.el('div', { parent: r4, cls: 'k dk', html: 'return', style: { width: kw * 2.2 + 'px' } });

const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'The last tick<br>is always yours.' });

K.run({
  id: 'F01', title: 'Shop To-Do', dur: DUR, bpm: BPM, music: 'poor-but-happy', mood: 'calm', key: 'C', intro: 0.0, cover: 7.6,
  technique: 'A hand-drawn, unbranded notes-app checklist typed live with its keyboard (keys light as each letter lands); the keyboard drops and each line is done in MakeAndList: a card rises with the real screen that did it, the box ticks on the beat and the line strikes through; the last line, “Approve it”, is never ticked — the real Send step waits with a lime ring, “← that one’s yours”',
  caption: 'My shop to-do, mostly done: MakeAndList made the pages, wrote the listing, made the listing images and prepared it for my stores as a draft. The last tick — approving it — is always mine. Start free at makeandlist.com',
  short: 'The last tick is always yours.',
  question: 'How does it work?', gain: 'Time, with control: it does the list, you approve',
  beats: ['0–2.3 s: “Shop to-do · this weekend” typed live, five lines, keyboard up', '2.3–4.7 s: line 1 — the real Making screen rises, box ticks', '4.7–6.7 s: line 2 — the real listing description, tick', '6.7–8.8 s: line 3 — the real listing images, tick', '8.8–10.8 s: line 4 — prepared for ikas, draft only, tick', '10.8–13 s: “Approve it” stays open — the real Send step: that one’s yours; 13–15 s end card'],
  cues: [[0.0, 'pop'], [T_TITLE, 'type'], [T_ROW(1), 'type'], [T_ROW(3), 'type'], [T_KB, 'swish'],
    ...P.flatMap((p, i) => [[+(p - 0.1).toFixed(3), 'swish'], [TICK[i], 'pop'], [+(TICK[i] + 0.12).toFixed(3), 'marker']]),
    [+(T_LAST - 0.1).toFixed(3), 'whoosh'], [+(T_LAST + 0.5).toFixed(3), 'pop'], [T_YOURS, 'marker'], [12.2, 'chime'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  const caretOn = f % 16 < 9;

  // the note breathes very slightly (ambient)
  note.style.transform = `translateY(${Math.sin(T * 0.7) * 3}px)`;
  const enter = K.p(T, 0, 0.35, E.outCubic);
  note.style.opacity = enter;

  // typing: title, then each row
  const nT = Math.round(K.p(T, T_TITLE, T_TITLE + 0.5, E.linear) * TITLE.length);
  let typingKey = null;
  ttl.innerHTML = TITLE.slice(0, nT) + (T < T_ROW(0) && caretOn ? '<span class="caret"></span>' : '');
  if (T >= T_TITLE && T < T_TITLE + 0.5) typingKey = TITLE[Math.max(0, nT - 1)];
  rows.forEach((rw, i) => {
    const a = T_ROW(i), txt = ITEMS[i];
    const n = Math.round(K.p(T, a, a + TYPE_D, E.linear) * txt.length);
    const typingNow = T >= a && T < T_ROW(i + 1) && T < T_KB;
    rw.t.innerHTML = txt.slice(0, n) + (typingNow && caretOn ? '<span class="caret"></span>' : '');
    if (T >= a && T < a + TYPE_D) typingKey = txt[Math.max(0, n - 1)];
    const rin = K.p(T, a - 0.05, a + 0.2, E.outBack);
    rw.cb.style.transform = `scale(${rin})`;
    rw.r.style.opacity = T >= a - 0.05 ? 1 : 0;
    // tick
    const tk = i < 4 ? K.p(T, TICK[i], TICK[i] + 0.35, E.outBack) : 0;
    rw.fill.style.transform = `scale(${tk})`; rw.fill.style.opacity = tk > 0 ? 1 : 0;
    rw.cb.style.borderColor = tk > 0 ? '#1F1F1F' : '#C3BAAA';
    const stp = i < 4 ? K.p(T, TICK[i] + 0.12, TICK[i] + 0.4, E.inOutCubic) : 0;
    rw.st.style.transform = `scaleX(${stp})`;
    rw.t.style.color = stp > 0.4 ? '#9A9286' : '#1F1F1F';
    // highlight while its card is up (the last one stays lit)
    const up = i < 4 ? K.p(T, P[i] - 0.05, P[i] + 0.3, E.outCubic) * (1 - K.p(T, TICK[i], TICK[i] + 0.3, E.linear)) : K.p(T, T_LAST, T_LAST + 0.4, E.outExpo);
    rw.hl.style.transform = `scaleX(${up})`; rw.hl.style.opacity = i < 4 ? 0.85 * up : 1;
    if (rw.done) {
      const dp = K.p(T, TICK[i] + 0.25, TICK[i] + 0.6, E.outBack);
      rw.done.style.left = L.x + L.cb + 26 + rw.tx.offsetWidth + 22 + 'px';
      rw.done.style.top = L.rowY + i * L.rowH + (L.rowH - 38) / 2 + 'px';
      rw.done.style.opacity = Math.min(1, dp * 2); rw.done.style.transform = `scale(${0.6 + 0.4 * dp})`;
    }
  });
  // "that one's yours"
  const yp = K.p(T, T_YOURS, T_YOURS + 0.45, E.outBack);
  const last = rows[4];
  yours.style.left = L.x + L.cb + 26 + last.tx.offsetWidth + 130 + 'px';
  yours.style.top = L.rowY + 4 * L.rowH + (L.rowH - 70) / 2 + 'px';
  yours.style.opacity = Math.min(1, yp * 2) * (1 - K.p(T, 12.75, 12.95, E.linear));
  yours.style.transform = `translateX(${(1 - yp) * 40}px) rotate(${-2 + Math.sin(T * 2) * 0.8}deg)`;

  // keyboard: up while typing, the key of the letter just typed lights
  const kd = K.p(T, T_KB, T_KB + 0.4, E.inCubic);
  kb.style.transform = `translateY(${kd * (H - L.kbY + 60)}px)`;
  Object.entries(keyEls).forEach(([ch, el]) => el.classList.toggle('on', typingKey !== null && typingKey.toLowerCase() === ch));

  // the cards
  let tagOn = 0;
  cards.forEach((cd, i) => {
    const a = i < 4 ? P[i] : T_LAST, b = i < 4 ? DROP[i] : 12.9;
    const pin = K.p(T, a - 0.1, a + 0.4, E.outExpo), pout = K.p(T, b - 0.05, b + 0.25, E.inCubic);
    cd.c.style.visibility = T >= a - 0.1 && T < b + 0.25 ? 'visible' : 'hidden';
    cd.c.style.opacity = Math.min(1, pin * 1.6) * (1 - pout);
    cd.c.style.transform = `translateY(${(1 - pin) * 220 + pout * 160}px) rotate(${(i % 2 ? 1 : -1) * (0.8 + (1 - pin) * 3)}deg) scale(${0.94 + 0.06 * pin})`;
    // a slow inner drift on the screen crop
    cd.c.querySelector('.im img').style.transform = `translateY(${-(T - a) * 6}px)`;
    tagOn = Math.max(tagOn, Math.min(1, pin * 1.6) * (1 - pout));
  });
  const rg = K.p(T, T_LAST + 0.5, T_LAST + 0.85, E.outBack);
  ring.style.opacity = rg > 0 ? 1 : 0; ring.style.transform = `scale(${1.12 - 0.12 * rg})`;
  realTag.style.left = L.cardX + 14 + 'px'; realTag.style.top = L.cardY + L.cardH - 52 + 'px';
  realTag.style.opacity = tagOn;

  end(T);
});
</script></body></html>
