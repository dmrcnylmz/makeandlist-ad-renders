<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C05 · Pick Your Partner</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #1B1A18; color: #FAF7EE; }
.felt { position: absolute; inset: 0; background: radial-gradient(70% 50% at 50% 48%, #34312C, #1B1A18 70%); }
.spot { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(223,255,90,.16), rgba(223,255,90,0)); pointer-events: none; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .09;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.cap { position: absolute; left: 60px; right: 60px; text-align: center; font-family: 'Playfair Display'; font-weight: 800; letter-spacing: -0.02em; line-height: 1.0; z-index: 60; color: #FAF7EE; }
.slot { position: absolute; left: 0; top: 0; perspective: 2400px; transform-origin: 50% 50%; }
.c3 { position: absolute; inset: 0; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.back { background: #2A2724; box-shadow: inset 0 0 0 3px #45403A, inset 0 0 0 16px #2A2724, inset 0 0 0 18px #5A5550; }
.back .pat { position: absolute; inset: 30px; border-radius: 22px; background:
  repeating-linear-gradient(45deg, rgba(223,255,90,.07) 0 2px, transparent 2px 22px), repeating-linear-gradient(-45deg, rgba(223,255,90,.07) 0 2px, transparent 2px 22px); }
.back img { position: absolute; left: 50%; top: 50%; width: 44%; transform: translate(-50%, -50%); opacity: .92; }
.front { background: #FFFDF8; transform: rotateY(180deg); color: #1F1F1F; }
.front .top { position: absolute; left: 0; right: 0; top: 0; height: 190px; padding: 30px 36px 0; background: #EFEADF; border-bottom: 3px solid #1F1F1F; }
.front .kick { font: 600 19px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #6B655C; }
.front h2 { margin: 12px 0 0; font: 800 72px/1 'Playfair Display'; letter-spacing: -0.02em; }
.badge { position: absolute; right: 30px; top: 26px; font: 700 20px 'Archivo'; padding: 7px 14px; border-radius: 99px; white-space: nowrap; }
.front .money { position: absolute; left: 36px; right: 36px; top: 214px; font: 500 25px/1.32 'Archivo'; color: #2A2724; }
.front .money b { font-weight: 800; color: #1F1F1F; }
.front .rows { position: absolute; left: 36px; right: 36px; }
.front .mode { font: 600 17px 'IBM Plex Mono', monospace; letter-spacing: .08em; color: #8A8378; text-transform: uppercase; padding-bottom: 10px; border-bottom: 2px solid #ECE6DA; }
.front .r { display: flex; justify-content: space-between; align-items: center; height: 48px; border-bottom: 1.5px solid #F1ECE2; font: 500 25px 'Archivo'; }
.pill { font: 600 19px 'IBM Plex Mono', monospace; padding: 5px 12px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: #E1F1E6; color: #1E5E3E; border: 1.5px solid #BFDCC9; }
.pill.no { background: #EFEADF; color: #6B655C; border: 1.5px solid #D9D3C9; }
.pill.q { background: #FFF1D6; color: #8A5A12; border: 1.5px solid #EBD2A2; }
.front .foot { position: absolute; left: 36px; right: 36px; bottom: 24px; font: 500 17px 'IBM Plex Mono', monospace; color: #8A8378; letter-spacing: .04em; }
.holo { position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: 34px;
  background: linear-gradient(115deg, rgba(255,255,255,0) 28%, rgba(223,255,90,.55) 40%, rgba(255,255,255,.75) 47%, rgba(126,154,126,.45) 53%, rgba(232,96,60,.35) 59%, rgba(255,255,255,0) 70%);
  background-size: 300% 300%; mix-blend-mode: soft-light; }
.edge { position: absolute; inset: -8px; border-radius: 42px; border: 6px solid #DFFF5A; box-shadow: 0 0 60px rgba(223,255,90,.55); pointer-events: none; }
.shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
.chip { position: absolute; z-index: 70; font: 800 32px 'Archivo'; padding: 18px 30px; border-radius: 99px; white-space: nowrap; background: #DFFF5A; color: #1F1F1F; transform: translateX(-50%); }
.shot { position: absolute; z-index: 50; border-radius: 28px; overflow: hidden; background: #FAF7EE; box-shadow: 0 60px 110px -40px rgba(0,0,0,.8), 0 0 0 3px #DFFF5A; }
.shot img { position: absolute; max-width: none; display: block; }
.shot .demo { right: 14px; bottom: 12px; }
.note { position: absolute; z-index: 70; left: 60px; right: 60px; text-align: center; font: 500 25px/1.4 'IBM Plex Mono', monospace; color: #D9D3C9; }
</style></head>
<body><div id="stage"><div class="felt"></div></div>
<script src="kit.js"></script>
<script>
// C05 — trading cards. Four partner cards are dealt face down on a dark table; one by one each lifts off the pile,
// flips on the beat with a holographic sheen and shows what that partner is proven to do (copied from the real
// Partners screen, statuses and all), then files into your hand. The last one, Printful, is picked: your own
// account is connected and the partner bills it directly.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const B = 60 / 116, b = (n) => n * B;
const L = K.v({
  '9x16': { capY: 300, capFs: 104, cw: 600, ch: 780, cy: 870, handY: 330, handS: 0.17, pickS: 0.36, pickY: 642, shotY: 812, shotW: 760, chipY: 1130 },
  '4x5': { capY: 64, capFs: 88, cw: 540, ch: 720, cy: 730, handY: 64, handS: 0.15, pickS: 0.3, pickY: 334, shotY: 470, shotW: 700, chipY: 1150 },
});
const CW = L.cw, CH = L.ch;
const OK = 'supported', NO = 'not offered', NC = 'not confirmed';
const CARDS = [
  { name: 'Simulated', kick: 'PARTNER 01 / 04', badge: ['For trying the flow', '#1F1F1F', '#DFFF5A'], money: '<b>When money moves:</b> nothing leaves MakeAndList and no money moves.', mode: 'Simulated · built into MakeAndList', rows: [OK, OK, OK, OK, OK, NO] },
  { name: 'Gelato', kick: 'PARTNER 02 / 04', badge: ['Researched · no adapter yet', '#EFEADF', '#45403A'], money: '<b>When money moves:</b> Gelato charges when a draft becomes an order.', mode: 'Live · from the partner’s documentation', rows: [OK, OK, OK, OK, OK, NC] },
  { name: 'Prodigi', kick: 'PARTNER 03 / 04', badge: ['● Adapter built', '#E1F1E6', '#1E5E3E'], money: '<b>When money moves:</b> a live order goes straight to production and is charged, unless a pause window is set.', mode: 'Sandbox · built, not yet run against it', rows: [OK, OK, OK, OK, OK, NC] },
  { name: 'Printful', kick: 'PARTNER 04 / 04', badge: ['● Adapter built', '#E1F1E6', '#1E5E3E'], money: '<b>When money moves:</b> your Printful account is charged when an order you approved is confirmed. Drafts are free.', mode: 'Live · built, not yet run against it', rows: [NO, OK, OK, NO, OK, OK] },
];
const CAPS = ['Quotes', 'Sending orders', 'Looking an order up', 'Cancellations', 'Tracking', 'Signed updates'];
const pillCls = (v) => (v === OK ? 'ok' : v === NO ? 'no' : 'q');

const spot = K.box(W / 2 - 700, L.cy - 700, 1400, 1400, { cls: 'spot' });
const shadows = [], slots = CARDS.map((c, i) => {
  const sd = K.box(0, 0, CW * 1.1, 140, { cls: 'shadow' }); shadows.push(sd);
  const s = K.box(0, 0, CW, CH, { cls: 'slot', style: { zIndex: 10 + i } });
  const c3 = K.el('div', { cls: 'c3', parent: s });
  const back = K.el('div', { cls: 'face back', parent: c3, html: `<div class="pat"></div><img src="${K.brand('makeandlist-monogram-ivory.svg')}">` });
  const front = K.el('div', { cls: 'face front', parent: c3, html: `<div class="top"><div class="kick">${c.kick}</div><h2>${c.name}</h2></div>
    <div class="badge" style="background:${c.badge[1]};color:${c.badge[2]}">${c.badge[0]}</div>
    <div class="money">${c.money}</div>
    <div class="rows" style="top:${tall ? 396 : 350}px"><div class="mode">${c.mode}</div>${CAPS.map((k, j) => `<div class="r"><span>${k}</span><span class="pill ${pillCls(c.rows[j])}">${c.rows[j]}</span></div>`).join('')}</div>
    <div class="foot">From the Partners screen · demo workspace</div>` });
  const hb = K.el('div', { cls: 'holo', parent: back }), hf = K.el('div', { cls: 'holo', parent: front });
  const edge = K.el('div', { cls: 'edge', parent: s });
  return { s, c3, hb, hf, edge };
});
if (!tall) slots.forEach((S) => { S.s.querySelectorAll('.front .r').forEach((r) => { r.style.height = '44px'; r.style.fontSize = '23px'; }); S.s.querySelectorAll('.front .money').forEach((m) => { m.style.fontSize = '23px'; }); S.s.querySelectorAll('.front h2').forEach((h) => { h.style.fontSize = '64px'; }); });

const capEls = [];
function cap(text, fs) { const c = K.box(60, L.capY, W - 120, null, { cls: 'cap', style: { fontSize: (fs || L.capFs) + 'px' } }); capEls.push(c); return K.words(c, text); }
const hook = cap('Your printer.\nYour account.');
const fin = cap('Your partner bills\nyour own account.', L.capFs * 0.72);
const shot = (() => {
  const r = [24, 744, 732, 350], s = L.shotW / r[2], h = Math.round(r[3] * s);
  const el = K.box((W - L.shotW) / 2, L.shotY, L.shotW, h, { cls: 'shot' });
  K.el('img', { src: K.screen('62-phone-production-partners'), parent: el, style: { width: 780 * s + 'px', left: -r[0] * s + 'px', top: -r[1] * s + 'px' } });
  K.el('div', { cls: 'demo', parent: el, html: 'Real app · demo workspace' });
  return { el, h };
})();
const chip = K.box(W / 2, L.chipY, null, null, { cls: 'chip', html: 'Picked: Printful', style: { width: 'auto', height: 'auto' } });
const note = K.box(60, L.shotY + shot.h + 26, W - 120, null, { cls: 'note', html: 'Connecting moves no money.' });
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Your printer.<br>Your account.' });

// beats: deal 1–3; card k lifts on 4 + 4k, flips half a beat later, files into the hand on 7.5 + 4k; pick on 19.5
const LIFT = [0, 1, 2, 3].map((k) => b(4 + 4 * k)), FLIP = LIFT.map((t) => t + b(0.5)), FILE = LIFT.map((t) => t + b(3.5));
const PICK = b(19.5), CONNECT = b(21.5);
const seed = (n) => { const x = Math.sin(n * 91.7 + 13.1) * 43758.5; return x - Math.floor(x); };

K.run({
  id: 'C05', title: 'Pick Your Partner', dur: DUR, bpm: 116, mood: 'bright', key: 'B', intro: 2.07, cover: 9.4,
  technique: 'Trading-card flips on a dark table: four partner cards are dealt face down, each lifts off the pile and flips on the beat in CSS 3D with a moving holographic sheen to show what that partner is proven to do, then files into the hand; the last is picked with a lime edge and becomes the real connected-account screen',
  caption: 'Choose your print partner: Printful, Prodigi, Gelato, or a simulated partner to try the flow. Each one says what it is proven to do. You connect your own account, and printing is billed there, never in Credits. Start free at makeandlist.com',
  short: 'Your printer. Your account.',
  beats: ['0–2.1 s: “Your printer. Your account.” — four cards dealt face down', '2.1–4.1 s: Simulated — for trying the flow, no money moves', '4.1–6.2 s: Gelato — researched, no adapter yet', '6.2–8.3 s: Prodigi — adapter built, sandbox', '8.3–11 s: Printful — flipped and picked', '11–13 s: your own account connected — the partner bills it; 13–15 s end card'],
  cues: [[0.1, 'swish'], [b(1), 'paper'], [b(1.5), 'paper'], [b(2), 'paper'], [b(2.5), 'paper'],
    ...LIFT.flatMap((t, k) => [[t, 'swish'], [FLIP[k], 'pop']]), ...FILE.slice(0, 3).map((t) => [t, 'paper']),
    [b(18), 'riser'], [PICK, 'hit'], [PICK + b(0.5), 'chime'], [CONNECT - 0.25, 'whoosh'], [CONNECT, 'pop'], [CONNECT + b(1), 'click'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 3) - 0.5) * 60}px)`;
  spot.style.transform = `translate(${Math.sin(T * 0.7) * 60}px, ${Math.cos(T * 0.5) * 40}px)`;
  K.reveal(hook, T, 0.1, { kind: 'up', stagger: 0.08, out: LIFT[0] - 0.3 });
  K.reveal(fin, T, CONNECT + 0.05, { kind: 'up', stagger: 0.07 });
  capEls[0].style.visibility = T < LIFT[0] + 0.1 ? 'visible' : 'hidden';
  capEls[1].style.visibility = T > CONNECT - 0.1 ? 'visible' : 'hidden';

  const pickP = K.p(T, PICK, PICK + 0.45, E.outBack);
  const toTop = K.p(T, CONNECT - 0.35, CONNECT + 0.3, E.inOutCubic);
  slots.forEach((S, k) => {
    // the pile: dealt in, fanned a little, waiting
    const deal = K.p(T, b(1 + k * 0.5) - 0.2, b(1 + k * 0.5) + 0.3, E.outExpo);
    const pileIdx = 3 - k; // the first to show is on top
    let x = W / 2 + (pileIdx - 1.5) * 16, y = L.cy + 20 + pileIdx * 8, rot = (pileIdx - 1.5) * 4, sc = 0.92, ry = 0, z = 10 + (3 - pileIdx);
    x = K.lerp(W / 2 + (k - 1.5) * 300, x, deal); y = K.lerp(H + CH, y, deal); rot = K.lerp((k - 1.5) * 30, rot, deal);
    // lift and flip
    const lift = K.p(T, LIFT[k] - 0.15, LIFT[k] + 0.35, E.outExpo);
    const flip = K.p(T, FLIP[k] - 0.1, FLIP[k] + 0.4, E.outBack);
    x = K.lerp(x, W / 2, lift); y = K.lerp(y, L.cy - 18, lift); rot = K.lerp(rot, 0, lift); sc = K.lerp(sc, 1.04, lift);
    ry = 180 * flip;
    // the held card breathes and tilts so the sheen moves
    const hold = lift * (k === 3 ? 1 : 1 - K.p(T, FILE[k], FILE[k] + 0.4, E.inOutCubic));
    const tilt = Math.sin(T * 2.1 + k) * 7 * hold;
    // file into the hand row (all but the last)
    if (k < 3) {
      const fp = K.p(T, FILE[k], FILE[k] + 0.45, E.inOutCubic);
      const hx = W / 2 + (k - 1.5) * (CW * L.handS + 24) + CW * L.handS * 0.5 + 12, hy = L.handY + CH * L.handS / 2;
      x = K.lerp(x, hx, fp); y = K.lerp(y, hy, fp); sc = K.lerp(sc, L.handS, fp); rot = K.lerp(rot, (k - 1) * 4, fp);
      z = fp > 0.5 ? 30 + k : z + (lift > 0 ? 20 : 0);
      // hand cards dim when Printful is picked
      S.s.style.filter = `brightness(${1 - 0.5 * pickP})`;
      S.s.style.opacity = 1 - K.p(T, CONNECT - 0.4, CONNECT, E.linear);
    } else {
      z = lift > 0 ? 40 : z;
      x = K.lerp(x, W / 2, toTop); y = K.lerp(y, L.pickY, toTop); sc = K.lerp(sc, L.pickS, toTop) * (1 + 0.05 * pickP * (1 - toTop));
      S.s.style.opacity = 1;
    }
    if (lift > 0 && k < 3 && T < FILE[k]) z = 40;
    S.s.style.zIndex = z;
    S.s.style.transform = `translate(${x - CW / 2}px, ${y - CH / 2}px) scale(${sc}) rotate(${rot}deg)`;
    S.c3.style.transform = `rotateY(${ry + tilt}deg) rotateX(${Math.cos(T * 1.7 + k) * 4 * hold}deg)`;
    const sheen = 100 - ((ry + tilt * 6) / 180) * 100;
    S.hf.style.backgroundPosition = `${sheen}% 50%`; S.hb.style.backgroundPosition = `${sheen + 40}% 50%`;
    S.hf.style.opacity = 0.35 + 0.65 * Math.abs(Math.sin((ry + tilt * 4) * Math.PI / 180 * 2));
    S.edge.style.opacity = k === 3 ? pickP : 0;
    S.edge.style.transform = `scale(${1 + 0.03 * Math.sin(T * 6) * pickP})`;
    const sd = shadows[k];
    sd.style.left = x - CW * 0.55 + 'px'; sd.style.top = y + CH * sc * 0.5 - 40 + 'px';
    sd.style.opacity = (deal * 0.7) * (k < 3 ? 1 - K.p(T, FILE[k], FILE[k] + 0.3, E.linear) : 1 - toTop);
    sd.style.transform = `scale(${sc}, ${sc * (1 + lift * 0.4)})`;
    sd.style.zIndex = 5;
  });
  // the pick
  chip.style.opacity = K.p(T, PICK + 0.15, PICK + 0.4, E.linear) * (1 - K.p(T, CONNECT - 0.4, CONNECT - 0.1, E.linear));
  chip.style.transform = `translateX(-50%) scale(${0.7 + 0.3 * K.p(T, PICK + 0.15, PICK + 0.55, E.outBack)})`;
  chip.style.top = (L.cy + CH / 2 - (tall ? 50 : 40)) + 'px';
  // the connected account
  const sp = K.p(T, CONNECT, CONNECT + 0.6, E.outExpo);
  shot.el.style.opacity = Math.min(1, sp * 1.5); shot.el.style.visibility = sp > 0 ? 'visible' : 'hidden';
  shot.el.style.transform = `translateY(${(1 - sp) * 160 + Math.sin(T * 1.4) * 4}px) scale(${0.92 + 0.08 * sp})`;
  const np = K.p(T, CONNECT + 0.5, CONNECT + 1.0, E.outExpo);
  note.style.opacity = np; note.style.transform = `translateY(${(1 - np) * 20}px)`;
  end(T);
});
</script></body></html>
