<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>H15 · Work as a Team</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #F4EFE5; }
.bg { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 35%, #FBF8F1 0%, #F2ECE0 60%, #E7DFD0 100%); }
.wash { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(50px); }
.fchip { position: absolute; z-index: 80; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 10px; border-radius: 99px;
  background: #1F1F1F; color: #FAF7EE; font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .04em; white-space: nowrap; box-shadow: 0 16px 30px -18px rgba(31,31,31,.7); }
.fchip b { display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 99px; background: #DFFF5A; color: #1F1F1F; font-weight: 600; }
.fchip i { font-style: normal; color: #8A8378; }
.fchip span { font: 700 25px 'Archivo'; letter-spacing: 0; }
.cap { position: absolute; z-index: 40; font: 800 80px/0.98 'Playfair Display'; letter-spacing: -0.03em; color: #1F1F1F; }
.cap em { font-style: italic; font-weight: 600; background: linear-gradient(transparent 62%, #DFFF5A 62%, #DFFF5A 92%, transparent 92%); padding: 0 .04em; }
.badge { position: absolute; z-index: 24; transform-origin: 50% 0; }
.badge .card { position: absolute; inset: 0; border-radius: 26px; background: #FFFDF8; box-shadow: 0 40px 60px -34px rgba(31,31,31,.6), 0 0 0 1px #E2DBCE; }
.badge .empty { position: absolute; inset: 0; border-radius: 26px; border: 3px dashed #B7AE9F; display: grid; place-items: center; font: 300 90px 'Archivo'; color: #B7AE9F; }
.badge .hole { position: absolute; left: 50%; top: 18px; width: 64px; height: 12px; margin-left: -32px; border-radius: 6px; background: #E7DFD0; box-shadow: inset 0 2px 3px rgba(31,31,31,.25); }
.badge .clip { position: absolute; left: 50%; top: -26px; width: 38px; height: 48px; margin-left: -19px; border-radius: 8px; background: linear-gradient(180deg, #D5CEC1, #9C9486); }
.badge .av { position: absolute; left: 50%; top: 52px; width: 104px; height: 104px; margin-left: -52px; border-radius: 50%; background: #1F1F1F; color: #FAF7EE; display: grid; place-items: center; font: 700 52px 'Playfair Display'; }
.badge .nm { position: absolute; left: 0; right: 0; top: 172px; text-align: center; font: 800 38px 'Playfair Display'; color: #1F1F1F; }
.badge .ro { position: absolute; left: 50%; top: 230px; transform: translateX(-50%); padding: 9px 20px; border-radius: 99px; font: 700 24px 'Archivo'; white-space: nowrap; }
.ro.own { background: #1F1F1F; color: #DFFF5A; }
.ro.adm { background: #DFFF5A; color: #1F1F1F; box-shadow: inset 0 0 0 2px #1F1F1F; }
.ro.mem { background: #EFEADF; color: #1F1F1F; box-shadow: inset 0 0 0 2px #C9C1B3; }
.badge .sub { position: absolute; left: 0; right: 0; top: 290px; text-align: center; font: 500 18px 'IBM Plex Mono', monospace; color: #6B645A; }
.panel { position: absolute; z-index: 30; border-radius: 22px; background: #FFFDF8; overflow: hidden; box-shadow: 0 40px 70px -34px rgba(31,31,31,.6), 0 0 0 1px #E2DBCE; }
.cropbox { position: absolute; overflow: hidden; }
.cropbox img { position: absolute; left: 0; top: 0; display: block; }
.typ { position: absolute; z-index: 3; background: #FFFDF8; font: 500 20px 'Archivo'; color: #1F1F1F; display: flex; align-items: center; padding-left: 12px; white-space: nowrap; overflow: hidden; }
.typ i { display: inline-block; width: 2px; height: 1.1em; background: #1F1F1F; margin-left: 2px; }
.env { position: absolute; z-index: 45; width: 150px; height: 100px; margin: -50px 0 0 -75px; }
.rowhl { position: absolute; z-index: 4; background: #DFFF5A; mix-blend-mode: multiply; border-radius: 8px; }
.prod { position: absolute; z-index: 22; }
.prod img { width: 100%; display: block; filter: drop-shadow(0 22px 22px rgba(31,31,31,.35)); }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// H15 — Work as a team (Feature 15 / 16). Name badges: the owner's badge clips on beside two empty, dashed slots.
// The real "Invite by email" row types an address and sends; an envelope flies into a slot and the badge fills —
// Lena, Member, invited. Deniz's badge clips on and its role flips to Admin as Marian says it, over the real members
// list. Then the real "Who did what" log reveals line by line, with concept products of the shop beneath.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 143.6, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// Marian (speech ≈ 0.36–1.93 · 2.23–4.37 · 5.32–8.06 · 8.63–10.08); taps and impacts in the breaths.
const VO = [[0.3, 'Is your shop more than just you?'], [2.2, 'Invite them to your workspace by email.'],
  [4.75, 'Give each person a role: admin or member.'], [8.4, 'And see who did what.']];
const T_S2 = 2.05, T_SEND = 4.45, T_LAND = 4.95, T_S3 = 5.2, T_ADM = 7.0, T_MEM = 7.7, T_S4 = 8.25;

const L = tall
  ? { chip: [65, 290], capX: 65, capY: 370, capFs: 80, bY: 820, bW: 290, bH: 330, bX: [65, 395, 725], inv: [65, 600, 950], mem: [65, 600, 950], log: [65, 600, 950], prodY: 1040, tagY: 1196 }
  : { chip: [60, 56], capX: 60, capY: 130, capFs: 70, bY: 640, bW: 290, bH: 330, bX: [95, 395, 695], inv: [60, 330, 960], mem: [60, 330, 960], log: [60, 330, 960], prodY: 790, tagY: 1278 };

K.box(0, 0, W, H, { cls: 'bg' });
const washes = [0, 1].map((i) => K.box(0, 0, 900, 900, { cls: 'wash', style: { background: ['rgba(255,236,206,.6)', 'rgba(223,255,90,.16)'][i] } }));
const stage = document.getElementById('stage');
function crop(parent, src, nat, sx, sy, sw, sh, x, y, dw, cls) {
  const s = dw / sw;
  const box = K.el('div', { parent, cls: (cls || '') + ' cropbox', style: { left: x + 'px', top: y + 'px', width: dw + 'px', height: sh * s + 'px' } });
  K.el('img', { parent: box, src, style: { width: nat * s + 'px', transform: `translate(${-sx * s}px, ${-sy * s}px)` } });
  return { box, s, h: sh * s };
}

// ---------- badges ----------
const PEOPLE = [{ i: 'M', n: 'Maya', r: 'Owner', rc: 'own', sub: 'you' }, { i: 'D', n: 'Deniz', r: 'Member', rc: 'mem', sub: 'deniz@…' }, { i: 'L', n: 'Lena', r: 'Member', rc: 'mem', sub: 'invited · until 10 Sept' }];
const badges = PEOPLE.map((p, i) => {
  const b = K.box(L.bX[i], L.bY, L.bW, L.bH, { cls: 'badge', html: `<div class="empty">+</div><div class="card"><div class="hole"></div><div class="av">${p.i}</div><div class="nm">${p.n}</div><div class="ro ${p.rc}">${p.r}</div><div class="sub">${p.sub}</div></div><div class="clip"></div>` });
  return { b, empty: b.querySelector('.empty'), card: b.querySelector('.card'), ro: b.querySelector('.ro') };
});

// ---------- scene 2: the real invite row ----------
const M47 = K.screen('47-settings-members');
const inv = crop(stage, M47, 1440, 568, 572, 796, 90, L.inv[0], L.inv[1], L.inv[2], 'panel');
const typ = K.el('div', { parent: inv.box, cls: 'typ', style: { left: (577 - 568) * inv.s + 'px', top: (616 - 572) * inv.s + 'px', width: (464) * inv.s + 'px', height: 36 * inv.s + 'px', fontSize: Math.round(15 * inv.s) + 'px', borderRadius: 8 * inv.s + 'px' } });
const EMAIL = 'lena@paperandpines.co';
const note = crop(stage, M47, 1440, 572, 664, 362, 20, L.inv[0] + 8, L.inv[1] + inv.h + 14, 362 * inv.s * 1.1);
const cursor = K.cursor();
const env = K.box(0, 0, 150, 100, { cls: 'env', html: `<svg width="150" height="100" viewBox="0 0 150 100"><rect x="3" y="3" width="144" height="94" rx="10" fill="#FFFDF8" stroke="#1F1F1F" stroke-width="4"/><path d="M6 8 L75 58 L144 8" fill="none" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round"/><circle cx="118" cy="74" r="12" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="3"/></svg>` });

// ---------- scene 3: the real members list ----------
const mem = crop(stage, M47, 1440, 568, 404, 712, 136, L.mem[0], L.mem[1], L.mem[2], 'panel');
const memHl = K.el('div', { parent: mem.box, cls: 'rowhl', style: { left: (1190 - 568) * mem.s + 'px', top: (418 - 404) * mem.s + 'px', width: 80 * mem.s + 'px', height: 40 * mem.s + 'px', opacity: 0 } });
const memHl2 = K.el('div', { parent: mem.box, cls: 'rowhl', style: { left: (1190 - 568) * mem.s + 'px', top: (487 - 404) * mem.s + 'px', width: 80 * mem.s + 'px', height: 40 * mem.s + 'px', opacity: 0 } });

// ---------- scene 4: who did what ----------
const log = crop(stage, M47, 1440, 551, 806, 539, 222, L.log[0], L.log[1], L.log[2], 'panel');
const logRows = [878, 921, 964].map((y) => K.el('div', { parent: log.box, cls: 'rowhl', style: { left: 16 * log.s + 'px', top: (y - 806) * log.s + 'px', height: 40 * log.s + 'px', width: '0px' } }));
const logMask = [0, 1, 2].map((i) => K.el('div', { parent: log.box, style: { position: 'absolute', left: 0, right: 0, top: ([876, 919, 962][i] - 806) * log.s + 'px', height: 44 * log.s + 'px', background: '#FFFDF8', zIndex: 5 } }));
const PRODS = [['k07-sticker-sheet', 0.27, -6], ['k08-greeting-card', 0.22, 3], ['k14-gift-tag', 0.2, 8], ['k10-calendar', 0.25, -2]];
const prods = PRODS.map(([id, wf]) => K.box(0, 0, W * wf * (tall ? 0.95 : 0.8), null, { cls: 'prod', html: `<img src="${K.pub('r07/' + id + '.webp')}">` }));
const conceptTag = K.demoTag('Concept products · AI-generated', 0, 0);
const realTag = K.demoTag('Real app · demo workspace', 0, 0); realTag.style.zIndex = 61;

// captions
const mkCap = (txt, em) => {
  const c = K.box(L.capX, L.capY, W - 2 * L.capX, null, { cls: 'cap', style: { fontSize: L.capFs + 'px' } });
  const w = K.words(c, txt);
  em.forEach((i) => { const j = i < 0 ? w.length + i : i; w[j].innerHTML = `<em>${w[j].innerHTML.trim()}</em> `; });
  return { c, w };
};
const caps = [mkCap('Is your shop more\nthan just you?', [-2, -1]), mkCap('Invite them\nby email.', [-1]), mkCap('Give everyone\na role.', [-1]), mkCap('See who\ndid what.', [-1])];
const capT = [[0.3, T_S2], [T_S2 + 0.15, T_S3 - 0.05], [T_S3 + 0.15, T_S4 - 0.05], [T_S4 + 0.2, 99]];

const chip = K.box(L.chip[0], L.chip[1], null, null, { cls: 'fchip', style: { width: 'auto', height: '56px' }, html: '<b>Feature 15</b><i>/ 16 ·</i><span>Work as a team</span>' });
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'Your shop. Your team.' });

const swing = (T, t0) => { const u = Math.max(0, T - t0); return 8 * Math.exp(-u * 3) * Math.cos(u * 8) + Math.sin(T * 1.2 + t0) * 0.8; };

K.run({
  id: 'H15', title: 'Work as a Team', dur: DUR, bpm: BPM, music: 'ov-ukulele-quiet-background-melody', mood: 'warm', key: 'C', intro: 0, cover: 7.4,
  technique: 'Clip-on name badges: the owner’s badge swings in beside two dashed empty slots; the real “Invite by email” row types an address and sends, an envelope arcs into a slot and the badge fills (Lena · Member · invited); Deniz’s badge clips on and its role flips to Admin on the word, over the real members list; then the real “Who did what” log reveals line by line above concept products of the shop',
  caption: 'Work as a team: invite people to your workspace by email — the link works once, only for that address — and give each a role, admin or member. Every print order and partner change shows who did what. Start free at makeandlist.com',
  short: 'Invite by email. Give each a role.',
  vo: VO,
  beats: ['0–2 s: “Is your shop more than just you?” — the owner’s badge and two empty slots', '2–4.7 s: the real invite row: an email is typed, Member chosen, Send invitation; the link works once for that address', '4.7–8.2 s: badges fill — Lena, Member (invited); Deniz flips to Admin — over the real members list', '8.2–13 s: the real “Who did what” log, line by line; concept products of the shop', '13–15 s: end card'],
  cues: [[0.05, 'swish'], [0.3, 'pop'], [0.9, 'pop'], [1.05, 'pop'], [T_S2, 'swish'], [2.6, 'type'], [3.4, 'type'], [T_SEND, 'click'], [T_SEND + 0.1, 'whoosh'], [T_LAND, 'paper'], [T_LAND + 0.15, 'ding'],
    [T_S3 + 0.4, 'pop'], [T_ADM, 'click'], [T_MEM, 'click'], [T_S4, 'whoosh'], [8.75, 'pop'], [9.25, 'pop'], [9.75, 'pop'], [10.3, 'chime'], [10.9, 'paper'], [13.0, 'swish']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;
  washes[0].style.transform = `translate(${W * 0.65 - 450 + Math.sin(T * 0.4) * 120}px, ${H * 0.25 - 450 + Math.cos(T * 0.35) * 80}px)`;
  washes[1].style.transform = `translate(${W * 0.2 - 450 + Math.cos(T * 0.5) * 100}px, ${H * 0.7 - 450 + Math.sin(T * 0.45) * 90}px)`;
  const cp = K.p(T, 0.05, 0.55, E.outExpo);
  chip.style.opacity = cp * (1 - K.p(T, 12.85, 13.0, E.linear)); chip.style.clipPath = `inset(0 ${(1 - cp) * 100}% 0 0 round 99px)`; chip.style.transform = `translateX(${(1 - cp) * -30}px)`;

  // ---------- badges (scenes 1–3) ----------
  const bOut = K.p(T, T_S4 - 0.1, T_S4 + 0.45, E.inCubic);
  const fillT = [0.3, T_S3 + 0.4, T_LAND]; // when each badge is filled
  badges.forEach((bd, i) => {
    const inP = K.p(T, i === 0 ? 0.3 : 0.85 + i * 0.15, (i === 0 ? 0.3 : 0.85 + i * 0.15) + 0.5, E.outBack);
    const fp = K.p(T, fillT[i], fillT[i] + 0.35, E.outBack);
    bd.b.style.opacity = Math.min(1, inP * 2) * (1 - bOut);
    bd.b.style.transform = `translateY(${(1 - inP) * -80 - bOut * 140}px) rotate(${swing(T, i === 0 ? 0.3 : fillT[i]) * (1 - bOut)}deg)`;
    bd.card.style.opacity = i === 0 ? 1 : Math.min(1, fp * 2);
    bd.card.style.transform = `rotateY(${(1 - fp) * (i ? 90 : 0)}deg)`;
    bd.empty.style.opacity = i === 0 ? 0 : 1 - Math.min(1, fp * 2);
    bd.b.style.visibility = T < T_S4 + 0.5 ? 'visible' : 'hidden';
  });
  // Deniz: Member → Admin on the word; Lena's Member pill lights on "member"
  const adm = T >= T_ADM;
  badges[1].ro.className = 'ro ' + (adm ? 'adm' : 'mem'); badges[1].ro.innerHTML = adm ? 'Admin' : 'Member';
  const ap = K.p(T, T_ADM, T_ADM + 0.3, E.outBack), mp = K.p(T, T_MEM, T_MEM + 0.3, E.outBack);
  badges[1].ro.style.transform = `translateX(-50%) scale(${adm ? 0.8 + 0.2 * ap : 1})`;
  badges[2].ro.style.transform = `translateX(-50%) scale(${T >= T_MEM ? 1 + 0.12 * Math.sin(mp * Math.PI) : 1})`;
  badges[2].ro.style.boxShadow = T >= T_MEM ? `inset 0 0 0 2px #1F1F1F, 0 0 0 ${6 * (1 - mp) + 2}px rgba(223,255,90,.9)` : '';

  // ---------- scene 2: the invite row ----------
  const iIn = K.p(T, T_S2, T_S2 + 0.5, E.outExpo), iOut = K.p(T, T_S3 - 0.1, T_S3 + 0.25, E.inCubic);
  inv.box.style.opacity = iIn * (1 - iOut); inv.box.style.transform = `translateY(${(1 - iIn) * 60 - iOut * 40}px)`;
  inv.box.style.visibility = T >= T_S2 && T < T_S3 + 0.3 ? 'visible' : 'hidden';
  note.box.style.opacity = K.p(T, 2.7, 3.1, E.linear) * (1 - iOut); note.box.style.visibility = inv.box.style.visibility;
  const n = Math.round(EMAIL.length * K.p(T, 2.45, 3.9, E.linear));
  typ.innerHTML = (n ? EMAIL.slice(0, n) : '<span style="color:#8A8378">name@example.com</span>') + (T < T_SEND && Math.floor(T * 4) % 2 === 0 ? '<i></i>' : '');
  // the cursor taps "Send invitation"
  const sbx = L.inv[0] + (1290 - 568) * inv.s, sby = L.inv[1] + (633 - 572) * inv.s;
  const cm = K.p(T, 3.7, 4.35, E.inOutCubic);
  cursor.at(K.lerp(W * 0.8, sbx, cm), K.lerp(L.inv[1] + 320, sby, cm), T >= T_SEND && T < T_SEND + 0.15);
  cursor.hide(K.p(T, 3.6, 3.75, E.linear) * (1 - K.p(T, 4.7, 4.9, E.linear)));
  cursor.ripple(sbx + 8, sby + 8, T, T_SEND);
  // the envelope arcs into Lena's slot
  const ev = K.p(T, T_SEND + 0.05, T_LAND, E.inOutCubic);
  const tx = L.bX[2] + L.bW / 2, ty = L.bY + L.bH / 2;
  env.style.left = K.lerp(sbx, tx, ev) + 'px'; env.style.top = K.lerp(sby, ty, ev) - Math.sin(ev * Math.PI) * 160 + 'px';
  env.style.transform = `rotate(${(1 - ev) * -20 + ev * 8}deg) scale(${1 - 0.5 * K.p(T, T_LAND - 0.1, T_LAND + 0.1, E.inCubic)})`;
  env.style.opacity = T >= T_SEND && T < T_LAND + 0.1 ? 1 : 0;

  // ---------- scene 3: the real members list ----------
  const mIn = K.p(T, T_S3, T_S3 + 0.5, E.outExpo), mOut = K.p(T, T_S4 - 0.1, T_S4 + 0.3, E.inCubic);
  mem.box.style.opacity = mIn * (1 - mOut); mem.box.style.transform = `translateY(${(1 - mIn) * 60 - mOut * 40}px)`;
  mem.box.style.visibility = T >= T_S3 && T < T_S4 + 0.35 ? 'visible' : 'hidden';
  memHl.style.opacity = 0.6 * K.p(T, T_ADM, T_ADM + 0.2, E.linear); memHl2.style.opacity = 0.6 * K.p(T, T_MEM, T_MEM + 0.2, E.linear);

  // ---------- scene 4: who did what ----------
  const lIn = K.p(T, T_S4 + 0.05, T_S4 + 0.6, E.outExpo);
  log.box.style.opacity = lIn; log.box.style.transform = `translateY(${(1 - lIn) * 80}px) rotate(${-0.6 + Math.sin(T * 0.6) * 0.3}deg)`;
  log.box.style.visibility = T >= T_S4 ? 'visible' : 'hidden';
  [8.75, 9.25, 9.75].forEach((t, i) => {
    const p = K.p(T, t, t + 0.35, E.outCubic);
    logMask[i].style.transform = `translateX(${p * 100}%)`;
    logRows[i].style.width = (log.box.offsetWidth - 32 * log.s) * K.p(T, t + 0.2, t + 0.7, E.outCubic) * (1 - K.p(T, t + 1.2, t + 1.6, E.linear) * 0.6) + 'px';
    logRows[i].style.opacity = 0.5;
  });
  prods.forEach((p, i) => {
    const pp = K.p(T, 10.5 + i * 0.12, 11.1 + i * 0.12, E.outBack);
    const x = (tall ? 65 : 60) + i * (W - (tall ? 130 : 120)) / 4 + (i % 2) * 10;
    p.style.left = x + 'px';
    p.style.top = L.prodY + (i % 2) * 30 + (1 - pp) * 120 + Math.sin(T * 1.1 + i) * 4 + 'px';
    p.style.opacity = Math.min(1, pp * 2); p.style.transform = `rotate(${PRODS[i][2]}deg)`;
  });
  conceptTag.style.left = (tall ? 65 : 60) + 'px'; conceptTag.style.top = (tall ? L.prodY - 50 : L.prodY - 46) + 'px';
  conceptTag.style.opacity = K.p(T, 10.8, 11.2, E.linear) * (1 - K.p(T, 12.7, 12.95, E.linear));

  // real-app tag follows whichever crop is up
  const rp = T < T_S3 ? inv : T < T_S4 ? mem : log;
  realTag.style.left = (tall ? 65 : 60) + 'px';
  realTag.style.top = (T < T_S3 ? L.inv[1] : T < T_S4 ? L.mem[1] : L.log[1]) - 44 + 'px';
  realTag.style.opacity = T >= T_S2 + 0.3 && T < 12.9 ? 1 : 0;

  caps.forEach((c, i) => {
    const [a, b] = capT[i];
    K.reveal(c.w, T, a, { kind: 'up', stagger: 0.06, dur: 0.45, out: b < 90 ? b - 0.3 : undefined });
    c.c.style.visibility = T >= a - 0.05 && T < b + 0.1 ? 'visible' : 'hidden';
  });

  end(T);
});
</script></body></html>
