<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>E08 · Today's Forecast</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: radial-gradient(120% 80% at 50% 30%, #24313D 0%, #151C24 70%); }
.mapf { position: absolute; overflow: hidden; border-radius: 28px; background: #2B4256; box-shadow: 0 50px 100px -40px rgba(0,0,0,.8), 0 0 0 2px rgba(250,247,238,.12); }
.mapw { position: absolute; left: 0; top: 0; width: 1000px; height: 800px; transform-origin: 0 0; }
.mapw svg { position: absolute; left: 0; top: 0; overflow: visible; }
.pin { position: absolute; transform: translate(-50%, -100%); z-index: 6; }
.pin .lb { background: #FFFDF8; border-radius: 16px; padding: 10px 16px; display: grid; place-items: center; box-shadow: 0 14px 26px -12px rgba(0,0,0,.7); height: 58px; }
.pin .lb img { max-height: 30px; max-width: 150px; display: block; }
.pin .stem { width: 4px; height: 20px; background: #FFFDF8; margin: 0 auto; }
.pin .dot { width: 18px; height: 18px; border-radius: 50%; background: #DFFF5A; box-shadow: 0 0 0 4px #1F1F1F; margin: -2px auto 0; }
.wx { position: absolute; z-index: 7; transform: translate(-50%, -50%); }
.dr { position: absolute; z-index: 8; width: 56px; height: 70px; border-radius: 8px; background: #FFFDF8; box-shadow: 0 0 0 3px #1F1F1F, 0 10px 18px -8px rgba(0,0,0,.6); overflow: hidden; }
.dr::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 16px; background: #DFFF5A; border-bottom: 3px solid #1F1F1F; }
.dr::after { content: ''; position: absolute; left: 9px; right: 9px; top: 26px; height: 32px; background: repeating-linear-gradient(#C9C2B4 0 4px, transparent 4px 10px); }
.cnt { position: absolute; z-index: 9; transform: translate(-50%, 0); font: 700 22px 'IBM Plex Mono', monospace; background: #1F1F1F; color: #DFFF5A; padding: 4px 12px; border-radius: 99px; white-space: nowrap; }
.listed { position: absolute; z-index: 9; transform: translate(-50%, 0); font: 700 22px 'Archivo'; background: #DFFF5A; color: #1F1F1F; padding: 6px 14px; border-radius: 99px; white-space: nowrap; box-shadow: 0 0 0 3px #1F1F1F; }
.bug { position: absolute; z-index: 30; display: flex; align-items: center; gap: 18px; }
.bug .lg { background: #DFFF5A; color: #1F1F1F; font: 800 30px 'Archivo'; letter-spacing: .02em; padding: 10px 18px; border-radius: 12px; }
.bug .t { font: 800 50px/1 'Playfair Display'; color: #FAF7EE; letter-spacing: -0.01em; }
.bug .live { font: 600 20px 'IBM Plex Mono', monospace; color: #FAF7EE; letter-spacing: .18em; display: flex; align-items: center; gap: 10px; }
.bug .live i { width: 14px; height: 14px; border-radius: 50%; background: #E8603C; display: block; }
.chy { position: absolute; z-index: 30; display: flex; height: 112px; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
.chy .k { background: #1F1F1F; color: #DFFF5A; font: 700 24px 'IBM Plex Mono', monospace; letter-spacing: .16em; display: grid; place-items: center; padding: 0 26px; flex: none; }
.chy .v { position: relative; flex: 1; background: #FAF7EE; overflow: hidden; }
.chy .ln { position: absolute; left: 30px; right: 20px; top: 0; height: 112px; display: block; line-height: 112px; font-weight: 800; font-family: 'Playfair Display'; color: #1F1F1F; white-space: nowrap; letter-spacing: -0.01em; }
.chy .ln em { font-style: italic; background: linear-gradient(transparent 58%, #DFFF5A 58%, #DFFF5A 92%, transparent 92%); }
.tick { position: absolute; z-index: 30; height: 48px; overflow: hidden; background: rgba(15,20,26,.92); border-radius: 0 0 14px 14px; }
.tick span { position: absolute; top: 0; height: 48px; display: flex; align-items: center; white-space: nowrap; font: 500 22px 'IBM Plex Mono', monospace; color: #EFEADF; letter-spacing: .04em; }
.pct { position: absolute; z-index: 20; background: #FFFDF8; border-radius: 26px; padding: 22px 30px 24px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 4px #DFFF5A; }
.pct .n { font: 800 150px/0.9 'Archivo'; letter-spacing: -0.04em; color: #1F1F1F; font-variant-numeric: tabular-nums; }
.pct .n small { font-size: 80px; }
.pct .s { font: 700 34px/1.1 'Playfair Display'; font-style: italic; color: #1F1F1F; margin-top: 8px; }
.pct .j { font: 500 17px 'IBM Plex Mono', monospace; color: #6B645A; margin-top: 10px; letter-spacing: .04em; }
.adv { position: absolute; z-index: 22; background: #FAF7EE; border-radius: 24px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.85); }
.adv .hd { background: #DFFF5A; padding: 14px 26px; font: 700 26px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #1F1F1F; display: flex; gap: 14px; align-items: center; border-bottom: 3px solid #1F1F1F; }
.adv .bd { padding: 22px 26px 26px; }
.adv .tx { font: 800 46px/1.08 'Playfair Display'; color: #1F1F1F; letter-spacing: -0.01em; }
.adv .crop { position: relative; margin-top: 18px; height: 150px; border-radius: 14px; overflow: hidden; background: #FAF7EE; box-shadow: 0 0 0 2px #E2DBCE; }
.adv .crop img { position: absolute; left: 0; width: 100%; }
.adv .row { display: flex; gap: 14px; margin-top: 20px; align-items: center; }
.adv .yes { background: #1F1F1F; color: #DFFF5A; font: 800 34px 'Archivo'; padding: 14px 40px; border-radius: 99px; }
.adv .no { color: #6B645A; font: 600 24px 'Archivo'; }
.days { position: absolute; z-index: 24; display: flex; gap: 10px; }
.days .d { flex: 1; background: rgba(250,247,238,.96); border-radius: 18px; padding: 12px 8px 14px; text-align: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); }
.days .d b { display: block; font: 700 18px 'IBM Plex Mono', monospace; letter-spacing: .12em; color: #6B645A; }
.days .d span { display: block; font: 700 21px/1.1 'Archivo'; color: #1F1F1F; margin-top: 4px; }
.lgd { position: absolute; z-index: 12; font: 600 18px 'IBM Plex Mono', monospace; color: #EFEADF; letter-spacing: .1em; display: flex; align-items: center; gap: 10px; background: rgba(15,20,26,.7); padding: 8px 14px; border-radius: 10px; }
.lgd i { width: 90px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, rgba(223,255,90,.25), #DFFF5A, #9FBF24); display: block; }
.demo { z-index: 26; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 85; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.scan { position: absolute; inset: 0; pointer-events: none; z-index: 84; opacity: .05; background: repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 5px); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// E08 — Today's Forecast. A TV weather package for your shop: a map whose cities are the seller's own stores; a front of
// new products sweeps in; the radar fills with drafts (“100 % chance of drafts” — a joke about drafts-first, labelled as
// one); an advisory: nothing goes live until you say yes, proved by the real Send screen; a tap on Yes clears the clouds,
// suns pop over the stores and a five-day outlook rolls in. The chyron carries every line for muted viewers.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 89.1, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const VO = [
  [0.3, 'Here’s your shop forecast.'],
  [2.1, 'New products, moving in.'],
  [4.8, 'A hundred percent chance of drafts.', 1.08],
  [7.3, 'Nothing goes live without your yes.', 1.08],
  [9.85, 'Then, clear skies for your launch.', 1.1],
];
const T_FRONT = B(2.75), T_RAIN = B(7), T_ADV = B(10.75), T_YES = B(14.25), T_CLEAR = B(14.6), T_DAYS = B(16.25);

// ---------- layout ----------
const L = tall
  ? { bugY: 292, mx: 40, my: 390, mw: 1000, mh: 800, chyY: 1076, tickY: 1188, pctX: 590, pctY: 430, advX: 70, advY: 520, advW: 940, daysY: 900 }
  : { bugY: 46, mx: 60, my: 128, mw: 960, mh: 768, chyY: 918, tickY: 1030, pctX: 560, pctY: 160, advX: 110, advY: 250, advW: 860, daysY: 1110 };
const MS = L.mw / 1000;

// ---------- bug ----------
const bug = K.box(tall ? 50 : 60, L.bugY, null, null, { cls: 'bug', html: `<div class="lg">ML</div><div class="t">Shop forecast</div><div class="live"><i></i>LIVE</div>`, style: { width: 'auto', height: 'auto' } });

// ---------- map ----------
const mapf = K.box(L.mx, L.my, L.mw, L.mh, { cls: 'mapf' });
const mapw = K.el('div', { parent: mapf, cls: 'mapw' });
const LAND = [
  'M60 120 C 160 60, 330 70, 420 140 C 480 190, 450 300, 380 360 C 330 400, 360 480, 420 520 C 480 560, 440 700, 330 730 C 220 760, 120 700, 90 600 C 60 500, 140 440, 110 360 C 80 280, 20 190, 60 120 Z',
  'M520 90 C 640 40, 860 70, 930 160 C 980 230, 940 330, 880 380 C 830 420, 900 500, 900 580 C 900 680, 800 740, 690 730 C 600 720, 560 650, 590 580 C 620 520, 560 470, 520 420 C 470 360, 480 260, 520 200 C 540 160, 480 120, 520 90 Z',
];
mapw.insertAdjacentHTML('beforeend', `<svg width="1000" height="800" viewBox="0 0 1000 800">
  <defs><radialGradient id="rg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#DFFF5A" stop-opacity=".85"/><stop offset=".55" stop-color="#B8D63A" stop-opacity=".55"/><stop offset="1" stop-color="#9FBF24" stop-opacity="0"/></radialGradient>
   <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="40"/></filter></defs>
  ${Array.from({ length: 11 }, (_, i) => `<path d="M${i * 100} 0 V800" stroke="rgba(250,247,238,.06)" stroke-width="2"/>`).join('')}
  ${Array.from({ length: 9 }, (_, i) => `<path d="M0 ${i * 100} H1000" stroke="rgba(250,247,238,.06)" stroke-width="2"/>`).join('')}
  ${LAND.map((d) => `<path d="${d}" fill="#7E9A7E" stroke="#5F7A60" stroke-width="5"/><path d="${d}" fill="none" stroke="rgba(250,247,238,.25)" stroke-width="2" transform="translate(-6 -6)"/>`).join('')}
  <ellipse cx="470" cy="660" rx="56" ry="32" fill="#7E9A7E" stroke="#5F7A60" stroke-width="5"/>
  <g class="radar" filter="url(#wob)">${[[230, 260, 190], [700, 230, 200], [780, 520, 170], [250, 600, 180], [640, 640, 170], [470, 420, 150]].map(([x, y, r], i) => `<circle class="rb" data-i="${i}" cx="${x}" cy="${y}" r="${r}" fill="url(#rg)"/>`).join('')}</g>
  <g class="front"></g></svg>`);
const radar = mapw.querySelector('.radar'), rbs = [...mapw.querySelectorAll('.rb')];
const frontG = mapw.querySelector('.front');
// the front: a curved line with alternating cold triangles and warm half-discs, carrying three product glyphs
const FP = 'M0 -60 C 70 140, -40 300, 30 450 C 90 600, 10 740, 40 880';
frontG.insertAdjacentHTML('beforeend', `<path class="fl" d="${FP}" fill="none" stroke="#FAF7EE" stroke-width="10" stroke-linecap="round"/>`);
const flPath = frontG.querySelector('.fl');
const GLYPH = [
  `<rect x="-34" y="-44" width="68" height="88" rx="6" fill="#FFFDF8" stroke="#1F1F1F" stroke-width="5"/><circle cx="8" cy="-10" r="14" fill="#E8603C"/><path d="M-18 30 q10 -30 0 -50 M-18 4 q-14 -6 -12 -20" fill="none" stroke="#5F7A60" stroke-width="5" stroke-linecap="round"/>`,
  `<path d="M-46 -30 l24 -16 h44 l24 16 l-12 22 h-10 v52 h-48 v-52 h-10z" fill="#FFFDF8" stroke="#1F1F1F" stroke-width="5" stroke-linejoin="round"/><circle cx="0" cy="4" r="14" fill="#E8603C"/><path d="M-18 14 h36" stroke="#1F1F1F" stroke-width="4"/>`,
  `<rect x="-30" y="-34" width="52" height="66" rx="8" fill="#FFFDF8" stroke="#1F1F1F" stroke-width="5"/><path d="M22 -20 q26 0 26 18 q0 18 -26 18" fill="none" stroke="#1F1F1F" stroke-width="6"/><path d="M-16 -6 q10 -14 20 0 q-10 14 -20 0" fill="#7E9A7E"/>`,
];
let frontSyms = [], glyphs = [];
function buildFront() {
  if (frontSyms.length || !flPath.getTotalLength) return;
  const len = flPath.getTotalLength();
  for (let i = 0; i < 14; i++) {
    const d = (i + 0.5) / 14 * len, p = flPath.getPointAtLength(d), q = flPath.getPointAtLength(Math.min(len, d + 2));
    const a = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${a})`);
    g.innerHTML = i % 2 ? `<path d="M-18 0 A18 18 0 0 1 18 0 Z" fill="#E8603C" transform="rotate(180)"/>` : `<path d="M-18 0 L0 26 L18 0 Z" fill="#9CC3E6" transform="rotate(180)"/>`;
    frontG.appendChild(g);
  }
  [0.22, 0.5, 0.78].forEach((u, i) => {
    const p = flPath.getPointAtLength(u * len);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML = `<g transform="translate(${p.x - 80} ${p.y})">${GLYPH[i]}</g>`;
    frontG.appendChild(g); glyphs.push(g);
  });
  frontSyms = [1];
}
const frontLab = K.el('div', { parent: mapw, cls: 'lgd', html: 'Front · new products', style: { left: '0px', top: '0px' } });

// store pins (the cities)
const PINS = [['ikas', 230, 230], ['woocommerce', 715, 200], ['wix', 790, 515], ['gumroad', 245, 595], ['shopware', 640, 640]];
const pins = PINS.map(([s, x, y]) => {
  const p = K.el('div', { parent: mapw, cls: 'pin', style: { left: x + 'px', top: y + 'px' }, html: `<div class="lb"><img src="${K.pub('platforms/' + s + '.svg')}" style="${s === 'wix' ? 'filter:brightness(0)' : ''}"></div><div class="stem"></div><div class="dot"></div>` });
  // weather icon beside: a cloud that later turns to a sun
  const wx = K.el('div', { parent: mapw, cls: 'wx', style: { left: x + 92 + 'px', top: y - 70 + 'px' }, html: `<svg width="120" height="90" viewBox="0 0 120 90">
    <g class="sun"><circle cx="60" cy="45" r="22" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="4"/>${Array.from({ length: 8 }, (_, k) => `<path d="M60 45 m0 -30 v-10" stroke="#DFFF5A" stroke-width="6" stroke-linecap="round" transform="rotate(${k * 45} 60 45)"/>`).join('')}</g>
    <g class="cl"><path d="M28 72 h60 a18 18 0 0 0 0 -36 a26 26 0 0 0 -48 -6 a20 20 0 0 0 -12 42z" fill="#D9D3C9" stroke="#1F1F1F" stroke-width="4" stroke-linejoin="round"/></g></svg>` });
  const drs = [0, 1, 2].map(() => K.el('div', { parent: mapw, cls: 'dr' }));
  const cnt = K.el('div', { parent: mapw, cls: 'cnt', html: 'Draft', style: { left: x + 'px', top: y + 34 + 'px' } });
  const ls = K.el('div', { parent: mapw, cls: 'listed', html: '✓ Listed', style: { left: x + 'px', top: y + 34 + 'px' } });
  return { p, wx, sun: wx.querySelector('.sun'), cl: wx.querySelector('.cl'), drs, cnt, ls, x, y };
});
const lgd = K.el('div', { parent: mapf, cls: 'lgd', html: 'Radar · drafts <i></i>', style: { left: '22px', top: '22px' } });

// ---------- 100 % card ----------
const pct = K.box(L.pctX, L.pctY, null, null, { cls: 'pct', html: `<div class="n"><span>0</span><small>%</small></div><div class="s">chance of drafts</div><div class="j">A joke about drafts-first.<br>Not a forecast of sales.</div>`, style: { width: 'auto', height: 'auto' } });
const pctN = pct.querySelector('.n span');

// ---------- advisory ----------
const adv = K.box(L.advX, L.advY, L.advW, null, { cls: 'adv', html: `<div class="hd">⚠ Advisory · in effect</div><div class="bd">
  <div class="tx">Nothing goes live<br>until you say yes.</div>
  <div class="crop"><img src="${K.screen('72-phone-listing-send')}"></div>
  <div class="row"><div class="yes">Yes, list it</div><div class="no">or keep it a draft</div></div></div>`, style: { height: 'auto' } });
const cropImg = adv.querySelector('.crop img');
const cropW = L.advW - 52;
cropImg.style.top = -(1086 * cropW / 780) + 'px';
const advTag = K.demoTag('Real app · demo workspace', 0, 0);
const yesBtn = adv.querySelector('.yes');
const cur = K.cursor(); cur.hide(0);

// ---------- five-day outlook ----------
const DAYS = [['Mon', 'Idea', 'cl'], ['Tue', 'Drafts', 'dr'], ['Wed', 'Your yes', 'ok'], ['Thu', 'Listed', 'sun'], ['Fri', 'Printed per order', 'sun']];
const ICO = {
  cl: '<svg width="56" height="40" viewBox="0 0 120 90"><path d="M28 72 h60 a18 18 0 0 0 0 -36 a26 26 0 0 0 -48 -6 a20 20 0 0 0 -12 42z" fill="#D9D3C9" stroke="#1F1F1F" stroke-width="6"/></svg>',
  dr: '<svg width="56" height="40" viewBox="0 0 120 90"><rect x="38" y="10" width="44" height="58" rx="6" fill="#FFFDF8" stroke="#1F1F1F" stroke-width="6"/><rect x="38" y="10" width="44" height="14" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="6"/></svg>',
  ok: '<svg width="56" height="40" viewBox="0 0 120 90"><circle cx="60" cy="45" r="32" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="6"/><path d="M44 46 l12 12 l22 -24" fill="none" stroke="#1F1F1F" stroke-width="8" stroke-linecap="round"/></svg>',
  sun: '<svg width="56" height="40" viewBox="0 0 120 90"><circle cx="60" cy="45" r="22" fill="#DFFF5A" stroke="#1F1F1F" stroke-width="6"/>' + Array.from({ length: 8 }, (_, k) => `<path d="M60 15 v-10" stroke="#9FBF24" stroke-width="8" stroke-linecap="round" transform="rotate(${k * 45} 60 45)"/>`).join('') + '</svg>',
};
const daysW = tall ? 940 : 960;
const days = K.box((W - daysW) / 2, L.daysY, daysW, null, { cls: 'days', html: DAYS.map(([d, t, i]) => `<div class="d"><b>${d}</b>${ICO[i]}<span>${t}</span></div>`).join(''), style: { height: 'auto' } });
const dayEls = [...days.querySelectorAll('.d')];

// ---------- chyron + ticker ----------
const CHW = tall ? 950 : 960;
const chy = K.box((W - CHW) / 2, L.chyY, CHW, 112, { cls: 'chy', html: '<div class="k">Forecast</div><div class="v"></div>' });
const chyV = chy.querySelector('.v');
const CHY = [
  [0.25, 'Your <em>shop forecast</em>'],
  [VO[1][0] - 0.1, 'A front of <em>new products</em>'],
  [VO[2][0] - 0.1, '<em>100 %</em> chance of drafts'],
  [VO[3][0] - 0.1, 'Live only after <em>your yes</em>'],
  [VO[4][0] - 0.1, '<em>Clear skies</em> for your launch'],
];
const chyL = CHY.map(([, h]) => K.el('div', { parent: chyV, cls: 'ln', html: h, style: { fontSize: (tall ? 46 : 46) + 'px' } }));
const tick = K.box((W - CHW) / 2 + 16, L.tickY - 6, CHW - 32, 48, { cls: 'tick', html: '<span></span>' });
const TICK = 'Printed products are printed per order by your own print partner · paid from your partner account, never Credits · drafts first, always · this forecast is a joke, not a prediction · ';
tick.firstChild.textContent = TICK + TICK;
const grain = K.box(0, 0, W, H, { cls: 'gr' });
K.box(0, 0, W, H, { cls: 'scan' });
const end = K.endCard(13.0, { lift: tall ? 160 : 0, line: 'Clear skies for<br>your launch.' });

K.run({
  id: 'E08', title: "Today's Forecast", dur: DUR, bpm: BPM, music: 'a-small-town-on-pluto', mood: 'bright', key: 'C', intro: 0.0, cover: 6.4,
  technique: 'A TV weather package: a stylised map whose cities are the seller’s store pins, a weather front drawn with alternating cold triangles and warm half-discs that carries three product glyphs across, a displaced radar layer that fills with drafts as little draft cards rain onto each pin, a counting “100 %” card, an advisory panel with the real Send screen and a tapped Yes that clears the clouds into suns, and a five-day outlook; a chyron and ticker carry every line',
  caption: 'Your shop forecast: a front of new products moving in, a 100 % chance of drafts (we promise — drafts first, always), and nothing goes live until you say yes. Printing is per order, by your own partner. Start free at makeandlist.com',
  short: '100 % chance of drafts.',
  question: 'Can I trust it?', gain: 'Control: drafts first; your stores',
  vo: VO,
  beats: ['0–1.9 s: the weather package: “Here’s your shop forecast” — store pins pop onto the map', '1.9–4.7 s: a front of new products sweeps across the map', '4.7–7.2 s: the radar fills; drafts rain onto each store — “100 % chance of drafts” (labelled a joke)', '7.2–9.8 s: advisory: nothing goes live until you say yes — the real Send screen; tap Yes', '9.8–13 s: clouds clear to suns, “Listed” on each pin, a five-day outlook', '13–15 s: end card'],
  cues: [[0.0, 'whoosh'], [0.1, 'hit'], [B(0.5), 'pop'], [B(0.75), 'pop'], [B(1), 'pop'], [B(1.25), 'pop'], [B(1.5), 'pop'],
    [T_FRONT - 0.05, 'swish'], [T_RAIN - 0.1, 'whoosh'], [T_RAIN + 0.3, 'pop'], [T_RAIN + 0.6, 'pop'], [T_RAIN + 0.9, 'pop'], 
    [T_ADV - 0.15, 'swish'], [T_YES, 'click'], [T_CLEAR + 0.05, 'chime'], [T_DAYS, 'swish'], [13.0, 'hit']],
}, (T) => {
  buildFront();
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;

  // package in
  const pin = K.p(T, 0, 0.6, E.outExpo);
  mapf.style.opacity = pin; mapf.style.transform = `translateY(${(1 - pin) * 80}px) scale(${0.94 + 0.06 * pin})`;
  const bp = K.p(T, 0.1, 0.6, E.outExpo);
  bug.style.opacity = bp; bug.style.transform = `translateX(${(1 - bp) * -80}px)`;
  bug.querySelector('.live i').style.opacity = Math.floor(T * 2) % 2 ? 0.35 : 1;

  // slow map camera drift
  const cz = 1.04 + 0.04 * Math.sin(T * 0.25);
  mapw.style.transform = `scale(${MS * cz}) translate(${Math.sin(T * 0.3) * -12 - 20}px, ${Math.cos(T * 0.22) * -8 - 16}px)`;

  // the front sweeps across, carrying the products
  const fp = K.p(T, T_FRONT, T_RAIN + 0.4, E.inOutCubic);
  const fx = K.lerp(-60, 470, fp) + K.p(T, T_RAIN + 0.4, T_CLEAR, E.linear) * 120 + K.p(T, T_CLEAR, T_CLEAR + 0.7, E.inCubic) * 700;
  frontG.setAttribute('transform', `translate(${fx} 0)`);
  frontG.style.opacity = T >= T_FRONT ? 1 : 0;
  glyphs.forEach((g, i) => { g.setAttribute('transform', `translate(0 ${Math.sin(T * 2 + i) * 6})`); });
  frontLab.style.left = fx + 60 + 'px'; frontLab.style.top = '330px';
  frontLab.style.opacity = K.win(T, T_FRONT + 0.6, T_RAIN + 0.2, 0.3);

  // radar fills with drafts
  const rp = K.p(T, T_RAIN - 0.1, T_RAIN + 0.9, E.outCubic) * (1 - K.p(T, T_CLEAR, T_CLEAR + 0.6, E.inCubic));
  radar.style.opacity = rp;
  rbs.forEach((c, i) => c.setAttribute('transform', `translate(${Math.sin(T * 0.8 + i) * 18} ${Math.cos(T * 0.6 + i) * 12})`));
  lgd.style.opacity = rp;

  // pins, clouds, drafts, listed
  pins.forEach((P, i) => {
    const pp = K.p(T, B(0.5 + i * 0.25), B(0.5 + i * 0.25) + 0.45, E.outBack);
    P.p.style.transform = `translate(-50%, -100%) scale(${pp})`; P.p.style.transformOrigin = '50% 100%';
    const cw = K.p(T, T_FRONT + 0.6 + i * 0.12, T_FRONT + 1.1 + i * 0.12, E.outBack);
    const clr = K.p(T, T_CLEAR + i * 0.08, T_CLEAR + 0.5 + i * 0.08, E.inOutCubic);
    P.wx.style.opacity = Math.min(1, cw * 2);
    P.wx.style.transform = `translate(-50%, -50%) scale(${0.5 + 0.5 * cw})`;
    P.cl.setAttribute('transform', `translate(${clr * 90 + Math.sin(T + i) * 3} 0)`); P.cl.setAttribute('opacity', 1 - clr);
    const sp = K.p(T, T_CLEAR + 0.15 + i * 0.08, T_CLEAR + 0.6 + i * 0.08, E.outBack);
    P.sun.setAttribute('opacity', sp > 0 ? 1 : 0);
    P.sun.setAttribute('transform', `rotate(${T * 30} 60 45) translate(60 45) scale(${sp}) translate(-60 -45)`);
    P.drs.forEach((d, k) => {
      const t0 = T_RAIN + 0.15 + i * 0.1 + k * 0.28;
      const dp = K.p(T, t0, t0 + 0.4, E.outBack);
      const gone = K.p(T, T_CLEAR - 0.05, T_CLEAR + 0.3, E.inCubic);
      d.style.left = P.x - 28 + (k - 1) * 8 + 'px';
      d.style.top = P.y - 160 + (1 - dp) * -260 - k * 8 + 'px';
      d.style.opacity = T >= t0 ? 1 - gone : 0;
      d.style.transform = `rotate(${(k - 1) * 8 + (1 - dp) * 20}deg) scale(${1 - gone * 0.5})`;
      d.style.zIndex = 8 + k;
    });
    const cp = K.p(T, T_RAIN + 1.0 + i * 0.1, T_RAIN + 1.3 + i * 0.1, E.outBack);
    P.cnt.style.opacity = T < T_CLEAR ? Math.min(1, cp * 2) : 0;
    P.cnt.style.transform = `translate(-50%, 0) scale(${0.6 + 0.4 * cp})`;
    const lp = K.p(T, T_CLEAR + 0.3 + i * 0.1, T_CLEAR + 0.6 + i * 0.1, E.outBack);
    P.ls.style.opacity = T >= T_CLEAR ? Math.min(1, lp * 2) : 0;
    P.ls.style.transform = `translate(-50%, 0) scale(${0.6 + 0.4 * lp})`;
  });

  // 100 %
  const pc = K.p(T, T_RAIN + 0.1, T_RAIN + 0.55, E.outBack), po = K.p(T, T_ADV - 0.3, T_ADV, E.inCubic);
  pct.style.opacity = Math.min(1, pc * 2) * (1 - po);
  pct.style.transform = `translateY(${(1 - pc) * 40 - po * 30}px) scale(${0.8 + 0.2 * pc}) rotate(${-2 + Math.sin(T * 1.2) * 0.6}deg)`;
  pct.style.visibility = T >= T_RAIN && T < T_ADV ? 'visible' : 'hidden';
  pctN.textContent = K.count(T, T_RAIN + 0.1, T_RAIN + 0.9, 0, 100);

  // advisory with the real Send screen; the tap on Yes
  const ap = K.p(T, T_ADV - 0.1, T_ADV + 0.45, E.outExpo), ao = K.p(T, T_YES + 0.2, T_YES + 0.5, E.inCubic);
  adv.style.opacity = ap * (1 - ao);
  adv.style.transform = `translateY(${(1 - ap) * 120 + ao * 60}px) scale(${1 - ao * 0.06})`;
  adv.style.visibility = T >= T_ADV - 0.1 && T < T_YES + 0.5 ? 'visible' : 'hidden';
  const ab = adv.getBoundingClientRect();
  const crop = adv.querySelector('.crop').getBoundingClientRect();
  advTag.style.left = crop.right - 330 + 'px'; advTag.style.top = crop.bottom - 40 + 'px';
  advTag.style.opacity = adv.style.opacity; advTag.style.visibility = adv.style.visibility;
  const yb = yesBtn.getBoundingClientRect();
  const tx = yb.left + yb.width * 0.55, ty = yb.top + yb.height * 0.5;
  const ci = K.p(T, T_YES - 0.8, T_YES - 0.05, E.inOutCubic);
  cur.at(K.lerp(tx + 260, tx, ci), K.lerp(ty + 200, ty, ci), T > T_YES && T < T_YES + 0.15);
  cur.hide(K.win(T, T_YES - 0.85, T_YES + 0.45, 0.15));
  cur.ripple(tx + 10, ty + 10, T, T_YES);
  yesBtn.style.background = T >= T_YES ? '#DFFF5A' : '#1F1F1F'; yesBtn.style.color = T >= T_YES ? '#1F1F1F' : '#DFFF5A';
  yesBtn.style.transform = `scale(${T >= T_YES && T < T_YES + 0.12 ? 0.94 : 1})`;
  void ab;

  // clear skies: the map brightens
  const cl = K.p(T, T_CLEAR, T_CLEAR + 0.8, E.outCubic);
  mapf.style.background = `rgb(${K.lerp(43, 92, cl)}, ${K.lerp(66, 140, cl)}, ${K.lerp(86, 178, cl)})`;

  // five-day outlook
  dayEls.forEach((d, i) => {
    const p = K.p(T, T_DAYS + i * 0.09, T_DAYS + 0.45 + i * 0.09, E.outBack);
    d.style.opacity = Math.min(1, p * 2); d.style.transform = `translateY(${(1 - p) * 50}px)`;
  });
  days.style.visibility = T >= T_DAYS ? 'visible' : 'hidden';

  // chyron
  const chIn = K.p(T, 0.15, 0.6, E.outExpo);
  chy.style.opacity = chIn; chy.style.transform = `translateX(${(1 - chIn) * -100}px)`;
  let ci2 = 0; CHY.forEach(([t], i) => { if (T >= t) ci2 = i; });
  chyL.forEach((ln, i) => {
    const a = CHY[i][0], b = i < CHY.length - 1 ? CHY[i + 1][0] : 99;
    const p = K.p(T, a, a + 0.4, E.outExpo), o = K.p(T, b - 0.05, b + 0.25, E.inCubic);
    ln.style.transform = `translateY(${(1 - p) * 112 - o * 112}px)`;
    ln.style.opacity = T >= a && T < b + 0.25 ? 1 : 0;
  });
  void ci2;
  tick.style.opacity = chIn;
  tick.firstChild.style.transform = `translateX(${-((T * 110) % (tick.firstChild.scrollWidth / 2 || 1))}px)`;

  end(T);
});
</script></body></html>
