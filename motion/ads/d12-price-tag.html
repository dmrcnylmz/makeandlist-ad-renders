<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>D12 · The Price Tag</title><link rel="stylesheet" href="kit.css">
<style>
#stage { background: #CDB596; }
.ph { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
.shade { position: absolute; inset: 0; pointer-events: none; }
.grp { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.str { position: absolute; width: 3px; margin-left: -1.5px; top: 0; border-radius: 2px;
  background: repeating-linear-gradient(170deg, #8C6B48 0 5px, #B48D63 5px 9px); box-shadow: 0 0 0 .5px rgba(60,40,20,.25); }
.tag { position: absolute; top: 0; filter: drop-shadow(0 26px 22px rgba(40,28,14,.35)) drop-shadow(0 4px 4px rgba(40,28,14,.25)); }
.tag svg.shape { position: absolute; left: 0; top: 0; overflow: visible; }
.tag .in { position: absolute; left: 0; right: 0; padding: 0 30px; text-align: left; color: #2A2724; }
.tag .no { font: 600 22px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #6B5539; }
.tag .hd { font-family: 'Playfair Display'; font-weight: 800; letter-spacing: -0.02em; line-height: .98; margin-top: 14px; }
.tag .hd em { font-style: normal; color: #B8442A; }
.tag .sm { font: 600 23px/1.25 'Archivo'; margin-top: 16px; color: #45403A; }
.tag .rule { height: 2px; margin-top: 18px; background: repeating-linear-gradient(90deg, rgba(42,39,36,.45) 0 8px, transparent 8px 14px); }
.peg { position: absolute; width: 22px; height: 60px; margin-left: -11px; top: -34px; border-radius: 5px;
  background: linear-gradient(90deg, #C79A64, #E3BE8C 45%, #B98A55); box-shadow: 0 6px 10px -4px rgba(40,28,14,.5); z-index: 3; }
.peg::after { content: ''; position: absolute; left: 9px; top: 6px; width: 4px; height: 48px; background: rgba(90,60,30,.35); border-radius: 2px; }
.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; z-index: 3;
  background: radial-gradient(circle at 35% 30%, #F4E3B8, #C9A45A 55%, #8C6B2E); box-shadow: 0 5px 8px -3px rgba(40,28,14,.6); }
.rail { position: absolute; left: 0; top: 0; overflow: visible; z-index: 10; }
.card { position: absolute; overflow: hidden; border-radius: 26px; background: #FFFDF8; z-index: 30;
  box-shadow: 0 50px 90px -40px rgba(31,22,10,.75), 0 0 0 1px rgba(31,31,31,.08); }
.card img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
.cap { position: absolute; z-index: 31; font: 800 40px/1.1 'Archivo'; letter-spacing: -0.01em; color: #FFFDF8; text-shadow: 0 2px 18px rgba(31,22,10,.45); }
.cap b { color: #DFFF5A; font-weight: 800; }
.hl { position: absolute; z-index: 32; border: 5px solid #DFFF5A; border-radius: 18px; box-shadow: 0 0 0 2px #1F1F1F; pointer-events: none; }
.sample { position: absolute; z-index: 33; font: 600 18px 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #1F1F1F; background: #DFFF5A; padding: 5px 10px; border-radius: 8px; }
.gr { position: absolute; inset: -60px; pointer-events: none; z-index: 95; opacity: .08; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div>
<script src="kit.js"></script>
<script>
// D12 — "What does it really cost?" A kraft price tag swings on a brass pin over a concept product photo; on the
// drop it tears into three, and three tags swing in on a twine line — Credits make it · your partner prints it ·
// you set the price. Each tag, when it is touched, swings and drops its proof below it (the real quote, the real
// partner account, the real price field). One closing tag: the cost is known before anything is made.
const W = K.W, H = K.H, tall = K.F === '9x16', DUR = 15, E = K.ease;
const BPM = 80.7, BEAT = 60 / BPM, B = (n) => +(n * BEAT).toFixed(3);
const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const T_SPLIT = B(3);                         // 2.230 the hook tag tears
const F = [B(4), B(7.5), B(11)];             // 2.974, 5.576, 8.178 each tag's turn
const T_OUT = B(14.5);                        // 10.781 the three tags lift away
const T_FIN = B(15);                          // 11.152 the closing tag drops

const L = tall
  ? { railY: 252, hang: 56, tw: 316, th: 372, xs: [196, 540, 884], hookX: 540, hookY: 252, hookHang: 70, hookW: 640, hookH: 600, hookFs: 98,
      capY: 714, cardX: 90, cardY: 804, cardW: 900, cardH: 430, finY: 300, finW: 760, finH: 560, finFs: 84,
      photo: { s: 1.78, fx: 500, fy: 640, X: 560, Y: 1360 }, ctag: [70, 1196] }
  : { railY: 44, hang: 48, tw: 300, th: 368, xs: [200, 540, 880], hookX: 330, hookY: 70, hookHang: 50, hookW: 520, hookH: 560, hookFs: 84,
      capY: 512, cardX: 90, cardY: 590, cardW: 900, cardH: 560, finY: 120, finW: 700, finH: 500, finFs: 74,
      photo: { s: 1.3, fx: 520, fy: 620, X: 760, Y: 760 }, ctag: [600, 1258] };

// ---------- the concept photo: a blurred cover copy behind, the sharp photo placed on purpose ----------
const IMG = K.pub('r04/g02-sunset-tee.webp');
const bgImg = K.el('img', { src: IMG, cls: 'ph', style: { width: W * 1.3 + 'px', height: W * 1.3 * 1.5 + 'px', filter: 'blur(40px) brightness(.92)' } });
const photo = K.el('img', { src: IMG, cls: 'ph', style: { width: '1024px', height: '1536px', WebkitMaskImage: 'linear-gradient(180deg, transparent 0, #000 9%, #000 100%)', maskImage: 'linear-gradient(180deg, transparent 0, #000 9%, #000 100%)' } });
const shade = K.box(0, 0, W, H, { cls: 'shade', style: { background: tall ? 'linear-gradient(180deg, rgba(40,28,14,.5) 0, rgba(40,28,14,.08) 45%, rgba(40,28,14,0) 70%, rgba(40,28,14,.35) 100%)' : 'linear-gradient(90deg, rgba(40,28,14,.45) 0, rgba(40,28,14,.05) 55%, rgba(40,28,14,0) 100%)' } });
const dim = K.box(0, 0, W, H, { cls: 'shade', style: { background: 'radial-gradient(120% 80% at 50% 40%, rgba(58,40,22,.15), rgba(30,20,10,.5))', opacity: 0 } });
const conceptTag = K.demoTag('Concept image · AI-generated', L.ctag[0], L.ctag[1]);

// ---------- a tag: string from its peg, the shaped card, a hole with a ring ----------
function tagShape(w, h, fill, edge) {
  const c = 34;
  return `<svg class="shape" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><filter id="pt${w}${h}${fill.slice(1)}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="${w}"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .14  0 0 0 0 .06  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs>
    <path d="M${c} 0 H${w - c} L${w} ${c} V${h - 16} Q${w} ${h} ${w - 16} ${h} H16 Q0 ${h} 0 ${h - 16} V${c} Z" fill="${fill}" stroke="${edge}" stroke-width="2"/>
    <path d="M${c} 0 H${w - c} L${w} ${c} V${h - 16} Q${w} ${h} ${w - 16} ${h} H16 Q0 ${h} 0 ${h - 16} V${c} Z" fill="${fill}" filter="url(#pt${w}${h}${fill.slice(1)})"/>
    <circle cx="${w / 2}" cy="40" r="17" fill="none" stroke="#D9C9A8" stroke-width="7"/><circle cx="${w / 2}" cy="40" r="17" fill="none" stroke="rgba(60,40,20,.35)" stroke-width="1.5"/>
    <circle cx="${w / 2}" cy="40" r="12" fill="rgba(40,28,14,.55)"/></svg>`;
}
function makeTag(w, h, hang, fill, edge, inner, holder) {
  const g = K.box(0, 0, 0, 0, { cls: 'grp' });
  const s = K.el('div', { cls: 'str', parent: g, style: { height: hang + 40 + 'px' } });
  const t = K.el('div', { cls: 'tag', parent: g, html: tagShape(w, h, fill, edge) + `<div class="in" style="top:84px">${inner}</div>`, style: { left: -w / 2 + 'px', top: hang + 'px', width: w + 'px', height: h + 'px' } });
  K.el('div', { cls: holder, parent: g });
  g.appendChild(s); // the string sits over the tag, into the hole
  return { g, t, s, w, h, hang };
}
const KRAFT = '#CFA676', KRAFT_E = '#A9824F';

// hook tag, in three copies clipped to thirds (they tear apart on the split)
const hookInner = `<div class="no">The price tag</div><div class="hd" style="font-size:${L.hookFs}px">What does it <em>really</em> cost?</div><div class="rule"></div><div class="sm" style="font-size:${tall ? 28 : 25}px">Three answers. Fifteen seconds.</div>`;
const hooks = [0, 1, 2].map((i) => {
  const tg = makeTag(L.hookW, L.hookH, L.hookHang, KRAFT, KRAFT_E, hookInner, 'pin');
  const a = (i * L.hookW) / 3 - (i ? 8 : 0), b = ((3 - i - 1) * L.hookW) / 3 - (i < 2 ? 8 : 0);
  tg.clip = `inset(-20px ${b}px -40px ${a}px)`;
  if (i > 0) { tg.g.querySelector('.pin').style.display = 'none'; tg.s.style.display = 'none'; }
  return tg;
});
hooks.forEach((h) => h.t.querySelector('.in').style.paddingLeft = '44px');

// the twine rail
const rail = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); rail.setAttribute('class', 'rail'); document.getElementById('stage').appendChild(rail);
rail.setAttribute('width', W); rail.setAttribute('height', 200); rail.style.top = L.railY - 60 + 'px';
rail.innerHTML = `<path id="rp" d="" fill="none" stroke="#9C7650" stroke-width="5" stroke-linecap="round"/><path id="rp2" d="" fill="none" stroke="#D2AE7E" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>`;
const rp = rail.querySelector('#rp'), rp2 = rail.querySelector('#rp2');

// the three answer tags
const TAGS = [
  { fill: '#CFA676', edge: KRAFT_E, no: 'Nº 1 · Design', hd: 'Credits<br>make it.', sm: 'Pages, artwork, listing images.' },
  { fill: '#FFFDF8', edge: '#D9D3C9', no: 'Nº 2 · Print', hd: 'Your partner<br>prints it.', sm: 'Paid from your own partner account.' },
  { fill: '#DFFF5A', edge: '#B9D93A', no: 'Nº 3 · Price', hd: 'You set<br>the price.', sm: 'In your own store.' },
];
const tags = TAGS.map((d) => makeTag(L.tw, L.th, L.hang, d.fill, d.edge, `<div class="no">${d.no}</div><div class="hd" style="font-size:${tall ? 50 : 46}px">${d.hd}</div><div class="rule"></div><div class="sm">${d.sm}</div>`, 'peg'));

// the proof under each tag: a real screen crop
const PROOF = [
  { src: '65-phone-configure', sx: 18, sy: 3236, sw: 744, sh: 436, cap: 'The quote comes <b>first</b>. Then you decide.', hl: [0.015, 0.12, 0.42, 0.25] },
  { src: '31-partner-connected', sx: 296, sy: 30, sw: 540, sh: 300, cap: 'Your partner bills <b>your</b> account. Never Credits.', hl: [0.005, 0.38, 0.97, 0.15] },
  { src: '51-phone-listing', sx: 34, sy: 1700, sw: 712, sh: 384, cap: 'Your listing, <b>your</b> price, your store.', hl: [0.08, 0.15, 0.86, 0.24] },
];
const cards = PROOF.map((p) => {
  const k = L.cardW / p.sw, h = Math.min(L.cardH, p.sh * k);
  const c = K.box(L.cardX, L.cardY, L.cardW, h, { cls: 'card' });
  K.el('img', { src: K.screen(p.src), parent: c, style: { transform: `translate(${-p.sx * k}px, ${-p.sy * k}px) scale(${k})` } });
  const cap = K.box(L.cardX, L.capY, L.cardW, null, { cls: 'cap', html: p.cap });
  const fh = p.sh * k;
  const hl = K.box(L.cardX + p.hl[0] * L.cardW, L.cardY + p.hl[1] * fh, p.hl[2] * L.cardW, p.hl[3] * fh, { cls: 'hl' });
  return { c, cap, hl, h };
});
const realTag = K.demoTag('Real app · demo workspace', 0, 0);
const sample = K.box(0, 0, null, null, { cls: 'sample', html: 'Demo price', style: { width: 'auto', height: 'auto' } });

// the closing tag
const fin = makeTag(L.finW, L.finH, L.hookHang, KRAFT, KRAFT_E, `<div class="no">No surprises</div><div class="hd" style="font-size:${L.finFs}px">Know the cost <em>before</em> anything is made.</div><div class="rule"></div><div class="sm" style="font-size:${tall ? 28 : 25}px">Credits for design · your partner for printing · your price.</div>`, 'pin');
fin.t.querySelector('.in').style.paddingLeft = '44px';
const grain = K.box(0, 0, W, H, { cls: 'gr' });
const end = K.endCard(13.0, { lift: K.F === '9x16' ? 160 : 0, line: 'See the cost.<br>Then decide.' });

// a damped swing that starts at t0 (deg)
const swing = (T, t0, A, w = 4.4, k = 1.6) => (T < t0 ? 0 : A * Math.exp(-k * (T - t0)) * Math.sin(w * (T - t0)));
const breeze = (T, i) => 1.1 * Math.sin(T * 1.3 + i * 1.7) + 0.5 * Math.sin(T * 2.1 + i);
function place(tg, x, y, rot, sc, op) {
  tg.g.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${sc})`;
  tg.g.style.opacity = op;
  tg.g.style.visibility = op > 0.001 ? 'visible' : 'hidden';
}

K.run({
  id: 'D12', title: 'The Price Tag', dur: DUR, bpm: BPM, music: 'bouncing', mood: 'bright', key: 'C', intro: 0.0, cover: 4.2,
  technique: 'Pendulum price tags: a kraft tag swings on a brass pin over a concept photo, tears into three clipped strips on the drop, and three tags swing in on a drawn twine line; each tag, when touched, gets a damped swing impulse and drops its real-screen proof beneath it',
  caption: 'What does it really cost? Credits pay for making the design, your own print partner account pays for printing, and you set the price in your own store. You see the quote before anything is made. Start free at makeandlist.com',
  short: 'Credits make it. You set the price.',
  beats: ['0–2.2 s: “What does it really cost?” — a price tag swings over a concept tee', '2.2–3 s: the tag tears into three; three tags swing onto a twine line', '3–5.6 s: Nº 1 Credits make it — the real quote comes first', '5.6–8.2 s: Nº 2 your partner prints it — billed to your own partner account, never Credits', '8.2–10.8 s: Nº 3 you set the price — the real price field', '10.8–13 s: “Know the cost before anything is made.” · 13–15 s end card'],
  cues: [[0.0, 'swish'], [0.42, 'paper'], [B(1), 'pop'], [+(T_SPLIT - 1.4).toFixed(3), 'riser'], [T_SPLIT, 'hit'], [+(T_SPLIT + 0.05).toFixed(3), 'paper'],
    ...F.flatMap((t, i) => [[t, 'swish'], [+(t + B(0.5)).toFixed(3), 'pop'], [+(t + B(1.5)).toFixed(3), ['coin', 'click', 'marker'][i]]]),
    [T_OUT, 'whoosh'], [T_FIN, 'paper'], [B(16), 'chime'], [13.0, 'hit']],
}, (T) => {
  const f = Math.floor(T * 30);
  grain.style.transform = `translate(${(seed(f) - 0.5) * 60}px, ${(seed(f + 7) - 0.5) * 60}px)`;

  // ---------- photo: slow push-in; blurred and dimmed while the tags talk, back in focus for the close ----------
  const P = L.photo, s = P.s * (1 + 0.035 * T / DUR);
  const blurP = K.p(T, T_SPLIT - 0.1, T_SPLIT + 0.6, E.outCubic) * (1 - K.p(T, T_OUT, T_OUT + 0.8, E.inOutCubic));
  photo.style.transform = `translate(${P.X - P.fx * s + Math.sin(T * 0.4) * 8}px, ${P.Y - P.fy * s - blurP * 60}px) scale(${s})`;
  photo.style.filter = blurP > 0.01 ? `blur(${blurP * 16}px) brightness(${1 - 0.1 * blurP}) saturate(${1 + 0.15 * blurP})` : 'none';
  bgImg.style.transform = `translate(${-W * 0.15}px, ${-H * 0.1}px)`;
  dim.style.opacity = blurP;
  conceptTag.style.opacity = 1 - blurP;

  // ---------- hook tag: drops onto its pin, swings; tears into thirds on the split ----------
  const dropP = K.p(T, 0, 0.55, E.outBack);
  const tear = K.p(T, T_SPLIT, T_SPLIT + 0.6, E.inCubic);
  hooks.forEach((h, i) => {
    const rot = swing(T, 0.35, 11, 4.0, 1.2) + breeze(T, 0) * 0.6 + (i - 1) * 14 * tear;
    const dx = (i - 1) * 90 * tear, dy = tear * tear * 900;
    place(h, L.hookX + dx, L.hookY - (1 - dropP) * 700 + dy, rot, 1, T < T_SPLIT + 0.6 ? 1 - K.p(T, T_SPLIT + 0.3, T_SPLIT + 0.6, E.linear) : 0);
    h.t.style.clipPath = T >= T_SPLIT ? h.clip : 'none';
    if (i > 0) h.t.style.visibility = T >= T_SPLIT ? 'visible' : 'hidden';
  });

  // ---------- the rail draws across; three tags swing in ----------
  const railP = K.p(T, T_SPLIT, T_SPLIT + 0.5, E.outExpo);
  const lift = K.p(T, T_OUT, T_OUT + 0.55, E.inCubic);
  const sag = 26;
  const rx1 = W / 2 - (W / 2 + 20) * railP, rx2 = W / 2 + (W / 2 + 20) * railP;
  const ry = 60 - lift * 500;
  rp.setAttribute('d', `M${rx1} ${ry} Q ${W / 2} ${ry + sag * 2 * railP} ${rx2} ${ry}`);
  rp2.setAttribute('d', rp.getAttribute('d'));
  const railAt = (x) => { const u = (x - rx1) / Math.max(1, rx2 - rx1); return L.railY - 60 + ry + 2 * u * (1 - u) * sag * 2 * railP + 60 - 60; };

  let cur = -1; F.forEach((t, i) => { if (T >= t) cur = i; });
  if (T >= T_OUT) cur = -1;
  tags.forEach((tg, i) => {
    const tin = T_SPLIT + 0.12 + i * 0.1;
    const inP = K.p(T, tin, tin + 0.6, E.outBack);
    const focus = cur === i ? K.p(T, F[i], F[i] + 0.5, E.outExpo) * (1 - K.p(T, (F[i + 1] || T_OUT) - 0.2, (F[i + 1] || T_OUT) + 0.2, E.inOutCubic)) : 0;
    const anyFocus = cur >= 0 ? K.p(T, F[0], F[0] + 0.5, E.outExpo) : 0;
    const sc = (tall ? 0.9 : 0.86) + 0.12 * focus - 0.06 * anyFocus * (1 - focus);
    const rot = swing(T, tin, i === 1 ? -16 : 16) + swing(T, F[i], 9, 5.2, 1.9) + breeze(T, i + 1) * (1 + focus);
    const x = L.xs[i];
    const y = railAt(x) + 10 - (1 - inP) * 520;
    place(tg, x, y, rot, sc, T < tin ? 0 : (1 - lift) * (0.55 + 0.45 * Math.max(focus, 1 - anyFocus)));
  });

  // ---------- proofs ----------
  cards.forEach((cd, i) => {
    const a = F[i] + B(0.5), b = F[i + 1] || T_OUT;
    const inP = K.p(T, a - 0.2, a + 0.45, E.outExpo), outP = K.p(T, b - 0.3, b, E.inCubic);
    const v = T >= a - 0.2 && T < b;
    cd.c.style.visibility = v ? 'visible' : 'hidden';
    cd.c.style.opacity = inP * (1 - outP);
    cd.c.style.transform = `translateY(${(1 - inP) * 90 - outP * 60}px) rotate(${(1 - inP) * (i === 1 ? 2 : -2)}deg)`;
    const cp = K.p(T, a - 0.3, a + 0.3, E.outExpo);
    cd.cap.style.visibility = v ? 'visible' : 'hidden';
    cd.cap.style.opacity = cp * (1 - outP);
    cd.cap.style.transform = `translateY(${(1 - cp) * 30}px)`;
    const hp = K.p(T, F[i] + B(1.5), F[i] + B(1.5) + 0.35, E.outBack);
    cd.hl.style.visibility = v ? 'visible' : 'hidden';
    cd.hl.style.opacity = K.p(T, F[i] + B(1.5), F[i] + B(1.5) + 0.12, E.linear) * (1 - outP);
    cd.hl.style.transform = `scale(${1.12 - 0.12 * hp})`;
    if (v) {
      realTag.style.left = L.cardX + 22 + 'px'; realTag.style.top = L.cardY + cd.h + 18 + 'px';
      realTag.style.opacity = inP * (1 - outP);
    }
  });
  if (cur < 0) realTag.style.opacity = 0;
  // the price on the real screen is the demo listing's own price: say so
  const sp = cur === 2 ? K.p(T, F[2] + B(1.5), F[2] + B(1.5) + 0.3, E.outBack) * (1 - K.p(T, T_OUT - 0.3, T_OUT, E.inCubic)) : 0;
  sample.style.opacity = Math.min(1, sp);
  sample.style.left = L.cardX + L.cardW * 0.62 + 'px'; sample.style.top = L.cardY + cards[2].h * 0.36 + 'px';
  sample.style.transform = `scale(${0.7 + 0.3 * sp}) rotate(-4deg)`;

  // ---------- the closing tag ----------
  const fp = K.p(T, T_FIN, T_FIN + 0.6, E.outBack);
  place(fin, W / 2, L.finY - (1 - fp) * 900, swing(T, T_FIN + 0.2, 9, 4.2, 1.5) + breeze(T, 5) * 0.6, 1, T >= T_FIN ? 1 : 0);

  end(T);
});
</script></body></html>
